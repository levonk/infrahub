[defaults]
inventory = shared/active/02-config/ansible/inventories/localnet.yml
roles_path = shared/active/02-config/ansible/roles
collections_paths = shared/active/02-config/ansible/collections
host_key_checking = False
retry_files_enabled = False
forks = 10
# macOS targets lack POSIX-ACL chmod (`chmod 'A+user:...'` fails) — tasks with
# become_user break without world-readable remote tmpfiles.
allow_world_readable_tmpfiles = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
