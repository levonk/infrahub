      - name: TraLa (cno)
        href: "https://start2.cno.levonk.com"
        icon: mdi-view-dashboard
        description: Traefik service catalog on OCI (cno network)
      - name: TraLa (nl)
        href: "https://start2.nl.levonk.com"
        icon: mdi-view-dashboard
