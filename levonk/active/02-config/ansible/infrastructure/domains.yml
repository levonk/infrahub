---
# Levonk Client Domain Names and DNS Values
# Location: levonk/active/02-config/ansible/infrastructure/domains.yml
# Purpose: Client-specific domain name overrides
# Overrides shared defaults from shared/active/02-config/ansible/infrastructure/domains.yml
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Client-Specific Domain Overrides
# ---------------------------------------------------------------------------
# Levonk uses the levonk.com domain for all services

# ---------------------------------------------------------------------------
# AI Services (client-specific)
# ---------------------------------------------------------------------------
infra_domain_ai_dashboard_web: "ai-dashboard.levonk.com"
infra_domain_ai_litellm: "aigate.levonk.com"
infra_domain_ai_litellm_api: "aigate-api.levonk.com"
infra_domain_ai_omniroute: "airoute.levonk.com"
infra_domain_ai_omnigent: "aiif.levonk.com"  # Public alias "AI InterFace" for the Omnigent service
infra_domain_ai_archon: "archon.levonk.com"   # Archon workflow layer (future Traefik routing)
infra_domain_ai_agentmemory: "agentmemory.levonk.com"
infra_domain_ai_langfuse: "langfuse.levonk.com"

# QM (Multiplayer agent harness — deployed to Windows Docker Desktop)
infra_domain_ai_qm: "qm.levonk.com"
infra_hostname_qm: "qm-levonk-core"
infra_hostname_qm_web: "qm-levonk-web-ui"
infra_hostname_qm_postgres: "qm-levonk-pg"

# Paperclip (AI agent orchestration platform)
infra_domain_ai_paperclip: "paperclip.levonk.com"
infra_hostname_paperclip: "paperclip"
infra_hostname_paperclip_postgres: "paperclip-postgres"

# ---------------------------------------------------------------------------
# Traefik Dashboard (client-specific)
# ---------------------------------------------------------------------------
infra_domain_traefik_dashboard: "traefik.levonk.com"

# ---------------------------------------------------------------------------
# Proxy Services (client-specific)
# ---------------------------------------------------------------------------
infra_domain_proxy_search: "search.levonk.com"

# ---------------------------------------------------------------------------
# SSO/Authelia (client-specific)
# ---------------------------------------------------------------------------
infra_domain_sso_authelia: "auth.levonk.com"

# ---------------------------------------------------------------------------
# DNS Services (client-specific)
# ---------------------------------------------------------------------------
infra_domain_dns_adguard: "adguard.levonk.com"

# ---------------------------------------------------------------------------
# VPN Hostnames (client-specific)
# ---------------------------------------------------------------------------
infra_hostname_vpn_nordvpn: "nordvpn"
infra_hostname_vpn_tailscale: "tailscale"
infra_hostname_vpn_tor: "tor-exit"
infra_hostname_vpn_tailscale_nordvpn: "vpn-tailscale-exit"
infra_hostname_vpn_tailscale_tor: "tor-tailscale-exit"

# ---------------------------------------------------------------------------
# Exit Node CNAME Domains (client-specific)
# Dual-deployment alias scheme: *.{nl,cno}.levonk.com
# nl = network local (dtop202311, X86 Windows Docker Desktop)
# cno = cloud network oracle (oci, ARM64 Oracle Cloud)
# CNAMEs point to Tailscale FQDNs of the exit node containers.
# ---------------------------------------------------------------------------
infra_domain_vpn_exit_cno: "vpn.cno.levonk.com"
infra_domain_tor_exit_cno: "tor.cno.levonk.com"
infra_domain_vpn_exit_nl: "vpn.nl.levonk.com"
infra_domain_tor_exit_nl: "tor.nl.levonk.com"

# ---------------------------------------------------------------------------
# Verdaccio NPM Registry (client-specific dual-deployment)
# Dual-deployment alias scheme: npmjs.{nl,cno}.levonk.com
# nl = network local (dtop202311, X86 Windows Docker Desktop)
# cno = cloud network oracle (oci, ARM64 Oracle Cloud)
# CNAMEs point to the Tailscale FQDN of the host running the registry.
# ---------------------------------------------------------------------------
infra_domain_artifact_verdaccio_cno: "npmjs.cno.levonk.com"
infra_domain_artifact_verdaccio_nl: "npmjs.nl.levonk.com"
infra_hostname_verdaccio_cno: "localnet-artifact-verdaccio"
infra_hostname_verdaccio_nl: "localnet-artifact-verdaccio-nl"

# ---------------------------------------------------------------------------
# Exit Node Tailscale FQDNs (client-specific)
# Tailscale hostnames are network-suffixed to ensure uniqueness across the tailnet.
# cno-* = OCI cloud server (ARM64), nl-* = dtop202311 Windows Docker Desktop (X86)
# ---------------------------------------------------------------------------
infra_tailscale_fqdn_cno_vpn_exit: "cno-vpn-tailscale-exit.tale-grouper.ts.net"
infra_tailscale_fqdn_cno_tor_exit: "cno-tor-tailscale-exit.tale-grouper.ts.net"
infra_tailscale_fqdn_nl_vpn_exit: "nl-vpn-tailscale-exit.tale-grouper.ts.net"
infra_tailscale_fqdn_nl_tor_exit: "nl-tor-tailscale-exit.tale-grouper.ts.net"

# ---------------------------------------------------------------------------
# Tailscale Tailnet FQDN (client-specific)
# Cloudflare CNAMEs point to these instead of A records to Tailscale IPs.
# This decouples Cloudflare DNS from the ephemeral Tailscale IP — if
# Tailscale reassigns the IP, only Tailscale DNS updates, not Cloudflare.
# ---------------------------------------------------------------------------
infra_tailscale_tailnet: "tale-grouper.ts.net"
infra_tailscale_fqdn_cloud_server: "oci.tale-grouper.ts.net"
infra_tailscale_fqdn_inference_host: "kckinai.tale-grouper.ts.net"
# Windows Docker host (dtop202311) — runs the Wazuh manager stack and other
# Docker services. Agents connect to this FQDN via Tailscale.
infra_tailscale_fqdn_windows_docker: "dtop202311.tale-grouper.ts.net"

# ---------------------------------------------------------------------------
# Inference Host Domain (client-specific)
# kckinai is a Tailscale-attached host for AI inference workloads.
# ---------------------------------------------------------------------------
infra_domain_inference_host: "kckinai.levonk.com"

# ---------------------------------------------------------------------------
# Service Hostnames (client-specific container names)
# ---------------------------------------------------------------------------
infra_hostname_omniroute: "omniroute"
infra_hostname_litellm: "litellm"
infra_hostname_litellm_postgres: "litellm-postgres"
infra_hostname_litellm_redis: "litellm-redis"
infra_hostname_headroom: "headroom"
infra_hostname_forge: "forge"
infra_hostname_iron_proxy: "iron-proxy"
infra_hostname_privacy_orchestrator: "privacy-orchestrator"
infra_hostname_ai_dashboard: "ai-dashboard"
infra_hostname_omnigent: "omnigent"
infra_hostname_omnigent_postgres: "omnigent-postgres"
infra_hostname_archon: "archon"
infra_hostname_archon_postgres: "archon-postgres"
infra_hostname_pi: "pi"
infra_hostname_agentmemory: "agentmemory"
infra_hostname_langfuse_web: "langfuse-web"
infra_hostname_langfuse_worker: "langfuse-worker"
infra_hostname_langfuse_postgres: "langfuse-postgres"
infra_hostname_langfuse_clickhouse: "langfuse-clickhouse"
infra_hostname_langfuse_redis: "langfuse-redis"
infra_hostname_langfuse_minio: "langfuse-minio"
infra_hostname_authelia: "authelia"
infra_hostname_crowdsec: "crowdsec"
infra_hostname_traefik: "traefik"
infra_hostname_nordvpn: "nordvpn"
infra_hostname_homepage: "homepage"
infra_hostname_trala: "trala"

# ---------------------------------------------------------------------------
# Start / Launch Page Dashboards (client-specific)
# See ADR-20260629001 for the decision rationale.
# Dual-deployment: each network (cno + nl) runs its own Homepage + TraLa.
# The bare domains (start.levonk.com, start2.levonk.com) point to cno (OCI).
# ---------------------------------------------------------------------------
infra_domain_dashboard_homepage: "start.levonk.com"
infra_domain_dashboard_trala: "start2.levonk.com"
infra_domain_dashboard_homepage_cno: "start.cno.levonk.com"
infra_domain_dashboard_trala_cno: "start2.cno.levonk.com"
infra_domain_dashboard_homepage_nl: "start.nl.levonk.com"
infra_domain_dashboard_trala_nl: "start2.nl.levonk.com"

# ---------------------------------------------------------------------------
# Nix Cache Chain Services (dual-deployment: nl + cno)
# Harmonia serves local /nix/store (internal). ncps is the front-door NAR
# caching proxy. ncro races upstreams (internal).
# nl  = dtop202311 (Windows Docker Desktop, X86) — nixcache.nl.levonk.com
# cno = oci-cloud-server (Linux, ARM64) — nixcache.cno.levonk.com
# ---------------------------------------------------------------------------
infra_domain_nix_cache_nl: "nixcache.nl.levonk.com"
infra_domain_nix_cache_cno: "nixcache.cno.levonk.com"
# nl hostnames (Windows Docker Desktop — dtop202311)
infra_hostname_nix_harmonia_nl: "localnet-nix-harmonia"
infra_hostname_nix_ncps_nl: "localnet-nix-ncps"
infra_hostname_nix_ncro_nl: "localnet-nix-ncro"
# cno hostnames (OCI cloud server — ARM64 Linux)
infra_hostname_nix_harmonia_cno: "localnet-nix-harmonia-cno"
infra_hostname_nix_ncps_cno: "localnet-nix-ncps-cno"
infra_hostname_nix_ncro_cno: "localnet-nix-ncro-cno"

# ---------------------------------------------------------------------------
# Garnix CI Builder (nl region — dtop202311)
# Nix-based CI builder with /dev/kvm + shared nix store. Web UI at ci.nl.levonk.com.
# ---------------------------------------------------------------------------
infra_domain_garnix_ci_nl: "ci.nl.levonk.com"
infra_hostname_garnix_ci: "localnet-garnix-ci"