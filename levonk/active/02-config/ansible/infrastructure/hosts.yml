# Levonk host inventory — single source of truth for host architecture.
#
# This file is the authoritative host→architecture map for the levonk client.
# AI agents and build scripts MUST read architecture from here, never re-derive it.
#
# Consumed by:
#   - scripts/generate_service_catalog.py  (feeds the `arch` column in SERVICES.md)
#   - scripts/build-and-push-images.sh     (selects target platform per host)
#   - levonk/justfile                      (levonk-build-* / levonk-deploy-* recipes)
#
# Naming follows ADR-20260719002: no `-windows` suffix on resources.
# `network` values: cno = cloud network oracle (OCI), nl = network local (Windows dtop).

hosts:
  oci-cloud-server:
    label: "OCI Cloud Server (cno)"
    network: cno
    arch: arm64
    docker_platform: linux/arm64
    tailscale_fqdn: oci.tale-grouper.ts.net
    role: cloud-server

  kckinai:
    label: "kckinai (Inference Host)"
    network: cno
    arch: arm64
    docker_platform: linux/arm64
    tailscale_fqdn: kckinai.tale-grouper.ts.net
    role: inference-host

  dtop202311:
    label: "dtop202311 (nl — Windows Docker)"
    network: nl
    arch: amd64
    docker_platform: linux/amd64
    tailscale_fqdn: dtop202311.tale-grouper.ts.net
    role: windows-docker-host

  isolation-vm:
    label: "Isolation VM (QEMU on OCI)"
    network: cno
    arch: amd64
    docker_platform: linux/amd64
    tailscale_fqdn: "192.168.100.147 (NAT bridge)"
    role: isolation-vm
