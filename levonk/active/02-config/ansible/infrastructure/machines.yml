# Levonk client-specific machine metadata for service catalog generation
#
# This file defines the machines in the levonk fleet with metadata used by
# generate_service_catalog.py to render Mermaid diagrams and legends.
#
# Schema:
#   label:          Display name for the machine
#   tailscale:      Tailscale hostname or IP
#   arch:           CPU architecture (arm64, amd64, x86_64)
#   docker_platform: Docker platform string (linux/arm64, linux/amd64)
#   color:          Hex color for Mermaid diagram nodes
#   mermaid_class:  CSS class name for Mermaid node styling
#   ssh_key:        SSH key name (without path — client-specific, not for shared/)
#   ansible_user:   Ansible remote user for this machine

machines:
  oci-cloud-server:
    label: "OCI Cloud Server (cno)"
    tailscale: "oci.tale-grouper.ts.net"
    arch: "arm64"
    docker_platform: "linux/arm64"
    color: "#4A90D9"
    mermaid_class: "machine_oci"
    ssh_key: "lzkmbp2016-micro-oracle"
    ansible_user: "opc"
  kckinai:
    label: "kckinai (Inference Host)"
    tailscale: "kckinai.tale-grouper.ts.net"
    arch: "arm64"
    docker_platform: "linux/arm64"
    color: "#E8743C"
    mermaid_class: "machine_kckinai"
    ssh_key: "lzkmbp2016-micro-oracle"
    ansible_user: "cuser"
  dtop202311:
    label: "dtop202311 (nl — Windows Docker)"
    tailscale: "dtop202311.tale-grouper.ts.net"
    arch: "amd64"
    docker_platform: "linux/amd64"
    color: "#50C878"
    mermaid_class: "machine_dtop"
    ssh_key: "lzkmbp2016-micro-oracle"
    ansible_user: "ansible"
  isolation-vm:
    label: "Isolation VM (QEMU on OCI)"
    tailscale: "192.168.100.147 (NAT bridge)"
    arch: "amd64"
    docker_platform: "linux/amd64"
    color: "#9B59B6"
    mermaid_class: "machine_vm"
    ssh_key: "lzkmbp2016-micro-oracle"
    ansible_user: "cuser"
  lzkmbp2016:
    label: "lzkmbp2016 (Laptop — Intel macOS)"
    tailscale: "lzkmbp2016.tale-grouper.ts.net"
    arch: "x86_64"
    docker_platform: "linux/amd64"
    color: "#F39C12"
    mermaid_class: "machine_laptop1"
    ssh_key: "lzkmbp2016-micro-oracle"
    ansible_user: "auser"
  lzkmbp2018:
    label: "lzkmbp2018 (Laptop — macOS)"
    tailscale: "lzkmbp2018.tale-grouper.ts.net"
    arch: "x86_64"
    docker_platform: "linux/amd64"
    color: "#E67E22"
    mermaid_class: "machine_laptop2"
    ssh_key: "lzkmbp2016-micro-oracle"
    ansible_user: "auser"

# Physical network grouping for the Mermaid topology legend
# cno = cloud network oracle (OCI ARM64)
# nl  = network local (dtop202311 X86 Windows Docker Desktop, kckinai inference host)
physical_networks:
  "cno (Cloud Network Oracle)":
    - oci-cloud-server
    - isolation-vm
  "nl (Network Local)":
    - kckinai
    - dtop202311
  "Laptops (Roaming)":
    - lzkmbp2016
    - lzkmbp2018
