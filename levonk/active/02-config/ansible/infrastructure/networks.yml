---
# Levonk Client Network Topology Values
# Location: levonk/active/02-config/ansible/infrastructure/networks.yml
# Purpose: Client-specific network topology overrides
# Overrides shared defaults from shared/active/02-config/ansible/infrastructure/networks.yml
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Client-Specific Network Overrides
# ---------------------------------------------------------------------------
# Most shared defaults work for levonk, but we override specific values
# for our multi-exit-node architecture and AI pipeline

# ---------------------------------------------------------------------------
# AI Pipeline Service IPs (client-specific assignments)
# ---------------------------------------------------------------------------
infra_network_ip_litellm: "172.29.0.18"
infra_network_ip_litellm_traefik: "172.31.0.18"
infra_network_ip_omniroute: "172.29.0.14"
infra_network_ip_headroom: "172.29.0.13"
infra_network_ip_forge: "172.29.0.16"
infra_network_ip_iron_proxy: "172.29.0.17"
infra_network_ip_privacy_orchestrator: "172.29.0.15"

# agentmemory (on traefik-network for Traefik routing + Authelia SSO)
infra_network_ip_agentmemory: "172.31.0.7"

# Langfuse (LLM observability — parallel analytics sink on langfuse-network + traefik-network)
# langfuse-web also attaches to proxy-chain-network so LiteLLM can forward traces
# (see infra_network_ip_langfuse_web_proxy_chain in shared/infrastructure/networks.yml)
infra_network_ip_langfuse_web: "172.37.0.10"
infra_network_ip_langfuse_traefik: "172.31.0.40"

# ---------------------------------------------------------------------------
# Isolation VM Network (client-specific)
# ---------------------------------------------------------------------------
infra_network_kvm_nat_bridge_subnet: "192.168.100.0/24"
infra_network_kvm_nat_bridge_gateway: "192.168.100.1"
infra_network_kvm_nat_bridge_dhcp_start: "192.168.100.128"
infra_network_kvm_nat_bridge_dhcp_end: "192.168.100.254"

infra_network_kvm_routed_bridge_subnet: "192.168.101.0/24"
infra_network_kvm_routed_bridge_gateway: "192.168.101.1"
infra_network_kvm_routed_bridge_dhcp_start: "192.168.101.128"
infra_network_kvm_routed_bridge_dhcp_end: "192.168.101.254"

# ---------------------------------------------------------------------------
# Isolation VM Specific IP
# ---------------------------------------------------------------------------
infra_network_isolation_vm_ip: "192.168.100.147"
infra_network_isolation_vm_gateway: "192.168.100.1"

# ---------------------------------------------------------------------------
# VPN Route Advertisements (client-specific for OCI cloud server)
# ---------------------------------------------------------------------------
infra_network_vpn_tailscale_advertise_routes:
  - "192.168.100.0/24"  # NAT bridge network for VM
  - "192.168.101.0/24"  # Routed bridge network for VM