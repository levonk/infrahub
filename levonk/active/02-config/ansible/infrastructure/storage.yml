---
# Levonk Client Storage and Volume Values
# Location: levonk/active/02-config/ansible/infrastructure/storage.yml
# Purpose: Client-specific storage path overrides
# Overrides shared defaults from shared/active/02-config/ansible/infrastructure/storage.yml
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Client-Specific Storage Overrides
# ---------------------------------------------------------------------------
# Levonk uses the standard shared storage paths, but we document
# client-specific volume mounts and paths here

# ---------------------------------------------------------------------------
# Base Directories (client-specific for OCI cloud server)
# ---------------------------------------------------------------------------
infra_storage_base_dir: "/opt/localnet"
infra_storage_container_dir: "/opt/localnet/container"
infra_storage_services_dir: "/opt/localnet/services"
infra_storage_config_dir: "/opt/localnet/config"
infra_storage_data_dir: "/opt/localnet/data"
infra_storage_logs_dir: "/opt/localnet/logs"
infra_storage_backup_dir: "/opt/localnet/backup"

# ---------------------------------------------------------------------------
# Vault Storage (client-specific)
# ---------------------------------------------------------------------------
infra_storage_vault_path: "{{ infra_storage_config_dir }}/vault"
infra_storage_vault_file: "infrahub-levonk-all.vault.yml"

# ---------------------------------------------------------------------------
# AI Pipeline Storage (client-specific)
# ---------------------------------------------------------------------------
infra_storage_ai_config: "{{ infra_storage_services_dir }}/ai/config"
infra_storage_ai_data: "{{ infra_storage_services_dir }}/ai/data"

# agentmemory (persistent memory for AI coding agents)
infra_storage_agentmemory_config: "{{ infra_storage_services_dir }}/agentmemory/config"
infra_storage_agentmemory_data: "{{ infra_storage_data_dir }}/agentmemory"

# Langfuse (LLM observability & tracing — parallel analytics sink)
infra_storage_langfuse_config: "{{ infra_storage_services_dir }}/langfuse/config"
infra_storage_langfuse_data: "{{ infra_storage_data_dir }}/langfuse"

# ---------------------------------------------------------------------------
# Isolation VM Storage (client-specific)
# ---------------------------------------------------------------------------
infra_storage_isolation_vm_config: "{{ infra_storage_config_dir }}/isolation-vm"
infra_storage_isolation_vm_data: "{{ infra_storage_data_dir }}/isolation-vm"

# ---------------------------------------------------------------------------
# Service-Specific Volume Mounts (client-specific)
# ---------------------------------------------------------------------------
# Hermes Agent
infra_storage_hermes_agent_config: "{{ infra_storage_isolation_vm_config }}/hermes-agent"
infra_storage_hermes_agent_data: "{{ infra_storage_isolation_vm_data }}/hermes-agent"

# Nix Sidecar
infra_storage_nix_sidecar_config: "{{ infra_storage_isolation_vm_config }}/nix-sidecar"
infra_storage_nix_sidecar_data: "{{ infra_storage_isolation_vm_data }}/nix-sidecar"

# Base Kalinix
infra_storage_base_kalinix_config: "{{ infra_storage_isolation_vm_config }}/base-kalinix"
infra_storage_base_kalinix_data: "{{ infra_storage_isolation_vm_data }}/base-kalinix"