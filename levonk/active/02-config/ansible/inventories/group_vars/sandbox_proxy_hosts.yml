---
# Sandbox CLI Proxy — Group Vars
# Location: levonk/active/02-config/ansible/inventories/group_vars/sandbox_proxy_hosts.yml
# Purpose: Defines egress profiles and allowlists for sandboxed CLI tools.
# See ADR-202608051501 for the sandboxed CLI egress architecture.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Egress Profiles
# Each profile deploys a separate iron-proxy instance on a dedicated Docker
# network with its own allowlist. Tools reference a profile by name.
# ---------------------------------------------------------------------------

sandbox_cli_proxy_profiles:
  # ---------------------------------------------------------------------------
  # OSINT Profile — search engines + social networks
  # Used by: sherlock, subfinder, and similar OSINT tools
  # Method policy: GET + HEAD only (default-deny for everything else)
  # ---------------------------------------------------------------------------
  - name: "osint"
    network: "{{ infra_network_sandbox_osint_name }}"
    subnet: "{{ infra_network_sandbox_osint_subnet }}"
    gateway: "{{ infra_network_sandbox_osint_gateway }}"
    proxy_ip: "{{ infra_network_sandbox_osint_proxy_ip }}"
    http_port: "{{ infra_port_sandbox_osint_http_host }}"
    https_port: "{{ infra_port_sandbox_osint_https_host }}"
    dns_port: "{{ infra_port_sandbox_osint_dns_host }}"
    allowlist_rules:
      # Search engines — GET + HEAD only
      - host: "*.google.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.bing.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "duckduckgo.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.yahoo.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      # Social networks — GET + HEAD for username enumeration
      - host: "*.twitter.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.x.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.instagram.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.linkedin.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.facebook.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.github.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.gitlab.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.reddit.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.pinterest.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.tumblr.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.tiktok.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.youtube.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.medium.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.steamcommunity.com"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
      - host: "*.twitch.tv"
        methods: ["GET", "HEAD"]
        paths: ["/*"]
