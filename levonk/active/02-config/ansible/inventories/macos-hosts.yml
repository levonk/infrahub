---
# macOS Hosts Inventory
# Location: levonk/active/02-config/ansible/inventories/macos-hosts.yml
# Purpose: Defines the macos_hosts host group for Mac machines managed by Ansible.
#
# Connection: SSH (built-in on macOS, Remote Login must be enabled).
#   Minimal manual bootstrap required — see:
#     shared/active/08-docs/runbooks/manual-macos-host-install.md
#   Then run the bootstrap playbook:
#     just ansible-bootstrap-macos
#   which creates the auser admin user, installs Nix, Homebrew, container
#   runtime, apps, Tailscale, Netbird.
#
# Architecture:
#   - lzkmbp2016: x86 MacBook Pro, macOS 15.7.7 — also the Ansible control machine
#   - lzkmbp2018: x86 MacBook Pro, macOS — remote via Tailscale SSH
#
# User model (mirrors the cuser pattern on Linux hosts):
#   - auser: admin user created by the bootstrap playbook, used for Ansible SSH
#   - micro: daily-use user (can be non-admin for safety)
#   Ansible connects as "auser" (admin group, can sudo).
#   The daily user "micro" does not need admin rights.
#
# Note: ansible.cfg defaults become=True/sudo. macOS uses sudo per-task,
# so we set become: false at the playbook level and use become: true on
# individual tasks that need root (systemsetup, nix install, nix.conf).
#
# Connection variables are defined inline in vars: (not in group_vars) because
# Ansible resolves inventory-level connection settings before loading group_vars.
# ---------------------------------------------------------------------------

all:
  children:
    # Parent group that triggers loading of group_vars/infrahub-levonk-all.vault.yml
    # Ansible uses the full filename stem as the group name, so the group is
    # "infrahub-levonk-all.vault" (the .vault.yml suffix is part of the name)
    infrahub-levonk-all.vault:
      children:
        macos_hosts:
          hosts:
            lzkmbp2016:
              ansible_host: "lzkmbp2016.tale-grouper.ts.net"
              macos_tailscale_hostname: "lzkmbp2016"
              macos_netbird_hostname: "lzkmbp2016"
            lzkmbp2018:
              ansible_host: "lzkmbp2018.tale-grouper.ts.net"
              macos_tailscale_hostname: "lzkmbp2018"
              macos_netbird_hostname: "lzkmbp2018"
          vars:
            # Connection — Ansible connects as the dedicated "auser" admin user
            ansible_user: "auser"
            ansible_port: 22
            # Uses the same SSH key as the OCI cloud server
            ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/lzkmbp2016-micro-oracle"
            ansible_become: false
            ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

            # Admin user configuration (mirrors cuser pattern on Linux)
            macos_auser: "auser"
            # SSH public key for auser (read from the control machine's key)
            macos_auser_ssh_public_key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/lzkmbp2016-micro-oracle.pub') }}"
            # GUI / daily-use user — OPTIONAL. The macos-xcode role auto-detects
            # the GUI user via `stat -f%Su /dev/console` if this is not set.
            # Uncomment to override auto-detection (e.g., if the GUI user differs
            # from what /dev/console reports):
            # macos_gui_user: "micro"
        # Sandbox CLI proxy hosts — parent of macos_hosts so all Macs run the proxy.
        # Add or remove child groups to control which hosts deploy the sandbox proxy.
        # See ADR-202608051501 for the sandboxed CLI egress architecture.
        sandbox_proxy_hosts:
          children:
            macos_hosts:
