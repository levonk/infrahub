---
# Windows Docker Desktop Inventory
# Location: levonk/active/02-config/ansible/inventories/windows-docker.yml
# Purpose: Defines the windows_docker_hosts host group for Windows machines running Docker Desktop.
#
# Connection: OpenSSH (built-in on Windows 10/11).
#   Minimal manual bootstrap required — see:
#     levonk/active/08-docs/runbooks/manual-windows-docker-host-install.md
#   Then run the bootstrap playbook:
#     just ansible-bootstrap-windows-docker
#   which installs Docker Desktop, Git, Tailscale, and configures the host.
#
# Docker access: Windows named pipe (npipe:////./pipe/docker_engine)
#   The Python docker library auto-detects the named pipe on Windows.
#   No TCP endpoint exposure needed — safer than tcp://localhost:2375.
#   The ansible user must be in the docker-users group (bootstrap playbook does this).
#
# Note: ansible.cfg defaults become=True/sudo. Windows has no sudo, so we
# override ansible_become: false. The deployment user must be in the
# docker-users group on Windows (bootstrap playbook handles this).
#
# Connection variables are defined inline in vars: (not in group_vars) because
# Ansible resolves inventory-level connection settings before loading group_vars.
# ---------------------------------------------------------------------------

all:
  children:
    # Parent group that triggers loading of group_vars/infrahub-levonk-all.vault.yml
    # Ansible uses the full filename stem as the group name, so the group is
    # "infrahub-levonk-all.vault" (the .vault.yml suffix is part of the name)
    infrahub-levonk-all.vault:
      children:
        windows_docker_hosts:
          hosts:
            dtop202311:
          vars:
            # Connection — dtop202311 (Windows Desktop, Docker Desktop via Tailscale)
            # Defined here (not group_vars) so Ansible can resolve them at parse time
            ansible_host: "dtop202311.tale-grouper.ts.net"
            ansible_user: "ansible"
            ansible_port: 22
            ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/lzkmbp2016-micro-oracle"
            ansible_python_interpreter: "C:\\Program Files\\Python312\\python.exe"
            ansible_shell_type: "powershell"
            ansible_become: false
            ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

            # Docker Desktop named pipe (auto-detected by Python docker library on Windows)
            # No TCP endpoint exposure needed
            docker_host: "npipe:////./pipe/docker_engine"

            # Tailscale hostname for this Windows machine
            windows_tailscale_hostname: "dtop202311"
