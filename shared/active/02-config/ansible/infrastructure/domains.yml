---
# Domain Names and DNS Schema
# Location: shared/active/02-config/ansible/infrastructure/domains.yml
# Purpose: Shared domain name schema with generic defaults
# Client-specific values in levonk/active/02-config/ansible/infrastructure/domains.yml
# ---------------------------------------------------------------------------
# Variable Naming: infra_domain_{SERVICE}_{CONTEXT}_{ATTRIBUTE}
# Services: traefik, ai, proxy, dns, monitoring
# Context: dashboard, gateway, web, api, etc.
# Attributes: domain, hostname, subdomain
# ---------------------------------------------------------------------------
# Self-referential pattern: all domains derive from infra_domain_base.
# Clients override infra_domain_base (e.g. "client.com") and any individual
# domains that use non-obvious subdomain names.

# ---------------------------------------------------------------------------
# Base Domain (client-specific — MUST be overridden)
# ---------------------------------------------------------------------------
infra_domain_base: "example.com"

# ---------------------------------------------------------------------------
# Traefik Dashboard
# ---------------------------------------------------------------------------
infra_domain_traefik_dashboard: "traefik.{{ infra_domain_base }}"

# ---------------------------------------------------------------------------
# AI Services
# ---------------------------------------------------------------------------
infra_domain_ai_dashboard_web: "ai-dashboard.{{ infra_domain_base }}"
infra_domain_ai_litellm: "aigate.{{ infra_domain_base }}"
infra_domain_ai_litellm_api: "aigate-api.{{ infra_domain_base }}"
infra_domain_ai_omniroute: "airoute.{{ infra_domain_base }}"
infra_domain_ai_omnigent: "aiif.{{ infra_domain_base }}"  # Public alias "AI InterFace" for the Omnigent service
infra_domain_ai_archon: "archon.{{ infra_domain_base }}"   # Archon workflow layer (future Traefik routing)
infra_domain_ai_agentmemory: "agentmemory.{{ infra_domain_base }}"
infra_domain_ai_langfuse: "langfuse.{{ infra_domain_base }}"
infra_domain_ai_buzz: "buzz.{{ infra_domain_base }}"

# QM (Multiplayer agent harness for work — web UI)
infra_domain_ai_qm: "qm.{{ infra_domain_base }}"
infra_hostname_qm: "qm-levonk-core"
infra_hostname_qm_web: "qm-levonk-web-ui"
infra_hostname_qm_postgres: "qm-levonk-pg"

# ---------------------------------------------------------------------------
# Paperclip AI Orchestration
# ---------------------------------------------------------------------------
infra_domain_ai_paperclip: "paperclip.{{ infra_domain_base }}"
infra_hostname_paperclip: "paperclip"
infra_hostname_paperclip_postgres: "paperclip-postgres"

# ---------------------------------------------------------------------------
# Proxy Services
# ---------------------------------------------------------------------------
infra_domain_proxy_search: "search.{{ infra_domain_base }}"

# Hister Search Engine (personal search for browsing history and documents)
infra_domain_search_hister: "hister.{{ infra_domain_base }}"

# Web Proxy Chain (see diagrams/proxy/complete-web-proxy-chain.mmd)
infra_domain_proxy_mitm: "mitm.{{ infra_domain_base }}"
infra_domain_proxy_mitm_ca: "ca.{{ infra_domain_base }}"
infra_domain_proxy_varnish: "varnish.{{ infra_domain_base }}"

# ---------------------------------------------------------------------------
# SSO/Authelia
# ---------------------------------------------------------------------------
infra_domain_sso_authelia: "auth.{{ infra_domain_base }}"

# ---------------------------------------------------------------------------
# Monitoring Services (per ADR-202608270001)
# Grafana and Uptime Kuma are exposed via Traefik for browser access.
# Prometheus and Alertmanager are internal-only (no Traefik exposure).
# ---------------------------------------------------------------------------
infra_domain_monitoring_grafana: "grafana.{{ infra_domain_base }}"
infra_domain_monitoring_prometheus: "prometheus.{{ infra_domain_base }}"
infra_domain_monitoring_uptime_kuma: "uptime.{{ infra_domain_base }}"
infra_domain_monitoring_alertmanager: "alerts.{{ infra_domain_base }}"
infra_hostname_monitoring_prometheus: "localnet-monitoring-prometheus"
infra_hostname_monitoring_grafana: "localnet-monitoring-grafana"
infra_hostname_monitoring_loki: "localnet-monitoring-loki"
infra_hostname_monitoring_alertmanager: "localnet-monitoring-alertmanager"
infra_hostname_monitoring_uptime_kuma: "localnet-monitoring-uptime-kuma"
infra_hostname_monitoring_node_exporter: "localnet-monitoring-node-exporter"

# ---------------------------------------------------------------------------
# VPN Hostnames
# ---------------------------------------------------------------------------
infra_hostname_vpn_nordvpn: "nordvpn"
infra_hostname_vpn_tailscale: "tailscale"
infra_hostname_vpn_netbird: "netbird"
infra_hostname_vpn_tor: "tor"

# ---------------------------------------------------------------------------
# Tailscale Tailnet FQDN
# Used for Cloudflare CNAME targets instead of A records pointing at
# Tailscale IPs. CNAMEs decouple DNS from the ephemeral Tailscale IP —
# if Tailscale reassigns the IP, only Tailscale DNS updates, not Cloudflare.
# The tailnet name (e.g. "client-tailnet") is client-specific and MUST be
# overridden in the client's infrastructure/domains.yml.
# ---------------------------------------------------------------------------
infra_tailscale_tailnet: "example.ts.net"
infra_tailscale_fqdn_cloud_server: "{{ infra_tailscale_tailnet }}"
infra_tailscale_fqdn_windows_docker: "{{ infra_tailscale_tailnet }}"
# Tailscale IP for the Windows Docker host (for A records — direct tailnet access)
# Overridden in client infrastructure/domains.yml with the actual Tailscale IP.
infra_tailscale_ip_windows_docker: ""

# ---------------------------------------------------------------------------
# Service Hostnames (container names)
# ---------------------------------------------------------------------------
infra_hostname_omniroute: "omniroute"
infra_hostname_litellm: "litellm"
infra_hostname_litellm_postgres: "litellm-postgres"
infra_hostname_litellm_redis: "litellm-redis"
infra_hostname_headroom: "headroom"
infra_hostname_forge: "forge"
infra_hostname_iron_proxy: "iron-proxy"
infra_hostname_privacy_orchestrator: "privacy-orchestrator"
infra_hostname_ai_dashboard: "ai-dashboard"
infra_hostname_omnigent: "omnigent"
infra_hostname_omnigent_postgres: "omnigent-postgres"
infra_hostname_archon: "archon"
infra_hostname_archon_postgres: "archon-postgres"
infra_hostname_pi: "pi"
infra_hostname_agentmemory: "agentmemory"
infra_hostname_langfuse_web: "langfuse-web"
infra_hostname_langfuse_worker: "langfuse-worker"
infra_hostname_langfuse_postgres: "langfuse-postgres"
infra_hostname_langfuse_clickhouse: "langfuse-clickhouse"
infra_hostname_langfuse_redis: "langfuse-redis"
infra_hostname_langfuse_minio: "langfuse-minio"
infra_hostname_buzz: "buzz"
infra_hostname_buzz_postgres: "buzz-postgres"
infra_hostname_buzz_redis: "buzz-redis"
infra_hostname_buzz_minio: "buzz-minio"
infra_hostname_authelia: "authelia"
infra_hostname_crowdsec: "crowdsec"
infra_hostname_traefik: "traefik"
infra_hostname_homepage: "homepage"
infra_hostname_trala: "trala"

# ---------------------------------------------------------------------------
# Start / Launch Page Dashboards
# See ADR-20260629001 for the decision rationale.
# Dual-deployment: each network (cno + nl) runs its own Homepage + TraLa.
# The bare domains (start, start2) point to cno (cloud).
# ---------------------------------------------------------------------------
infra_domain_dashboard_homepage: "start.{{ infra_domain_base }}"
infra_domain_dashboard_trala: "start2.{{ infra_domain_base }}"
infra_domain_dashboard_homepage_cno: "start.cno.{{ infra_domain_base }}"
infra_domain_dashboard_trala_cno: "start2.cno.{{ infra_domain_base }}"
infra_domain_dashboard_homepage_nl: "start.nl.{{ infra_domain_base }}"
infra_domain_dashboard_trala_nl: "start2.nl.{{ infra_domain_base }}"

# ---------------------------------------------------------------------------
# Career Services
# ---------------------------------------------------------------------------
infra_domain_career_jobops: "jobops.{{ infra_domain_base }}"

# ---------------------------------------------------------------------------
# Tools / File Transfer
# ---------------------------------------------------------------------------
infra_domain_tools_croc_relay: "croc.{{ infra_domain_base }}"

# ---------------------------------------------------------------------------
# Object Storage Services
# ---------------------------------------------------------------------------
infra_domain_storage_rustfs: "rustfs.{{ infra_domain_base }}"
infra_domain_storage_rustfs_console: "rustfs-console.{{ infra_domain_base }}"
infra_hostname_rustfs: "localnet-rustfs"

# ---------------------------------------------------------------------------
# Security/SIEM Services
# ---------------------------------------------------------------------------
infra_domain_security_wazuh: "wazuh.{{ infra_domain_base }}"
infra_hostname_wazuh_manager: "wazuh-manager"
infra_hostname_wazuh_indexer: "wazuh-indexer"
infra_hostname_wazuh_dashboard: "wazuh-dashboard"

# ---------------------------------------------------------------------------
# Artifact / NPM Registry Services (Verdaccio dual-deployment)
# nl = network local (X86)
# cno = cloud network oracle (ARM64)
# Both are independent registries with synced config (same htpasswd, same config template).
# ---------------------------------------------------------------------------
infra_domain_artifact_verdaccio_cno: "npmjs.cno.{{ infra_domain_base }}"
infra_domain_artifact_verdaccio_nl: "npmjs.nl.{{ infra_domain_base }}"
infra_hostname_verdaccio_cno: "localnet-artifact-verdaccio"
infra_hostname_verdaccio_nl: "localnet-artifact-verdaccio-nl"

# ---------------------------------------------------------------------------
# Cloudflare DNS Record Types
# ---------------------------------------------------------------------------
infra_dns_record_type_a: "A"
infra_dns_record_type_cname: "CNAME"
infra_dns_record_type_txt: "TXT"
infra_dns_record_type_mx: "MX"

# ---------------------------------------------------------------------------
# DNS TTL Values
# ---------------------------------------------------------------------------
infra_dns_ttl_default: "300"
infra_dns_ttl_long: "3600"
infra_dns_ttl_short: "60"

# ---------------------------------------------------------------------------
# n8n (Workflow automation — self-hosted)
# Used by: deploy-n8n.yml playbook on cloud_servers
# Two public domains: n8n app + Grafana dashboards, both behind Traefik + Authelia.
# ---------------------------------------------------------------------------
infra_domain_ai_n8n: "n8n.{{ infra_domain_base }}"
infra_domain_ai_n8n_grafana: "n8n-grafana.{{ infra_domain_base }}"
infra_hostname_n8n: "localnet-n8n"
infra_hostname_n8n_postgres: "localnet-n8n-postgres"
infra_hostname_n8n_prometheus: "localnet-n8n-prometheus"
infra_hostname_n8n_grafana: "localnet-n8n-grafana"

# ---------------------------------------------------------------------------
# Nix Cache Chain Services (dual-deployment: nl + cno)
# Implements ADR-20260708001: regional multi-layer cache chain.
# Harmonia serves local /nix/store (internal, 127.0.0.1 only).
# ncps is the front-door NAR caching proxy (exposed via Traefik).
# ncro races upstreams in parallel (internal, behind ncps).
# nl  = network local (X86)
# cno = cloud network oracle (ARM64)
# ---------------------------------------------------------------------------
infra_domain_nix_cache_nl: "nixcache.nl.{{ infra_domain_base }}"
infra_domain_nix_cache_cno: "nixcache.cno.{{ infra_domain_base }}"
# nl hostnames
infra_hostname_nix_harmonia_nl: "localnet-nix-harmonia"
infra_hostname_nix_ncps_nl: "localnet-nix-ncps"
infra_hostname_nix_ncro_nl: "localnet-nix-ncro"
# cno hostnames
infra_hostname_nix_harmonia_cno: "localnet-nix-harmonia-cno"
infra_hostname_nix_ncps_cno: "localnet-nix-ncps-cno"
infra_hostname_nix_ncro_cno: "localnet-nix-ncro-cno"

# ---------------------------------------------------------------------------
# Garnix CI Builder (nl region — X86)
# Nix-based CI builder with /dev/kvm + shared nix store from nix-sidecar.
# Web UI exposed via Traefik.
# ---------------------------------------------------------------------------
infra_domain_garnix_ci_nl: "ci.nl.{{ infra_domain_base }}"
infra_hostname_garnix_ci: "localnet-garnix-ci"

# ---------------------------------------------------------------------------
# Directory Empire Dashboard (nl region — X86)
# Next.js orchestration dashboard for the Directory Empire platform.
# Multi-stage Docker build from the directory-empire repo (lrepo52/directory-empire).
# Web UI exposed via Traefik.
# ---------------------------------------------------------------------------
infra_domain_dashboard_directory_empire_nl: "de.nl.{{ infra_domain_base }}"
infra_hostname_dashboard_directory_empire: "localnet-dashboard-directory-empire"

# ---------------------------------------------------------------------------
# Control Center Dashboard
# Business intelligence dashboard (Next.js + SQLite) deployed to
# windows_docker_hosts (dtop202311). Exposed via Traefik on both the
# default domain and the nl subdomain. Authelia SSO gates the outer layer.
# ---------------------------------------------------------------------------
infra_domain_dashboard_control_center: "dashboard.{{ infra_domain_base }}"
infra_domain_dashboard_control_center_nl: "dashboard.nl.{{ infra_domain_base }}"
infra_hostname_dashboard_control_center: "localnet-dashboard-control-center"

# ---------------------------------------------------------------------------
# no-mistakes Shared Git Gate
# Default domain (no-mistakes.{{ infra_domain_base }}) CNAMEs to the nl subdomain.
# The nl subdomain is the actual deployment target (dtop202311).
# ---------------------------------------------------------------------------
infra_domain_devops_no_mistakes: "no-mistakes.{{ infra_domain_base }}"
infra_domain_devops_no_mistakes_default: "no-mistakes.{{ infra_domain_base }}"

# ---------------------------------------------------------------------------
# Stirling-PDF (nl region — X86)
# Self-hosted PDF utility suite (merge, split, convert, sign, OCR, etc.).
# Upstream image: stirlingtools/stirling-pdf:latest (multi-arch amd64 + arm64).
# Web UI exposed via Traefik at stirling.nl.{{ infra_domain_base }}.
# ---------------------------------------------------------------------------
infra_domain_tools_stirling_pdf: "stirling.nl.{{ infra_domain_base }}"
infra_hostname_tools_stirling_pdf: "localnet-tools-stirling-pdf"

# ---------------------------------------------------------------------------
# Fallback hostnames — generic (non-suffixed) aliases for roles that reference
# the service without a region suffix. Map to the nl (primary) variant.
# ---------------------------------------------------------------------------
infra_hostname_nix_ncps: "{{ infra_hostname_nix_ncps_nl | default('localnet-nix-ncps') }}"

# ---------------------------------------------------------------------------
# AI Buzz — relay domain for buzz-agent WebSocket connections
# ---------------------------------------------------------------------------
infra_domain_buzz: "buzz.{{ infra_domain_base }}"
