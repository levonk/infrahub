---
# Domain Names and DNS Schema
# Location: shared/active/02-config/ansible/infrastructure/domains.yml
# Purpose: Shared domain name schema with sensible defaults
# Client-specific values in levonk/active/02-config/ansible/infrastructure/domains.yml
# ---------------------------------------------------------------------------
# Variable Naming: infra_domain_{SERVICE}_{CONTEXT}_{ATTRIBUTE}
# Services: traefik, ai, proxy, dns, monitoring
# Context: dashboard, gateway, web, api, etc.
# Attributes: domain, hostname, subdomain
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Traefik Dashboard
# ---------------------------------------------------------------------------
infra_domain_traefik_dashboard: "traefik.levonk.com"

# ---------------------------------------------------------------------------
# AI Services
# ---------------------------------------------------------------------------
infra_domain_ai_dashboard_web: "ai-dashboard.levonk.com"
infra_domain_ai_litellm: "aigate.levonk.com"
infra_domain_ai_litellm_api: "aigate-api.levonk.com"
infra_domain_ai_omniroute: "airoute.levonk.com"
infra_domain_ai_omnigent: "aiif.levonk.com"  # Public alias "AI InterFace" for the Omnigent service
infra_domain_ai_archon: "archon.levonk.com"   # Archon workflow layer (future Traefik routing)
infra_domain_ai_agentmemory: "agentmemory.levonk.com"
infra_domain_ai_langfuse: "langfuse.levonk.com"
infra_domain_ai_buzz: "buzz.levonk.com"

# QM (Multiplayer agent harness for work — web UI)
infra_domain_ai_qm: "qm.levonk.com"
infra_hostname_qm: "qm-levonk-core"
infra_hostname_qm_web: "qm-levonk-web-ui"
infra_hostname_qm_postgres: "qm-levonk-pg"

# ---------------------------------------------------------------------------
# Paperclip AI Orchestration
# ---------------------------------------------------------------------------
infra_domain_ai_paperclip: "paperclip.levonk.com"
infra_hostname_paperclip: "paperclip"
infra_hostname_paperclip_postgres: "paperclip-postgres"

# ---------------------------------------------------------------------------
# Proxy Services
# ---------------------------------------------------------------------------
infra_domain_proxy_search: "search.levonk.com"

# ---------------------------------------------------------------------------
# SSO/Authelia
# ---------------------------------------------------------------------------
infra_domain_sso_authelia: "auth.levonk.com"

# ---------------------------------------------------------------------------
# Monitoring Services
# ---------------------------------------------------------------------------
infra_domain_monitoring_grafana: "grafana.levonk.com"
infra_domain_monitoring_prometheus: "prometheus.levonk.com"

# ---------------------------------------------------------------------------
# VPN Hostnames
# ---------------------------------------------------------------------------
infra_hostname_vpn_nordvpn: "nordvpn"
infra_hostname_vpn_tailscale: "tailscale"
infra_hostname_vpn_netbird: "netbird"
infra_hostname_vpn_tor: "tor"

# ---------------------------------------------------------------------------
# Tailscale Tailnet FQDN
# Used for Cloudflare CNAME targets instead of A records pointing at
# Tailscale IPs. CNAMEs decouple DNS from the ephemeral Tailscale IP —
# if Tailscale reassigns the IP, only Tailscale DNS updates, not Cloudflare.
# The tailnet name (e.g. "tale-grouper") is client-specific and MUST be
# overridden in the client's infrastructure/domains.yml.
# ---------------------------------------------------------------------------
infra_tailscale_tailnet: "example.ts.net"
infra_tailscale_fqdn_cloud_server: "{{ infra_tailscale_tailnet }}"
infra_tailscale_fqdn_windows_docker: "{{ infra_tailscale_tailnet }}"

# ---------------------------------------------------------------------------
# Service Hostnames (container names)
# ---------------------------------------------------------------------------
infra_hostname_omniroute: "omniroute"
infra_hostname_litellm: "litellm"
infra_hostname_litellm_postgres: "litellm-postgres"
infra_hostname_litellm_redis: "litellm-redis"
infra_hostname_headroom: "headroom"
infra_hostname_forge: "forge"
infra_hostname_iron_proxy: "iron-proxy"
infra_hostname_privacy_orchestrator: "privacy-orchestrator"
infra_hostname_ai_dashboard: "ai-dashboard"
infra_hostname_omnigent: "omnigent"
infra_hostname_omnigent_postgres: "omnigent-postgres"
infra_hostname_archon: "archon"
infra_hostname_archon_postgres: "archon-postgres"
infra_hostname_pi: "pi"
infra_hostname_agentmemory: "agentmemory"
infra_hostname_langfuse_web: "langfuse-web"
infra_hostname_langfuse_worker: "langfuse-worker"
infra_hostname_langfuse_postgres: "langfuse-postgres"
infra_hostname_langfuse_clickhouse: "langfuse-clickhouse"
infra_hostname_langfuse_redis: "langfuse-redis"
infra_hostname_langfuse_minio: "langfuse-minio"
infra_hostname_buzz: "buzz"
infra_hostname_buzz_postgres: "buzz-postgres"
infra_hostname_buzz_redis: "buzz-redis"
infra_hostname_buzz_minio: "buzz-minio"
infra_hostname_authelia: "authelia"
infra_hostname_crowdsec: "crowdsec"
infra_hostname_traefik: "traefik"
infra_hostname_homepage: "homepage"
infra_hostname_trala: "trala"

# ---------------------------------------------------------------------------
# Start / Launch Page Dashboards
# See ADR-20260629001 for the decision rationale.
# Dual-deployment: each network (cno + nl) runs its own Homepage + TraLa.
# The bare domains (start.levonk.com, start2.levonk.com) point to cno (OCI).
# ---------------------------------------------------------------------------
infra_domain_dashboard_homepage: "start.levonk.com"
infra_domain_dashboard_trala: "start2.levonk.com"
infra_domain_dashboard_homepage_cno: "start.cno.levonk.com"
infra_domain_dashboard_trala_cno: "start2.cno.levonk.com"
infra_domain_dashboard_homepage_nl: "start.nl.levonk.com"
infra_domain_dashboard_trala_nl: "start2.nl.levonk.com"

# ---------------------------------------------------------------------------
# Career Services
# ---------------------------------------------------------------------------
infra_domain_career_jobops: "jobops.levonk.com"

# ---------------------------------------------------------------------------
# Tools / File Transfer
# ---------------------------------------------------------------------------
infra_domain_tools_croc_relay: "croc.levonk.com"

# ---------------------------------------------------------------------------
# Object Storage Services
# ---------------------------------------------------------------------------
infra_domain_storage_rustfs: "rustfs.levonk.com"
infra_domain_storage_rustfs_console: "rustfs-console.levonk.com"
infra_hostname_rustfs: "localnet-rustfs"

# ---------------------------------------------------------------------------
# Security/SIEM Services
# ---------------------------------------------------------------------------
infra_domain_security_wazuh: "wazuh.levonk.com"
infra_hostname_wazuh_manager: "wazuh-manager"
infra_hostname_wazuh_indexer: "wazuh-indexer"
infra_hostname_wazuh_dashboard: "wazuh-dashboard"

# ---------------------------------------------------------------------------
# Artifact / NPM Registry Services (Verdaccio dual-deployment)
# nl = network local (dtop202311, X86 Windows Docker Desktop)
# cno = cloud network oracle (oci, ARM64 Oracle Cloud)
# Both are independent registries with synced config (same htpasswd, same config template).
# ---------------------------------------------------------------------------
infra_domain_artifact_verdaccio_cno: "npmjs.cno.levonk.com"
infra_domain_artifact_verdaccio_nl: "npmjs.nl.levonk.com"
infra_hostname_verdaccio_cno: "localnet-artifact-verdaccio"
infra_hostname_verdaccio_nl: "localnet-artifact-verdaccio-nl"

# ---------------------------------------------------------------------------
# Cloudflare DNS Record Types
# ---------------------------------------------------------------------------
infra_dns_record_type_a: "A"
infra_dns_record_type_cname: "CNAME"
infra_dns_record_type_txt: "TXT"
infra_dns_record_type_mx: "MX"

# ---------------------------------------------------------------------------
# DNS TTL Values
# ---------------------------------------------------------------------------
infra_dns_ttl_default: "300"
infra_dns_ttl_long: "3600"
infra_dns_ttl_short: "60"

# ---------------------------------------------------------------------------
# n8n (Workflow automation — self-hosted)
# Used by: deploy-n8n.yml playbook on cloud_servers (OCI)
# Two public domains: n8n app + Grafana dashboards, both behind Traefik + Authelia.
# ---------------------------------------------------------------------------
infra_domain_ai_n8n: "n8n.levonk.com"
infra_domain_ai_n8n_grafana: "n8n-grafana.levonk.com"
infra_hostname_n8n: "localnet-n8n"
infra_hostname_n8n_postgres: "localnet-n8n-postgres"
infra_hostname_n8n_prometheus: "localnet-n8n-prometheus"
infra_hostname_n8n_grafana: "localnet-n8n-grafana"

# ---------------------------------------------------------------------------
# Nix Cache Chain Services (nl region — dtop202311, Windows Docker Desktop)
# Implements ADR-20260708001: regional multi-layer cache chain.
# Harmonia serves local /nix/store (internal, 127.0.0.1 only).
# ncps is the front-door NAR caching proxy (exposed via Traefik).
# ncro races upstreams in parallel (internal, behind ncps).
# ---------------------------------------------------------------------------
infra_domain_nix_cache_nl: "cache.nl.levonk.com"
infra_hostname_nix_harmonia: "localnet-nix-harmonia"
infra_hostname_nix_ncps: "localnet-nix-ncps"
infra_hostname_nix_ncro: "localnet-nix-ncro"

# ---------------------------------------------------------------------------
# Garnix CI Builder (nl region — dtop202311, Windows Docker Desktop)
# Nix-based CI builder with /dev/kvm + shared nix store from nix-sidecar.
# Web UI exposed via Traefik at ci.nl.levonk.com.
# ---------------------------------------------------------------------------
infra_domain_garnix_ci_nl: "ci.nl.levonk.com"
infra_hostname_garnix_ci: "localnet-garnix-ci"