---
# Network Topology Schema
# Location: shared/active/02-config/ansible/infrastructure/networks.yml
# Purpose: Shared network topology schema with sensible defaults
# Client-specific values in levonk/active/02-config/ansible/infrastructure/networks.yml
# ---------------------------------------------------------------------------
# Variable Naming: infra_network_{SERVICE}_{CONTEXT}_{ATTRIBUTE}
# Services: vpn, dns, proxy, ai, storage, kvm, monitoring
# Context: nordvpn, tailscale, netbird, wireguard, etc.
# Attributes: subnet, gateway, ip, network_name
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# VPN Networks
# ---------------------------------------------------------------------------
infra_network_vpn_nordvpn_network_name: "vpn-network"
infra_network_vpn_nordvpn_subnet: "172.28.0.0/16"
infra_network_vpn_nordvpn_gateway: "172.28.0.1"

infra_network_vpn_tailscale_subnet: "100.64.0.0/10"
infra_network_vpn_netbird_subnet: "100.100.0.0/10"
infra_network_vpn_wireguard_direct_subnet: "10.13.13.0/24"
infra_network_vpn_wireguard_transparent_subnet: "10.13.14.0/24"

# ---------------------------------------------------------------------------
# AI Pipeline Networks
# ---------------------------------------------------------------------------
infra_network_ai_proxy_chain_network_name: "proxy-chain-network"
infra_network_ai_proxy_chain_subnet: "172.29.0.0/16"
infra_network_ai_proxy_chain_gateway: "172.29.0.1"

# ---------------------------------------------------------------------------
# Wazuh SIEM/XDR Network
# Used by: Windows Docker Desktop hosts (deploy-wazuh.yml playbook)
# Internal network for manager ↔ indexer ↔ dashboard communication.
# ---------------------------------------------------------------------------
infra_network_security_wazuh_network_name: "wazuh-network"
infra_network_security_wazuh_subnet: "172.25.0.0/16"
infra_network_security_wazuh_gateway: "172.25.0.1"
infra_network_security_wazuh_indexer_ip: "172.25.0.10"
infra_network_security_wazuh_manager_ip: "172.25.0.11"
infra_network_security_wazuh_dashboard_ip: "172.25.0.12"

infra_network_ai_forge_network_name: "forge-network"
infra_network_ai_forge_subnet: "172.35.0.0/16"
infra_network_ai_forge_gateway: "172.35.0.1"

# Langfuse (LLM observability & tracing — parallel analytics sink)
infra_network_ai_langfuse_network_name: "langfuse-network"
infra_network_ai_langfuse_subnet: "172.37.0.0/16"
infra_network_ai_langfuse_gateway: "172.37.0.1"
infra_network_ip_langfuse_web: "172.37.0.10"
infra_network_ip_langfuse_worker: "172.37.0.11"
infra_network_ip_langfuse_postgres: "172.37.0.20"
infra_network_ip_langfuse_clickhouse: "172.37.0.30"
infra_network_ip_langfuse_redis: "172.37.0.40"
infra_network_ip_langfuse_minio: "172.37.0.50"
# Traefik-network IP for langfuse-web (public routing)
infra_network_ip_langfuse_traefik: "172.31.0.40"
# proxy-chain-network IP for langfuse-web (LiteLLM → Langfuse trace forwarding)
infra_network_ip_langfuse_web_proxy_chain: "172.29.0.19"

# Buzz (human + AI agent collaboration workspace / Nostr relay)
infra_network_ai_buzz_network_name: "buzz-network"
infra_network_ai_buzz_subnet: "172.38.0.0/16"
infra_network_ai_buzz_gateway: "172.38.0.1"
infra_network_ip_buzz: "172.38.0.10"
infra_network_ip_buzz_postgres: "172.38.0.20"
infra_network_ip_buzz_redis: "172.38.0.30"
infra_network_ip_buzz_minio: "172.38.0.40"
# Traefik-network IP for buzz (public routing)
infra_network_ip_buzz_traefik: "172.31.0.50"

# Paperclip (AI agent orchestration platform)
# Joins traefik-network for public routing via Traefik + Authelia
infra_network_ip_paperclip: "172.31.0.20"
infra_network_ip_paperclip_traefik: "172.31.0.15"

# QM (Multiplayer agent harness — deployed to Windows Docker Desktop)
# Dedicated bridge network for qm core ↔ web-ui ↔ postgres communication.
# Joins traefik-network for public routing via Traefik.
infra_network_ai_qm_network_name: "qm-levonk"
infra_network_ai_qm_subnet: "172.42.0.0/16"
infra_network_ai_qm_gateway: "172.42.0.1"
infra_network_ip_qm_core: "172.42.0.10"
infra_network_ip_qm_web: "172.42.0.11"
infra_network_ip_qm_postgres: "172.42.0.20"
# Traefik-network IP for qm web-ui (public routing)
infra_network_ip_qm_traefik: "172.31.0.22"

# ---------------------------------------------------------------------------
# DNS Networks
# ---------------------------------------------------------------------------
infra_network_dns_localnet_network_name: "localnet-network"
infra_network_dns_localnet_subnet: "172.26.0.0/16"
infra_network_dns_localnet_gateway: "172.26.0.1"

# DNS service IP allocations (within localnet-network, high range 172.26.255.x)
# See: diagrams/dns/complete-dns-chain.mmd and complete-dns-chain.notes.md
# Active tiers: odoh (1), anon (2), unbound-tor (3), unbound-root (10)
# Dark tiers: dnscrypt-tor (4-6 shared), std (7), doh (8), encrypted (9),
#             plaintext-tor (11), plaintext (12)
infra_network_ip_dns_adguard: "172.26.255.67"
infra_network_ip_dns_dnsdist: "172.26.255.49"
infra_network_ip_dns_coredns: "172.26.255.51"
infra_network_ip_dns_unbound_validator: "172.26.255.50"
infra_network_ip_dns_unbound_tor: "172.26.255.52"
infra_network_ip_dns_unbound_root: "172.26.255.53"
infra_network_ip_dns_dnscrypt_odoh: "172.26.255.60"
infra_network_ip_dns_dnscrypt_anon: "172.26.255.61"
infra_network_ip_dns_dnscrypt_std: "172.26.255.62"
infra_network_ip_dns_dnscrypt_doh: "172.26.255.63"
infra_network_ip_dns_dnscrypt_encrypted: "172.26.255.64"
infra_network_ip_dns_dnscrypt_plaintext: "172.26.255.65"
infra_network_ip_dns_dnscrypt_tor: "172.26.255.66"
infra_network_ip_dns_dnscrypt_plaintext_tor: "172.26.255.68"
infra_network_ip_dns_tor_proxy: "172.26.255.70"

# Web Proxy Chain IP allocations (within localnet-network, high range 172.26.255.x)
# See: diagrams/proxy/complete-web-proxy-chain.mmd and complete-web-proxy-chain.notes.md
# Shares localnet-network with DNS chain. Reuses DNS chain Tor proxy at .70.
infra_network_ip_proxy_mitm: "172.26.255.80"
infra_network_ip_proxy_privoxy: "172.26.255.81"
infra_network_ip_proxy_varnish: "172.26.255.82"
infra_network_ip_proxy_gost: "172.26.255.83"

# ---------------------------------------------------------------------------
# Proxy Networks
# ---------------------------------------------------------------------------
infra_network_proxy_tor_network_name: "tor-network"
infra_network_proxy_tor_subnet: "172.30.0.0/16"
infra_network_proxy_tor_gateway: "172.30.0.1"

infra_network_proxy_traefik_network_name: "traefik-network"
infra_network_proxy_traefik_subnet: "172.31.0.0/16"
infra_network_proxy_traefik_gateway: "172.31.0.1"

# ---------------------------------------------------------------------------
# Security Networks
# ---------------------------------------------------------------------------
infra_network_security_authelia_network_name: "authelia-network"
infra_network_security_authelia_subnet: "172.32.0.0/16"
infra_network_security_authelia_gateway: "172.32.0.1"

infra_network_security_crowdsec_network_name: "crowdsec-network"
infra_network_security_crowdsec_subnet: "172.33.0.0/16"
infra_network_security_crowdsec_gateway: "172.33.0.1"

# ---------------------------------------------------------------------------
# KVM/Virtualization Networks
# ---------------------------------------------------------------------------
infra_network_kvm_nat_bridge_name: "kvm-nat-br0"
infra_network_kvm_nat_bridge_subnet: "192.168.100.0/24"
infra_network_kvm_nat_bridge_gateway: "192.168.100.1"
infra_network_kvm_nat_bridge_dhcp_start: "192.168.100.128"
infra_network_kvm_nat_bridge_dhcp_end: "192.168.100.254"

infra_network_kvm_routed_bridge_name: "kvm-route-br0"
infra_network_kvm_routed_bridge_subnet: "192.168.101.0/24"
infra_network_kvm_routed_bridge_gateway: "192.168.101.1"
infra_network_kvm_routed_bridge_dhcp_start: "192.168.101.128"
infra_network_kvm_routed_bridge_dhcp_end: "192.168.101.254"

# ---------------------------------------------------------------------------
# Service IP Allocations (within networks)
# ---------------------------------------------------------------------------
infra_network_ip_litellm: "172.29.0.18"
infra_network_ip_litellm_traefik: "172.31.0.18"
infra_network_ip_omniroute: "172.29.0.14"
infra_network_ip_headroom: "172.29.0.13"
infra_network_ip_forge: "172.29.0.16"
infra_network_ip_iron_proxy: "172.29.0.17"
infra_network_ip_privacy_orchestrator: "172.29.0.15"

# ---------------------------------------------------------------------------
# Freenet (P2P decentralized app platform — freenet-core peer node)
# Used by: Windows Docker Desktop hosts (deploy-freenet.yml playbook)
# Dedicated bridge network — no Traefik routing (Tailscale-only access).
# ---------------------------------------------------------------------------
infra_network_p2p_freenet_network_name: "freenet-network"
infra_network_p2p_freenet_subnet: "172.39.0.0/16"
infra_network_p2p_freenet_gateway: "172.39.0.1"
infra_network_ip_freenet: "172.39.0.10"

# ---------------------------------------------------------------------------
# Windows Exit Node Networks (nl — Network Local, Windows Docker Desktop)
# Used by: Windows Docker Desktop hosts (deploy-windows-exit-nodes.yml playbook)
# Docker networks are local to each host — same names as OCI (cno) since they
# are on separate Docker daemons. Subnets are different to avoid confusion.
# NordVPN (nl): gluetun container + vpn-tailscale-exit container
# Tor (nl): tor-exit container + tor-tailscale-exit container
# ---------------------------------------------------------------------------
infra_network_vpn_nordvpn_windows_network_name: "vpn-network"
infra_network_vpn_nordvpn_windows_subnet: "172.40.0.0/16"
infra_network_vpn_nordvpn_windows_gateway: "172.40.0.1"

infra_network_proxy_tor_windows_network_name: "tor-network"
infra_network_proxy_tor_windows_subnet: "172.41.0.0/16"
infra_network_proxy_tor_windows_gateway: "172.41.0.1"

# ---------------------------------------------------------------------------
# VPN Subnet Collections
# ---------------------------------------------------------------------------
infra_network_vpn_subnets:
  - "{{ infra_network_vpn_tailscale_subnet }}"
  - "{{ infra_network_vpn_netbird_subnet }}"

# ---------------------------------------------------------------------------
# Sandboxed CLI Proxy Networks
# Used by: deploy-sandbox-proxy.yml playbook on sandbox_proxy_hosts
# Each egress profile gets a dedicated Docker network for isolation.
# See ADR-202608051501 for the sandboxed CLI egress architecture.
# ---------------------------------------------------------------------------
# OSINT profile (search engines + social networks)
infra_network_sandbox_osint_name: "sandbox-osint-net"
infra_network_sandbox_osint_subnet: "172.43.0.0/16"
infra_network_sandbox_osint_gateway: "172.43.0.1"
infra_network_sandbox_osint_proxy_ip: "172.43.0.2"

# ---------------------------------------------------------------------------
# n8n (Workflow automation — self-hosted)
# Used by: deploy-n8n.yml playbook on cloud_servers (OCI)
# All n8n containers (app, postgres, prometheus, grafana) share n8n-network
# for service discovery. The n8n and grafana containers also join traefik-network
# for public routing.
# Subnet 172.44.0.0/16 — next free after sandbox-osint (172.43).
# ---------------------------------------------------------------------------
infra_network_ai_n8n_network_name: "n8n-network"
infra_network_ai_n8n_subnet: "172.44.0.0/16"
infra_network_ai_n8n_gateway: "172.44.0.1"
infra_network_ip_n8n: "172.44.0.10"
infra_network_ip_n8n_postgres: "172.44.0.20"
infra_network_ip_n8n_prometheus: "172.44.0.30"
infra_network_ip_n8n_grafana: "172.44.0.40"
infra_network_ip_n8n_traefik: "172.31.0.20"
infra_network_ip_n8n_grafana_traefik: "172.31.0.21"