# ===========================================================================
# Service Chains
# Data-driven request-flow topology for proxy/cache chains.
# The generate_service_catalog.py script renders each chain as a Mermaid
# diagram in the "Service Chains" section and injects connections into the
# main topology diagram. Supports linear flow and fan-out (branches).
#
# Schema:
#   name:        Human-readable chain name
#   description: One-line summary
#   flow:        Ordered list of steps. Each step is either:
#     - service: "Service Name"     # matches a service name in services.yml
#       role: "optional label"      # shown on the edge
#       branches:                   # fan-out from this step
#         - service: "Name"         # branch to a service
#         - upstream: "URL"         # branch to an external upstream
# ===========================================================================

chains:
  - name: "AI Pipeline"
    description: "Request flow for AI inference — gateway → proxy chain → upstream providers"
    flow:
      - service: "LiteLLM"
        role: "gateway (auth, virtual keys, spend)"
      - service: "Privacy Orchestrator"
        role: "PII guardrail"
      - service: "Forge"
        role: "load balancer"
      - service: "Headroom"
        role: "context compression"
      - service: "iron-proxy"
        role: "egress proxy"
      - service: "OmniRoute"
        role: "upstream router"

  - name: "Nix Cache Chain (nl)"
    description: "Nix binary cache proxy chain (nl region) — client → cache → racer → upstreams"
    flow:
      - service: "Nix ncps (nl)"
        role: "front door (Traefik)"
      - service: "Nix ncro (nl)"
        role: "racing proxy"
        branches:
          - service: "Nix Harmonia (nl)"
            role: "local /nix/store"
          - upstream: "https://cache.nixos.org"
          - upstream: "https://cache.garnix.io"
          - upstream: "https://nix-community.cachix.org"

  - name: "Nix Cache Chain (cno)"
    description: "Nix binary cache proxy chain (cno region) — client → cache → racer → upstreams"
    flow:
      - service: "Nix ncps (cno)"
        role: "front door (Traefik)"
      - service: "Nix ncro (cno)"
        role: "racing proxy"
        branches:
          - service: "Nix Harmonia (cno)"
            role: "local /nix/store"
          - upstream: "https://cache.nixos.org"
          - upstream: "https://cache.garnix.io"
          - upstream: "https://nix-community.cachix.org"
