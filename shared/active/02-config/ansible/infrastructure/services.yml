---
# Service Catalog Metadata
# Location: shared/active/02-config/ansible/infrastructure/services.yml
# Purpose: Human-authored metadata for each service (machine, category, description).
#          The generate_service_catalog.py script reads this + ports.yml + domains.yml
#          + networks.yml to produce SERVICES.md.
# ---------------------------------------------------------------------------
# This is the ONLY manual file. When you add a new service:
#   1. Add its ports/domains/networks to the infrastructure YAML files (as you already do)
#   2. Add an entry here with its machine, category, description, and source_repo
#   3. Run: just generate-service-catalog
# ---------------------------------------------------------------------------
# source_repo (REQUIRED):
#   The primary source repository URL (GitHub/GitLab) for the service.
#   If no source repo exists (commercial product, physical host), use the
#   product page or official website instead.
#   The generate_service_catalog.py script validates that every entry has
#   source_repo and renders it as a clickable link in SERVICES.md.
# ---------------------------------------------------------------------------
# Categories:
#   ui         — Web UI accessible via Traefik + Authelia (browser-facing)
#   api        — HTTP API accessible via Traefik (programmatic, may also have UI)
#   console    — Admin console / dashboard (not a user-facing app)
#   passive    — Database, cache, queue, object storage (no HTTP endpoint for users)
#   proxy      — Internal proxy chain component (not directly user-facing)
#   vpn        — VPN / mesh networking container
#   dns        — DNS resolver or DNS-related service
#   security   — Security engine, bouncer, auth provider
#   infra      — Infrastructure service (registry, dashboard, VM, etc.)
# ---------------------------------------------------------------------------
# Monitoring fields (optional, per ADR-202608270001):
#   metrics_path: "/metrics"           — Prometheus scrape path (if service exposes metrics)
#   metrics_port: "infra_port_..."     — Port variable for metrics endpoint
#   health_endpoint: "/health"         — Health check path (for uptime monitoring)
#   pipeline: "ai"                     — Which pipeline this service belongs to (ai, dns, web, vpn, none)
#   pipeline_stage: "gateway"          — Stage within the pipeline (for alert inhibition rules)
#   alert_labels:                      — Labels for Prometheus alert rules
#     pipeline: "ai"
#     stage: "gateway"
#     service: "litellm"
# ---------------------------------------------------------------------------

# Machines:
#   oci-cloud-server  — OCI ARM cloud server (primary, Tailscale: oci.<tailnet>)
#   kckinai           — Inference host (local, Tailscale: kckinai.<tailnet>)
#   dtop202311        — Windows Docker Desktop (local, Tailscale: dtop202311.<tailnet>)
#   isolation-vm      — QEMU VM on OCI cloud server (192.168.100.147)
# ---------------------------------------------------------------------------

# ===========================================================================
# AI Pipeline Services
# ===========================================================================

services:
- name: "LiteLLM"
  container: "{{ infra_hostname_litellm }}"
  machine: "oci-cloud-server"
  category: "ui"
  description: "AI Gateway — entry point for the pipeline (auth, virtual keys, spend tracking, PII guardrail)"
  source_repo: "https://github.com/BerriAI/litellm"
  domains:
    - "infra_domain_ai_litellm"
    - "infra_domain_ai_litellm_api"
  ports:
    - host: "infra_port_ai_litellm_host"
      container: "infra_port_ai_litellm_container"
      label: "Web/API"
  traefik: true
  metrics_path: "/metrics"
  health_endpoint: "/health"
  pipeline: "ai"
  pipeline_stage: "gateway"
  alert_labels:
    pipeline: "ai"
    stage: "gateway"
    service: "litellm"

- name: "LiteLLM Postgres"
  container: "{{ infra_hostname_litellm_postgres }}"
  machine: "oci-cloud-server"
  category: "passive"
  description: "PostgreSQL database for LiteLLM (keys, spend, config)"
  source_repo: "https://github.com/docker-library/postgres"
  ports:
    - host: "infra_port_ai_litellm_postgres_host"
      container: "infra_port_ai_litellm_postgres_container"
      label: "PostgreSQL"
  network: "proxy-chain-network"

- name: "LiteLLM Redis"
  container: "{{ infra_hostname_litellm_redis }}"
  machine: "oci-cloud-server"
  category: "passive"
  description: "Redis cache for LiteLLM"
  source_repo: "https://github.com/redis/redis"
  ports:
    - container: "infra_port_ai_litellm_redis_container"
      label: "Redis"
  network: "proxy-chain-network"

