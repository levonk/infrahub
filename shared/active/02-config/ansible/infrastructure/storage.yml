---
# Storage and Volume Schema
# Location: shared/active/02-config/ansible/infrastructure/storage.yml
# Purpose: Shared storage paths and volume schema with sensible defaults
# Client-specific values in levonk/active/02-config/ansible/infrastructure/storage.yml
# ---------------------------------------------------------------------------
# Variable Naming: infra_storage_{SERVICE}_{CONTEXT}_{ATTRIBUTE}
# Services: docker, vault, config, data, logs, backup
# Context: localnet, cloud, vm, container
# Attributes: path, dir, volume, mount
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Base Directories
# ---------------------------------------------------------------------------
infra_storage_base_dir: "/opt/localnet"
infra_storage_container_dir: "/opt/localnet/container"
infra_storage_services_dir: "/opt/localnet/services"
infra_storage_config_dir: "/opt/localnet/config"
infra_storage_data_dir: "/opt/localnet/data"

# ---------------------------------------------------------------------------
# Docker userns-remap
# When userns-remap is enabled (default: "default" → dockremap), container root
# maps to this UID/GID on the host. Bind-mounted directories that containers
# need to write to MUST be owned by this UID, not root (0).
# See roles/docker-engine/tasks/main.yml for the dockremap user/group setup.
# ---------------------------------------------------------------------------
infra_storage_userns_remap_uid: 100000
infra_storage_userns_remap_gid: 100000
infra_storage_logs_dir: "/opt/localnet/logs"
infra_storage_backup_dir: "/opt/localnet/backup"

# ---------------------------------------------------------------------------
# Docker Storage
# ---------------------------------------------------------------------------
infra_storage_docker_network_name: "cloud-server"
infra_storage_docker_volume_dir: "/var/lib/docker/volumes"

# ---------------------------------------------------------------------------
# KVM/libvirt Storage
# ---------------------------------------------------------------------------
infra_storage_kvm_pool_name: "default"
infra_storage_kvm_pool_path: "/var/lib/libvirt/images"

# ---------------------------------------------------------------------------
# Vault Storage
# ---------------------------------------------------------------------------
infra_storage_vault_path: "{{ infra_storage_config_dir }}/vault"
infra_storage_vault_file: "infrahub-levonk-all.vault.yml"

# ---------------------------------------------------------------------------
# Service-Specific Storage Paths
# ---------------------------------------------------------------------------
# DNS Services
infra_storage_dns_config: "{{ infra_storage_services_dir }}/dns/config"
infra_storage_dns_data: "{{ infra_storage_services_dir }}/dns/data"

# Proxy Services
infra_storage_proxy_config: "{{ infra_storage_services_dir }}/proxy/config"
infra_storage_proxy_cache: "{{ infra_storage_services_dir }}/proxy/cache"

# Web Proxy Chain volumes (see diagrams/proxy/complete-web-proxy-chain.mmd)
infra_storage_proxy_mitm_ca_volume: "localnet-proxy-mitm-ca-volume"
infra_storage_proxy_varnish_cache_volume: "localnet-proxy-varnish-cache-volume"
infra_storage_proxy_gost_config_volume: "localnet-proxy-gost-config-volume"
infra_storage_proxy_privoxy_config_volume: "localnet-proxy-privoxy-config-volume"

# VPN Services
infra_storage_vpn_config: "{{ infra_storage_services_dir }}/vpn/config"

# AI Services
infra_storage_ai_config: "{{ infra_storage_services_dir }}/ai/config"
infra_storage_ai_data: "{{ infra_storage_services_dir }}/ai/data"

# agentmemory (persistent memory for AI coding agents)
infra_storage_agentmemory_config: "{{ infra_storage_services_dir }}/agentmemory/config"
infra_storage_agentmemory_data: "{{ infra_storage_data_dir }}/agentmemory"

# LiteLLM (AI Gateway — entry point for the pipeline)
infra_storage_litellm_config: "{{ infra_storage_services_dir }}/litellm/config"
infra_storage_litellm_data: "{{ infra_storage_data_dir }}/litellm"

# Langfuse (LLM observability & tracing — parallel analytics sink)
infra_storage_langfuse_config: "{{ infra_storage_services_dir }}/langfuse/config"
infra_storage_langfuse_data: "{{ infra_storage_data_dir }}/langfuse"

# Buzz (human + AI agent collaboration workspace / Nostr relay)
infra_storage_buzz_config: "{{ infra_storage_services_dir }}/buzz/config"
infra_storage_buzz_data: "{{ infra_storage_data_dir }}/buzz"
infra_storage_buzz_postgres_volume: "localnet-buzz-postgres-data-volume"
infra_storage_buzz_minio_volume: "localnet-buzz-minio-data-volume"

# Buzz Agent Runtime Containers (buzz-acp + devin-cli per agent)
# Each agent gets a config volume for devin credentials and buzz-acp state.
infra_storage_buzz_agent_config: "{{ infra_storage_services_dir }}/buzz-agent"
infra_storage_buzz_agent_data: "{{ infra_storage_data_dir }}/buzz-agent"

# Paperclip (AI agent orchestration platform)
infra_storage_paperclip_volume: "localnet-paperclip-data-volume"
infra_storage_paperclip_postgres_volume: "localnet-paperclip-postgres-data-volume"

# QM (Multiplayer agent harness — deployed to Windows Docker Desktop)
# Docker volumes for Postgres data and sandbox layer (skills, tools).
infra_storage_qm_postgres_volume: "localnet-qm-postgres-data-volume"
infra_storage_qm_layer_volume: "localnet-qm-layer-volume"

# Security Services
infra_storage_security_config: "{{ infra_storage_services_dir }}/security/config"
infra_storage_security_data: "{{ infra_storage_services_dir }}/security/data"

# ---------------------------------------------------------------------------
# Container Volume Mount Patterns
# ---------------------------------------------------------------------------
infra_storage_mount_config: "{{ infra_storage_config_dir }}/{{ infra_hostname_service }}"
infra_storage_mount_data: "{{ infra_storage_data_dir }}/{{ infra_hostname_service }}"
infra_storage_mount_logs: "{{ infra_storage_logs_dir }}/{{ infra_hostname_service }}"

# ---------------------------------------------------------------------------
# Backup Configuration
# ---------------------------------------------------------------------------
infra_storage_backup_retention_days: "7"
infra_storage_backup_schedule: "daily"
infra_storage_backup_compression: "gzip"

# ---------------------------------------------------------------------------
# WorldMonitor Self-Hosted Stack Storage
# Used by: deploy-worldmonitor.yml playbook
# Redis data volume name (Docker volume, not a host path — works on any OS)
# ---------------------------------------------------------------------------
infra_storage_worldmonitor_redis_data_volume: "worldmonitor-redis-data"

# ---------------------------------------------------------------------------
# JobOps Career Tool Storage
# Used by: Windows Docker Desktop hosts (deploy-jobops.yml playbook)
# Docker volume for persistent data (database, generated PDFs)
# ---------------------------------------------------------------------------
infra_storage_jobops_data_volume: "localnet-jobops-data-volume"
infra_storage_jobops_codex_volume: "localnet-jobops-codex-volume"

# ---------------------------------------------------------------------------
# RustFS S3-Compatible Object Storage
# Used by: Windows Docker Desktop hosts (deploy-rustfs.yml playbook)
# Docker volumes for object data and application logs
# ---------------------------------------------------------------------------
infra_storage_rustfs_data_volume: "localnet-rustfs-data-volume"
infra_storage_rustfs_logs_volume: "localnet-rustfs-logs-volume"

# ---------------------------------------------------------------------------
# Wazuh SIEM/XDR Storage
# Used by: Windows Docker Desktop hosts (deploy-wazuh.yml playbook)
# Docker volumes for manager, indexer, and dashboard persistent data.
# Cert volume holds generated TLS certs for internal inter-container TLS.
# ---------------------------------------------------------------------------
infra_storage_wazuh_manager_api_config_volume: "wazuh-manager-api-config"
infra_storage_wazuh_manager_etc_volume: "wazuh-manager-etc"
infra_storage_wazuh_manager_logs_volume: "wazuh-manager-logs"
infra_storage_wazuh_manager_queue_volume: "wazuh-manager-queue"
infra_storage_wazuh_manager_multigroups_volume: "wazuh-manager-multigroups"
infra_storage_wazuh_indexer_data_volume: "wazuh-indexer-data"
infra_storage_wazuh_dashboard_config_volume: "wazuh-dashboard-config"
infra_storage_wazuh_dashboard_custom_volume: "wazuh-dashboard-custom"
infra_storage_wazuh_certs_volume: "wazuh-certs"

# ---------------------------------------------------------------------------
# Freenet (P2P decentralized app platform — freenet-core peer node)
# Used by: Windows Docker Desktop hosts (deploy-freenet.yml playbook)
# Docker volume for persistent node data (contracts, delegate state, keys).
# Mounted at /root/.cache/freenet inside the container (FREENET_BASE_DIR).
# ---------------------------------------------------------------------------
infra_storage_freenet_data_volume: "localnet-freenet-data-volume"

# ---------------------------------------------------------------------------
# Verdaccio NPM Registry
# Used by: dual-deployment — OCI cloud server (cno) + Windows Docker Desktop (nl)
# Two independent registries with separate storage volumes.
# Config dir holds Ansible-rendered config.yaml + htpasswd.
# ---------------------------------------------------------------------------
infra_storage_verdaccio_data_volume: "localnet-verdaccio-data-volume"
infra_storage_verdaccio_config_volume: "localnet-verdaccio-config-volume"

# ---------------------------------------------------------------------------
# Sandboxed CLI Proxy Storage
# Used by: deploy-sandbox-proxy.yml playbook on sandbox_proxy_hosts
# CA certificate directory shared across all egress profiles.
# See ADR-202608051501 for the sandboxed CLI egress architecture.
# ---------------------------------------------------------------------------
infra_storage_sandbox_ca_dir: "/opt/sandbox-cli"
infra_storage_sandbox_config_dir: "{{ infra_storage_services_dir }}/sandbox-cli/config"

# ---------------------------------------------------------------------------
# n8n (Workflow automation — self-hosted)
# Used by: deploy-n8n.yml playbook on cloud_servers (OCI)
# Volumes: n8n app data, postgres data, prometheus TSDB, grafana data.
# Config dir holds Ansible-rendered prometheus.yml + grafana provisioning.
# ---------------------------------------------------------------------------
infra_storage_n8n_data_volume: "localnet-n8n-data-volume"
infra_storage_n8n_postgres_volume: "localnet-n8n-postgres-data-volume"
infra_storage_n8n_prometheus_volume: "localnet-n8n-prometheus-data-volume"
infra_storage_n8n_grafana_volume: "localnet-n8n-grafana-data-volume"
infra_storage_n8n_config_dir: "{{ infra_storage_services_dir }}/n8n"

# ---------------------------------------------------------------------------
# Nix Cache Chain Storage (dual-deployment: nl + cno)
# Implements ADR-20260708001. Harmonia reads the shared nix store (ro).
# ncps caches NARs in its own volume. ncro is stateless (no storage).
#
# nl (dtop202311, Windows Docker Desktop):
#   The nix-sidecar volumes are reused for /nix and /etc/nix — all cache
#   services share the same store as the nix-sidecar for maximum reuse.
# cno (oci-cloud-server, Linux ARM64):
#   Nix is installed natively on the host. Harmonia bind-mounts /nix/store
#   and /nix/var/nix/db directly from the host filesystem (no Docker volume).
#   ncps and ncro use Docker volumes for their data.
# ---------------------------------------------------------------------------
# nl: Shared nix store + config volumes (same as nix-sidecar — reuse)
infra_storage_nix_shared_store_volume: "localnet-base-nix-store-volume"
infra_storage_nix_shared_config_volume: "localnet-base-nix-config-volume"
infra_storage_nix_shared_cache_volume: "localnet-base-nix-cache-volume"
# nl: Harmonia-specific data volume (signing key, etc.)
infra_storage_nix_harmonia_data_volume: "localnet-harmonia-data-volume"
# nl: ncps-specific data volume (cached NARs + SQLite database)
infra_storage_nix_ncps_data_volume: "localnet-ncps-data-volume"
# cno: Harmonia data volume (signing key, config — /nix/store is bind-mounted from host)
infra_storage_nix_harmonia_data_volume_cno: "localnet-harmonia-cno-data-volume"
# cno: ncps data volume (cached NARs + SQLite database)
infra_storage_nix_ncps_data_volume_cno: "localnet-ncps-cno-data-volume"
# cno: ncro data volume (SQLite route cache)
infra_storage_nix_ncro_data_volume_cno: "localnet-ncro-cno-data-volume"
# cno: ncro config volume
infra_storage_nix_ncro_config_volume_cno: "localnet-ncro-cno-config-volume"

# ---------------------------------------------------------------------------
# Garnix CI Builder Storage (nl region — dtop202311)
# Reuses the shared nix store from nix-sidecar so builds don't re-download.
# /dev/kvm is passed through for nested virtualization (NixOS VM builds).
# Work data volume holds CI workspace, build results, and action runner state.
# ---------------------------------------------------------------------------
infra_storage_garnix_ci_work_volume: "localnet-garnix-ci-work-volume"
infra_storage_garnix_ci_config_volume: "localnet-garnix-ci-config-volume"

# ---------------------------------------------------------------------------
# Directory Empire Dashboard Storage (nl region — dtop202311)
# Next.js orchestration dashboard. Config volume holds environment files
# rendered by Ansible (e.g., .env for runtime configuration).
# ---------------------------------------------------------------------------
infra_storage_directory_empire_config_volume: "localnet-directory-empire-config-volume"

# ---------------------------------------------------------------------------
# Hister Search Engine Storage (nl region — dtop202311)
# Self-hosted search engine. Data volume holds the SQLite index, rules,
# and auto-generated secret key.
# ---------------------------------------------------------------------------
infra_storage_hister_data_volume: "localnet-hister-data-volume"

# ---------------------------------------------------------------------------
# no-mistakes Shared Git Gate
# ---------------------------------------------------------------------------
infra_storage_no_mistakes_volume: "localnet-no-mistakes-data"
infra_storage_no_mistakes_config_dir: "{{ infra_storage_services_dir }}/no-mistakes"

# ---------------------------------------------------------------------------
# restoredrill (PostgreSQL backup restore verification)
# Used by: deploy-restoredrill.yml playbook on cloud_servers (OCI)
# Stores: restoredrill binary, per-database configs, pg_dump backups, JSON
# evidence reports, and Prometheus textfile metrics.
# The backup_dir holds pg_dump -Fc archives (compressed) with retention.
# The report_dir holds JSON evidence reports for audit retrieval.
# The prometheus_textfile is written for node_exporter textfile collector.
# ---------------------------------------------------------------------------
infra_storage_restoredrill_config_dir: "{{ infra_storage_services_dir }}/restoredrill"
infra_storage_restoredrill_backup_dir: "{{ infra_storage_backup_dir }}/restoredrill"
infra_storage_restoredrill_report_dir: "{{ infra_storage_data_dir }}/restoredrill/reports"
infra_storage_restoredrill_binary_dir: "{{ infra_storage_services_dir }}/restoredrill/bin"
infra_storage_restoredrill_prometheus_textfile: "/var/lib/node_exporter/textfile/restoredrill.prom"

# ---------------------------------------------------------------------------
# Monitoring Stack Storage (per ADR-202608270001)
# Used by: deploy-monitoring-stack.yml playbook on cloud_servers (OCI)
# Prometheus TSDB, Loki log chunks, Grafana SQLite + dashboards,
# Alertmanager state, Uptime Kuma SQLite, node_exporter textfile dir.
# ---------------------------------------------------------------------------
infra_storage_monitoring_prometheus_volume: "localnet-monitoring-prometheus-data-volume"
infra_storage_monitoring_loki_volume: "localnet-monitoring-loki-data-volume"
infra_storage_monitoring_grafana_volume: "localnet-monitoring-grafana-data-volume"
infra_storage_monitoring_alertmanager_volume: "localnet-monitoring-alertmanager-data-volume"
infra_storage_monitoring_uptime_kuma_volume: "localnet-monitoring-uptime-kuma-data-volume"
infra_storage_monitoring_config_dir: "{{ infra_storage_services_dir }}/monitoring"
infra_storage_monitoring_node_exporter_textfile_dir: "/var/lib/node_exporter/textfile"
