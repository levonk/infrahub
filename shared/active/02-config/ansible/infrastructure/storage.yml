---
# Storage and Volume Schema
# Location: shared/active/02-config/ansible/infrastructure/storage.yml
# Purpose: Shared storage paths and volume schema with sensible defaults
# Client-specific values in levonk/active/02-config/ansible/infrastructure/storage.yml
# ---------------------------------------------------------------------------
# Variable Naming: infra_storage_{SERVICE}_{CONTEXT}_{ATTRIBUTE}
# Services: docker, vault, config, data, logs, backup
# Context: localnet, cloud, vm, container
# Attributes: path, dir, volume, mount
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Base Directories
# ---------------------------------------------------------------------------
infra_storage_base_dir: "/opt/localnet"
infra_storage_container_dir: "/opt/localnet/container"
infra_storage_services_dir: "/opt/localnet/services"
infra_storage_config_dir: "/opt/localnet/config"
infra_storage_data_dir: "/opt/localnet/data"

# ---------------------------------------------------------------------------
# Docker userns-remap
# When userns-remap is enabled (default: "default" → dockremap), container root
# maps to this UID/GID on the host. Bind-mounted directories that containers
# need to write to MUST be owned by this UID, not root (0).
# See roles/docker-engine/tasks/main.yml for the dockremap user/group setup.
# ---------------------------------------------------------------------------
infra_storage_userns_remap_uid: 100000
infra_storage_userns_remap_gid: 100000
infra_storage_logs_dir: "/opt/localnet/logs"
infra_storage_backup_dir: "/opt/localnet/backup"

# ---------------------------------------------------------------------------
# Docker Storage
# ---------------------------------------------------------------------------
infra_storage_docker_network_name: "cloud-server"
infra_storage_docker_volume_dir: "/var/lib/docker/volumes"

# ---------------------------------------------------------------------------
# KVM/libvirt Storage
# ---------------------------------------------------------------------------
infra_storage_kvm_pool_name: "default"
infra_storage_kvm_pool_path: "/var/lib/libvirt/images"

# ---------------------------------------------------------------------------
# Vault Storage
# ---------------------------------------------------------------------------
infra_storage_vault_path: "{{ infra_storage_config_dir }}/vault"
infra_storage_vault_file: "infrahub-levonk-all.vault.yml"

# ---------------------------------------------------------------------------
# Service-Specific Storage Paths
# ---------------------------------------------------------------------------
# DNS Services
infra_storage_dns_config: "{{ infra_storage_services_dir }}/dns/config"
infra_storage_dns_data: "{{ infra_storage_services_dir }}/dns/data"

# Proxy Services
infra_storage_proxy_config: "{{ infra_storage_services_dir }}/proxy/config"
infra_storage_proxy_cache: "{{ infra_storage_services_dir }}/proxy/cache"

# VPN Services
infra_storage_vpn_config: "{{ infra_storage_services_dir }}/vpn/config"

# AI Services
infra_storage_ai_config: "{{ infra_storage_services_dir }}/ai/config"
infra_storage_ai_data: "{{ infra_storage_services_dir }}/ai/data"

# agentmemory (persistent memory for AI coding agents)
infra_storage_agentmemory_config: "{{ infra_storage_services_dir }}/agentmemory/config"
infra_storage_agentmemory_data: "{{ infra_storage_data_dir }}/agentmemory"

# LiteLLM (AI Gateway — entry point for the pipeline)
infra_storage_litellm_config: "{{ infra_storage_services_dir }}/litellm/config"
infra_storage_litellm_data: "{{ infra_storage_data_dir }}/litellm"

# Langfuse (LLM observability & tracing — parallel analytics sink)
infra_storage_langfuse_config: "{{ infra_storage_services_dir }}/langfuse/config"
infra_storage_langfuse_data: "{{ infra_storage_data_dir }}/langfuse"

# Buzz (human + AI agent collaboration workspace / Nostr relay)
infra_storage_buzz_config: "{{ infra_storage_services_dir }}/buzz/config"
infra_storage_buzz_data: "{{ infra_storage_data_dir }}/buzz"
infra_storage_buzz_postgres_volume: "localnet-buzz-postgres-data-volume"
infra_storage_buzz_minio_volume: "localnet-buzz-minio-data-volume"

# Paperclip (AI agent orchestration platform)
infra_storage_paperclip_volume: "localnet-paperclip-data-volume"
infra_storage_paperclip_postgres_volume: "localnet-paperclip-postgres-data-volume"

# QM (Multiplayer agent harness — deployed to Windows Docker Desktop)
# Docker volumes for Postgres data and sandbox layer (skills, tools).
infra_storage_qm_postgres_volume: "localnet-qm-postgres-data-volume"
infra_storage_qm_layer_volume: "localnet-qm-layer-volume"

# Security Services
infra_storage_security_config: "{{ infra_storage_services_dir }}/security/config"
infra_storage_security_data: "{{ infra_storage_services_dir }}/security/data"

# ---------------------------------------------------------------------------
# Container Volume Mount Patterns
# ---------------------------------------------------------------------------
infra_storage_mount_config: "{{ infra_storage_config_dir }}/{{ infra_hostname_service }}"
infra_storage_mount_data: "{{ infra_storage_data_dir }}/{{ infra_hostname_service }}"
infra_storage_mount_logs: "{{ infra_storage_logs_dir }}/{{ infra_hostname_service }}"

# ---------------------------------------------------------------------------
# Backup Configuration
# ---------------------------------------------------------------------------
infra_storage_backup_retention_days: "7"
infra_storage_backup_schedule: "daily"
infra_storage_backup_compression: "gzip"

# ---------------------------------------------------------------------------
# WorldMonitor Self-Hosted Stack Storage
# Used by: deploy-worldmonitor.yml playbook
# Redis data volume name (Docker volume, not a host path — works on any OS)
# ---------------------------------------------------------------------------
infra_storage_worldmonitor_redis_data_volume: "worldmonitor-redis-data"

# ---------------------------------------------------------------------------
# JobOps Career Tool Storage
# Used by: Windows Docker Desktop hosts (deploy-jobops.yml playbook)
# Docker volume for persistent data (database, generated PDFs)
# ---------------------------------------------------------------------------
infra_storage_jobops_data_volume: "localnet-jobops-data-volume"
infra_storage_jobops_codex_volume: "localnet-jobops-codex-volume"

# ---------------------------------------------------------------------------
# RustFS S3-Compatible Object Storage
# Used by: Windows Docker Desktop hosts (deploy-rustfs.yml playbook)
# Docker volumes for object data and application logs
# ---------------------------------------------------------------------------
infra_storage_rustfs_data_volume: "localnet-rustfs-data-volume"
infra_storage_rustfs_logs_volume: "localnet-rustfs-logs-volume"

# ---------------------------------------------------------------------------
# Wazuh SIEM/XDR Storage
# Used by: Windows Docker Desktop hosts (deploy-wazuh.yml playbook)
# Docker volumes for manager, indexer, and dashboard persistent data.
# Cert volume holds generated TLS certs for internal inter-container TLS.
# ---------------------------------------------------------------------------
infra_storage_wazuh_manager_api_config_volume: "wazuh-manager-api-config"
infra_storage_wazuh_manager_etc_volume: "wazuh-manager-etc"
infra_storage_wazuh_manager_logs_volume: "wazuh-manager-logs"
infra_storage_wazuh_manager_queue_volume: "wazuh-manager-queue"
infra_storage_wazuh_manager_multigroups_volume: "wazuh-manager-multigroups"
infra_storage_wazuh_indexer_data_volume: "wazuh-indexer-data"
infra_storage_wazuh_dashboard_config_volume: "wazuh-dashboard-config"
infra_storage_wazuh_dashboard_custom_volume: "wazuh-dashboard-custom"
infra_storage_wazuh_certs_volume: "wazuh-certs"

# ---------------------------------------------------------------------------
# Freenet (P2P decentralized app platform — freenet-core peer node)
# Used by: Windows Docker Desktop hosts (deploy-freenet.yml playbook)
# Docker volume for persistent node data (contracts, delegate state, keys).
# Mounted at /root/.cache/freenet inside the container (FREENET_BASE_DIR).
# ---------------------------------------------------------------------------
infra_storage_freenet_data_volume: "localnet-freenet-data-volume"

# ---------------------------------------------------------------------------
# Verdaccio NPM Registry
# Used by: dual-deployment — OCI cloud server (cno) + Windows Docker Desktop (nl)
# Two independent registries with separate storage volumes.
# Config dir holds Ansible-rendered config.yaml + htpasswd.
# ---------------------------------------------------------------------------
infra_storage_verdaccio_data_volume: "localnet-verdaccio-data-volume"
infra_storage_verdaccio_config_volume: "localnet-verdaccio-config-volume"