# ----------------------------------------------------------------------------
# Infra Value Fallback Defaults
# ----------------------------------------------------------------------------
# This file defines the ultimate fallback defaults for the `infra_value_*`
# variable pattern used across all Ansible roles in this repository.
#
# Each `infra_value_*` variable is referenced as the final `default()` argument
# in role defaults files (e.g. `{{ infra_domain_foo | default(infra_value_foo) }}`).
# These values are intentionally non-functional placeholders: domains, docker
# hosts, ports and paths are empty strings; secrets/passwords/API keys are
# `"change-me"`; timezones are `UTC`; container names follow the
# `localnet-<service>` pattern; volumes follow `localnet-<service>-<type>-volume`;
# image tags default to `latest`; versions to `0.0.0`; booleans to `false`.
#
# In any real deployment these values should be overridden by the matching
# `infra_domain_*`, `infra_hostname_*`, `infra_storage_*`, `infra_port_*`,
# `infra_tailscale_*` or `vault_*` variables.
# ----------------------------------------------------------------------------

