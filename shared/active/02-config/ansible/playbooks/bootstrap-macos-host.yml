---
# Bootstrap macOS Host
# Location: shared/active/02-config/ansible/playbooks/bootstrap-macos-host.yml
#
# Minimal bootstrap for a fresh macOS machine: creates the Ansible admin user,
# enables SSH, installs the Nix daemon, and joins Tailscale/Netbird.
# System configuration (darwin-rebuild, Homebrew, apps, pmset, chflags) is
# handled by configure-macos-host.yml after bootstrap.
#
# Prerequisites (manual — see manual-macos-host-install.md):
#   1. SSH access to the Mac (either local or via Tailscale)
#   2. Admin password available (become: true for system changes)
#
# Usage (example with levonk client inventory):
#   ansible-playbook -i <client>/active/02-config/ansible/inventories/macos-hosts.yml \
#     shared/active/02-config/ansible/playbooks/bootstrap-macos-host.yml \
#     --vault-password-file ~/.ansible/vault_password \
#     --ask-become-pass

- name: "Bootstrap macOS Host — Create auser, SSH, Nix, Tailscale, Netbird"
  hosts: macos_hosts
  # Facts are gathered in pre_tasks AFTER the CLT check — /usr/bin/python3 on
  # a fresh Mac is a stub that errors out until Command Line Tools exist, so
  # every Python module (including setup) fails until CLT is installed.
  gather_facts: false
  become: false  # macOS uses sudo per-task, not persistent become

  pre_tasks:
    # /usr/bin/python3 on a fresh Mac is a stub that prints an xcode-select
    # error and exits non-zero — Ansible's setup module then fails with
    # "No start of json char found". Install Command Line Tools headless via
    # softwareupdate. Uses raw (no Python required on the target).
    - name: "Install Xcode Command Line Tools if missing (required for Python)"
      ansible.builtin.raw: |
        if xcode-select -p >/dev/null 2>&1; then
          echo "CLT already installed"
          exit 0
        fi
        touch /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        label=$(softwareupdate -l 2>/dev/null | grep -i "Command Line Tools" | sed -n 's/^.*Label: \(.*\)$/\1/p' | head -1)  # project-lint: disable=magic-int  first match only
        if [ -z "$label" ]; then
          label=$(softwareupdate -l 2>/dev/null | grep -i "Command Line Tools" | sed -n 's/^.*\* \(.*\)$/\1/p' | head -1)  # project-lint: disable=magic-int  first match only
        fi
        if [ -z "$label" ]; then
          rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
          echo "ERROR: no Command Line Tools update found" >&2  # project-lint: disable=magic-int  stderr fd
          exit 1
        fi
        softwareupdate -i "$label" --agree-to-license --verbose 2>&1 | tail -5  # project-lint: disable=magic-int  show install tail
        rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        xcode-select -p
      become: true
      tags: ["clt", "bootstrap"]

    - name: "Gather ansible_facts"
      ansible.builtin.setup:
        gather_subset: ["all"]
      tags: ["always"]

    - name: "Load shared infrastructure modes (infra_mode_*)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Validate required variables"
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_user is defined
          - ansible_facts['distribution'] == "MacOSX"
        fail_msg: "Missing connection variables or target is not macOS. Check inventories/macos-hosts.yml"
        success_msg: "Connection variables OK — target is macOS."
      tags: ["always", "validate"]

    - name: "Report target machine"
      ansible.builtin.debug:
        msg: |
          ========================================
          Bootstrap macOS Host
          ========================================
          Host: {{ inventory_hostname }}
          Ansible Host: {{ ansible_host }}
          User: {{ ansible_user }}
          OS: macOS {{ ansible_facts['distribution_version'] }}
          Architecture: {{ ansible_facts['architecture'] }}
          ========================================
      tags: ["always", "info"]

  tasks:
    # ---------------------------------------------------------------------------
    # Admin user (auser) — dedicated admin account for Ansible management
    # Mirrors the cuser pattern used on Linux hosts. The daily-use user
    # (e.g. micro) can be a non-admin for safety.
    # This user is in the admin group so Ansible can sudo for system changes.
    # ---------------------------------------------------------------------------
    - name: "Check if admin user (auser) exists"
      ansible.builtin.command: dscl . -read /Users/{{ macos_auser }} UniqueID
      register: auser_check
      changed_when: false
      failed_when: false
      tags: ["auser", "check"]

    - name: "Create admin user (auser)"
      ansible.builtin.command: >
        sysadminctl -addUser {{ macos_auser }}
        -password {{ vault_macos_auser_password | default('-') }}
        -admin -home /Users/{{ macos_auser }}
      when: auser_check.rc != 0
      become: true
      no_log: true
      tags: ["auser", "create"]

    # dseditgroup edits to the admin group require interactive admin
    # credentials on macOS 15+ even when running as root — only attempt the
    # edit when auser is genuinely missing from the group (normally created
    # with -admin by sysadminctl, so this is a no-op in practice).
    - name: "Check auser admin group membership"
      ansible.builtin.command: dseditgroup -o checkmember -m {{ macos_auser }} admin
      register: auser_admin_check
      changed_when: false
      failed_when: false
      tags: ["auser", "check"]

    - name: "Ensure auser is in admin group"
      ansible.builtin.command: dseditgroup -o edit -a {{ macos_auser }} -t user admin
      become: true
      changed_when: false
      when: auser_admin_check.rc != 0
      tags: ["auser", "configure"]

    # ---------------------------------------------------------------------------
    # Passwordless sudo for auser — mirrors the Linux host-os-bootstrap role's
    # /etc/sudoers.d/<admin_user> NOPASSWD entry. Without this, every subsequent
    # Ansible run that uses become: true would need --ask-become-pass, which
    # breaks unattended configure/os-update runs. The validate step uses
    # visudo -cf so a malformed entry can never break sudo on the host.
    # ---------------------------------------------------------------------------
    - name: "Grant auser passwordless sudo (NOPASSWD) — required for unattended Ansible"
      ansible.builtin.copy:
        content: "{{ macos_auser }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ macos_auser }}"
        owner: "root"
        group: "wheel"
        mode: "{{ infra_mode_file_readonly }}"
        validate: "visudo -cf %s"
      become: true
      tags: ["auser", "sudoers"]

    # The manual bootstrap script's `sudo mkdir -p /Users/auser/.ssh`
    # creates /Users/auser root-owned when sysadminctl doesn't materialize
    # the home directory — auser then can't write its own home and every
    # Ansible run fails at "Failed to create temporary directory".
    - name: "Ensure auser home directory exists and is owned by auser"
      ansible.builtin.file:
        path: "/Users/{{ macos_auser }}"
        state: directory
        owner: "{{ macos_auser }}"
        group: "staff"
        mode: "{{ infra_mode_dir }}"
      become: true
      tags: ["auser", "configure"]

    - name: "Create .ssh directory for auser"
      ansible.builtin.file:
        path: "/Users/{{ macos_auser }}/.ssh"
        state: directory
        owner: "{{ macos_auser }}"
        group: "staff"
        mode: "{{ infra_mode_dir_restricted }}"
      become: true
      tags: ["auser", "ssh"]

    - name: "Add SSH public key for auser"
      ansible.builtin.copy:
        content: "{{ macos_auser_ssh_public_key }}"
        dest: "/Users/{{ macos_auser }}/.ssh/authorized_keys"
        owner: "{{ macos_auser }}"
        group: "staff"
        mode: "{{ infra_mode_file_restricted }}"
      become: true
      when: macos_auser_ssh_public_key is defined
      tags: ["auser", "ssh"]

    # ---------------------------------------------------------------------------
    # SSH Server (Remote Login)
    # ---------------------------------------------------------------------------
    - name: "Enable Remote Login (SSH server)"
      ansible.builtin.command: systemsetup -setremotelogin on
      become: true
      changed_when: false
      tags: ["ssh"]

    - name: "Verify SSH server is running"
      ansible.builtin.command: launchctl list com.openssh.sshd
      register: sshd_status
      changed_when: false
      failed_when: false
      tags: ["ssh"]

    - name: "Report SSH status"
      ansible.builtin.debug:
        msg: "SSH server: {{ 'running' if sshd_status.rc == 0 else 'NOT running — check manually' }}"
      tags: ["ssh"]

    # ---------------------------------------------------------------------------
    # Nix — multi-user daemon mode (official installer)
    # Installs with: experimental-features = nix-command flakes
    # ---------------------------------------------------------------------------
    - name: "Check if Nix is installed"
      ansible.builtin.command: /nix/var/nix/profiles/default/bin/nix --version
      register: nix_check
      changed_when: false
      failed_when: false
      tags: ["nix", "check"]

    # The upstream Nix daemon installer writes an /etc/fstab entry for the
    # APFS "Nix Store" volume via `vifs`, but the fstab path is SIP-blocked
    # on macOS 26+ ("Operation not permitted" even as root). The install
    # below patches that call out — mounting is handled by the
    # org.nixos.darwin-store LaunchDaemon the installer creates.
    - name: "Install Nix (vanilla multi-user daemon)"
      # Fetches the release tarball directly so create-darwin-volume.sh can
      # be patched before running install: the fstab write (vifs) fails on
      # macOS 26+ where the fstab path is SIP-blocked. The patch is safe —
      # mounting is handled by the org.nixos.darwin-store LaunchDaemon the
      # installer creates; fstab only carried mount options.
      ansible.builtin.shell:
        cmd: |
          set -e
          workdir=$(mktemp -d)
          cd "$workdir"
          case "$(uname -m)" in
            arm64)  nixsys="aarch64-darwin" ;;
            x86_64) nixsys="x86_64-darwin" ;;
            *)      echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;  # project-lint: disable=magic-int  stderr fd
          esac
          curl -sSfL -o nix.tar.xz \
            "https://releases.nixos.org/nix/nix-{{ macos_nix_version }}/nix-{{ macos_nix_version }}-${nixsys}.tar.xz"
          tar -xJf nix.tar.xz
          cd "nix-{{ macos_nix_version }}-${nixsys}"
          sed -i '' 's|add_nix_vol_fstab_line "$volume_uuid" /usr/sbin/vifs|:|' create-darwin-volume.sh
          ./install --daemon --yes --daemon-user-count 4  # project-lint: disable=magic-int  builder user count, not an operational magic number
      when:
        - nix_check.rc != 0
        - macos_nix_flavor == "vanilla"
      become: true
      tags: ["nix", "install"]

    # The Determinate shell installer (nix-installer) still registers the
    # /nix mount via /etc/fstab, which is SIP-blocked on macOS 26+
    # ("Operation not permitted" renaming fstab.tmp). The macOS-native
    # Determinate.pkg mounts the store via a LaunchDaemon and works
    # headless via `installer -pkg`.
    - name: "Install Nix (Determinate pkg — launchd-mounted store)"
      ansible.builtin.shell:
        cmd: >
          curl --proto '=https' --tlsv1.2 -sSfL
          -o /tmp/determinate-nix.pkg
          https://install.determinate.systems/determinate-pkg/stable/Universal &&
          installer -pkg /tmp/determinate-nix.pkg -target / &&
          rm -f /tmp/determinate-nix.pkg
      when:
        - nix_check.rc != 0
        - macos_nix_flavor == "determinate"
      become: true
      tags: ["nix", "install"]

    - name: "Report Nix version"
      ansible.builtin.command: /nix/var/nix/profiles/default/bin/nix --version
      register: nix_version
      changed_when: false
      tags: ["nix", "verify"]

    - name: "Show Nix version"
      ansible.builtin.debug:
        msg: "{{ nix_version.stdout }}"
      tags: ["nix", "verify"]

    # ---------------------------------------------------------------------------
    # Tailscale
    # ---------------------------------------------------------------------------
    - name: "Check if Tailscale is connected"
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: false
      tags: ["tailscale", "check"]

    - name: "Join Tailscale network with auth key"
      ansible.builtin.command: >
        tailscale up
        --authkey {{ vpn_tailscale_auth_key }}
        --hostname {{ macos_tailscale_hostname }}
        --accept-routes
        --accept-dns
      when:
        - tailscale_status.rc != 0 or "Logged out" in tailscale_status.stdout
        - vpn_tailscale_auth_key is defined
        - vpn_tailscale_auth_key | length > 0
      no_log: true
      tags: ["tailscale", "configure"]

    - name: "Report Tailscale status"
      ansible.builtin.command: tailscale status
      register: tailscale_final_status
      changed_when: false
      tags: ["tailscale", "verify"]

    - name: "Show Tailscale status"
      ansible.builtin.debug:
        msg: "{{ tailscale_final_status.stdout_lines[:5] }}"
      tags: ["tailscale", "verify"]

    # ---------------------------------------------------------------------------
    # Netbird — optional (skipped if no setup key in vault)
    # ---------------------------------------------------------------------------
    - name: "Check if Netbird setup key is available"
      ansible.builtin.set_fact:
        netbird_enabled: >-
          {{ (vault_netbird_setup_key is defined) and (vault_netbird_setup_key | length > 0) }}
      tags: ["netbird", "check"]

    - name: "Report Netbird configuration status"
      ansible.builtin.debug:
        msg: "Netbird: {{ 'will configure (setup key found in vault)' if netbird_enabled | bool else 'skipped (no setup key in vault — not yet tested)' }}"
      tags: ["netbird", "check"]

    - name: "Check if Netbird is connected"
      ansible.builtin.command: netbird status
      register: netbird_status
      changed_when: false
      failed_when: false
      when: netbird_enabled | bool
      tags: ["netbird", "check"]

    - name: "Join Netbird network with setup key"
      ansible.builtin.command: >
        netbird up
        --managementURL {{ macos_netbird_management_url | default('https://api.netbird.io:{{ infra_port_proxy_https_host }}') }}
        --setupKey {{ vault_netbird_setup_key }}
        --hostname {{ macos_netbird_hostname }}
      when:
        - netbird_enabled | bool
        - netbird_status.rc != 0
      no_log: true
      tags: ["netbird", "configure"]

    - name: "Report Netbird status"
      ansible.builtin.command: netbird status
      register: netbird_final_status
      changed_when: false
      failed_when: false
      when: netbird_enabled | bool
      tags: ["netbird", "verify"]

    - name: "Show Netbird status"
      ansible.builtin.debug:
        msg: "{{ netbird_final_status.stdout_lines[:5] if (netbird_enabled | bool and netbird_final_status.stdout) else 'Netbird not configured (no setup key)' }}"
      tags: ["netbird", "verify"]

    # ---------------------------------------------------------------------------
    # Summary
    # ---------------------------------------------------------------------------
    - name: "Bootstrap complete — summary"
      ansible.builtin.debug:
        msg: |
          ========================================
          Bootstrap complete: {{ inventory_hostname }}
          ========================================
          Nix: {{ nix_version.stdout | default('check failed') }}
          System config: run `just ansible-configure-macos` to apply
          Tailscale: {{ 'connected' if (tailscale_final_status is defined and tailscale_final_status.rc == 0) else 'NOT connected' }}
          Netbird: {{ 'connected' if (netbird_enabled is defined and netbird_enabled | bool and netbird_final_status is defined and netbird_final_status.rc == 0) else ('skipped (no setup key)' if not (netbird_enabled is defined and netbird_enabled | bool) else 'NOT connected') }}
          SSH: enabled (Remote Login)
          ========================================
      tags: ["always", "summary"]
