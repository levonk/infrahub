---
# Configure macOS Host
# Location: shared/active/02-config/ansible/playbooks/configure-macos-host.yml
# Runbook for local validation: shared/active/08-docs/runbooks/nix-darwin-local-validation.md
# PRD: internal-docs/feature/2026/07/nix-darwin-use/feat-202607060157-nix-darwin-migration.md
#
# Applies the nix-darwin system configuration, installs apps (Homebrew +
# nix flake), configures the container runtime, and applies macOS
# power-management settings that nix-darwin cannot manage (pmset, chflags,
# windowserver). This must run AFTER bootstrap-macos-host.yml has created
# the auser admin and installed the Nix daemon.
#
# Usage:
#   ansible-playbook -i <client>/active/02-config/ansible/inventories/macos-hosts.yml \
#     shared/active/02-config/ansible/playbooks/configure-macos-host.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Configure macOS Host — nix-darwin + apps + pmset + chflags + windowserver"
  hosts: macos_hosts
  gather_facts: true
  become: false  # macOS uses sudo per-task

  vars:
    macos_auser_home: "/Users/{{ macos_auser }}"
    macos_infrahub_repo_dir: "{{ macos_auser_home }}/.local/share/infrahub"
    # Clients override these in their macos_hosts group_vars — they are
    # resolved via default() at the use sites, NOT in play vars, because
    # play-level vars outrank group_vars and would mask the override:
    #   macos_darwin_flake_repo_subdir   — repo subdir of the flake defining
    #     darwinConfigurations.<host> (default shared module library;
    #     levonk → "levonk/active/02-config/nix/darwin")
    #   macos_darwin_shared_repo_subdir  — repo subdir of the shared module-
    #     library flake (default shared; deployed beside the host flake only
    #     when it differs from the host flake)
    #   macos_darwin_override_inputs     — flake inputs repointed at the
    #     deployed shared-library dir via --override-input (default [];
    #     client flakes declare shared-darwin as an absolute path: input
    #     that only resolves on the control machine)
    # brew isn't on the SSH PATH — resolve arch-aware absolute path
    macos_brew_bin: "{{ '/opt/homebrew/bin/brew' if ansible_facts['architecture'] == 'arm64' else '/usr/local/bin/brew' }}"
    macos_brew_dir: "{{ macos_brew_bin | dirname }}"
    macos_nix_worktree_dir: "{{ macos_auser_home }}/.local/share/infrahub-darwin"
    macos_nix_shared_worktree_dir: "{{ macos_auser_home }}/.local/share/infrahub-darwin-shared"
    macos_nix_flake_dir: "{{ macos_auser_home }}/.local/share/nix-flake"
    # 5 dirname steps: playbooks -> ansible -> 02-config -> active -> shared -> infrahub root
    infrahub_root: "{{ playbook_dir | dirname | dirname | dirname | dirname | dirname }}"
    macos_infrahub_git_key_file: "{{ macos_auser_home }}/.ssh/{{ ansible_ssh_private_key_file | basename }}"
    # Minimum macOS major version that ships Apple Container (ARM only)
    macos_apple_container_min_major: "26"  # project-lint: disable=magic-int  macOS version number, not an operational value

  pre_tasks:
    - name: "Gather ansible_facts"
      ansible.builtin.setup:
        gather_subset: ["all"]
      tags: ["always"]

    - name: "Load shared infrastructure app defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/apps.yml"
      tags: ["always"]

    # modes.yml + timing.yml are shared-only (no client overrides exist in
    # levonk/active/02-config/ansible/infrastructure/) — see AGENTS.md
    # lessons learned: include_vars must load all infrastructure files.
    - name: "Load shared infrastructure modes (infra_mode_*)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Load shared infrastructure timing defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/timing.yml"
      tags: ["always"]

    # ports.yml + networks.yml are needed by the nix-harmonia role
    # (nix_harmonia_host_port, infra_network_bind_localhost).
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    # ---------------------------------------------------------------------------
    # Verify and repair bootstrap state
    #
    # If a host was manually provisioned (not via the bootstrap skill), some
    # bootstrap steps may be missing. This block checks each bootstrap
    # artifact and re-runs the corresponding task if missing. All tasks are
    # idempotent — safe to re-run on already-bootstrapped hosts.
    #
    # This mirrors the bootstrap-macos-host.yml playbook so that
    # `just ansible-configure-macos` is self-healing regardless of how the
    # host was initially set up.
    # ---------------------------------------------------------------------------
    - name: "Check if admin user (auser) exists"
      ansible.builtin.command: dscl . -read /Users/{{ macos_auser }} UniqueID
      register: auser_check
      changed_when: false
      failed_when: false
      tags: ["always", "bootstrap-verify"]

    - name: "Create admin user (auser) if missing"
      ansible.builtin.command: >
        sysadminctl -addUser {{ macos_auser }}
        -password {{ vault_macos_auser_password | default('-') }}
        -admin -home /Users/{{ macos_auser }}
      when: auser_check.rc != 0
      become: true
      no_log: true
      tags: ["always", "bootstrap-verify"]

    # dseditgroup edits to the admin group require interactive admin
    # credentials on macOS 15+ even when running as root — only attempt the
    # edit when auser is genuinely missing from the group (normally created
    # with -admin by sysadminctl above, so this is a no-op in practice).
    - name: "Check auser admin group membership"
      ansible.builtin.command: dseditgroup -o checkmember -m {{ macos_auser }} admin
      register: auser_admin_check
      changed_when: false
      failed_when: false
      tags: ["always", "bootstrap-verify"]

    - name: "Ensure auser is in admin group"
      ansible.builtin.command: dseditgroup -o edit -a {{ macos_auser }} -t user admin
      become: true
      changed_when: false
      when: auser_admin_check.rc != 0
      tags: ["always", "bootstrap-verify"]

    - name: "Check auser passwordless sudo"
      ansible.builtin.stat:
        path: "/etc/sudoers.d/{{ macos_auser }}"
      register: auser_sudoers
      tags: ["always", "bootstrap-verify"]

    - name: "Grant auser passwordless sudo if missing"
      ansible.builtin.copy:
        content: "{{ macos_auser }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ macos_auser }}"
        owner: "root"
        group: "wheel"
        mode: "{{ infra_mode_file_readonly }}"
        validate: "visudo -cf %s"
      become: true
      when: not auser_sudoers.stat.exists
      tags: ["always", "bootstrap-verify"]

    - name: "Check if SSH (Remote Login) is enabled"
      ansible.builtin.command: launchctl list com.openssh.sshd
      register: sshd_status
      changed_when: false
      failed_when: false
      tags: ["always", "bootstrap-verify"]

    - name: "Enable Remote Login (SSH) if not running"
      ansible.builtin.command: systemsetup -setremotelogin on
      become: true
      changed_when: false
      when: sshd_status.rc != 0
      tags: ["always", "bootstrap-verify"]

    - name: "Check if Nix is installed"
      ansible.builtin.command: /nix/var/nix/profiles/default/bin/nix --version
      register: nix_check
      changed_when: false
      failed_when: false
      tags: ["always", "bootstrap-verify"]

    - name: "Install Nix if missing (multi-user daemon)"
      # Same patched-tarball approach as bootstrap-macos-host.yml: the fstab
      # write (vifs) fails on macOS 26+ where the fstab path is SIP-blocked;
      # mounting is handled by the org.nixos.darwin-store LaunchDaemon.
      ansible.builtin.shell:
        cmd: |
          set -e
          workdir=$(mktemp -d)
          cd "$workdir"
          case "$(uname -m)" in
            arm64)  nixsys="aarch64-darwin" ;;
            x86_64) nixsys="x86_64-darwin" ;;
            *)      echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;  # project-lint: disable=magic-int  stderr fd
          esac
          curl -sSfL -o nix.tar.xz \
            "https://releases.nixos.org/nix/nix-{{ macos_nix_version }}/nix-{{ macos_nix_version }}-${nixsys}.tar.xz"
          tar -xJf nix.tar.xz
          cd "nix-{{ macos_nix_version }}-${nixsys}"
          sed -i '' 's|add_nix_vol_fstab_line "$volume_uuid" /usr/sbin/vifs|:|' create-darwin-volume.sh
          ./install --daemon --yes --daemon-user-count 4  # project-lint: disable=magic-int  builder user count, not an operational magic number
      when:
        - nix_check.rc != 0
        - macos_nix_flavor == "vanilla"
      become: true
      tags: ["always", "bootstrap-verify"]

    - name: "Check if Tailscale CLI is installed"
      ansible.builtin.command: command -v tailscale
      register: tailscale_bin_check
      changed_when: false
      failed_when: false
      tags: ["always", "bootstrap-verify"]

    - name: "Check if Tailscale is connected"
      ansible.builtin.command: tailscale status
      register: tailscale_check
      changed_when: false
      failed_when: false
      when: tailscale_bin_check.rc == 0
      tags: ["always", "bootstrap-verify"]

    - name: "Join Tailscale if not connected"
      ansible.builtin.command: >
        tailscale up
        --authkey {{ vpn_tailscale_auth_key }}
        --hostname {{ macos_tailscale_hostname }}
        --accept-routes
        --accept-dns
      when:
        - tailscale_bin_check.rc == 0
        - tailscale_check is defined
        - tailscale_check.rc != 0 or "Logged out" in tailscale_check.stdout
        - vpn_tailscale_auth_key is defined
        - vpn_tailscale_auth_key | length > 0
      no_log: true
      tags: ["always", "bootstrap-verify"]

    - name: "Auto-detect container runtime (macOS 26+ ARM → Apple Container, else OrbStack)"  # project-lint: disable=magic-int  macOS version number, not an operational value
      ansible.builtin.set_fact:
        infra_app_container_runtime: >-
          {{ 'apple-container'
             if (ansible_facts['distribution_version'] is version(macos_apple_container_min_major, '>=') and ansible_facts['architecture'] == 'arm64')
             else 'orbstack' }}
      when: infra_app_container_runtime is not defined or infra_app_container_runtime == "auto"
      tags: ["always"]

    - name: "Report target machine"
      ansible.builtin.debug:
        msg: |
          ========================================
          Configure macOS Host
          ========================================
          Host: {{ inventory_hostname }}
          OS: macOS {{ ansible_facts['distribution_version'] }}
          Architecture: {{ ansible_facts['architecture'] }}
          Container runtime: {{ infra_app_container_runtime }}
          ========================================
      tags: ["always", "info"]

    - name: "Check infrahub repo status on control machine" # noqa command-instead-of-module
      ansible.builtin.command: git status --porcelain
      args:
        chdir: "{{ infrahub_root }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      register: infrahub_git_status
      tags: ["always"]
      # git module can't do `status --porcelain`; intentional command use

    - name: "Resolve infrahub Git URL for target" # noqa command-instead-of-module
      ansible.builtin.command: git remote get-url origin
      args:
        chdir: "{{ infrahub_root }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      register: infrahub_git_origin
      tags: ["always"]
      # git module can't do `remote get-url`; intentional command use

    - name: "Set infrahub git URL fact (target ssh cannot use control alias github-l)"
      ansible.builtin.set_fact:
        macos_infrahub_git_url: "{{ infrahub_git_origin.stdout | regex_replace('github-l', 'github.com') }}"
      tags: ["always"]

  tasks:
    # ---------------------------------------------------------------------------
    # Nix configuration — nix.conf + x86_64 channel pinning
    # ---------------------------------------------------------------------------
    # Only vanilla Nix has its nix.conf managed here — on Determinate Nix
    # hosts (macos_nix_flavor=determinate) determinate-nixd owns
    # /etc/nix/nix.conf; overwriting it breaks the daemon. Extra settings
    # go to /etc/nix/nix.custom.conf via the shared nix-darwin module.
    # nix-darwin owns /etc/nix/nix.conf after first activation (it becomes a
    # symlink into /etc/static). Only write the bootstrap config while it's
    # still a regular file — overwriting the managed symlink would conflict
    # with activation's unexpected-files check.
    - name: "Check whether /etc/nix/nix.conf is managed by nix-darwin"
      ansible.builtin.stat:
        path: /etc/nix/nix.conf
      register: nix_conf_state
      tags: ["nix", "configure"]

    - name: "Ensure nix.conf has flakes + nix-command + optimisation enabled"
      ansible.builtin.copy:
        dest: /etc/nix/nix.conf
        content: |
          experimental-features = nix-command flakes
          auto-optimise-store = true
          keep-outputs = true
          keep-derivations = true
          accept-flake-config = true
        mode: "{{ infra_mode_file }}"
        owner: root
        group: wheel
      become: true
      when:
        - macos_nix_flavor == "vanilla"
        - not (nix_conf_state.stat.islnk | default(false))
      tags: ["nix", "configure"]

    - name: "Restart nix-daemon to pick up config"
      ansible.builtin.command: launchctl kickstart -k system/org.nixos.nix-daemon
      become: true
      changed_when: false
      when: macos_nix_flavor == "vanilla"
      tags: ["nix", "configure"]

    # ponytail: nixpkgs 26.11 dropped x86_64-darwin; pin 26.05-darwin for x86_64 only
    - name: "Pin nixpkgs to 26.05-darwin for x86_64-darwin"  # project-lint: disable=magic-dotted  version number, not an operational magic number
      ansible.builtin.command: |
        /nix/var/nix/profiles/default/bin/nix-channel --add https://nixos.org/channels/nixpkgs-26.05-darwin nixpkgs  # project-lint: disable=magic-dotted  version number, not an operational magic number
        /nix/var/nix/profiles/default/bin/nix-channel --update
      changed_when: true
      when:
        - ansible_facts['distribution'] == "MacOSX"
        - ansible_facts['architecture'] == "x86_64"
      tags: ["nix", "configure"]

    - name: "Set nixpkgs flake registry to 26.05-darwin for x86_64-darwin"  # project-lint: disable=magic-dotted  version number, not an operational magic number
      ansible.builtin.command: >
        /nix/var/nix/profiles/default/bin/nix registry add nixpkgs
        github:NixOS/nixpkgs/nixpkgs-26.05-darwin  # project-lint: disable=magic-dotted  version number, not an operational magic number
      changed_when: true
      when:
        - ansible_facts['distribution'] == "MacOSX"
        - ansible_facts['architecture'] == "x86_64"
      tags: ["nix", "configure"]

    # ---------------------------------------------------------------------------
    # Harmonia signing key — when the host's nix-darwin config enables
    # services.harmonia-darwin, the launchd daemon reads
    # /etc/nix/harmonia.secret at startup. Deploy the key BEFORE activation
    # so the daemon starts cleanly on first run; the role also kickstarts
    # the daemon on hosts where it is already crash-looping without the key.
    # ---------------------------------------------------------------------------
    - name: "Deploy Harmonia signing key (nix-harmonia role, darwin dispatch)"
      ansible.builtin.include_role:
        name: nix-harmonia
      tags: ["nix", "harmonia"]

    # ---------------------------------------------------------------------------
    # Homebrew — must be installed BEFORE nix-darwin activation: the homebrew
    # module aborts activation when /opt/homebrew/bin/brew is absent.
    # ---------------------------------------------------------------------------
    - name: "Check if Homebrew is installed"
      ansible.builtin.command: "{{ macos_brew_bin }} --version"
      register: brew_check
      changed_when: false
      failed_when: false
      tags: ["brew", "check"]

    - name: "Install Homebrew"
      ansible.builtin.shell:
        cmd: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"  # project-lint: disable=magic-int  env var flag, not an operational value
      when: brew_check.rc != 0
      tags: ["brew", "install"]

    # The brew installer creates /opt/homebrew owned by the installing user
    # (auser) with 755 dirs — group admins (e.g. micro, who runs `brew bundle`
    # during nix-darwin activation) then can't write Caskroom/caches. Normalize
    # to group-writable admin.
    - name: "Normalize Homebrew dir permissions for admin group"
      ansible.builtin.shell:
        cmd: |
          BREW_DIR="{{ macos_brew_dir | dirname }}"
          chgrp -R admin "$BREW_DIR"
          find "$BREW_DIR" -type d -exec chmod g+w {} +
          chmod -R g+w "$BREW_DIR"
      become: true
      changed_when: true
      when: brew_check.rc == 0 or brew_check.changed
      tags: ["brew", "install"]

    # ---------------------------------------------------------------------------
    # Deploy the nix-darwin flake to the target
    # Clean control repo: try a full git clone from origin; if auth fails, fall
    # back to copying the local darwin directory. Dirty repo: copy local changes.
    # For client flakes (macos_darwin_flake_repo_subdir != the shared module
    # library), the shared library tree is deployed to a second worktree and
    # referenced via --override-input so the client flake's absolute path:
    # inputs resolve on the target.
    # ---------------------------------------------------------------------------
    - name: "Clone infrahub from origin if control repo is clean"
      when: infrahub_git_status.stdout | length == 0
      block:
        - name: "Clone infrahub to target" # noqa latest[git]
          ansible.builtin.git:
            repo: "{{ macos_infrahub_git_url }}"
            dest: "{{ macos_infrahub_repo_dir }}"
            key_file: "{{ macos_infrahub_git_key_file }}"
            version: HEAD
            accept_newhostkey: true
          register: infrahub_clone
          tags: ["nix-darwin", "deploy"]

        - name: "Set flake paths from clone"
          ansible.builtin.set_fact:
            macos_darwin_flake_dir: "{{ macos_infrahub_repo_dir }}/{{ macos_darwin_flake_repo_subdir | default('shared/active/02-config/nix/darwin') }}"
            macos_darwin_shared_dir: "{{ macos_infrahub_repo_dir }}/{{ macos_darwin_shared_repo_subdir | default('shared/active/02-config/nix/darwin') }}"
          tags: ["nix-darwin", "deploy"]
      rescue:
        # ponytail: target may not have a GitHub-deploying private key; copying the
        # local darwin tree is the same as a clone when the control repo is clean.
        - name: "Fallback — copy local nix-darwin flake"
          ansible.posix.synchronize:
            src: "{{ infrahub_root }}/{{ macos_darwin_flake_repo_subdir | default('shared/active/02-config/nix/darwin') }}/"
            dest: "{{ macos_nix_worktree_dir }}"
          tags: ["nix-darwin", "deploy"]

        - name: "Set flake paths from local copy"
          ansible.builtin.set_fact:
            macos_darwin_flake_dir: "{{ macos_nix_worktree_dir }}"
            macos_darwin_shared_dir: "{{ macos_nix_shared_worktree_dir }}"
          tags: ["nix-darwin", "deploy"]

    - name: "Copy local nix-darwin flake if control repo is dirty"
      ansible.posix.synchronize:
        src: "{{ infrahub_root }}/{{ macos_darwin_flake_repo_subdir | default('shared/active/02-config/nix/darwin') }}/"
        dest: "{{ macos_nix_worktree_dir }}"
      when: infrahub_git_status.stdout | length > 0
      tags: ["nix-darwin", "deploy"]

    - name: "Set flake paths from dirty local copy"
      ansible.builtin.set_fact:
        macos_darwin_flake_dir: "{{ macos_nix_worktree_dir }}"
        macos_darwin_shared_dir: "{{ macos_nix_shared_worktree_dir }}"
      when: infrahub_git_status.stdout | length > 0
      tags: ["nix-darwin", "deploy"]

    # The shared module library only needs its own worktree when the host
    # flake is a different tree that consumes it via --override-input.
    - name: "Copy shared nix-darwin module library for client flake"
      ansible.posix.synchronize:
        src: "{{ infrahub_root }}/{{ macos_darwin_shared_repo_subdir | default('shared/active/02-config/nix/darwin') }}/"
        dest: "{{ macos_nix_shared_worktree_dir }}"
      when:
        - macos_darwin_shared_dir is defined
        - macos_darwin_shared_dir == macos_nix_shared_worktree_dir
        - macos_darwin_flake_repo_subdir | default('shared/active/02-config/nix/darwin') != macos_darwin_shared_repo_subdir | default('shared/active/02-config/nix/darwin')
      tags: ["nix-darwin", "deploy"]

    - name: "Build --override-input args for flake inputs pointed at the shared library"
      ansible.builtin.set_fact:
        macos_darwin_override_args: >-
          {{ (macos_darwin_override_inputs | default([]))
             | map('regex_replace', '^(.*)$', '--override-input \1 path:' + macos_darwin_shared_dir)
             | join(' ') }}
      when: macos_darwin_shared_dir is defined
      tags: ["nix-darwin", "deploy"]

    - name: "Apply nix-darwin configuration"
      ansible.builtin.command: >
        /nix/var/nix/profiles/default/bin/nix run nix-darwin -- switch
        --flake {{ macos_darwin_flake_dir }}#{{ inventory_hostname }}
        {{ macos_darwin_override_args | default('') }}
      become: true
      changed_when: true
      register: nix_darwin_switch
      # nix-darwin switch exits non-zero if the Homebrew bundle step fails
      # during activation, even though the system generation was built and
      # profiled successfully. The verification gate below checks whether
      # the new generation is actually active — that's the real success
      # signal. We tolerate non-zero exit here so the gate can run.
      failed_when: false
      tags: ["nix-darwin", "apply"]

    # ---------------------------------------------------------------------------
    # Verification gate — ensure the new generation is actually active before
    # proceeding to Homebrew, casks, container runtime, and pmset tasks.
    #
    # nix-darwin's activate-system launchd daemon is responsible for updating
    # /run/current-system to point at the newly-built generation. On first
    # install (or if the daemon didn't reload during activation), the symlink
    # may still point at the old generation — the switch command exits
    # successfully, but the new packages are not on PATH. This gate detects
    # the mismatch, restarts the daemon, and fails if it still doesn't pick
    # up the new generation.
    # ---------------------------------------------------------------------------
    - name: "Read the latest profile generation"
      ansible.builtin.command: readlink -f /nix/var/nix/profiles/system
      register: nix_darwin_profile_target
      changed_when: false
      failed_when: false
      tags: ["nix-darwin", "verify"]

    - name: "Read the active system symlink"
      ansible.builtin.command: readlink -f /run/current-system
      register: nix_darwin_active_target
      changed_when: false
      failed_when: false
      tags: ["nix-darwin", "verify"]

    - name: "Restart activate-system daemon if generation is not active"
      ansible.builtin.shell:
        cmd: |
          launchctl bootout system/org.nixos.activate-system 2>/dev/null || true
          sleep 2  # project-lint: disable=magic-int  brief pause before re-bootstrap
          if [ -f /Library/LaunchDaemons/org.nixos.activate-system.plist ]; then
            launchctl bootstrap system /Library/LaunchDaemons/org.nixos.activate-system.plist
            sleep 5  # project-lint: disable=magic-int  wait for daemon to update /run/current-system
          else
            # First-generation activation — the activate-system plist only
            # lands in /Library/LaunchDaemons once activation runs, so run
            # the built system's activate script directly. Activation
            # refuses to overwrite /etc files it doesn't manage yet (the
            # nix.conf we pre-wrote for flakes, and the installer's bashrc/
            # zshrc hooks) — park them as *.before-nix-darwin per the
            # documented first-activation procedure; nix-darwin writes
            # managed copies.
            for f in /etc/nix/nix.conf /etc/nix/nix.custom.conf /etc/bashrc /etc/zshrc; do
              if [ -f "$f" ]; then
                mv -f "$f" "$f.before-nix-darwin"
              fi
            done
            "$(readlink -f /nix/var/nix/profiles/system)/activate"
          fi
      become: true
      when: >
        nix_darwin_active_target.stdout | default('') != nix_darwin_profile_target.stdout | default('')
      tags: ["nix-darwin", "verify"]

    - name: "Re-read the active system symlink after daemon restart"
      ansible.builtin.command: readlink -f /run/current-system
      register: nix_darwin_active_target_after
      changed_when: false
      failed_when: false
      when: >
        nix_darwin_active_target.stdout | default('') != nix_darwin_profile_target.stdout | default('')
      tags: ["nix-darwin", "verify"]

    - name: "Fail if new generation is still not active"
      ansible.builtin.fail:
        msg: |
          nix-darwin switch completed but /run/current-system does not point
          at the latest generation. Even after restarting the activate-system
          daemon, the mismatch persists.
          Profile generation: {{ nix_darwin_profile_target.stdout | default('NOT FOUND') }}
          Active system:      {{ nix_darwin_active_target_after.stdout | default('NOT FOUND') }}
          Switch exit code:   {{ nix_darwin_switch.rc }}
          Manual recovery:
            sudo launchctl bootout system/org.nixos.activate-system
            sudo launchctl bootstrap system /Library/LaunchDaemons/org.nixos.activate-system.plist
            readlink -f /run/current-system
      when: >
        nix_darwin_active_target.stdout | default('') != nix_darwin_profile_target.stdout | default('')
        and
        nix_darwin_active_target_after.stdout | default('') != nix_darwin_profile_target.stdout | default('')
      tags: ["nix-darwin", "verify"]

    - name: "Warn if switch exited non-zero but generation is active"
      ansible.builtin.debug:
        msg: |
          WARNING: nix-darwin switch exited with code {{ nix_darwin_switch.rc }}
          but the new generation IS active. The non-zero exit was likely caused
          by a Homebrew bundle failure during activation — the system packages
          are correct, but some casks may not have installed. Check switch output:
          {{ nix_darwin_switch.stderr_lines[-3:] | default('no stderr') }}  # project-lint: disable=magic-int  stderr line count, not an operational value
      when: nix_darwin_switch.rc | default(0) != 0 and nix_darwin_active_target_after.stdout | default(nix_darwin_active_target.stdout | default('')) == nix_darwin_profile_target.stdout | default('')  # project-lint: disable=magic-int  exit code comparison, not an operational value
      tags: ["nix-darwin", "verify"]

    # ---------------------------------------------------------------------------
    # Homebrew — for cask apps not in nixpkgs
    # ---------------------------------------------------------------------------
    - name: "Report Homebrew version"
      ansible.builtin.command: "{{ macos_brew_bin }} --version"
      register: brew_version
      changed_when: false
      failed_when: false
      tags: ["brew", "verify"]

    - name: "Show Homebrew version"
      ansible.builtin.debug:
        msg: "{{ brew_version.stdout_lines[0] }}"
      tags: ["brew", "verify"]

    # ---------------------------------------------------------------------------
    # Nix flake — install CLI + GUI apps
    # The flake is in shared/active/02-config/nix/flake.nix
    # ---------------------------------------------------------------------------
    - name: "Ensure nix flake dir exists on target"
      ansible.builtin.file:
        path: "{{ macos_nix_flake_dir }}"
        state: directory
        owner: "{{ macos_auser }}"
        mode: "{{ infra_mode_dir }}"
      tags: ["nix", "flake"]

    - name: "Copy nix flake to target host"
      ansible.builtin.copy:
        src: "{{ infrahub_root }}/shared/active/02-config/nix/flake.nix"
        dest: "{{ macos_nix_flake_dir }}/flake.nix"
        mode: "{{ infra_mode_file }}"
      tags: ["nix", "flake"]

    # `nix profile install` is a no-op when the attr is already installed —
    # it reports "already added" and never re-evaluates. Remove first so the
    # package set actually converges with the synced flake.
    - name: "Reinstall host apps via nix flake (CLI + GUI packages)"
      ansible.builtin.command: >
        /nix/var/nix/profiles/default/bin/nix profile remove host-apps
      register: nix_profile_remove
      changed_when: true
      failed_when: nix_profile_remove.rc != 0 and 'does not exist' not in (nix_profile_remove.stderr | default('')) and 'not installed' not in (nix_profile_remove.stderr | default(''))
      tags: ["nix", "apps"]

    - name: "Install host apps via nix flake (CLI + GUI packages)"
      ansible.builtin.command: >
        /nix/var/nix/profiles/default/bin/nix profile install
        {{ macos_nix_flake_dir }}#host-apps
      register: nix_profile_install
      changed_when: "'installed' in nix_profile_install.stdout or 'built' in nix_profile_install.stdout"
      tags: ["nix", "apps"]

    - name: "Symlink GUI .app bundles to /Applications"
      ansible.builtin.command: >
        /nix/var/nix/profiles/default/bin/nix run
        {{ macos_nix_flake_dir }}#symlink-apps
      register: nix_symlink
      changed_when: "'Done.' in nix_symlink.stdout"
      tags: ["nix", "apps", "symlink"]

    - name: "Report symlinked apps"
      ansible.builtin.debug:
        msg: "{{ nix_symlink.stdout }}"
      tags: ["nix", "apps", "symlink"]

    # ---------------------------------------------------------------------------
    # Homebrew casks — apps not in nixpkgs
    # OrbStack is only needed when container runtime is "orbstack"
    # (Apple Container is built into macOS 26+ and needs no install)
    # ---------------------------------------------------------------------------
    - name: "Filter cask list — remove OrbStack if using Apple Container"
      ansible.builtin.set_fact:
        macos_brew_casks: >-
          {{ infra_app_brew_casks | reject('search', 'orbstack') | list
             if infra_app_container_runtime == "apple-container"
             else infra_app_brew_casks }}
      tags: ["brew", "casks"]

    - name: "Install Homebrew cask apps"
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: present
        path: "{{ macos_brew_dir }}"
        install_options: "appdir=/Applications"
      loop: "{{ macos_brew_casks }}"
      tags: ["brew", "casks"]

    # ---------------------------------------------------------------------------
    # Container Runtime — auto-detected:
    #   macOS 26+ ARM  → Apple Container (native, no third-party runtime)
    #   otherwise      → OrbStack (installed via brew cask above)
    # ---------------------------------------------------------------------------
    - name: "Check if OrbStack is installed"
      ansible.builtin.command: orbstack version
      register: orbstack_check
      changed_when: false
      failed_when: false
      when: infra_app_container_runtime == "orbstack"
      tags: ["containers", "check"]

    - name: "Report OrbStack status"
      ansible.builtin.debug:
        msg: "OrbStack: {{ orbstack_check.stdout if orbstack_check.rc == 0 else 'not installed' }}"
      when: infra_app_container_runtime == "orbstack"
      tags: ["containers", "check"]

    - name: "Check if Apple Container CLI is available"
      ansible.builtin.command: container --version
      register: apple_container_check
      changed_when: false
      failed_when: false
      when: infra_app_container_runtime == "apple-container"
      tags: ["containers", "check"]

    - name: "Report Apple Container status"
      ansible.builtin.debug:
        msg: "Apple Container: {{ apple_container_check.stdout if apple_container_check.rc == 0 else 'not installed — requires macOS 26+' }}"  # project-lint: disable=magic-int  macOS version number, not an operational value
      when: infra_app_container_runtime == "apple-container"
      tags: ["containers", "check"]

    # OrbStack is installed via brew cask above (in infra_app_brew_casks).
    # Apple Container is built into macOS 26+ (no install needed).

    - name: "Verify container runtime is available"
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false
      tags: ["containers", "verify"]

    - name: "Report container runtime"
      ansible.builtin.debug:
        msg: "Docker CLI: {{ docker_check.stdout if docker_check.rc == 0 else 'NOT available — OrbStack may need to be started' }}"
      tags: ["containers", "verify"]

    # ---------------------------------------------------------------------------
    # Power management (laptop-only) + filesystem / display tweaks
    # These are the 7 sudo-requiring settings removed from osx-settings.py.
    # ---------------------------------------------------------------------------
    - name: "Apply pmset power settings"
      when: "'Book' in ansible_facts['product_name']"
      tags: ["pmset"]
      block:
        - name: "pmset -a lidwake 1"  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          ansible.builtin.command: pmset -a lidwake 1  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          become: true
          changed_when: true

        - name: "pmset -a autorestart 1"  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          ansible.builtin.command: pmset -a autorestart 1  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          become: true
          changed_when: true

        - name: "pmset -a displaysleep 4"  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          ansible.builtin.command: pmset -a displaysleep 4  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          become: true
          changed_when: true

        - name: "pmset -c sleep 0"  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          ansible.builtin.command: pmset -c sleep 0  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          become: true
          changed_when: true

        - name: "pmset -b sleep 5"  # project-lint: disable=magic-int  shell command argument, not an operational value
          ansible.builtin.command: pmset -b sleep 5  # project-lint: disable=magic-int  shell command argument, not an operational value
          become: true
          changed_when: true

    # Desktops/headless minis: never sleep, wake on network access —
    # otherwise the host drops off Tailscale and LAN SSH when idle.
    - name: "Apply pmset power settings (desktop/headless)"
      when: "'Book' not in ansible_facts['product_name']"
      tags: ["pmset"]
      block:
        - name: "pmset -a sleep 0"  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          ansible.builtin.command: pmset -a sleep 0  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          become: true
          changed_when: true

        - name: "pmset -a womp 1"  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          ansible.builtin.command: pmset -a womp 1  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          become: true
          changed_when: true

        - name: "pmset -a autorestart 1"  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          ansible.builtin.command: pmset -a autorestart 1  # project-lint: disable=magic-int  macOS power management setting, not a standalone magic number
          become: true
          changed_when: true

    - name: "Show /Volumes in Finder"
      ansible.builtin.command: chflags nohidden /Volumes
      become: true
      changed_when: true
      tags: ["chflags"]

    - name: "Enable HiDPI display modes"
      ansible.builtin.command: defaults write /Library/Preferences/com.apple.windowserver DisplayResolutionEnabled -bool true
      become: true
      changed_when: true
      tags: ["windowserver"]

    # ---------------------------------------------------------------------------
    # Hosts-file blocklist — sinkhole IP-logger/tracker/grabber domains
    # ---------------------------------------------------------------------------
    - name: "Sinkhole IP-logger/tracker domains in /etc/hosts"
      ansible.builtin.include_role:
        name: common-hosts-blocklist
      tags: ["hardening", "hosts-blocklist"]

    # ---------------------------------------------------------------------------
    # Firefox enterprise policy — force-install Bitwarden, disable password
    # manager, disable telemetry, disable form autofill, force popups to tabs
    # with full chrome. Requires root for .app/Contents/Resources/distribution.
    # ---------------------------------------------------------------------------
    - name: "Distribute Firefox enterprise policies.json"
      ansible.builtin.include_role:
        name: common-firefox-policy
      tags: ["firefox-policy", "hardening"]

    # ---------------------------------------------------------------------------
    # Chromium-family enterprise policy — disable built-in password manager,
    # leak/breach monitoring, and form autofill so Bitwarden is the only
    # credential manager. Requires root for /Library/Managed Preferences.
    # ---------------------------------------------------------------------------
    - name: "Distribute Chromium managed-preferences policies"
      ansible.builtin.include_role:
        name: common-chromium-policy
      tags: ["chromium-policy", "hardening"]

    # ---------------------------------------------------------------------------
    # Xcode — install via mas (Mac App Store CLI)
    # Requires: mas in PATH (nix-darwin fleet module), Apple ID signed in to
    # App Store. Skipped if Xcode already at target version. Run selectively:
    #   --tags xcode          install/upgrade Xcode only
    #   --skip-tags xcode     skip Xcode (useful for non-dev hosts)
    # ---------------------------------------------------------------------------
    - name: "Install Xcode via mas"
      ansible.builtin.include_role:
        name: macos-xcode
      tags: ["xcode", "dev-tools"]

    # ---------------------------------------------------------------------------
    # Summary
    # ---------------------------------------------------------------------------
    - name: "Configure complete — summary"
      ansible.builtin.debug:
        msg: |
          ========================================
          Configure complete: {{ inventory_hostname }}
          ========================================
          Nix: darwin-rebuild applied
          Homebrew: {{ brew_version.stdout_lines[0] | default('check failed') }}
          Nix apps: installed via flake (CLI in profile, GUI symlinked to /Applications)
          Brew casks: {{ macos_brew_casks | default([]) | join(', ') }}
          Container runtime: {{ infra_app_container_runtime | default('auto') }}
          Docker CLI: {{ docker_check.stdout if (docker_check is defined and docker_check.rc == 0) else 'NOT available' }}
          Xcode: run `just ansible-install-xcode` or `--tags xcode` to install
          ========================================
      tags: ["always", "summary"]
