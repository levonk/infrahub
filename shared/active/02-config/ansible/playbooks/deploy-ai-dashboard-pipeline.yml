---
# AI Dashboard Pipeline Deployment Playbook (DEPRECATED — partial overlap with gateway playbook)
#
# STATUS: Being deprecated in favor of deploy-ai-gateway-pipeline.yml, which is now the
#         primary playbook for the AI pipeline. The gateway playbook deploys LiteLLM,
#         Headroom, and OmniRoute (plus pre-stages Langfuse for observability).
#
#         This playbook is RETAINED because it is currently the only place Iron-Proxy
#         (egress firewall) is deployed via an Ansible role include. The gateway playbook
#         does not yet include the proxy-iron-proxy role. Once Iron-Proxy is folded into
#         the gateway playbook, this file can be fully retired.
#
# CURRENT MVP PIPELINE (active):
#   Omnigent -> Pi -> LiteLLM (aigate) -> Headroom -> OmniRoute (airoute) -> Iron-Proxy -> Internet
#                       (auth, keys,      (compress)  (tier fallback,          (egress
#                        PII, spend,                  9-factor scoring)        firewall)
#                        Langfuse)
#
# DEFERRED TO FUTURE RELEASES (not deployed by this or the gateway playbook):
#   - Forge                  — Phase 2 (Future): tool-call repair
#   - Privacy Orchestrator   — Superseded by LiteLLM Presidio; standalone deferred to Phase 5
#   - AI Dashboard Proxy 1/2 — Phase 4 (Future): deep analytics collectors
#   - AI Dashboard DB        — Phase 4 (Future): analytics database
#   - NordVPN                — Deferred (privacy egress handled by Iron-Proxy for MVP)
#
# This playbook uses Ansible roles with community.docker modules — NEVER docker compose.
# Services with existing roles (iron-proxy, headroom, omniroute) are deployed via include_role.
# Deferred services are marked below with their target phase.
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-ai-dashboard-pipeline.yml \
#     --vault-password-file ~/.ansible/vault_password
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-ai-dashboard-pipeline.yml \
#     --check --diff --vault-password-file ~/.ansible/vault_password

- name: "Deploy AI Dashboard Pipeline"
  hosts: cloud_servers
  become: true
  gather_facts: true
  vars:
    cloud_server_admin_user: "{{ ansible_user }}"

  pre_tasks:
    - name: "Load shared infrastructure defaults (ports, networks, domains, storage)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

    - name: "Load client infrastructure overrides (levonk)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

    - name: "Display deployment start information"
      ansible.builtin.debug:
        msg: |
          ========================================
          AI Dashboard Pipeline Deployment Started
          ========================================
          Target: {{ inventory_hostname }}
          User: {{ ansible_user_id }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Architecture: {{ ansible_facts['architecture'] }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          ========================================
      tags: ["always", "info"]

    - name: "Validate required AI dashboard variables are defined"
      ansible.builtin.assert:
        that:
          - localnet_services_dir is defined
          - shared_container_services_dir is defined
        fail_msg: >-
          Missing required AI dashboard variables. Check
          levonk/active/02-config/ansible/inventories/group_vars/cloud_servers.yml
          and group_vars/all.yml.
        success_msg: "All required AI dashboard variables are defined."
      tags: ["always", "validate"]

  tasks:
    # ===========================================================================
    # Stage 1: Iron-Proxy (Egress Firewall) — deployed via role
    # ===========================================================================
    - name: "Deploy iron-proxy via role"
      ansible.builtin.include_role:
        name: proxy-iron-proxy
      tags: ["deploy", "iron-proxy"]

    # ===========================================================================
    # Stage 2: Headroom (Context Compression) — deployed via role
    # ===========================================================================
    - name: "Deploy headroom via role"
      ansible.builtin.include_role:
        name: proxy-headroom
      tags: ["deploy", "headroom"]

    # ===========================================================================
    # Stage 3: OmniRoute (AI Gateway) — deployed via role
    # ===========================================================================
    - name: "Deploy omniroute via role"
      ansible.builtin.include_role:
        name: omniroute
      tags: ["deploy", "omniroute"]

    # ===========================================================================
    # DEFERRED — Future Evolution
    # The services below are not part of the current MVP pipeline. They are
    # retained as placeholders with phase labels for future releases. When a
    # phase is activated, create Ansible roles following the pattern in
    # roles/omniroute/ and roles/proxy-iron-proxy/.
    # ===========================================================================

    # --- Phase 2 (Future): Tool-call repair ---
    # - name: "Deploy forge via role"
    #   ansible.builtin.include_role:
    #     name: ai-forge
    #   tags: ["deploy", "forge"]

    # --- Superseded by LiteLLM Presidio; standalone deferred to Phase 5 ---
    # - name: "Deploy privacy-orchestrator via role"
    #   ansible.builtin.include_role:
    #     name: ai-privacy-orchestrator
    #   tags: ["deploy", "privacy-orchestrator"]

    # --- Phase 4 (Future): Deep analytics collectors ---
    # - name: "Deploy ai-dashboard-proxy-1 via role"
    #   ansible.builtin.include_role:
    #     name: ai-dashboard-proxy
    #   vars:
    #     ai_dashboard_proxy_instance: 1
    #   tags: ["deploy", "ai-dashboard-proxy-1"]
    #
    # - name: "Deploy ai-dashboard-proxy-2 via role"
    #   ansible.builtin.include_role:
    #     name: ai-dashboard-proxy
    #   vars:
    #     ai_dashboard_proxy_instance: 2
    #   tags: ["deploy", "ai-dashboard-proxy-2"]

    # --- Phase 4 (Future): Analytics database ---
    # - name: "Deploy ai-dashboard database via role"
    #   ansible.builtin.include_role:
    #     name: ai-dashboard-db
    #   tags: ["deploy", "ai-dashboard-db"]

    # ===========================================================================
    # Verification — read-only container status checks (no docker compose)
    # ===========================================================================
    - name: "Verify iron-proxy container is running"
      ansible.builtin.command:
        cmd: "docker inspect --format='{% raw %}{{.State.Status}}{% endraw %}' iron-proxy"
      become: true
      become_user: "{{ cloud_server_admin_user }}"
      register: iron_proxy_status
      changed_when: false
      ignore_errors: true
      tags: ["verify", "iron-proxy"]

    - name: "Verify headroom container is running"
      ansible.builtin.command:
        cmd: "docker inspect --format='{% raw %}{{.State.Status}}{% endraw %}' headroom"
      become: true
      become_user: "{{ cloud_server_admin_user }}"
      register: headroom_status
      changed_when: false
      ignore_errors: true
      tags: ["verify", "headroom"]

    - name: "Verify omniroute container is running"
      ansible.builtin.command:
        cmd: "docker inspect --format='{% raw %}{{.State.Status}}{% endraw %}' {{ ai_omniroute_container_name }}"
      become: true
      become_user: "{{ cloud_server_admin_user }}"
      register: omniroute_status
      changed_when: false
      ignore_errors: true
      tags: ["verify", "omniroute"]

    - name: "Display container status summary"
      ansible.builtin.debug:
        msg: |
          Container Status Summary:
            iron-proxy: {{ iron_proxy_status.stdout | default('NOT FOUND') }}
            headroom:   {{ headroom_status.stdout | default('NOT FOUND') }}
            omniroute:  {{ omniroute_status.stdout | default('NOT FOUND') }}
      tags: ["verify", "summary"]

  post_tasks:
    - name: "Display deployment summary"
      ansible.builtin.debug:
        msg: |
          ========================================
          AI Dashboard Pipeline Deployment Complete
          ========================================
          STATUS: DEPRECATED — primary playbook is deploy-ai-gateway-pipeline.yml
          Target: {{ inventory_hostname }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          ----------------------------------------
          Deployed via Ansible roles (community.docker):
          - Iron-Proxy: egress firewall (proxy-chain-network 172.29.0.17)
            [Unique to this playbook — gateway playbook does not yet include Iron-Proxy]
          - Headroom: context compression (proxy-chain-network 172.29.0.13)
            [Also deployed by deploy-ai-gateway-pipeline.yml]
          - OmniRoute: AI gateway (proxy-chain-network 172.29.0.14, traefik ai-gateway.levonk.com)
            [Also deployed by deploy-ai-gateway-pipeline.yml]
          ----------------------------------------
          DEFERRED — Future Evolution (not deployed):
          - Forge (Phase 2 — tool-call repair)
          - Privacy Orchestrator (superseded by LiteLLM Presidio; standalone deferred to Phase 5)
          - AI Dashboard Proxy 1/2 (Phase 4 — deep analytics collectors)
          - AI Dashboard DB (Phase 4 — analytics database)
          ----------------------------------------
          Current MVP Pipeline Flow:
          Omnigent -> Pi -> LiteLLM (aigate) -> Headroom -> OmniRoute (airoute) -> Iron-Proxy -> Internet
          [LiteLLM + Headroom + OmniRoute deployed via deploy-ai-gateway-pipeline.yml]
          [Iron-Proxy deployed via this playbook]
          Network: proxy-chain-network (172.29.0.0/16)
          ========================================
      tags: ["always", "summary"]
