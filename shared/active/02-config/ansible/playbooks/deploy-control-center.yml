---
# Deploy Control Center dashboard to Windows Docker Desktop (nl region)
# Location: shared/active/02-config/ansible/playbooks/deploy-control-center.yml
#
# Deploys the Control Center business intelligence dashboard (Next.js + SQLite)
# on the Windows Docker host (dtop202311). The container image is built from
# the control-center fork (lrepo52/control-center) via a multi-stage Dockerfile
# and pushed to the local registry before deployment.
#
# Architecture:
#   control-center (4537, dashboard.{{ infra_domain_base }} + dashboard.nl.{{ infra_domain_base }})
#   — Next.js dashboard via Traefik, Authelia-gated, multi-tenant auth
#
# Prerequisites:
#   1. Traefik Windows deployed: just ansible-deploy-traefik-windows
#   2. DNS CNAME configured: just ansible-deploy-dns
#   3. Container image built+pushed: just build-control-center-image
#   4. SSH config entry for dtop202311.<tailnet>
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/windows-docker.yml \
#     shared/active/02-config/ansible/playbooks/deploy-control-center.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Deploy Control Center dashboard on Windows Docker host"
  hosts: windows_docker_hosts
  gather_facts: false
  become: false

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load shared infrastructure mode defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Load shared infrastructure timing defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/timing.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Validate required variables"
      ansible.builtin.assert:
        that:
          - infra_port_dashboard_control_center_host is defined
          - infra_domain_dashboard_control_center is defined
          - infra_domain_dashboard_control_center_nl is defined
          - infra_hostname_dashboard_control_center is defined
          - infra_tailscale_fqdn_windows_docker is defined
        fail_msg: >-
          Missing required infrastructure variables. Check ports.yml,
          domains.yml, storage.yml, and client domain overrides.
        success_msg: "All required infrastructure variables are defined."
      tags: ["always", "validate"]

    - name: "Load shared infrastructure fallback values"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/values.yml"
      tags: ["always"]

    - name: "Load dashboard-control-center role defaults (for container name + port vars)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/dashboard-control-center/defaults/main.yml"
      tags: ["always"]

    - name: "Load proxy_traefik_windows role defaults (for Traefik routing vars)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/proxy_traefik_windows/defaults/main.yml"
      tags: ["always"]

    - name: "Load search-hister role defaults (required by proxy_traefik_windows hister template)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/search-hister/defaults/main.yml"
      tags: ["always"]

    - name: "Load tools-stirling-pdf role defaults (required by proxy_traefik_windows stirling template)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/tools-stirling-pdf/defaults/main.yml"
      tags: ["always"]

    - name: "Load artifact-verdaccio role defaults (required by proxy_traefik_windows npmjs template)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/artifact-verdaccio/defaults/main.yml"
      tags: ["always"]

    - name: "Load dashboard-homepage role defaults (required by proxy_traefik_windows start template)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/dashboard-homepage/defaults/main.yml"
      tags: ["always"]

    - name: "Load dashboard-trala role defaults (required by proxy_traefik_windows start2 template)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/dashboard-trala/defaults/main.yml"
      tags: ["always"]

    - name: "Load nix-ncps role defaults (required by proxy_traefik_windows nixcache template)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/nix-ncps/defaults/main.yml"
      tags: ["always"]

    - name: "Load garnix-ci role defaults (required by proxy_traefik_windows ci template)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/garnix-ci/defaults/main.yml"
      tags: ["always"]

    - name: "Load dashboard-directory-empire role defaults (required by proxy_traefik_windows de template)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/dashboard-directory-empire/defaults/main.yml"
      tags: ["always"]

    - name: "Load vault secrets (Cloudflare API token for ACME)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/inventories/group_vars/infrahub-levonk-all.vault.yml"
      tags: ["always"]
      no_log: true

  roles:
    - role: proxy_traefik_windows
      tags: ["deploy", "traefik-windows", "control-center"]

    - role: dashboard-control-center
      tags: ["deploy", "control-center"]
      when: control_center_enabled | default(true) | bool

  post_tasks:
    - name: "Report deployment summary"
      ansible.builtin.debug:
        msg: |
          ================================================
          Control Center Deployed (nl region)
          ================================================
          Host: {{ inventory_hostname }}

          Control Center:
            Web UI (default): https://{{ infra_domain_dashboard_control_center }} (via Traefik, SSO-protected)
            Web UI (nl):      https://{{ infra_domain_dashboard_control_center_nl }} (via Traefik, SSO-protected)
            Container:        {{ infra_hostname_dashboard_control_center }}
            Port:             {{ infra_port_dashboard_control_center_host }}:{{ infra_port_dashboard_control_center_container }}
            Health:           /api/health

          Next steps:
            1. Verify: curl https://{{ infra_domain_dashboard_control_center }}/api/health
            2. Verify: curl https://{{ infra_domain_dashboard_control_center_nl }}/api/health
            3. Check logs: docker logs {{ infra_hostname_dashboard_control_center }}
            4. Redeploy Traefik Windows to pick up the new dynamic config:
               just ansible-deploy-traefik-windows
            5. Register first tenant: visit https://{{ infra_domain_dashboard_control_center_nl }}/register
          ================================================
      tags: ["always", "summary"]

- name: "Deploy Control Center cross-machine routing on OCI Traefik"
  hosts: cloud_servers
  gather_facts: true
  become: true

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load shared infrastructure mode defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure timing defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/timing.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load shared infrastructure fallback values"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/values.yml"
      tags: ["always"]

    - name: "Load dashboard-control-center role defaults (for enabled flag + domain vars)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/dashboard-control-center/defaults/main.yml"
      tags: ["always"]

    - name: "Load proxy-traefik role defaults (for data dir + mode vars)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/proxy-traefik/defaults/main.yml"
      tags: ["always"]

    - name: "Load vault secrets (Cloudflare API token for ACME)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/inventories/group_vars/infrahub-levonk-all.vault.yml"
      tags: ["always"]
      no_log: true

  tasks:
    - name: "Deploy Control Center dashboard (default domain) dynamic configuration template"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/proxy-traefik/templates/dynamic/cc-default.yml.j2"
        dest: "{{ proxy_traefik_data_dir }}/config/dynamic/cc-default.yml"
        owner: root
        group: root
        mode: "{{ infra_mode_file }}"
      become: true
      notify: "reload traefik"
      when: control_center_enabled | default(false) | bool
      tags: ["deploy", "traefik-oci", "control-center"]

    - name: "Deploy Control Center dashboard (NL domain) dynamic configuration template"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/proxy-traefik/templates/dynamic/cc-nl.yml.j2"
        dest: "{{ proxy_traefik_data_dir }}/config/dynamic/cc-nl.yml"
        owner: root
        group: root
        mode: "{{ infra_mode_file }}"
      become: true
      notify: "reload traefik"
      when: control_center_enabled | default(false) | bool
      tags: ["deploy", "traefik-oci", "control-center"]

    - name: "Reload Traefik to pick up new dynamic config"
      ansible.builtin.shell: "docker kill -s SIGHUP traefik 2>/dev/null || true"
      become: true
      changed_when: false
      when: control_center_enabled | default(false) | bool
      tags: ["deploy", "traefik-oci", "control-center"]

  handlers:
    - name: "reload traefik"
      ansible.builtin.shell: "docker kill -s SIGHUP traefik 2>/dev/null || true"
      become: true
      changed_when: false

