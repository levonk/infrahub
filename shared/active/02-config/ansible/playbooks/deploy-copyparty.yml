---
# copyparty Deployment Playbook
# Deploys copyparty (single-binary file sharing server) on the OCI cloud server
# behind Traefik. copyparty uses built-in basic auth (NOT Authelia — copyparty
# handles authentication internally), so the Traefik dynamic config has no
# authelia middleware.
#
# Stack: copyparty (web UI + file server) — no database, no Redis.
# Domain: files.levonk.com (single CNAME → Tailscale FQDN of the cloud server)
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-copyparty.yml \
#     --vault-password-file ~/.ansible/vault_password
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-copyparty.yml \
#     --check --diff --vault-password-file ~/.ansible/vault_password

- name: "Configure Cloudflare DNS for copyparty"
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - "{{ playbook_dir }}/../infrastructure/domains.yml"
    - "{{ playbook_dir }}/../infrastructure/timing.yml"
    - "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
    - "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/inventories/group_vars/infrahub-levonk-all.vault.yml"
  vars:
    cloudflare_api_token: "{{ vault_cloudflare_api_token | default('') }}"
    cloudflare_zone_id: "{{ vault_cloudflare_zone_id | default('') }}"
    cloudflare_dns_state: "present"
    cloudflare_dns_ttl: "{{ infra_dns_ttl }}"
    cloudflare_dns_proxied: false
    cloudflare_dns_verify: true
    cloudflare_dns_verify_propagation: false
    cloudflare_dns_validate_ip: true
    cloudflare_dns_allow_private_ip: false
    ts_fqdn: "{{ infra_tailscale_fqdn_cloud_server | default(infra_tailscale_tailnet | default('example.ts.net')) }}"
    cloudflare_dns_records:
      - name: "{{ infra_domain_storage_copyparty | default('files.' ~ (infra_domain_base | default('example.com'))) }}"
        type: "CNAME"
        content: "{{ ts_fqdn }}"
        ttl: "{{ cloudflare_dns_ttl }}"
        proxied: "{{ cloudflare_dns_proxied }}"
        state: "{{ cloudflare_dns_state }}"
  roles:
    - cloudflare-dns
  tags: ["dns"]

- name: "Deploy copyparty File Sharing Server"
  hosts: cloud_servers
  become: true
  gather_facts: true
  vars:
    cloud_server_admin_user: "{{ ansible_user }}"

  pre_tasks:
    - name: "Load shared infrastructure defaults (ports, networks, domains, storage, modes, timing)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
        - modes.yml
        - timing.yml
      tags: ["always"]

    - name: "Load client infrastructure overrides (levonk)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

    - name: "Validate required variables"
      ansible.builtin.assert:
        that:
          - copyparty_enabled is defined
          - copyparty_domain is defined
          - copyparty_container_name is defined
          - copyparty_container_port is defined
        fail_msg: "Missing required copyparty variables. Check storage-copyparty role defaults and infrastructure files."
        success_msg: "All required copyparty variables are defined."
      tags: ["always", "validate"]

    - name: "Display deployment start information"
      ansible.builtin.debug:
        msg: |
          ========================================
          Deploying copyparty File Sharing Server
          ========================================
          App domain:      {{ copyparty_domain }}
          App port:        {{ copyparty_host_port }} → {{ copyparty_container_port }}
          Container:       {{ copyparty_container_name | default('copyparty') }}
          Network:         {{ copyparty_network_name | default('traefik-network') }}
          Auth:            copyparty built-in basic auth (NO Authelia)
          ========================================
      tags: ["always"]

  roles:
    - role: storage-copyparty
      tags: ["deploy", "copyparty"]
      when: copyparty_enabled | default(true) | bool

- name: "Deploy Traefik routing for copyparty"
  hosts: cloud_servers
  become: true
  gather_facts: false

  pre_tasks:
    - name: "Load shared infrastructure defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
        - modes.yml
        - timing.yml
      tags: ["always"]

    - name: "Load client infrastructure overrides (levonk)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

    - name: "Load proxy-traefik role defaults (for domain variable mappings)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/proxy-traefik/defaults/main.yml"
      tags: ["always"]

    - name: "Load storage-copyparty role defaults (for copyparty variable mappings)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/storage-copyparty/defaults/main.yml"
      tags: ["always"]

  tasks:
    - name: "Deploy copyparty Traefik dynamic configuration"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/proxy-traefik/templates/dynamic/copyparty.yml.j2"
        dest: "{{ proxy_traefik_data_dir | default('/opt/traefik') }}/config/dynamic/copyparty.yml"
        owner: root
        group: root
        mode: "{{ infra_mode_file }}"
      notify: reload traefik
      tags: ["traefik", "routing"]
      when: copyparty_enabled | default(true) | bool

  handlers:
    - name: reload traefik
      community.docker.docker_container:
        name: "{{ proxy_traefik_container_name | default('traefik') }}"
        state: started
        restart: true
      when: copyparty_enabled | default(true) | bool
