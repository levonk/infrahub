---
# Deploy Media Stack to Windows Docker Desktop (nl region)
# Location: shared/active/02-config/ansible/playbooks/deploy-media-stack.yml
#
# Two-phase deployment:
#   Phase 1 (Windows Docker host): deploy all media containers (jellyfin,
#            jellyseerr, radarr, sonarr, lidarr, bazarr, prowlarr, kapowarr,
#            whisparr, audiobookshelf, flaresolverr, recyclarr, unpackarr)
#            - nl (Windows Docker Desktop, X86): ssh-tunneled Docker CLI pattern
#              (community.docker modules can't run on Windows — Ansible core
#              basic.py imports grp, Unix-only)
#   Phase 2 (Windows Docker host): re-run proxy_traefik_windows role with
#            media_stack_enabled to deploy the media-nl.yml dynamic config
#            template (gated on proxy_traefik_windows_media_stack_enabled | bool)
#
# Prerequisites:
#   1. Traefik deployed on Windows: just ansible-deploy-proxy-web (or deploy-verdaccio)
#   2. DNS CNAMEs configured: just levonk-deploy-dns
#   3. SSH config entry for dtop202311.<tailnet> (IdentityFile + IdentitiesOnly)
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/windows-docker.yml \
#     shared/active/02-config/ansible/playbooks/deploy-media-stack.yml \
#     --vault-password-file ~/.ansible/vault_password
#
# Or via just:
#   just ansible-deploy-media-stack

- name: "Phase One — Deploy media stack containers on Windows Docker host (nl)"
  hosts: windows_docker_hosts
  gather_facts: true
  become: false
  vars:
    media_stack_enabled: true

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure storage overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load client infrastructure port overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure timing defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/timing.yml"
      tags: ["always"]

    - name: "Load shared infrastructure mode defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load shared infrastructure app defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/apps.yml"
      tags: ["always"]

    - name: "Load shared infrastructure fallback values"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/values.yml"
      tags: ["always"]

    - name: "Validate required variables"
      ansible.builtin.assert:
        that:
          - media_stack_enabled is defined
          - infra_port_media_jellyfin_host is defined
          - infra_domain_media_jellyfin is defined
        fail_msg: >-
          Missing required variables. Check infrastructure files
          (ports.yml, domains.yml, storage.yml) and client overrides.
        success_msg: "All required media_stack variables are defined."
      tags: ["always", "validate"]

  roles:
    - role: media-stack
      tags: ["deploy", "media-stack"]


- name: "Phase Two — Deploy Traefik dynamic config for media stack on Windows"
  hosts: windows_docker_hosts
  become: false
  gather_facts: true
  vars:
    media_stack_enabled: true
    proxy_traefik_windows_media_stack_enabled: true

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure storage overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load client infrastructure port overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure timing defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/timing.yml"
      tags: ["always"]

    - name: "Load shared infrastructure mode defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load shared infrastructure app defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/apps.yml"
      tags: ["always"]

    - name: "Load shared infrastructure fallback values"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/values.yml"
      tags: ["always"]

    - name: "Load media-stack role defaults (for container name + port vars)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/media-stack/defaults/main.yml"
      tags: ["always"]

    - name: "Load vault secrets (Cloudflare API token for ACME)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/inventories/group_vars/infrahub-levonk-all.vault.yml"
      tags: ["always"]
      no_log: true

  roles:
    - role: proxy_traefik_windows
      tags: ["deploy", "traefik-windows", "media-stack"]
