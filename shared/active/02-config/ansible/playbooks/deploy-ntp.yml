---
# NTP Tailnet Server Deployment Playbook
# Deploys native chronyd on the OCI cloud server serving NTP to the tailnet
# only (ntp.{base} → A record to the host's Tailscale IP).
# Design: shared/docs/pipelines/ntp/ntp-chain.md
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-ntp.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Deploy NTP tailnet server (chronyd)"
  hosts: cloud_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Load shared infrastructure defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
        - modes.yml
        - timing.yml
      tags: ["always"]

    - name: "Load client infrastructure overrides (levonk)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

    - name: "Display deployment information"
      ansible.builtin.debug:
        msg: |
          ========================================
          NTP Tailnet Server Deployment (chronyd)
          ========================================
          Target: {{ inventory_hostname }}
          Domain: {{ infra_domain_ntp_server | default('ntp.' ~ (infra_domain_base | default('example.com'))) }}
          Bind: {{ infra_tailscale_ip_cloud_server | default('unset') }}:{{ infra_port_ntp_server_host | default('123') }}/udp+tcp
          Allowed: {{ infra_network_tailscale_cidr | default('100.64.0.0/10') }}
          ========================================
      tags: ["always", "info"]

  roles:
    - role: ntp-chronyd
      tags: ["ntp", "chronyd", "time"]
