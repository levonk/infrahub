---
# Omnigent + Pi Deployment Playbook
# Deploys the Omnigent server (AI agent framework & meta-harness) and Pi (coding
# agent harness, RPC mode) to cloud servers. Omnigent orchestrates; Pi executes
# coding loops. Pi's LLM requests route through the AI analytics pipeline.
#
# Stack: Omnigent (server + Postgres) + Pi (RPC mode, HTTP-to-stdin bridge)
# Pipeline: Omnigent → Pi → AI Dashboard Proxy 1 → ... → Internet
#
# This playbook uses community.docker modules (docker_container, docker_network,
# docker_volume, docker_image) per the architectural invariants in AGENTS.md.
# No docker compose, no compose file copying, no .env file interpolation.
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-omnigent.yml \
#     --vault-password-file ~/.ansible/vault_password
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-omnigent.yml \
#     --check --diff --vault-password-file ~/.ansible/vault_password

- name: "Deploy Omnigent + Pi Agent Stack"
  hosts: cloud_servers
  become: true
  gather_facts: true
  vars:
    cloud_server_admin_user: "{{ ansible_user }}"

  pre_tasks:
    - name: "Load shared infrastructure defaults (ports, networks, domains, storage)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

    - name: "Load client infrastructure overrides (levonk)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

    - name: "Display deployment start information"
      ansible.builtin.debug:
        msg: |
          ========================================
          Omnigent + Pi Deployment Started
          ========================================
          Target: {{ inventory_hostname }}
          User: {{ ansible_user_id }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Architecture: {{ ansible_facts['architecture'] }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          ========================================
      tags: ["always", "info"]

    - name: "Validate required variables are defined"
      ansible.builtin.assert:
        that:
          - localnet_services_dir is defined
          - shared_container_services_dir is defined
          - omnigent_db_password is defined
          - omnigent_accounts_cookie_secret is defined
          - omnigent_accounts_init_admin_password is defined
          - pi_api_key is defined
        fail_msg: >-
          Missing required variables. Check
          levonk/active/02-config/ansible/inventories/group_vars/cloud_servers.yml,
          group_vars/all.yml, and the client vault
          (infrahub-levonk-all.vault.yml) for omnigent_db_password,
          omnigent_accounts_cookie_secret, omnigent_accounts_init_admin_password,
          and pi_api_key.
        success_msg: "All required variables are defined."
      tags: ["always", "validate"]

    - name: "Create omnigent services directory"
      ansible.builtin.file:
        path: "{{ localnet_services_dir }}/omnigent"
        state: directory
        owner: "{{ cloud_server_admin_user }}"
        group: "{{ cloud_server_admin_user }}"
        mode: '{{ infra_mode_dir }}'
      tags: ["always", "setup"]

  tasks:
    # ── Pi image build context ─────────────────────────────
    # Copy build files to the target for the docker_image build step.
    # These are source files for the image build, NOT compose files.
    - name: "Create Pi build directory"
      ansible.builtin.file:
        path: "{{ localnet_services_dir }}/omnigent/pi-build"
        state: directory
        owner: "{{ cloud_server_admin_user }}"
        group: "{{ cloud_server_admin_user }}"
        mode: '{{ infra_mode_dir }}'
      tags: ["config", "setup"]

    - name: "Copy Pi Dockerfile"
      ansible.builtin.copy:
        src: "{{ shared_container_services_dir }}/ai-codeassist/pi/Dockerfile"
        dest: "{{ localnet_services_dir }}/omnigent/pi-build/Dockerfile"
        owner: "{{ cloud_server_admin_user }}"
        group: "{{ cloud_server_admin_user }}"
        mode: '{{ infra_mode_file }}'
      tags: ["config", "dockerfile"]

    - name: "Copy Pi RPC bridge script"
      ansible.builtin.copy:
        src: "{{ shared_container_services_dir }}/ai-codeassist/pi/rpc-bridge.py"
        dest: "{{ localnet_services_dir }}/omnigent/pi-build/rpc-bridge.py"
        owner: "{{ cloud_server_admin_user }}"
        group: "{{ cloud_server_admin_user }}"
        mode: '{{ infra_mode_dir }}'
      tags: ["config", "bridge"]

    - name: "Copy Pi models.json (custom pipeline provider config)"
      ansible.builtin.copy:
        src: "{{ shared_container_services_dir }}/ai-codeassist/pi/models.json"
        dest: "{{ localnet_services_dir }}/omnigent/pi-build/models.json"
        owner: "{{ cloud_server_admin_user }}"
        group: "{{ cloud_server_admin_user }}"
        mode: '{{ infra_mode_file }}'
      tags: ["config", "models"]

    # ── Pi bind-mount source files ─────────────────────────
    # Docker creates empty directories when a bind-mount source file doesn't
    # exist. Ensure these are files (empty placeholders) so the container
    # mounts them correctly. Populate with real content on the server.
    - name: "Ensure Pi bind-mount source files exist (not directories)"
      ansible.builtin.shell: |
        for f in credentials.json iron-proxy-ca.crt; do
          path="{{ localnet_services_dir }}/omnigent/$f"
          if [ -d "$path" ]; then rmdir "$path" 2>/dev/null || true; fi
          if [ ! -e "$path" ]; then
            touch "$path"
            chmod {{ infra_mode_file_restricted }} "$path"
            chown {{ cloud_server_admin_user }}:{{ cloud_server_admin_user }} "$path"
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false
      tags: ["config", "setup"]

    # ── Build Pi Docker image ──────────────────────────────
    - name: "Build Pi Docker image"
      community.docker.docker_image:
        name: "localnet-pi"
        tag: "{{ pi_version | default('latest') }}"
        source: build
        build:
          path: "{{ localnet_services_dir }}/omnigent/pi-build"
        state: present
      tags: ["build", "pi"]

    - name: "Tag Pi Docker image as latest"
      community.docker.docker_image:
        name: "localnet-pi:{{ pi_version | default('latest') }}"
        repository: "localnet-pi:latest"
        source: local
        state: present
      tags: ["build", "pi"]

    # ── Docker Networks ────────────────────────────────────
    - name: "Ensure omnigent-network exists (owned by this playbook)"
      community.docker.docker_network:
        name: omnigent-network
        state: present
        driver: bridge
        ipam_config:
          - subnet: "{{ infra_network_proxy_subnet }}"
            gateway: "{{ infra_network_proxy_subnet_gateway }}"
      tags: ["network", "setup"]

    - name: "Ensure ai-dashboard-network exists (may be owned by another role)"
      community.docker.docker_network:
        name: ai-dashboard-network
        state: present
        driver: bridge
        ipam_config:
          - subnet: "{{ infra_network_proxy_alt_subnet }}"
      ignore_errors: true
      tags: ["network", "setup"]

    - name: "Ensure proxy-chain-network exists (may be owned by another role)"
      community.docker.docker_network:
        name: proxy-chain-network
        state: present
        driver: bridge
        ipam_config:
          - subnet: "{{ infra_network_ai_subnet }}"
            gateway: "{{ infra_network_ai_subnet_gateway }}"
      ignore_errors: true
      tags: ["network", "setup"]

    - name: "Ensure vpn-network exists (owned by NordVPN role)"
      community.docker.docker_network:
        name: vpn-network
        state: present
        driver: bridge
        ipam_config:
          - subnet: "{{ infra_network_monitoring_subnet }}"
      ignore_errors: true
      tags: ["network", "setup"]

    - name: "Ensure traefik-network exists (owned by traefik role)"
      community.docker.docker_network:
        name: traefik-network
        state: present
        driver: bridge
      ignore_errors: true
      tags: ["network", "setup"]

    # ── Docker Volumes ─────────────────────────────────────
    - name: "Ensure Omnigent volumes exist"
      community.docker.docker_volume:
        name: "{{ item }}"
        state: present
      loop:
        - localnet-omnigent-postgres-data-volume
        - localnet-omnigent-artifact-data-volume
      tags: ["volumes", "setup"]

    - name: "Ensure Pi volumes exist"
      community.docker.docker_volume:
        name: "{{ item }}"
        state: present
      loop:
        - localnet-pi-data-volume
        - localnet-pi-sessions-volume
      tags: ["volumes", "setup"]

    # ── Omnigent PostgreSQL ────────────────────────────────
    - name: "Deploy Omnigent PostgreSQL container"
      community.docker.docker_container:
        name: "{{ infra_hostname_omnigent_postgres | default('omnigent-postgres') }}"
        image: "postgres:16-alpine"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: omnigent-network
            ipv4_address: "{{ omnigent_db_container_ip | default(infra_network_proxy_subnet_ip_20) }}"
        env:
          POSTGRES_DB: "{{ omnigent_db_name | default('omnigent') }}"
          POSTGRES_USER: "{{ omnigent_db_user | default('omnigent') }}"
          POSTGRES_PASSWORD: "{{ omnigent_db_password }}"
        volumes:
          - "localnet-omnigent-postgres-data-volume:/var/lib/postgresql/data"
        log_driver: json-file
        log_options:
          max-size: "{{ infra_log_max_size }}"
          max-file: "{{ infra_log_max_file }}"
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U {{ omnigent_db_user | default('omnigent') }} -d {{ omnigent_db_name | default('omnigent') }}"]
          interval: "{{ infra_timeout_short }}"
          timeout: "{{ infra_timeout_healthcheck_short }}"
          retries: "{{ infra_retry_default }}"
          start_period: "{{ infra_timeout_short }}"
      no_log: true
      tags: ["deploy", "database"]

    # ── Omnigent Server ────────────────────────────────────
    - name: "Deploy Omnigent server container"
      community.docker.docker_container:
        name: "{{ infra_hostname_omnigent | default('omnigent') }}"
        image: "{{ omnigent_image | default('ghcr.io/omnigent-ai/omnigent-server') }}:{{ omnigent_image_tag | default('latest') }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: omnigent-network
            ipv4_address: "{{ omnigent_container_ip | default(infra_network_proxy_subnet_ip_10) }}"
          - name: traefik-network
            ipv4_address: "{{ omnigent_traefik_ip | default('{{ infra_network_ai_subnet_alt_ip_30 }}') }}"
        env:
          # ── Database ─────────────────────────────────────
          DATABASE_URL: "postgresql+psycopg://{{ omnigent_db_user | default('omnigent') }}:{{ omnigent_db_password }}@{{ infra_hostname_omnigent_postgres | default('omnigent-postgres') }}:{{ infra_port_db_postgres_host }}/{{ omnigent_db_name | default('omnigent') }}"
          ARTIFACT_DIR: "/data/artifacts"
          HOST: "{{ infra_network_bind_all }}"
          PORT: "{{ omnigent_container_port | default(infra_port_ai_dashboard_alt_host) }}"
          OMNIGENT_ADMIN_CREDENTIALS_PATH: "/data/admin-credentials"
          # ── Auth ─────────────────────────────────────────
          OMNIGENT_AUTH_ENABLED: "{{ omnigent_auth_enabled | default('1') }}"
          OMNIGENT_AUTH_PROVIDER: "{{ omnigent_auth_provider | default('') }}"
          # ── OIDC (active when AUTH_ENABLED=1 + OMNIGENT_OIDC_ISSUER set) ──
          OMNIGENT_OIDC_ISSUER: "{{ omnigent_oidc_issuer | default('') }}"
          OMNIGENT_OIDC_CLIENT_ID: "{{ omnigent_oidc_client_id | default('') }}"
          OMNIGENT_OIDC_CLIENT_SECRET: "{{ omnigent_oidc_client_secret | default('') }}"
          OMNIGENT_OIDC_COOKIE_SECRET: "{{ omnigent_oidc_cookie_secret | default('') }}"
          OMNIGENT_OIDC_SCOPES: "{{ omnigent_oidc_scopes | default('') }}"
          OMNIGENT_OIDC_SESSION_TTL_HOURS: "{{ omnigent_oidc_session_ttl_hours | default(infra_session_ttl_hours_default) }}"
          OMNIGENT_OIDC_ALLOWED_DOMAINS: "{{ omnigent_oidc_allowed_domains | default('') }}"
          OMNIGENT_OIDC_LOGOUT_REDIRECT_URI: "{{ omnigent_oidc_logout_redirect_uri | default('') }}"
          OMNIGENT_OIDC_ALLOW_INVITES: "{{ omnigent_oidc_allow_invites | default('') }}"
          # ── Domain ───────────────────────────────────────
          OMNIGENT_DOMAIN: "{{ infra_domain_ai_omnigent | default('aiif.' ~ (infra_domain_base | default('example.com'))) }}"
          # ── Accounts mode (default when AUTH_ENABLED=1 + no OIDC) ──
          OMNIGENT_ACCOUNTS_COOKIE_SECRET: "{{ omnigent_accounts_cookie_secret }}"
          OMNIGENT_ACCOUNTS_BASE_URL: "{{ omnigent_accounts_base_url | default('https://' + (infra_domain_ai_omnigent | default('aiif.' ~ (infra_domain_base | default('example.com'))))) }}"
          OMNIGENT_ACCOUNTS_INIT_ADMIN_PASSWORD: "{{ omnigent_accounts_init_admin_password }}"
          OMNIGENT_ACCOUNTS_SESSION_TTL_HOURS: "{{ omnigent_accounts_session_ttl_hours | default(infra_session_ttl_hours_default) }}"
          OMNIGENT_ACCOUNTS_INVITE_TTL_HOURS: "{{ omnigent_accounts_invite_ttl_hours | default(infra_cert_expiry_hours) }}"
          OMNIGENT_ACCOUNTS_MAGIC_TTL_MINUTES: "{{ omnigent_accounts_magic_ttl_minutes | default(infra_retry_long) }}"
          OMNIGENT_ACCOUNTS_AUTO_OPEN: "{{ omnigent_accounts_auto_open | default('0') }}"
        ports:
          - "{{ omnigent_host_port | default(infra_port_ai_dashboard_alt_host) }}:{{ omnigent_container_port | default(infra_port_ai_dashboard_alt_host) }}/tcp"
        volumes:
          - "localnet-omnigent-artifact-data-volume:/data"
        log_driver: json-file
        log_options:
          max-size: "{{ infra_log_max_size }}"
          max-file: "{{ infra_log_max_file }}"
        healthcheck:
          test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:{{ omnigent_container_port | default(infra_port_ai_dashboard_alt_host) }}/health')"]
          interval: "{{ infra_timeout_default }}"
          timeout: "{{ infra_timeout_short }}"
          retries: "{{ infra_retry_short }}"
          start_period: "{{ infra_timeout_long }}"
      no_log: true
      tags: ["deploy", "omnigent"]

    # ── Pi (Coding Agent Harness — RPC mode) ───────────────
    - name: "Deploy Pi container"
      community.docker.docker_container:
        name: "{{ infra_hostname_pi | default('pi') }}"
        image: "localnet-pi:latest"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: omnigent-network
            ipv4_address: "{{ pi_container_ip | default(infra_network_proxy_subnet_ip_30) }}"
          - name: ai-dashboard-network
            ipv4_address: "{{ pi_dashboard_ip | default('{{ infra_network_proxy_alt_subnet_ip_30 }}') }}"
          - name: proxy-chain-network
            ipv4_address: "{{ pi_chain_ip | default('{{ infra_network_ai_subnet_ip_30 }}') }}"
          - name: vpn-network
            ipv4_address: "{{ pi_vpn_ip | default('{{ infra_network_monitoring_subnet_ip_30 }}') }}"
        env:
          # ── RPC Bridge ────────────────────────────────────
          PI_RPC_PORT: "{{ infra_port_ai_pi_container | default(infra_port_ai_dashboard_host) }}"
          PI_RPC_HOST: "{{ infra_network_bind_all }}"
          # ── Pi Agent Config ───────────────────────────────
          PI_PROVIDER: "{{ pi_provider | default('openai') }}"
          PI_MODEL: "{{ pi_model | default('claude-sonnet-4-20250514') }}"  # project-lint: disable=magic-int  model identifier/version string, not an operational value
          PI_API_BASE_URL: "{{ pi_api_base_url | default('http://ai-dashboard-proxy-1:{{ infra_port_nix_ncro_host }}/v1') }}"
          PI_API_KEY: "{{ pi_api_key }}"
          # ── Egress Proxy (iron-proxy → NordVPN) ──────────
          HTTP_PROXY: "{{ pi_http_proxy | default('http://{{ infra_network_ai_subnet_ip_17 }}:{{ infra_port_proxy_dashboard_host }}') }}"
          HTTPS_PROXY: "{{ pi_https_proxy | default('http://{{ infra_network_ai_subnet_ip_17 }}:{{ infra_port_proxy_dashboard_host }}') }}"
          NO_PROXY: "{{ pi_no_proxy | default('localhost,{{ infra_network_bind_localhost }},{{ infra_network_private_class_b }},{{ infra_network_monitoring_subnet }},{{ infra_network_ai_subnet }},{{ infra_network_proxy_alt_subnet }},{{ infra_network_proxy_subnet }}') }}"
          NODE_OPTIONS: "--use-env-proxy"
          NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/iron-proxy-ca.crt"
          # ── Session Storage ───────────────────────────────
          PI_SESSION_DIR: "/data/sessions"
          PI_NO_SESSION: "{{ pi_no_session | default('0') }}"
          # ── Workspace ─────────────────────────────────────
          PI_WORKSPACE_DIR: "/workspace"
          # ── User/Group ────────────────────────────────────
          PUID: "{{ pi_puid | default('1001') }}"  # project-lint: disable=magic-int  Jinja default port value, should use infra_port variable
          PGID: "{{ pi_pgid | default('1001') }}"  # project-lint: disable=magic-int  Jinja default port value, should use infra_port variable
          TZ: "{{ pi_tz | default('UTC') }}"
        ports:
          - "{{ infra_port_ai_pi_host | default(infra_port_ai_dashboard_host) }}:{{ infra_port_ai_pi_container | default(infra_port_ai_dashboard_host) }}/tcp"
        volumes:
          - "localnet-pi-data-volume:/data"
          - "localnet-pi-sessions-volume:/data/sessions"
          - "{{ localnet_services_dir }}/omnigent/credentials.json:/home/pi/.config/opencode-windsurf-auth/credentials.json:ro"
          - "{{ localnet_services_dir }}/omnigent/iron-proxy-ca.crt:/etc/ssl/certs/iron-proxy-ca.crt:ro"
        log_driver: json-file
        log_options:
          max-size: "{{ infra_log_max_size }}"
          max-file: "{{ infra_log_max_file }}"
        healthcheck:
          test: ["CMD", "curl", "-sf", "http://localhost:{{ infra_port_ai_pi_container | default(infra_port_ai_dashboard_host) }}/health"]
          interval: "{{ infra_timeout_default }}"
          timeout: "{{ infra_timeout_short }}"
          retries: "{{ infra_retry_short }}"
          start_period: "{{ infra_timeout_default }}"
      no_log: true
      tags: ["deploy", "pi"]

    # ── Verification ────────────────────────────────────────
    - name: "Wait for Omnigent Postgres to be healthy"
      community.docker.docker_container_info:
        name: "{{ infra_hostname_omnigent_postgres | default('omnigent-postgres') }}"
      register: omnigent_pg_info
      until: >-
        omnigent_pg_info.exists and
        omnigent_pg_info.container.State.Health.Status is defined and
        omnigent_pg_info.container.State.Health.Status == "healthy"
      retries: "{{ infra_retry_long }}"
      delay: "{{ infra_delay_default }}"
      tags: ["verify", "database"]

    - name: "Wait for Omnigent server to be running"
      community.docker.docker_container_info:
        name: "{{ infra_hostname_omnigent | default('omnigent') }}"
      register: omnigent_info
      until: >-
        omnigent_info.exists and
        omnigent_info.container.State.Running
      retries: "{{ infra_retry_long }}"
      delay: "{{ infra_delay_default }}"
      tags: ["verify", "health"]

    - name: "Wait for Pi to be running"
      community.docker.docker_container_info:
        name: "{{ infra_hostname_pi | default('pi') }}"
      register: pi_info
      until: >-
        pi_info.exists and
        pi_info.container.State.Running
      retries: "{{ infra_retry_long }}"
      delay: "{{ infra_delay_default }}"
      tags: ["verify", "health"]

    - name: "Display container status"
      ansible.builtin.debug:
        msg: |
          Container {{ infra_hostname_omnigent | default('omnigent') }}: {{ omnigent_info.container.State.Status }}
          Container {{ infra_hostname_omnigent_postgres | default('omnigent-postgres') }}: {{ omnigent_pg_info.container.State.Status }}
          Container {{ infra_hostname_pi | default('pi') }}: {{ pi_info.container.State.Status }}
      tags: ["verify", "containers"]

    - name: "Check Omnigent server logs for errors"
      ansible.builtin.shell:
        cmd: "set -o pipefail; docker logs {{ infra_hostname_omnigent | default('omnigent') }} --tail=50 2>&1 | grep -i error || echo 'No errors found'"  # project-lint: disable=magic-int  docker logs tail count, not an operational value
      register: omnigent_logs
      changed_when: false
      failed_when: "'error' in omnigent_logs.stdout.lower() and 'No errors found' not in omnigent_logs.stdout"
      tags: ["verify", "logs"]

    - name: "Check Pi logs for errors"
      ansible.builtin.shell:
        cmd: "set -o pipefail; docker logs {{ infra_hostname_pi | default('pi') }} --tail=50 2>&1 | grep -i error || echo 'No errors found'"  # project-lint: disable=magic-int  docker logs tail count, not an operational value
      register: pi_logs
      changed_when: false
      failed_when: "'error' in pi_logs.stdout.lower() and 'No errors found' not in pi_logs.stdout"
      tags: ["verify", "logs"]

  post_tasks:
    - name: "Display deployment summary"
      ansible.builtin.debug:
        msg: |
          ========================================
          Omnigent + Pi Deployment Complete
          ========================================
          Target: {{ inventory_hostname }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          ----------------------------------------
          Deployed Services:
          - Omnigent Server: http://{{ omnigent_container_ip | default(infra_network_proxy_subnet_ip_10) }}:{{ omnigent_container_port | default(infra_port_ai_dashboard_alt_host) }} (API + web UI)
          - Omnigent Postgres: postgresql://{{ omnigent_db_user | default('omnigent') }}@{{ omnigent_db_container_ip | default(infra_network_proxy_subnet_ip_20) }}:{{ infra_port_db_postgres_host }}/{{ omnigent_db_name | default('omnigent') }}
          - Pi (RPC bridge): http://{{ pi_container_ip | default(infra_network_proxy_subnet_ip_30) }}:{{ infra_port_ai_pi_container | default(infra_port_ai_dashboard_host) }} (coding agent harness)
          ----------------------------------------
          Pipeline Flow:
          Omnigent → Pi → AI Dashboard Proxy 1 → Privacy Orchestrator → Headroom → OmniRoute → Forge → AI Dashboard Proxy 2 → Iron-Proxy → NordVPN → Internet
          ----------------------------------------
          Public Access:
          - Web UI: https://{{ infra_domain_ai_omnigent | default('aiif.' ~ (infra_domain_base | default('example.com'))) }}
          ----------------------------------------
          Next Steps:
          1. Verify containers: docker ps | grep -E "omnigent|pi"
          2. Create admin account: open web UI or check docker logs omnigent for auto-generated password
          3. Register a runner: omni login https://{{ infra_domain_ai_omnigent | default('aiif.' ~ (infra_domain_base | default('example.com'))) }} && omni host https://{{ infra_domain_ai_omnigent | default('aiif.' ~ (infra_domain_base | default('example.com'))) }}
          4. Verify Pi RPC bridge: curl http://localhost:{{ infra_port_ai_pi_host | default(infra_port_ai_dashboard_host) }}/health
          ========================================
      tags: ["always", "summary"]

    - name: "Log deployment completion to system"
      ansible.builtin.shell:
        cmd: >-
          echo 'Omnigent + Pi deployment completed at
          {{ ansible_date_time.iso8601 }}' >> /var/log/omnigent-deploy.log
      changed_when: false
      failed_when: false
      tags: ["always", "logging"]
