---
# Deploy QM to Windows Docker Desktop + wire Traefik routing on OCI
# Location: shared/active/02-config/ansible/playbooks/deploy-qm.yml
#
# Two-phase deployment:
#   Phase 1 (Windows Docker host): pull ghcr.io images, deploy containers
#   Phase 2 (OCI cloud server): deploy Traefik dynamic config for cross-machine routing
#
# The service runs on the Windows Docker host (dtop202311), but Traefik runs on
# the OCI cloud server. Traefik routes to the Windows machine's Tailscale FQDN
# + host port — this is cross-machine routing via Tailscale.
#
# Docker modules use delegate_to: localhost with ssh:// Docker connection
# because community.docker modules can't run directly on Windows (Ansible's
# core basic.py imports grp, which is Unix-only). The SSH config entry for
# dtop202311.<tailnet> provides the key.
#
# Prerequisites:
#   1. Bootstrap playbook run on Windows: just ansible-bootstrap-windows-docker
#   2. Traefik deployed on OCI: just ansible-deploy-infra
#   3. DNS CNAME configured: just ansible-deploy-dns (configure-cloudflare-dns.yml)
#   4. SSH config entry for dtop202311.<tailnet> (IdentityFile + IdentitiesOnly)
#   5. Vault secrets added: vault_qm_* (see internal-docs/research/service/qm/README.md)
#   6. Sandbox image built and pushed to local registry (optional, for SANDBOX_BACKEND=local)
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/windows-docker.yml \
#     -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-qm.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Phase 1 — Deploy QM containers on Windows Docker host"
  hosts: windows_docker_hosts
  gather_facts: false
  become: false

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Validate required variables"
      ansible.builtin.assert:
        that:
          - qm_enabled is defined
          - infra_tailscale_fqdn_windows_docker is defined
          - vault_qm_postgres_password is defined
        fail_msg: "Missing required variables. Check windows_docker_hosts.yml, domains.yml, and vault."
        success_msg: "All required qm variables are defined."
      tags: ["always", "validate"]

  roles:
    - role: ai-qm
      tags: ["deploy", "qm"]
      when: qm_enabled | bool


- name: "Phase 2 — Deploy Traefik routing on OCI"
  hosts: cloud_servers
  gather_facts: false
  become: true

  vars:
    # qm_enabled is defined in windows_docker_hosts group_vars, not visible to cloud_servers.
    # Default to true here so the Traefik config is deployed.
    qm_enabled: true

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load proxy-traefik role defaults (for domain variable mappings)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/proxy-traefik/defaults/main.yml"
      tags: ["always"]

  tasks:
    - name: "Deploy QM Traefik dynamic configuration"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/proxy-traefik/templates/dynamic/qm.yml.j2"
        dest: "{{ proxy_traefik_data_dir | default('/opt/traefik') }}/config/dynamic/qm.yml"
        owner: root
        group: root
        mode: "{{ infra_mode_file }}"
      notify: reload traefik
      tags: ["traefik", "routing"]
      when: qm_enabled | default(false) | bool

  handlers:
    - name: reload traefik
      community.docker.docker_container:
        name: "{{ proxy_traefik_container_name | default('traefik') }}"
        state: started
        restart: true
      when: qm_enabled | default(false) | bool
