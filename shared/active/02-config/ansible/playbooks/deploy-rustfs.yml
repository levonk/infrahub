---
# Deploy RustFS to Windows Docker Desktop + wire Traefik routing on OCI
# Location: shared/active/02-config/ansible/playbooks/deploy-rustfs.yml
#
# Two-phase deployment:
#   Phase 1 (Windows Docker host): pull Docker Hub image, deploy container
#   Phase 2 (OCI cloud server): deploy Traefik dynamic config for cross-machine routing
#
# The service runs on the Windows Docker host (dtop202311), but Traefik runs on
# the OCI cloud server. Traefik routes to the Windows machine's Tailscale FQDN
# + host port — this is cross-machine routing via Tailscale.
#
# Docker modules use delegate_to: localhost with ssh:// Docker connection
# because community.docker modules can't run directly on Windows (Ansible's
# core basic.py imports grp, which is Unix-only). The SSH config entry for
# dtop202311.<tailnet> provides the key.
#
# Prerequisites:
#   1. Bootstrap playbook run on Windows: just ansible-bootstrap-windows-docker
#   2. Traefik deployed on OCI: just ansible-deploy-infra
#   3. DNS CNAME configured: just ansible-deploy-dns (configure-cloudflare-dns.yml)
#   4. SSH config entry for dtop202311.<tailnet> (IdentityFile + IdentitiesOnly)
#   5. python313Packages.docker in devbox.json (for community.docker modules on OCI phase)
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/windows-docker.yml \
#     -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-rustfs.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Phase 1 — Deploy RustFS container on Windows Docker host"
  hosts: windows_docker_hosts
  gather_facts: false
  become: false

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Validate required variables"
      ansible.builtin.assert:
        that:
          - rustfs_enabled is defined
          - windows_tailscale_hostname is defined
          - infra_tailscale_tailnet is defined
        fail_msg: "Missing required variables. Check windows_docker_hosts.yml and domains.yml."
        success_msg: "All required rustfs variables are defined."
      tags: ["always", "validate"]

  roles:
    - role: storage-rustfs
      tags: ["deploy", "rustfs"]
      when: rustfs_enabled | bool


- name: "Phase 2 — Deploy Traefik routing on OCI"
  hosts: cloud_servers
  gather_facts: false
  become: true

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

  tasks:
    - name: "Deploy RustFS Traefik dynamic configuration"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/proxy-traefik/templates/dynamic/rustfs.yml.j2"
        dest: "{{ proxy_traefik_data_dir | default('/opt/traefik') }}/config/dynamic/rustfs.yml"
        owner: root
        group: root
        mode: "{{ infra_mode_file }}"
      notify: reload traefik
      tags: ["traefik", "routing"]
      when: rustfs_enabled | default(false) | bool

  handlers:
    - name: reload traefik
      community.docker.docker_container:
        name: "{{ proxy_traefik_container_name | default('traefik') }}"
        state: started
        restart: true
      when: rustfs_enabled | default(false) | bool
