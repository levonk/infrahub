---
# Sandboxed CLI Proxy Deployment Playbook
# Deploys iron-proxy as a default-deny egress firewall for sandboxed CLI containers.
# Each profile in sandbox_cli_proxy_profiles gets its own iron-proxy instance.
#
# See ADR-202608051501 for the architecture decision.
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/macos-hosts.yml \
#     shared/active/02-config/ansible/playbooks/deploy-sandbox-proxy.yml \
#     --vault-password-file ~/.ansible/vault_password
#
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-sandbox-proxy.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Deploy Sandboxed CLI Proxy"
  hosts: sandbox_proxy_hosts
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Load shared infrastructure defaults (ports, networks, domains, storage)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
        - modes.yml
        - timing.yml
      tags: ["always"]

    - name: "Load client infrastructure overrides (levonk)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

    # ---------------------------------------------------------------------------
    # Apple Container (macOS 26+ ARM) has no Docker Engine API, so the
    # community.docker modules in sandbox-cli-proxy cannot manage containers.
    # Skip the role on apple-container hosts unless the host explicitly opts
    # in via sandbox_cli_proxy_allow_apple_container: true.
    # Detection mirrors configure-macos-host.yml: macos_container_runtime
    # group var ("auto" → macOS 26+ ARM = apple-container, else orbstack).
    # ---------------------------------------------------------------------------
    - name: "Resolve effective container runtime"
      ansible.builtin.set_fact:
        sandbox_proxy_effective_runtime: >-
          {{ 'apple-container'
             if ansible_facts['system'] | default('') == 'Darwin'
                and (
                  (macos_container_runtime | default('auto')) == 'apple-container'
                  or (
                    (macos_container_runtime | default('auto')) == 'auto'
                    and ansible_facts['distribution_version'] is version('26', '>=')
                    and ansible_facts['architecture'] == 'arm64'
                  )
                )
             else 'docker' }}
      tags: ["always"]

    - name: "Disable sandbox-cli-proxy on Apple Container hosts"
      ansible.builtin.set_fact:
        sandbox_cli_proxy_enabled: false
      when: >-
        sandbox_proxy_effective_runtime == 'apple-container'
        and not sandbox_cli_proxy_allow_apple_container | default(false) | bool
      tags: ["always"]

    - name: "Report container runtime gate"
      ansible.builtin.debug:
        msg: >-
          {{ 'sandbox-cli-proxy SKIPPED on ' ~ inventory_hostname ~
             ': Apple Container has no Docker Engine API ' ~
             '(set sandbox_cli_proxy_allow_apple_container: true to override)'
             if sandbox_proxy_effective_runtime == 'apple-container'
                and not sandbox_cli_proxy_allow_apple_container | default(false) | bool
             else 'sandbox-cli-proxy proceeding on ' ~ inventory_hostname ~
                  ' (' ~ sandbox_proxy_effective_runtime ~ ' runtime)' }}
      tags: ["always", "info"]

    - name: "Display deployment start information"
      ansible.builtin.debug:
        msg: |
          ========================================
          Sandboxed CLI Proxy Deployment Started
          ========================================
          Target: {{ inventory_hostname }}
          OS: {{ ansible_distribution | default('macOS') }} {{ ansible_distribution_version | default('') }}
          Architecture: {{ ansible_facts['architecture'] | default('unknown') }}
          Profiles: {{ sandbox_cli_proxy_profiles | map(attribute='name') | list }}
          ========================================
      tags: ["always", "info"]

  roles:
    - role: sandbox-cli-proxy
      tags: ["deploy", "sandbox-cli-proxy"]
