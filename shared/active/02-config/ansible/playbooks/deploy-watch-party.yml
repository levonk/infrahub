---
# Deploy Local Watch Party + coturn on OCI (cno)
# Location: shared/active/02-config/ansible/playbooks/deploy-watch-party.yml
#
# Local Watch Party — synchronized movie watching with friends.
# Web UI behind Traefik + Authelia SSO; coturn for WebRTC voice chat relay.
# Locally-built multi-arch image (linux/amd64 + linux/arm64) for watch-party;
# upstream coturn/coturn:4.17.2-alpine for coturn.
#
# Prerequisites:
#   1. Bootstrap playbook run on OCI: just ansible-deploy-bootstrap
#   2. Docker engine running on oci-cloud-server
#   3. Traefik + Authelia deployed: just ansible-deploy-infra
#   4. Watch Party image built and pushed: just docker-build-push localnet-media-watch-party
#   5. Vault secrets set: vault_media_watch_party_turn_password
#   6. DNS CNAME configured: just ansible-deploy-dns (configure-cloudflare-dns.yml)
#
# Public exposure: this playbook runs proxy-firewall which opens the public
# host-firewall ports declared in cloud_server_firewall_public_*_ports
# (80/443 Traefik edge + 3487 tcp/udp + 49000-49050/udp coturn relay).
# watch.levonk.com and auth.levonk.com CNAME to the oci.mach.<base> DDNS
# record (public IP) — see configure-cloudflare-dns.yml.
# The OCI VCN security list is NOT managed by Ansible — matching ingress
# rules for those ports must exist in the OCI console.
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-watch-party.yml \
#     --vault-password-file ~/.ansible/vault_password
#
# Dry run:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-watch-party.yml \
#     --check --diff --vault-password-file ~/.ansible/vault_password

- name: "Deploy Local Watch Party + coturn on OCI (cno)"
  hosts: cloud_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Load shared infrastructure defaults (ports, networks, domains, storage)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
        - modes.yml
        - timing.yml
      tags: ["always"]

    - name: "Load client infrastructure overrides (levonk)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/{{ item }}"
      loop:
        - ports.yml
        - networks.yml
        - domains.yml
        - storage.yml
      tags: ["always"]

  roles:
    # Open public host-firewall ports BEFORE the services start so coturn's
    # TURN relay and the Traefik edge are reachable once containers come up.
    - role: proxy-firewall
      tags: ["deploy", "firewall"]

    - role: media-coturn
      tags: ["deploy", "coturn"]

    - role: media-watch-party
      tags: ["deploy", "watch-party"]
