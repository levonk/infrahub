---
# Deploy Wazuh SIEM/XDR to Windows Docker Desktop + wire Traefik routing on OCI
# Location: shared/active/02-config/ansible/playbooks/deploy-wazuh.yml
#
# Two-phase deployment:
#   Phase 1 (Windows Docker host): pull Docker Hub images, generate certs,
#            deploy 3-container stack (indexer, manager, dashboard)
#   Phase 2 (OCI cloud server): deploy Traefik dynamic config for cross-machine routing
#
# The service runs on the Windows Docker host (dtop202311), but Traefik runs on
# the OCI cloud server. Traefik routes to the Windows machine's Tailscale FQDN
# + dashboard host port — this is cross-machine routing via Tailscale.
#
# Docker modules use delegate_to: localhost with ssh:// Docker connection
# because community.docker modules can't run directly on Windows (Ansible's
# core basic.py imports grp, which is Unix-only). The SSH config entry for
# dtop202311.<tailnet> provides the key.
#
# WSL2 tuning tasks use ansible.windows.win_shell, which runs PowerShell on
# the Windows host without the Python module_utils grp issue.
#
# Prerequisites:
#   1. Bootstrap playbook run on Windows: just ansible-bootstrap-windows-docker
#   2. Traefik deployed on OCI: just ansible-deploy-infra
#   3. DNS CNAME configured: just ansible-deploy-dns (configure-cloudflare-dns.yml)
#   4. SSH config entry for dtop202311.<tailnet> (IdentityFile + IdentitiesOnly)
#   5. WSL2 kernel param: vm.max_map_count=262144 (required by Wazuh Indexer/OpenSearch)
#      Set by this playbook via .wslconfig and WSL2 restart.
#   6. Vault secrets added: vault_wazuh_indexer_password, vault_wazuh_dashboard_password,
#      vault_wazuh_api_password
#
# Usage:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/windows-docker.yml \
#     -i levonk/active/02-config/ansible/inventories/oci.yml \
#     shared/active/02-config/ansible/playbooks/deploy-wazuh.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Phase 1 — Deploy Wazuh containers on Windows Docker host"
  hosts: windows_docker_hosts
  gather_facts: false
  become: false

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Validate required variables"
      ansible.builtin.assert:
        that:
          - wazuh_enabled is defined
          - windows_tailscale_hostname is defined
          - infra_tailscale_tailnet is defined
        fail_msg: "Missing required variables. Check windows_docker_hosts.yml and domains.yml."
        success_msg: "All required wazuh variables are defined."
      tags: ["always", "validate"]

    # WSL2 tuning required by Wazuh Indexer (OpenSearch). vm.max_map_count must
    # be >= 262144, otherwise the indexer container exits during bootstrap.
    - name: "Create WSL2 .wslconfig with vm.max_map_count=262144"  # project-lint: disable=magic-int  virtualization config constant, not a standalone magic number
      ansible.windows.win_shell:
        cmd: |
          $wslconfig = "$env:USERPROFILE\.wslconfig"
          $content = @"
          [wsl2]
          vm.max_map_count=262144  # project-lint: disable=magic-int  virtualization config constant, not a standalone magic number
          "@
          if (Test-Path $wslconfig) {
            $existing = Get-Content $wslconfig -Raw -ErrorAction SilentlyContinue
            if ($existing -notmatch 'vm\.max_map_count\s*=\s*262144') {  # project-lint: disable=magic-int  virtualization config constant, not a standalone magic number
              Add-Content -Path $wslconfig -Value "`n[wsl2]`nvm.max_map_count=262144" -NoNewline  # project-lint: disable=magic-int  virtualization config constant, not a standalone magic number
              Write-Output "WSLCONFIG_UPDATED"
            } else {
              Write-Output "WSLCONFIG_OK"
            }
          } else {
            Set-Content -Path $wslconfig -Value $content -NoNewline
            Write-Output "WSLCONFIG_CREATED"
          }
      register: wslconfig_status
      changed_when: "'WSLCONFIG_UPDATED' in wslconfig_status.stdout or 'WSLCONFIG_CREATED' in wslconfig_status.stdout"
      tags: ["always", "wsl2"]

    - name: "Restart WSL2 if .wslconfig was changed"
      ansible.windows.win_shell:
        cmd: |
          wsl --shutdown
          Start-Sleep -Seconds 5  # project-lint: disable=magic-int  Windows/PowerShell config value, not a standalone magic number
          Write-Output "WSL2_RESTARTED"
      when: "'WSLCONFIG_UPDATED' in wslconfig_status.stdout or 'WSLCONFIG_CREATED' in wslconfig_status.stdout"
      register: wsl2_restart
      tags: ["always", "wsl2"]

    - name: "Wait for Docker to be reachable after WSL2 restart"
      ansible.windows.win_shell:
        cmd: |
          for ($i = 0; $i -lt 30; $i++) {  # project-lint: disable=magic-int  PowerShell loop count, not an operational value
            $null = docker info 2>&1
            if ($LASTEXITCODE -eq 0) { Write-Output "DOCKER_READY"; exit 0 }
            Start-Sleep -Seconds 5  # project-lint: disable=magic-int  Windows/PowerShell config value, not a standalone magic number
          }
          Write-Output "DOCKER_TIMEOUT"
          exit 1
      when: "'WSL2_RESTARTED' in wsl2_restart.stdout | default('')"
      register: docker_ready
      retries: 0
      tags: ["always", "wsl2"]

  roles:
    - role: security-wazuh
      tags: ["deploy", "wazuh"]
      when: wazuh_enabled | bool


- name: "Phase 2 — Deploy Traefik routing on OCI"
  hosts: cloud_servers
  gather_facts: false
  become: true

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

  tasks:
    - name: "Deploy Wazuh Traefik dynamic configuration"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/proxy-traefik/templates/dynamic/wazuh.yml.j2"
        dest: "{{ proxy_traefik_data_dir | default('/opt/traefik') }}/config/dynamic/wazuh.yml"
        owner: root
        group: root
        mode: "{{ infra_mode_file }}"
      notify: reload traefik
      tags: ["traefik", "routing"]
      when: wazuh_enabled | default(false) | bool

  handlers:
    - name: reload traefik
      community.docker.docker_container:
        name: "{{ proxy_traefik_container_name | default('traefik') }}"
        state: started
        restart: true
      when: wazuh_enabled | default(false) | bool
