---
# Deploy Exit Nodes (NordVPN + Tor) on Windows Docker Desktop hosts
#
# Target: windows_docker_hosts group (host dtop202311).
# Access: Tailscale-only — no public domain, no Traefik routing.
#
# Deploys two additional Tailscale exit nodes on the Windows host:
#   1. NordVPN exit node — routes Tailscale traffic through NordVPN (gluetun)
#   2. Tor exit node — routes Tailscale traffic through Tor (tor-exit)
#
# Both exit nodes reuse the same vault credentials as the OCI exit nodes:
#   - vault_nordvpn_openvpn_user / vault_nordvpn_openvpn_pass
#   - vault_tailscale_auth_key
#
# The Tor exit node image (localnet-proxy-tor) must be built and pushed to the
# local registry first:
#   PLATFORM=linux/amd64 scripts/build-and-push-images.sh localnet-proxy-tor
#
# Usage:
#   just --justfile levonk/justfile levonk-deploy-exit-nodes-nl
#   or:
#   ansible-playbook -i levonk/active/02-config/ansible/inventories/windows-docker.yml \
#     shared/active/02-config/ansible/playbooks/deploy-windows-exit-nodes.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Deploy NordVPN Exit Node on Windows Docker Desktop"
  hosts: windows_docker_hosts
  gather_facts: false
  become: false
  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure storage overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load client infrastructure port overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure timing defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/timing.yml"
      tags: ["always"]

    - name: "Load shared infrastructure mode defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load shared infrastructure fallback values"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/values.yml"
      tags: ["always"]
  roles:
    - role: vpn-nordvpn-windows
      when: vpn_nordvpn_windows_enabled | default(false) | bool
      tags: ["deploy", "nordvpn", "exit-node"]

- name: "Deploy Tor Exit Node on Windows Docker Desktop"
  hosts: windows_docker_hosts
  gather_facts: false
  become: false
  roles:
    - role: vpn-tor-windows
      when: vpn_tor_windows_enabled | default(false) | bool
      tags: ["deploy", "tor", "exit-node"]
