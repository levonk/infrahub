---
# Deploy WorldMonitor Self-Hosted Stack to Windows Docker Desktop
# Location: shared/active/02-config/ansible/playbooks/deploy-worldmonitor.yml
#
# Two-phase deployment:
#   Phase 1 (on control machine / localhost): clone repo, build images, push to
#     registry, export all three images to a tar archive
#   Phase 2 (on Windows Docker host): load images from the archive and deploy
#     containers via DOCKER_HOST=ssh:// (delegate_to: localhost pattern, same
#     as vpn-*-windows / dns roles — no Python needed on Windows)
#
# No source code or building happens on the Windows machine.
# The Windows machine only receives pre-built images and runs containers.
#
# Images are transferred via docker save/load over the SSH docker connection
# rather than a registry pull — the Windows daemon therefore does NOT need
# insecure-registries configured (and no Docker Desktop restart is needed).
# Registry pushes are tagged "never" (skipped by default; run --tags push to
# mirror images to the registry for future multi-host pulls).
#
# Prerequisites:
#   1. Docker running on the control machine (for building images)
#   2. Bootstrap playbook run on Windows: just ansible-bootstrap-windows-docker
#   3. SSH config entry for the Windows host (provides user + key for ssh://)
#
# Usage (example with levonk client inventory):
#   ansible-playbook -i <client>/active/02-config/ansible/inventories/windows-docker.yml \
#     shared/active/02-config/ansible/playbooks/deploy-worldmonitor.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Phase 1 — Build and push WorldMonitor images"  # project-lint: disable=magic-int  phase number in task name
  hosts: localhost
  gather_facts: true
  connection: local
  become: false

  vars:
    wm_images_archive: "/tmp/worldmonitor-images.tar"

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load shared infrastructure timing defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/timing.yml"
      tags: ["always"]

    - name: "Load shared infrastructure mode defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Load shared infrastructure app defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/apps.yml"
      tags: ["always"]

    - name: "Load shared infrastructure fallback values"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/values.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure storage overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load client infrastructure port overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load client windows_docker_hosts group vars (localhost is not in that group)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/inventories/group_vars/windows_docker_hosts.yml"
      tags: ["always"]

    - name: "Validate required variables"
      ansible.builtin.assert:
        that:
          - worldmonitor_repo_url is defined
          - worldmonitor_repo_branch is defined
          - worldmonitor_registry_url is defined
        fail_msg: >-
          Missing required variables. Check the client's
          group_vars/windows_docker_hosts.yml.
        success_msg: "Build variables OK."
      tags: ["always", "validate"]

    - name: "Check Docker is available on control machine"
      ansible.builtin.command:
        cmd: "docker --version"
      register: docker_check
      changed_when: false
      tags: ["always", "verify"]

    - name: "Fail if Docker is not available"
      ansible.builtin.fail:
        msg: "Docker is not running on the control machine. Start Docker Desktop or colima."
      when: docker_check.rc != 0
      tags: ["always", "verify"]

  tasks:
    - name: "Clone WorldMonitor repository to temp build directory"
      ansible.builtin.git:
        repo: "{{ worldmonitor_repo_url }}"
        dest: "/tmp/worldmonitor-build"
        version: "{{ worldmonitor_repo_branch }}"
        force: true
        depth: 1  # project-lint: disable=magic-int  shallow clone depth
      tags: ["build"]

    - name: "Build WorldMonitor app image"
      ansible.builtin.command:
        cmd: "docker build -f Dockerfile -t {{ worldmonitor_registry_url }}/worldmonitor:latest ."
        chdir: "/tmp/worldmonitor-build"
      changed_when: true
      tags: ["build"]

    - name: "Build AIS relay image"
      ansible.builtin.command:
        cmd: "docker build -f Dockerfile.relay -t {{ worldmonitor_registry_url }}/worldmonitor-ais-relay:latest ."
        chdir: "/tmp/worldmonitor-build"
      changed_when: true
      tags: ["build"]

    - name: "Build Redis REST proxy image"
      ansible.builtin.command:
        cmd: "docker build -f docker/Dockerfile.redis-rest -t {{ worldmonitor_registry_url }}/worldmonitor-redis-rest:latest docker/"
        chdir: "/tmp/worldmonitor-build"
      changed_when: true
      tags: ["build"]

    - name: "Export WorldMonitor images to transfer archive"
      ansible.builtin.command:
        cmd: >-
          docker save -o {{ wm_images_archive }}
          {{ worldmonitor_registry_url }}/worldmonitor:latest
          {{ worldmonitor_registry_url }}/worldmonitor-ais-relay:latest
          {{ worldmonitor_registry_url }}/worldmonitor-redis-rest:latest
      changed_when: true
      tags: ["push", "export"]

    # Registry pushes are excluded from the normal run (tagged "never") —
    # the registry link hangs for minutes before failing and Phase 2 loads
    # images from the archive above anyway. Run with --tags push to mirror
    # the images into the registry for multi-host pulls.
    - name: "Push WorldMonitor app image to registry"
      ansible.builtin.command:
        cmd: "docker push {{ worldmonitor_registry_url }}/worldmonitor:latest"
      changed_when: true
      failed_when: false
      tags: ["push", "never"]

    - name: "Push AIS relay image to registry"
      ansible.builtin.command:
        cmd: "docker push {{ worldmonitor_registry_url }}/worldmonitor-ais-relay:latest"
      changed_when: true
      failed_when: false
      tags: ["push", "never"]

    - name: "Push Redis REST proxy image to registry"
      ansible.builtin.command:
        cmd: "docker push {{ worldmonitor_registry_url }}/worldmonitor-redis-rest:latest"
      changed_when: true
      failed_when: false
      tags: ["push", "never"]

    - name: "Report build and export complete"
      ansible.builtin.debug:
        msg: "Images built and exported to {{ wm_images_archive }} (registry push skipped; run --tags push to mirror to {{ worldmonitor_registry_url }})"
      tags: ["summary"]


- name: "Phase 2 — Deploy WorldMonitor containers on Windows"  # project-lint: disable=magic-int  phase number in task name
  hosts: windows_docker_hosts
  gather_facts: true
  become: false

  vars:
    # community.docker can't run on Windows (grp import), so modules run on the
    # controller and reach the Windows Docker daemon over SSH — the same
    # delegate_to: localhost + DOCKER_HOST: ssh:// pattern used by the
    # vpn-*-windows and dns roles. SSH user/key come from ~/.ssh/config.
    # No Python is needed on the Windows host.
    wm_docker_host: "ssh://ansible@{{ ansible_host }}"
    wm_images_archive: "/tmp/worldmonitor-images.tar"

  pre_tasks:
    - name: "Load shared infrastructure port defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure storage defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load shared infrastructure domain defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load shared infrastructure network defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

    - name: "Load shared infrastructure timing defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/timing.yml"
      tags: ["always"]

    - name: "Load shared infrastructure mode defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/modes.yml"
      tags: ["always"]

    - name: "Load shared infrastructure app defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/apps.yml"
      tags: ["always"]

    - name: "Load shared infrastructure fallback values"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/values.yml"
      tags: ["always"]

    - name: "Load client infrastructure domain overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/domains.yml"
      tags: ["always"]

    - name: "Load client infrastructure storage overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/storage.yml"
      tags: ["always"]

    - name: "Load client infrastructure port overrides"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../../levonk/active/02-config/ansible/infrastructure/ports.yml"
      tags: ["always"]

    - name: "Validate required WorldMonitor variables are defined"
      ansible.builtin.assert:
        that:
          - worldmonitor_enabled is defined
          - worldmonitor_registry_url is defined
          - worldmonitor_redis_password is defined
          - worldmonitor_redis_password | length > 0
          - worldmonitor_redis_token is defined
          - worldmonitor_redis_token | length > 0
          - worldmonitor_relay_shared_secret is defined
          - worldmonitor_relay_shared_secret | length > 0
          - worldmonitor_session_secret is defined
          - worldmonitor_session_secret | length >= 32  # project-lint: disable=magic-int  minimum secret length requirement
          - docker_host is defined
        fail_msg: >-
          Missing required WorldMonitor variables. Check the client's
          group_vars/windows_docker_hosts.yml and vault file.
        success_msg: "All required WorldMonitor variables are defined."
      tags: ["always", "validate"]

    - name: "Check Docker is accessible on Windows host"
      community.docker.docker_host_info:
        docker_host: "{{ wm_docker_host }}"
        use_ssh_client: true
      delegate_to: localhost
      register: docker_host_info_result
      ignore_errors: true
      tags: ["always", "verify", "docker"]

    - name: "Fail if Docker is not accessible"
      ansible.builtin.fail:
        msg: >-
          Docker is not accessible at {{ wm_docker_host }}.
          Ensure Docker Desktop is running on {{ inventory_hostname }} and the
          controller can SSH to it (check ~/.ssh/config for {{ ansible_host }}).
          Run: just ansible-bootstrap-windows-docker
      when: docker_host_info_result is failed
      tags: ["always", "verify", "docker"]

    - name: "Report Docker daemon info"
      ansible.builtin.debug:
        msg: "Docker daemon: {{ docker_host_info_result.host_info.ServerVersion }} ({{ docker_host_info_result.host_info.OperatingSystem }})"
      tags: ["always", "verify", "docker"]

  tasks:
    # ---------------------------------------------------------------------------
    # Load images onto the Windows daemon (no building on Windows)
    # The archive was exported by Phase 1 and is streamed over the SSH docker
    # connection — no registry pull, so insecure-registries is not required.
    # ---------------------------------------------------------------------------
    - name: "Load WorldMonitor images into Windows Docker daemon"
      community.docker.docker_image:
        name: "{{ worldmonitor_registry_url }}/worldmonitor:latest"
        docker_host: "{{ wm_docker_host }}"
        use_ssh_client: true
        source: load
        load_path: "{{ wm_images_archive }}"
      delegate_to: localhost
      tags: ["deploy", "load"]

    # ---------------------------------------------------------------------------
    # Create Docker network
    # ---------------------------------------------------------------------------
    - name: "Create WorldMonitor Docker network"
      community.docker.docker_network:
        name: "{{ worldmonitor_network_name }}"
        docker_host: "{{ wm_docker_host }}"
        use_ssh_client: true
        state: present
      delegate_to: localhost
      tags: ["network", "deploy"]

    # ---------------------------------------------------------------------------
    # Deploy containers (ordered: redis → redis-rest → ais-relay → worldmonitor)
    # ---------------------------------------------------------------------------
    - name: "Deploy Redis container"
      community.docker.docker_container:
        name: "worldmonitor-redis"
        image: "docker.io/redis:7-alpine"
        state: started
        restart_policy: unless-stopped
        docker_host: "{{ wm_docker_host }}"
        use_ssh_client: true
        networks:
          - name: "{{ worldmonitor_network_name }}"
        command: >-
          redis-server
          --requirepass {{ worldmonitor_redis_password }}
          --maxmemory 256mb
          --maxmemory-policy allkeys-lru
        volumes:
          - "{{ infra_storage_worldmonitor_redis_data_volume }}:/data"
      delegate_to: localhost
      tags: ["deploy", "redis"]

    - name: "Deploy Redis REST proxy container"
      community.docker.docker_container:
        name: "worldmonitor-redis-rest"
        image: "{{ worldmonitor_registry_url }}/worldmonitor-redis-rest:latest"
        state: started
        restart_policy: unless-stopped
        docker_host: "{{ wm_docker_host }}"
        use_ssh_client: true
        networks:
          - name: "{{ worldmonitor_network_name }}"
        ports:
          - "{{ infra_network_bind_localhost }}:{{ worldmonitor_redis_rest_host_port }}:{{ worldmonitor_redis_rest_container_port }}"
        env:
          SRH_TOKEN: "{{ worldmonitor_redis_token }}"
          SRH_CONNECTION_STRING: "redis://:{{ worldmonitor_redis_password }}@worldmonitor-redis:{{ infra_port_db_redis_container }}"
      delegate_to: localhost
      tags: ["deploy", "redis-rest"]

    - name: "Deploy AIS relay container"
      community.docker.docker_container:
        name: "worldmonitor-ais-relay"
        image: "{{ worldmonitor_registry_url }}/worldmonitor-ais-relay:latest"
        state: started
        restart_policy: unless-stopped
        docker_host: "{{ wm_docker_host }}"
        use_ssh_client: true
        networks:
          - name: "{{ worldmonitor_network_name }}"
        env:
          AISSTREAM_API_KEY: "{{ worldmonitor_aisstream_api_key }}"
          PORT: "{{ worldmonitor_ais_relay_container_port }}"
          RELAY_SHARED_SECRET: "{{ worldmonitor_relay_shared_secret }}"
      delegate_to: localhost
      tags: ["deploy", "ais-relay"]

    - name: "Deploy WorldMonitor app container"
      community.docker.docker_container:
        name: "worldmonitor"
        image: "{{ worldmonitor_registry_url }}/worldmonitor:latest"
        state: started
        restart_policy: unless-stopped
        docker_host: "{{ wm_docker_host }}"
        use_ssh_client: true
        networks:
          - name: "{{ worldmonitor_network_name }}"
        ports:
          - "{{ worldmonitor_app_host_port }}:{{ worldmonitor_app_container_port }}"
        env:
          UPSTASH_REDIS_REST_URL: "http://worldmonitor-redis-rest:{{ worldmonitor_redis_rest_container_port }}"
          UPSTASH_REDIS_REST_TOKEN: "{{ worldmonitor_redis_token }}"
          WM_SESSION_SECRET: "{{ worldmonitor_session_secret }}"
          LOCAL_API_PORT: "{{ infra_port_omnigent_local_api_host }}"
          LOCAL_API_MODE: "docker"
          LOCAL_API_CLOUD_FALLBACK: "false"
          WS_RELAY_URL: "http://worldmonitor-ais-relay:{{ worldmonitor_ais_relay_container_port }}"
          RELAY_SHARED_SECRET: "{{ worldmonitor_relay_shared_secret }}"
          LLM_API_URL: "{{ worldmonitor_llm_api_url }}"
          LLM_API_KEY: "{{ worldmonitor_llm_api_key }}"
          LLM_MODEL: "{{ worldmonitor_llm_model }}"
          GROQ_API_KEY: "{{ worldmonitor_groq_api_key }}"
          OPENROUTER_API_KEY: "{{ worldmonitor_openrouter_api_key }}"
          AISSTREAM_API_KEY: "{{ worldmonitor_aisstream_api_key }}"
          FINNHUB_API_KEY: "{{ worldmonitor_finnhub_api_key }}"
          EIA_API_KEY: "{{ worldmonitor_eia_api_key }}"
          FRED_API_KEY: "{{ worldmonitor_fred_api_key }}"
          ACLED_EMAIL: "{{ worldmonitor_acled_email }}"
          ACLED_PASSWORD: "{{ worldmonitor_acled_password }}"
          ACLED_ACCESS_TOKEN: "{{ worldmonitor_acled_access_token }}"
          NASA_FIRMS_API_KEY: "{{ worldmonitor_nasa_firms_api_key }}"
          CLOUDFLARE_API_TOKEN: "{{ worldmonitor_cloudflare_api_token }}"
          AVIATIONSTACK_API: "{{ worldmonitor_aviationstack_api }}"
          TRAVELPAYOUTS_API_TOKEN: "{{ worldmonitor_travelpayouts_api_token }}"
      delegate_to: localhost
      tags: ["deploy", "app"]

  post_tasks:
    - name: "Wait for containers to initialize"
      ansible.builtin.pause:
        seconds: "{{ infra_delay_long }}"
      tags: ["verify"]

    - name: "Verify all WorldMonitor containers are running"
      community.docker.docker_container_info:
        name: "{{ item }}"
        docker_host: "{{ wm_docker_host }}"
        use_ssh_client: true
      delegate_to: localhost
      loop:
        - "worldmonitor"
        - "worldmonitor-redis"
        - "worldmonitor-redis-rest"
        - "worldmonitor-ais-relay"
      register: wm_container_status
      tags: ["verify"]

    - name: "Report container statuses"
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.container.State.Status }}"
      loop: "{{ wm_container_status.results }}"
      when: item.container is defined
      tags: ["verify"]

    - name: "Fail if any container is not running"
      ansible.builtin.fail:
        msg: "Container {{ item.item }} is not running (status: {{ item.container.State.Status }}). Check docker logs {{ item.item }}."
      loop: "{{ wm_container_status.results }}"
      when:
        - item.container is defined
        - item.container.State.Status != "running"
      tags: ["verify"]

    - name: "Report deployment complete"
      ansible.builtin.debug:
        msg: |
          ========================================
          WorldMonitor Self-Hosted Stack Deployed
          ========================================
          Host: {{ inventory_hostname }}
          Registry: {{ worldmonitor_registry_url }}
          Dashboard: http://localhost:{{ worldmonitor_app_host_port }}
          Redis REST: http://{{ infra_network_bind_localhost }}:{{ worldmonitor_redis_rest_host_port }}
          ========================================
          Next: Run seeders to populate data.
          See https://github.com/koala73/worldmonitor SELF_HOSTING.md
          ========================================
      tags: ["verify", "summary"]
