---
# Test SSH connection to VM with correct SSH key

- name: Test VM SSH Connection with Key
  hosts: cloud_servers
  become: true
  gather_facts: true

  tasks:
    - name: Test SSH connection to VM with SSH key
      ansible.builtin.shell:
        cmd: "ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i {{ ansible_ssh_private_key_file }} cuser@{{ infra_network_lan_host_1 }} 'echo SSH successful'"  # project-lint: disable=magic-int  docker network config value, not a standalone magic number
      register: ssh_result
      changed_when: false
      failed_when: false

    - name: Display SSH result
      ansible.builtin.debug:
        var: ssh_result