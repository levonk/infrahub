---
# Web Proxy Chain Validation Playbook
# Read-only post-deployment checks for the web proxy chain.
#
# Usage:
#   just ansible-validate-proxy-web
#   # or directly:
#   devbox run -- ansible-playbook -i inventories/windows-docker.yml playbooks/validate-proxy-web.yml \
#     --vault-password-file ~/.ansible/vault_password

- name: "Validate Web Proxy Chain on Windows Docker Desktop"
  hosts: windows_docker_hosts
  gather_facts: true
  become: false
  vars:
    validation_results: {}
    security_gaps: []

  pre_tasks:
    - name: "Load shared infrastructure variables"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure networks"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

  tasks:
    - name: "Check proxy-web containers are running"
      ansible.builtin.shell: |
        docker ps --filter "name=localnet-proxy-" --format "{{ '{{.Names}}: {{.Status}}' }}"
      environment:
        DOCKER_HOST: "ssh://ansible@{{ ansible_host }}:{{ ansible_port }}"
      delegate_to: localhost
      register: proxy_web_containers
      changed_when: false
      tags: ["validate", "proxy-web"]

    - name: "Display container status"
      ansible.builtin.debug:
        var: proxy_web_containers.stdout_lines
      tags: ["validate", "proxy-web"]

    - name: "Check MITM proxy web UI is reachable"
      ansible.builtin.shell: |
        docker exec localnet-proxy-mitm curl -sf http://{{ infra_network_bind_localhost }}:{{ infra_port_nix_ncro_host }}/ >/dev/null 2>&1 && echo "OK" || echo "FAIL"
      environment:
        DOCKER_HOST: "ssh://ansible@{{ ansible_host }}:{{ ansible_port }}"
      delegate_to: localhost
      register: mitm_ui_check
      changed_when: false
      tags: ["validate", "mitm"]

    - name: "Display MITM UI check result"
      ansible.builtin.debug:
        var: mitm_ui_check.stdout
      tags: ["validate", "mitm"]

    - name: "Check Gost SOCKS5 is reachable"
      ansible.builtin.shell: |
        docker exec localnet-proxy-gost nc -z {{ infra_network_bind_localhost }} {{ infra_port_vpn_nordvpn_socks_host }} 2>/dev/null && echo "OK" || echo "FAIL"
      environment:
        DOCKER_HOST: "ssh://ansible@{{ ansible_host }}:{{ ansible_port }}"
      delegate_to: localhost
      register: gost_check
      changed_when: false
      tags: ["validate", "gost"]

    - name: "Display Gost check result"
      ansible.builtin.debug:
        var: gost_check.stdout
      tags: ["validate", "gost"]

- name: "Validate Web Proxy Chain on OCI Cloud Server"
  hosts: cloud_servers
  become: true
  gather_facts: true
  vars:
    validation_results: {}

  pre_tasks:
    - name: "Load shared infrastructure variables"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/ports.yml"
      tags: ["always"]

    - name: "Load shared infrastructure networks"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../infrastructure/networks.yml"
      tags: ["always"]

  tasks:
    - name: "Check proxy-web containers are running"
      community.docker.docker_container_info:
        name: "{{ item }}"
      register: proxy_web_container_info
      loop:
        - localnet-proxy-mitm
        - localnet-proxy-privoxy
        - localnet-proxy-varnish
        - localnet-proxy-gost
      tags: ["validate", "proxy-web"]

    - name: "Display container status"
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.container.State.Status if item.exists else 'NOT FOUND' }}"
      loop: "{{ proxy_web_container_info.results }}"
      tags: ["validate", "proxy-web"]

    - name: "Check MITM proxy web UI is reachable"
      ansible.builtin.uri:
        url: "http://{{ infra_network_bind_localhost }}:{{ infra_port_proxy_mitm_webui_host | default('19081') }}/"  # project-lint: disable=magic-int  Jinja default port value, should use infra_port variable
        status_code: "{{ infra_http_status_ok }}"
      register: mitm_ui_check
      failed_when: false
      tags: ["validate", "mitm"]

    - name: "Display MITM UI check result"
      ansible.builtin.debug:
        msg: "MITM web UI: {{ 'OK' if mitm_ui_check.status == {{ infra_http_status_ok }} else 'FAIL' }}"
      tags: ["validate", "mitm"]

    - name: "Check Gost SOCKS5 is reachable"
      ansible.builtin.wait_for:
        host: "{{ infra_network_bind_localhost }}"
        port: "{{ infra_port_proxy_gost_socks5_host | default('11080') }}"  # project-lint: disable=magic-int  Jinja default port value, should use infra_port variable
        timeout: "{{ infra_timeout_short }}"
      register: gost_check
      failed_when: false
      tags: ["validate", "gost"]

    - name: "Display Gost check result"
      ansible.builtin.debug:
        msg: "Gost SOCKS5: {{ 'OK' if gost_check.failed == false else 'FAIL' }}"
      tags: ["validate", "gost"]
