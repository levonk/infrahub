---
# Buzz AI agent collaboration workspace default variables
# Buzz is a self-hostable Nostr relay where humans and AI agents share rooms.
# Domain: buzz.<base>

# Container configuration
ai_buzz_container_name: "{{ infra_hostname_buzz | default(infra_value_ai_buzz_container_name) }}"
ai_buzz_image: "ghcr.io/block/buzz:latest"

# Postgres configuration (Buzz event store, channels, workflows, audit, FTS)
ai_buzz_postgres_container_name: "{{ infra_hostname_buzz_postgres | default(infra_value_ai_buzz_postgres_container_name) }}"
ai_buzz_postgres_image: "postgres:17-alpine"
ai_buzz_postgres_db: "buzz"
ai_buzz_postgres_user: "buzz"

# Redis configuration (Buzz pub/sub, presence, typing)
ai_buzz_redis_container_name: "{{ infra_hostname_buzz_redis | default(infra_value_ai_buzz_redis_container_name) }}"
ai_buzz_redis_image: "redis:7-alpine"

# MinIO configuration (Buzz S3-compatible object storage for media)
ai_buzz_minio_container_name: "{{ infra_hostname_buzz_minio | default(infra_value_ai_buzz_minio_container_name) }}"
ai_buzz_minio_image: "minio/minio:latest"
ai_buzz_minio_bucket: "buzz-media"

# Port configuration
ai_buzz_host_port: "{{ infra_port_ai_buzz_host | default(infra_port_ai_buzz_host) }}"
ai_buzz_container_port: "{{ infra_port_ai_buzz_container | default(infra_port_monitoring_grafana_host) }}"
ai_buzz_health_host_port: "{{ infra_port_ai_buzz_health_host | default(infra_port_ai_buzz_health_host) }}"
ai_buzz_health_container_port: "{{ infra_port_ai_buzz_health_container | default(infra_port_proxy_dashboard_host) }}"
ai_buzz_metrics_host_port: "{{ infra_port_ai_buzz_metrics_host | default(infra_port_ai_buzz_metrics_host) }}"
ai_buzz_metrics_container_port: "{{ infra_port_ai_buzz_metrics_container | default(infra_port_ai_buzz_host) }}"

# Network configuration
ai_buzz_network_name: "{{ infra_network_ai_buzz_network_name | default(infra_network_ai_buzz_network_name) }}"
ai_buzz_network_subnet: "{{ infra_network_ai_buzz_subnet | default(infra_network_ai_buzz_network_subnet) }}"
ai_buzz_network_gateway: "{{ infra_network_ai_buzz_gateway | default(infra_network_ai_buzz_network_gateway) }}"
ai_buzz_network_ip: "{{ infra_network_ip_buzz | default(infra_network_ip_ai_buzz_network) }}"
ai_buzz_postgres_ip: "{{ infra_network_ip_buzz_postgres | default(infra_network_ip_ai_buzz_postgres) }}"
ai_buzz_redis_ip: "{{ infra_network_ip_buzz_redis | default(infra_network_ip_ai_buzz_redis) }}"
ai_buzz_minio_ip: "{{ infra_network_ip_buzz_minio | default(infra_network_ip_ai_buzz_minio) }}"
ai_buzz_traefik_network_name: "{{ infra_network_proxy_traefik_network_name | default(infra_network_ai_buzz_traefik_network_name) }}"
ai_buzz_traefik_network_ip: "{{ infra_network_ip_buzz_traefik | default(infra_network_ip_ai_buzz_traefik_network) }}"

# Domain for Traefik routing
ai_buzz_domain: "{{ infra_domain_ai_buzz | default('buzz.' ~ (infra_domain_base | default(infra_value_ai_buzz_domain))) }}"

# Public relay URL used for NIP-42 auth challenges (wss:// public domain)
ai_buzz_relay_url: "wss://{{ ai_buzz_domain }}"

# Buzz operational settings
ai_buzz_auto_migrate: true
ai_buzz_audit_enabled: true
ai_buzz_require_auth_token: false
ai_buzz_require_relay_membership: false
ai_buzz_require_media_get_auth: false
ai_buzz_allow_nip_oa_auth: false

# Secrets (from vault)
ai_buzz_postgres_password: "{{ vault_buzz_postgres_password | default(infra_value_ai_buzz_postgres_password) }}"
ai_buzz_relay_private_key: "{{ vault_buzz_relay_private_key | default('') }}"
ai_buzz_s3_access_key: "{{ vault_buzz_s3_access_key | default(infra_value_ai_buzz_s3_access_key) }}"
ai_buzz_s3_secret_key: "{{ vault_buzz_s3_secret_key | default(infra_value_ai_buzz_s3_secret_key) }}"

# Storage
ai_buzz_postgres_volume_name: "{{ infra_storage_buzz_postgres_volume | default(infra_value_ai_buzz_postgres_volume_name) }}"
ai_buzz_minio_volume_name: "{{ infra_storage_buzz_minio_volume | default(infra_value_ai_buzz_minio_volume_name) }}"

# User/Group IDs and TZ
ai_buzz_puid: "{{ localnet_puid | default(cuser_uid | default(infra_identity_puid)) | string }}"
ai_buzz_pgid: "{{ localnet_pgid | default(cuser_gid | default(infra_identity_pgid)) | string }}"
ai_buzz_tz: "{{ localnet_tz | default(timezone | default(infra_value_ai_buzz_tz)) }}"
