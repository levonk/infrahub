---
# Buzz AI agent collaboration workspace / Nostr relay deployment
# Deploys Buzz relay + Postgres + Redis + MinIO on cloud servers.
# Pipeline position: Request origin (peer to Paperclip and Omnigent+Pi)
#
# Uses community.docker modules per AGENTS.md architectural invariants.
# No docker compose, no compose file copying, no .env file interpolation.

- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - localnet_services_dir is defined
      - ai_buzz_postgres_password is defined
      - ai_buzz_s3_access_key is defined
      - ai_buzz_s3_secret_key is defined
    fail_msg: >-
      Missing required variables. Check inventory vars and vault for
      localnet_services_dir, vault_buzz_postgres_password, vault_buzz_s3_access_key,
      and vault_buzz_s3_secret_key.
    success_msg: "All required Buzz variables are defined."
  tags: ["always", "validate"]

# ============================================================================
# Docker Volumes
# ============================================================================
- name: Ensure Buzz volumes exist
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ ai_buzz_postgres_volume_name }}"
    - "{{ ai_buzz_minio_volume_name }}"
  tags: ["volumes", "setup"]

# ============================================================================
# Docker Networks
# ============================================================================
- name: Ensure buzz Docker network exists
  community.docker.docker_network:
    name: "{{ ai_buzz_network_name }}"
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ ai_buzz_network_subnet }}"
        gateway: "{{ ai_buzz_network_gateway }}"
  tags: ["network", "setup"]

- name: Ensure traefik Docker network exists
  community.docker.docker_network:
    name: "{{ ai_buzz_traefik_network_name }}"
    state: present
    driver: bridge
  ignore_errors: true
  tags: ["network", "setup"]

# ============================================================================
# PostgreSQL (Buzz event store)
# ============================================================================
- name: Deploy Buzz PostgreSQL container
  community.docker.docker_container:
    name: "{{ ai_buzz_postgres_container_name }}"
    image: "{{ ai_buzz_postgres_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ ai_buzz_network_name }}"
        ipv4_address: "{{ ai_buzz_postgres_ip }}"
    env:
      POSTGRES_DB: "{{ ai_buzz_postgres_db }}"
      POSTGRES_USER: "{{ ai_buzz_postgres_user }}"
      POSTGRES_PASSWORD: "{{ ai_buzz_postgres_password }}"
      TZ: "{{ ai_buzz_tz }}"
      PGTZ: "{{ ai_buzz_tz }}"
    volumes:
      - "{{ ai_buzz_postgres_volume_name }}:/var/lib/postgresql/data:rw"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ ai_buzz_postgres_user }} -d {{ ai_buzz_postgres_db }}"]
      interval: "{{ infra_timeout_short }}"
      timeout: "{{ infra_timeout_healthcheck_short }}"
      retries: "{{ infra_retry_long }}"
      start_period: "{{ infra_timeout_short }}"
    security_opts:
      - no-new-privileges:true
  notify: restart buzz-postgres
  no_log: true
  tags: ["deploy", "database"]

- name: Wait for Buzz PostgreSQL to be healthy
  community.docker.docker_container_info:
    name: "{{ ai_buzz_postgres_container_name }}"
  register: buzz_pg_info
  until: buzz_pg_info.container.State.Health.Status == "healthy"
  retries: "{{ infra_retry_extended }}"
  delay: "{{ infra_delay_short }}"
  tags: ["deploy", "database"]

# ============================================================================
# Redis (Buzz pub/sub)
# ============================================================================
- name: Deploy Buzz Redis container
  community.docker.docker_container:
    name: "{{ ai_buzz_redis_container_name }}"
    image: "{{ ai_buzz_redis_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ ai_buzz_network_name }}"
        ipv4_address: "{{ ai_buzz_redis_ip }}"
    env:
      TZ: "{{ ai_buzz_tz }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: "{{ infra_timeout_healthcheck_short }}"
      timeout: "{{ infra_timeout_connect_short }}"
      retries: "{{ infra_retry_long }}"
      start_period: "{{ infra_timeout_healthcheck_short }}"
    security_opts:
      - no-new-privileges:true
  notify: restart buzz-redis
  tags: ["deploy", "cache"]

# ============================================================================
# MinIO (Buzz S-compatible object storage)
# ============================================================================
- name: Deploy Buzz MinIO container
  community.docker.docker_container:
    name: "{{ ai_buzz_minio_container_name }}"
    image: "{{ ai_buzz_minio_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ ai_buzz_network_name }}"
        ipv4_address: "{{ ai_buzz_minio_ip }}"
    command: "server /data --console-address ':{{ infra_port_ai_buzz_minio_console_container | default(infra_port_storage_rustfs_console_host) }}'"
    env:
      MINIO_ROOT_USER: "{{ ai_buzz_s3_access_key }}"
      MINIO_ROOT_PASSWORD: "{{ ai_buzz_s3_secret_key }}"
      TZ: "{{ ai_buzz_tz }}"
    volumes:
      - "{{ ai_buzz_minio_volume_name }}:/data:rw"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:{{ infra_port_ai_buzz_minio_api_container | default(infra_port_storage_rustfs_s3_host) }}/minio/health/live"]
      interval: "{{ infra_timeout_healthcheck_short }}"
      timeout: "{{ infra_timeout_healthcheck_short }}"
      retries: "{{ infra_retry_long }}"
      start_period: "{{ infra_timeout_short }}"
    security_opts:
      - no-new-privileges:true
  notify: restart buzz-minio
  no_log: true
  tags: ["deploy", "storage"]

- name: Wait for Buzz MinIO to be healthy
  community.docker.docker_container_info:
    name: "{{ ai_buzz_minio_container_name }}"
  register: buzz_minio_info
  until: buzz_minio_info.container.State.Health.Status == "healthy"
  retries: "{{ infra_retry_extended }}"
  delay: "{{ infra_delay_short }}"
  tags: ["deploy", "storage"]

# ============================================================================
# MinIO Bucket Bootstrap
# ============================================================================
- name: Ensure Buzz MinIO bucket exists
  community.docker.docker_container:
    name: buzz-mc-bootstrap
    image: minio/mc:latest
    state: started
    cleanup: true
    detach: false
    networks:
      - name: "{{ ai_buzz_network_name }}"
    env:
      MC_HOST_buzz: "http://{{ ai_buzz_s3_access_key }}:{{ ai_buzz_s3_secret_key }}@{{ ai_buzz_minio_container_name }}:{{ infra_port_ai_buzz_minio_api_container | default(infra_port_storage_rustfs_s3_host) }}"
    command:
      - "mb"
      - "buzz/{{ ai_buzz_minio_bucket }}"
      - "--ignore-existing"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
  register: buzz_bucket_result
  changed_when: false
  no_log: true
  tags: ["deploy", "storage"]

# ============================================================================
# Buzz Relay Container
# ============================================================================
- name: Deploy Buzz relay container
  community.docker.docker_container:
    name: "{{ ai_buzz_container_name }}"
    image: "{{ ai_buzz_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ ai_buzz_network_name }}"
        ipv4_address: "{{ ai_buzz_network_ip }}"
      - name: "{{ ai_buzz_traefik_network_name }}"
        ipv4_address: "{{ ai_buzz_traefik_network_ip }}"
    ports:
      - "{{ ai_buzz_host_port }}:{{ ai_buzz_container_port }}/tcp"
      - "{{ ai_buzz_health_host_port }}:{{ ai_buzz_health_container_port }}/tcp"
      - "{{ ai_buzz_metrics_host_port }}:{{ ai_buzz_metrics_container_port }}/tcp"
    env:
      # Database
      DATABASE_URL: "postgresql://{{ ai_buzz_postgres_user }}:{{ ai_buzz_postgres_password }}@{{ ai_buzz_postgres_container_name }}:{{ infra_port_ai_buzz_postgres_container | default(infra_port_db_postgres_host) }}/{{ ai_buzz_postgres_db }}"
      PGHOST: "{{ ai_buzz_postgres_container_name }}"
      PGPORT: "{{ infra_port_ai_buzz_postgres_container | default(infra_port_db_postgres_host) | string }}"
      PGUSER: "{{ ai_buzz_postgres_user }}"
      PGPASSWORD: "{{ ai_buzz_postgres_password }}"
      PGDATABASE: "{{ ai_buzz_postgres_db }}"
      # Redis
      REDIS_URL: "redis://{{ ai_buzz_redis_container_name }}:{{ infra_port_ai_buzz_redis_container | default('6379') }}"  # project-lint: disable=magic-int  Jinja default port value, should use infra_port variable
      # S3 / MinIO
      BUZZ_S3_ENDPOINT: "http://{{ ai_buzz_minio_container_name }}:{{ infra_port_ai_buzz_minio_api_container | default(infra_port_storage_rustfs_s3_host) }}"
      BUZZ_S3_ACCESS_KEY: "{{ ai_buzz_s3_access_key }}"
      BUZZ_S3_SECRET_KEY: "{{ ai_buzz_s3_secret_key }}"
      # Relay binding and public URL
      BUZZ_BIND_ADDR: "{{ infra_network_bind_all }}:{{ ai_buzz_container_port }}"
      RELAY_URL: "{{ ai_buzz_relay_url }}"
      BUZZ_RELAY_PRIVATE_KEY: "{{ ai_buzz_relay_private_key if (ai_buzz_relay_private_key | length > 0) else omit }}"
      # Health / metrics ports
      BUZZ_HEALTH_PORT: "{{ ai_buzz_health_container_port | string }}"
      BUZZ_METRICS_PORT: "{{ ai_buzz_metrics_container_port | string }}"
      # Operational toggles
      BUZZ_AUTO_MIGRATE: "{{ ai_buzz_auto_migrate | bool | ternary('true', 'false') }}"
      BUZZ_AUDIT_ENABLED: "{{ ai_buzz_audit_enabled | bool | ternary('true', 'false') }}"
      BUZZ_REQUIRE_AUTH_TOKEN: "{{ ai_buzz_require_auth_token | bool | ternary('true', 'false') }}"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "{{ ai_buzz_require_relay_membership | bool | ternary('true', 'false') }}"
      BUZZ_REQUIRE_MEDIA_GET_AUTH: "{{ ai_buzz_require_media_get_auth | bool | ternary('true', 'false') }}"
      BUZZ_ALLOW_NIP_OA_AUTH: "{{ ai_buzz_allow_nip_oa_auth | bool | ternary('true', 'false') }}"
      # General
      TZ: "{{ ai_buzz_tz }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:{{ ai_buzz_health_container_port }}/_liveness"]
      interval: "{{ infra_timeout_default }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_default }}"
      start_period: "{{ infra_timeout_long }}"
    security_opts:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      # HTTP router (redirects to HTTPS)
      traefik.http.routers.buzz-http.rule: "Host(`{{ ai_buzz_domain }}`)"
      traefik.http.routers.buzz-http.entryPoints: "web"
      traefik.http.routers.buzz-http.middlewares: "redirect-to-https-buzz"
      # HTTPS router with security middleware chain (Authelia SSO + GeoBlock + CrowdSec)
      traefik.http.routers.buzz-https.rule: "Host(`{{ ai_buzz_domain }}`)"
      traefik.http.routers.buzz-https.entryPoints: "websecure"
      traefik.http.routers.buzz-https.middlewares: "geoblock,crowdsec-bouncer,authelia"
      traefik.http.routers.buzz-https.tls: "true"
      traefik.http.routers.buzz-https.tls.certresolver: "letsencrypt"
      # Service configuration
      traefik.http.services.buzz.loadbalancer.server.port: "{{ ai_buzz_container_port }}"
      # HTTPS redirect middleware
      traefik.http.middlewares.redirect-to-https-buzz.redirectscheme.scheme: "https"
      traefik.http.middlewares.redirect-to-https-buzz.redirectscheme.permanent: "true"
  notify: restart buzz
  no_log: true
  tags: ["deploy", "buzz"]

- name: Wait for Buzz to be reachable
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ ai_buzz_health_host_port }}"
    delay: "{{ infra_delay_long }}"
    timeout: "{{ infra_timeout_extended }}"
  tags: ["deploy", "buzz"]

# ============================================================================
# Status Report
# ============================================================================
- name: Report Buzz status
  ansible.builtin.debug:
    msg: |
      Buzz deployed successfully:
        - Web UI / Relay: https://{{ ai_buzz_domain }} (SSO via Authelia)
        - Container: {{ ai_buzz_container_name }}
        - Postgres: {{ ai_buzz_postgres_container_name }}
        - Redis: {{ ai_buzz_redis_container_name }}
        - MinIO: {{ ai_buzz_minio_container_name }}
        - Relay URL: {{ ai_buzz_relay_url }}
  tags: ["deploy", "buzz"]
