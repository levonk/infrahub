---
# FreeLLMAPI default variables
# FreeLLMAPI is a free-tier LLM aggregator: aggregates 34+ providers behind a
# single OpenAI-compatible /v1 endpoint with automatic fallover.
# Domain: freellmapi.<base>

# Container configuration
ai_freellmapi_container_name: "{{ infra_hostname_ai_freellmapi | default('localnet-ai-freellmapi') }}"
ai_freellmapi_image_name: "ghcr.io/tashfeenahmed/freellmapi"
# Pinned release — the admin/license FREEAPI_CONFIG_JSON fields require
# upstream >= v0.12.0 (PR #1291). Never track `latest` for this service.
ai_freellmapi_image_tag: "v0.12.0"

# Port configuration (reference infrastructure variables)
ai_freellmapi_host_port: "{{ infra_port_ai_freellmapi_host }}"
ai_freellmapi_container_port: "{{ infra_port_ai_freellmapi_container }}"

# Network configuration (traefik-network for Traefik routing)
ai_freellmapi_network_name: "{{ infra_network_proxy_traefik_network_name | default('traefik-network') }}"

# Domain for Traefik routing
ai_freellmapi_domain: "{{ infra_domain_ai_freellmapi | default('freellmapi.' ~ (infra_domain_base | default('example.com'))) }}"

# Volume (SQLite database with encrypted provider keys)
ai_freellmapi_volume_name: "{{ infra_storage_ai_freellmapi_volume | default('localnet-ai-freellmapi-data-volume') }}"

# Healthcheck — MUST use string with unit suffix, NOT bare integers
ai_freellmapi_healthcheck_interval: "30s"
ai_freellmapi_healthcheck_timeout: "5s"
ai_freellmapi_healthcheck_retries: 3
ai_freellmapi_healthcheck_start_period: "15s"

# Container logging
ai_freellmapi_log_max_size: "10m"
ai_freellmapi_log_max_file: 5

# Health verification wait_for
ai_freellmapi_wait_delay: 10
ai_freellmapi_wait_timeout: 120
ai_freellmapi_localhost: "127.0.0.1"

# Secrets (reference vault with safe default)
ai_freellmapi_encryption_key: "{{ vault_ai_freellmapi_encryption_key | default('') }}"

# Trust Traefik as a single reverse proxy hop (for X-Forwarded-For/Proto)
ai_freellmapi_trust_proxy: "1"

# Verify health after deploy
ai_freellmapi_verify_health: true

# --- Declarative provisioning (native since upstream v0.12.0) ----------------
# `admin` and `license` are first-class FREEAPI_CONFIG_JSON fields. The server
# creates the first dashboard account inside the boot-time config apply, which
# runs before app.listen() and before the userCount() === 0 check that mints a
# setup code — so a configured admin closes the unauthenticated setup window
# entirely (/api/auth/setup answers 409 from request one). Once a user exists
# the admin block degrades to a warning; config can never take over a claimed
# install. Leave both empty to keep the manual browser setup flow.
ai_freellmapi_admin_email: "{{ vault_ai_freellmapi_admin_email | default('') }}"
ai_freellmapi_admin_password: "{{ vault_ai_freellmapi_admin_password | default('') }}"

# Optional freellmapi.co Premium license key — validated via the same
# /v1/license/activate endpoint the dashboard uses and activated detached, so
# an unreachable license service never delays boot. An identical stored key
# short-circuits; a changed key re-activates (rotation).
ai_freellmapi_license_key: "{{ vault_ai_freellmapi_license_key | default('') }}"

# Optional declarative startup config — rendered to FREEAPI_CONFIG_JSON and
# applied idempotently by the server on every boot. Shape (upstream docs):
#   keys:            [{platform, key, label, enabled}, ...]
#   customProviders: [{baseUrl, apiKey, label, models}, ...]
#   models:          [{platform, modelId, ...}, ...]
#   fallback:        [{platform, modelId, priority, enabled}, ...]
#   routing:         {strategy: priority|balanced|smartest|fastest|reliable|custom}
#   admin:           {email, password}   # overlaid below from vault vars
#   license:         "<key>"             # overlaid below from vault vars
# NOTE: the JSON is stored in the container env, visible via `docker inspect`
# to host root — the same exposure class as ENCRYPTION_KEY.
ai_freellmapi_declarative_config: "{{ vault_ai_freellmapi_config | default({}) }}"

# Effective FREEAPI_CONFIG_JSON: the vault config dict overlaid with the
# admin/license fields (only when provided — empty strings never reach the
# JSON). Admin is included only when BOTH email and password are set.
ai_freellmapi_config_effective: >-
  {{ ai_freellmapi_declarative_config
     | combine({'admin': {'email': ai_freellmapi_admin_email, 'password': ai_freellmapi_admin_password}}
               if (ai_freellmapi_admin_email | length > 0 and ai_freellmapi_admin_password | length > 0)
               else {})
     | combine({'license': ai_freellmapi_license_key}
               if ai_freellmapi_license_key | length > 0
               else {}) }}
