---
# Imagination Studio handlers

- name: restart imagination-studio
  ansible.builtin.systemd:
    name: "{{ ai_studio_service_name }}"
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ ai_studio_run_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ ai_studio_xdg_runtime_dir }}"
  when: ai_studio_enabled | bool
