---
# n8n Deployment
# Self-hosted workflow automation (standalone mode + observability stack)
# Containers: n8n, postgres, prometheus, grafana

# 1. Validate required variables
- name: Validate required n8n variables are defined
  ansible.builtin.assert:
    that:
      - n8n_container_name is defined
      - n8n_image is defined
      - n8n_host_port is defined
      - n8n_encryption_key is defined
      - n8n_encryption_key | length > 0
      - n8n_postgres_admin_password is defined
      - n8n_postgres_admin_password | length > 0
      - n8n_postgres_user_password is defined
      - n8n_postgres_user_password | length > 0
      - n8n_grafana_admin_password is defined
      - n8n_grafana_admin_password | length > 0
    fail_msg: "Missing required n8n variables or vault secrets are empty."
    success_msg: "All required n8n variables are defined."
  tags: ["always", "validate"]

# 2. Config directory
- name: Ensure n8n config directory exists
  ansible.builtin.file:
    path: "{{ n8n_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ infra_mode_dir }}"
  tags: ["deploy", "config"]

- name: Ensure n8n provisioning subdirectories exist
  ansible.builtin.file:
    path: "{{ n8n_config_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ infra_mode_dir }}"
  loop:
    - prometheus
    - grafana/provisioning/datasources
    - grafana/provisioning/dashboards
    - grafana/dashboards
    - postgres
  tags: ["deploy", "config"]

# 3. Render config files
- name: Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ n8n_config_dir }}/prometheus/prometheus.yml"
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  notify: restart n8n-prometheus
  tags: ["deploy", "config", "observability"]

- name: Render Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ n8n_config_dir }}/grafana/provisioning/datasources/prometheus.yml"
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  notify: restart n8n-grafana
  tags: ["deploy", "config", "observability"]

- name: Render Grafana dashboard provider provisioning
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ n8n_config_dir }}/grafana/provisioning/dashboards/n8n.yml"
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  notify: restart n8n-grafana
  tags: ["deploy", "config", "observability"]

- name: Render PostgreSQL init script
  ansible.builtin.template:
    src: init-data.sh.j2
    dest: "{{ n8n_config_dir }}/postgres/init-data.sh"
    owner: root
    group: root
    mode: "{{ infra_mode_dir }}"
  tags: ["deploy", "config", "database"]

- name: Copy n8n Grafana dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ n8n_config_dir }}/grafana/dashboards/"
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  notify: restart n8n-grafana
  tags: ["deploy", "config", "observability"]

# 4. Volumes
- name: Ensure n8n volumes exist
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ n8n_volume_name }}"
    - "{{ n8n_postgres_volume_name }}"
    - "{{ n8n_prometheus_volume_name }}"
    - "{{ n8n_grafana_volume_name }}"
  tags: ["deploy", "volumes"]

# 5. Network
- name: Ensure n8n network exists
  community.docker.docker_network:
    name: "{{ n8n_network_name }}"
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ n8n_network_subnet }}"
        gateway: "{{ n8n_network_gateway }}"
  tags: ["deploy", "network"]

# 6. Pull images
- name: Pull n8n images
  community.docker.docker_image:
    name: "{{ item.name }}"
    tag: "{{ item.tag }}"
    source: pull
    state: present
  loop:
    - name: "{{ n8n_image }}"
      tag: "{{ n8n_image_tag }}"
    - name: "{{ n8n_postgres_image }}"
      tag: "16-alpine"
    - name: "{{ n8n_prometheus_image }}"
      tag: "{{ n8n_prometheus_image_tag }}"
    - name: "{{ n8n_grafana_image }}"
      tag: "{{ n8n_grafana_image_tag }}"
  tags: ["deploy", "images"]

# 7. Deploy PostgreSQL
- name: Deploy n8n PostgreSQL container
  community.docker.docker_container:
    name: "{{ n8n_postgres_container_name }}"
    image: "{{ n8n_postgres_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ n8n_network_name }}"
        ipv4_address: "{{ n8n_postgres_network_ip }}"
    env:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "{{ n8n_postgres_admin_password }}"
      POSTGRES_DB: "{{ n8n_postgres_db }}"
      POSTGRES_NON_ROOT_USER: "{{ n8n_postgres_user }}"
      POSTGRES_NON_ROOT_PASSWORD: "{{ n8n_postgres_user_password }}"
      TZ: "{{ n8n_tz }}"
      PGTZ: "{{ n8n_tz }}"
    volumes:
      - "{{ n8n_postgres_volume_name }}:/var/lib/postgresql/data:rw"
      - "{{ n8n_config_dir }}/postgres/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh:ro"
    published_ports:
      - "{{ n8n_postgres_host_port }}:{{ n8n_postgres_container_port }}/tcp"
    log_driver: json-file
    log_options:
      max-size: "{{ n8n_log_max_size }}"
      max-file: "{{ n8n_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d {{ n8n_postgres_db }}"]
      interval: "{{ n8n_postgres_healthcheck_interval }}"
      timeout: "{{ n8n_postgres_healthcheck_timeout }}"
      retries: "{{ n8n_postgres_healthcheck_retries }}"
      start_period: "{{ n8n_postgres_healthcheck_start_period }}"
    security_opts:
      - no-new-privileges:true
  notify: restart n8n-postgres
  no_log: true
  tags: ["deploy", "database"]

# 8. Wait for PostgreSQL to be healthy
- name: Wait for n8n PostgreSQL to be healthy
  community.docker.docker_container_info:
    name: "{{ n8n_postgres_container_name }}"
  register: n8n_postgres_info
  retries: "{{ infra_retry_extended }}"
  delay: "{{ infra_delay_default }}"
  until: n8n_postgres_info.container.State.Health.Status | default('') == "healthy"
  tags: ["deploy", "database"]

# 9. Deploy n8n main container
- name: Deploy n8n container
  community.docker.docker_container:
    name: "{{ n8n_container_name }}"
    image: "{{ n8n_image }}:{{ n8n_image_tag }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ n8n_network_name }}"
        ipv4_address: "{{ n8n_network_ip }}"
      - name: "{{ n8n_traefik_network_name }}"
        ipv4_address: "{{ n8n_traefik_network_ip }}"
    env:
      # Database
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "{{ n8n_postgres_container_name }}"
      DB_POSTGRESDB_PORT: "{{ n8n_postgres_container_port }}"
      DB_POSTGRESDB_DATABASE: "{{ n8n_postgres_db }}"
      DB_POSTGRESDB_USER: "{{ n8n_postgres_user }}"
      DB_POSTGRESDB_PASSWORD: "{{ n8n_postgres_user_password }}"
      # Encryption
      N8N_ENCRYPTION_KEY: "{{ n8n_encryption_key }}"
      # Host/URL
      N8N_HOST: "{{ n8n_domain }}"
      N8N_PORT: "{{ n8n_container_port }}"
      N8N_PROTOCOL: "{{ n8n_protocol }}"
      N8N_WEBHOOK_URL: "{{ n8n_protocol }}://{{ n8n_domain }}/"
      N8N_PROXY_HOPS: "{{ n8n_proxy_hops | string }}"
      # Timezone
      GENERIC_TIMEZONE: "{{ n8n_tz }}"
      TZ: "{{ n8n_tz }}"
      # Production
      NODE_ENV: "{{ n8n_node_env }}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "true"
      # Metrics (for Prometheus scraping)
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_WEBHOOK_METRICS: "true"
      N8N_METRICS_INCLUDE_FORM_METRICS: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_INFO: "true"
    published_ports:
      - "{{ n8n_host_port }}:{{ n8n_container_port }}/tcp"
    volumes:
      - "{{ n8n_volume_name }}:/home/node/.n8n:rw"
    log_driver: json-file
    log_options:
      max-size: "{{ n8n_log_max_size }}"
      max-file: "{{ n8n_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:{{ n8n_container_port }}/healthz || exit 1"]
      interval: "{{ n8n_healthcheck_interval }}"
      timeout: "{{ n8n_healthcheck_timeout }}"
      retries: "{{ n8n_healthcheck_retries }}"
      start_period: "{{ n8n_healthcheck_start_period }}"
    security_opts:
      - no-new-privileges:true
  notify: restart n8n
  no_log: true
  tags: ["deploy", "container"]

# 10. Deploy Prometheus
- name: Deploy n8n Prometheus container
  community.docker.docker_container:
    name: "{{ n8n_prometheus_container_name }}"
    image: "{{ n8n_prometheus_image }}:{{ n8n_prometheus_image_tag }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ n8n_network_name }}"
        ipv4_address: "{{ n8n_prometheus_network_ip }}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    published_ports:
      - "{{ n8n_prometheus_host_port }}:{{ n8n_prometheus_container_port }}/tcp"
    volumes:
      - "{{ n8n_config_dir }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "{{ n8n_prometheus_volume_name }}:/prometheus:rw"
    log_driver: json-file
    log_options:
      max-size: "{{ n8n_log_max_size }}"
      max-file: "{{ n8n_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:{{ n8n_prometheus_container_port }}/-/healthy || exit 1"]
      interval: "{{ n8n_prometheus_healthcheck_interval }}"
      timeout: "{{ n8n_prometheus_healthcheck_timeout }}"
      retries: "{{ n8n_prometheus_healthcheck_retries }}"
      start_period: "{{ n8n_prometheus_healthcheck_start_period }}"
    security_opts:
      - no-new-privileges:true
  notify: restart n8n-prometheus
  tags: ["deploy", "observability"]

# 11. Deploy Grafana
- name: Deploy n8n Grafana container
  community.docker.docker_container:
    name: "{{ n8n_grafana_container_name }}"
    image: "{{ n8n_grafana_image }}:{{ n8n_grafana_image_tag }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ n8n_network_name }}"
        ipv4_address: "{{ n8n_grafana_network_ip }}"
      - name: "{{ n8n_traefik_network_name }}"
        ipv4_address: "{{ n8n_grafana_traefik_network_ip }}"
    env:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "{{ n8n_grafana_admin_password }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "{{ infra_timeout_one_second }}"
      TZ: "{{ n8n_tz }}"
    published_ports:
      - "{{ n8n_grafana_host_port }}:{{ n8n_grafana_container_port }}/tcp"
    volumes:
      - "{{ n8n_grafana_volume_name }}:/var/lib/grafana:rw"
      - "{{ n8n_config_dir }}/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "{{ n8n_config_dir }}/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    log_driver: json-file
    log_options:
      max-size: "{{ n8n_log_max_size }}"
      max-file: "{{ n8n_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:{{ n8n_grafana_container_port }}/api/health || exit 1"]
      interval: "{{ n8n_grafana_healthcheck_interval }}"
      timeout: "{{ n8n_grafana_healthcheck_timeout }}"
      retries: "{{ n8n_grafana_healthcheck_retries }}"
      start_period: "{{ n8n_grafana_healthcheck_start_period }}"
    security_opts:
      - no-new-privileges:true
  notify: restart n8n-grafana
  no_log: true
  tags: ["deploy", "observability"]

# 12. Wait for n8n to be healthy
- name: Wait for n8n to be healthy
  community.docker.docker_container_info:
    name: "{{ n8n_container_name }}"
  register: n8n_container_info
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_long }}"
  until: n8n_container_info.container.State.Health.Status | default('') == "healthy"
  tags: ["deploy", "container"]

# 13. Status report
- name: Get n8n container status
  community.docker.docker_container_info:
    name: "{{ n8n_container_name }}"
  register: n8n_status
  ignore_errors: true

- name: Get n8n Grafana container status
  community.docker.docker_container_info:
    name: "{{ n8n_grafana_container_name }}"
  register: n8n_grafana_status
  ignore_errors: true

- name: Report n8n deployment status
  ansible.builtin.debug:
    msg: |
      n8n deployed:
        - App URL: https://{{ n8n_domain }}
        - Grafana URL: https://{{ n8n_grafana_domain }}
        - Prometheus: http://localhost:{{ n8n_prometheus_host_port }}
        - n8n Container: {{ n8n_container_name }} — Status: {{ n8n_status.container.State.Status | default('unknown') }}
        - Grafana Container: {{ n8n_grafana_container_name }} — Status: {{ n8n_grafana_status.container.State.Status | default('unknown') }}
  tags: ["always", "info"]
