---
# Paperclip AI Orchestration default variables
# Paperclip is an open-source orchestration platform for teams of AI agents.
# Node.js server + React UI that orchestrates a team of AI agents.
# Domain: paperclip.levonk.com
# Upstream: https://github.com/paperclipai/paperclip (MIT license)

# Service configuration
ai_paperclip_enabled: true
ai_paperclip_container_name: "{{ infra_hostname_paperclip | default('paperclip') }}"

# Image — locally-built from shared/active/03-container/services/ai-codeassist/paperclip/Dockerfile
# Registered in scripts/build-and-push-images.sh as localnet-ai-paperclip
# Pushed to the local Docker registry at 100.90.22.85:5000
ai_paperclip_image: "100.90.22.85:5000/localnet-ai-paperclip"
ai_paperclip_image_tag: "latest"

# Port configuration
ai_paperclip_host_port: "{{ infra_port_ai_paperclip_host | default('3100') }}"
ai_paperclip_container_port: "{{ infra_port_ai_paperclip_container | default('3100') }}"

# Domain for Traefik routing
ai_paperclip_domain: "{{ infra_domain_ai_paperclip | default('paperclip.levonk.com') }}"

# Network configuration
ai_paperclip_traefik_network_name: "{{ infra_network_proxy_traefik_network_name | default('traefik-network') }}"
ai_paperclip_traefik_network_ip: "{{ infra_network_ip_paperclip_traefik | default('172.31.0.21') }}"
ai_paperclip_localnet_network_name: "{{ localnet_network_name | default('cloud-server') }}"

# PostgreSQL configuration (external container, not embedded)
ai_paperclip_postgres_container_name: "{{ infra_hostname_paperclip_postgres | default('paperclip-postgres') }}"
ai_paperclip_postgres_image: "postgres:16-alpine"
ai_paperclip_postgres_host_port: "{{ infra_port_ai_paperclip_postgres_host | default('5436') }}"
ai_paperclip_postgres_container_port: "{{ infra_port_ai_paperclip_postgres_container | default('5432') }}"
ai_paperclip_postgres_db: "paperclip"
ai_paperclip_postgres_user: "paperclip"
ai_paperclip_postgres_password: "{{ vault_paperclip_postgres_password | default('changeme') }}"

# Volume names
ai_paperclip_volume_name: "{{ infra_storage_paperclip_volume | default('localnet-paperclip-data-volume') }}"
ai_paperclip_postgres_volume_name: "{{ infra_storage_paperclip_postgres_volume | default('localnet-paperclip-postgres-data-volume') }}"

# Health check configuration (Paperclip exposes /health endpoint)
ai_paperclip_health_endpoint: "/health"
ai_paperclip_health_interval: "30s"
ai_paperclip_health_timeout: "10s"
ai_paperclip_health_start_period: "40s"
ai_paperclip_health_retries: 3

# User/Group IDs
ai_paperclip_puid: "{{ localnet_puid | default(cuser_uid | default(1000)) | string }}"
ai_paperclip_pgid: "{{ localnet_pgid | default(cuser_gid | default(1000)) | string }}"
ai_paperclip_tz: "{{ localnet_tz | default(timezone | default('UTC')) }}"

# Logging
ai_paperclip_log_max_size: "10m"
ai_paperclip_log_max_file: "5"
