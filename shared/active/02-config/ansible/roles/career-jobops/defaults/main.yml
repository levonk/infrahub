---
# JobOps default variables
# Upstream GHCR image — no build pipeline needed

# Container configuration
jobops_container_name: "localnet-jobops"
jobops_image_name: "ghcr.io/dakheera47/job-ops"
jobops_image_tag: "latest"

# Ports (reference infrastructure variables)
jobops_host_port: "{{ infra_port_career_jobops_host | default('3005') }}"
jobops_container_port: "{{ infra_port_career_jobops_container | default('3001') }}"

# Domain (reference infrastructure variables)
jobops_domain: "{{ infra_domain_career_jobops | default('jobops.levonk.com') }}"

# Volumes
jobops_data_volume: "{{ infra_storage_jobops_data_volume | default('localnet-jobops-data-volume') }}"
jobops_codex_volume: "{{ infra_storage_jobops_codex_volume | default('localnet-jobops-codex-volume') }}"

# Healthcheck — MUST use string with unit suffix, NOT bare integers
jobops_healthcheck_interval: "30s"
jobops_healthcheck_timeout: "10s"
jobops_healthcheck_retries: 3
jobops_healthcheck_start_period: "30s"

# Enable flag
jobops_enabled: true

# Docker connection string for the Windows host (SSH-tunneled)
# community.docker modules can't run directly on Windows (Ansible core basic.py
# imports grp, Unix-only). We delegate_to: localhost and connect to the Windows
# Docker daemon via ssh://. Requires SSH config entry for the Windows host.
jobops_docker_host: "ssh://ansible@{{ windows_tailscale_hostname | default('dtop202311') }}.{{ infra_tailscale_tailnet | default('tale-grouper.ts.net') }}"
