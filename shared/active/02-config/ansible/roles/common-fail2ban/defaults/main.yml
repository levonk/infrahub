---
# defaults file for common-fail2ban
# Neutral, overridable defaults. No localnet-specific paths.

# ---------------------------------------------------------------------------
# Ban Settings
# ---------------------------------------------------------------------------
fail2ban_bantime: "{{ cloud_server_fail2ban_bantime | default(infra_timeout_fail2ban_ban) }}"
fail2ban_maxretry: "{{ cloud_server_fail2ban_maxretry | default(infra_retry_default) }}"
fail2ban_findtime: "{{ cloud_server_fail2ban_findtime | default(infra_timeout_request) }}"

# ---------------------------------------------------------------------------
# Ignore IP List
# ---------------------------------------------------------------------------
fail2ban_ignoreip: "{{ cloud_server_fail2ban_ignoreip | default(['{{ infra_network_localhost_cidr }}', '::1']) }}"

# ---------------------------------------------------------------------------
# SSH Jail Settings
# ---------------------------------------------------------------------------
fail2ban_sshd_port: "{{ cloud_server_ssh_host_port | default(infra_port_ssh_host) }}"
fail2ban_backend: "systemd"

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
fail2ban_service_name: "fail2ban"
