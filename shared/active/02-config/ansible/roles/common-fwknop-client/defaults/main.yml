---
# Default variables for common-fwknop-client role
# Installs the fwknop SPA client and deploys ~/.fwknoprc + ~/.ssh/config.d/infrahub

# Whether to install and configure the fwknop client
fwknop_client_enabled: true

# SPA server connection details (sourced from infrastructure variables)
fwknop_client_spa_server: "{{ infra_domain_fwknop_spa_server | default('oci.mach.' ~ (infra_domain_base | default('example.com'))) }}"
fwknop_client_spa_port: "{{ infra_port_security_fwknop_spa_host | default(infra_port_fwknop_spa_host) }}"
# Internal SSH port — Tailscale path (ssh oci)
fwknop_client_ssh_port: "{{ infra_port_ssh_host | default(infra_port_ssh_host) }}"
# Public SSH port — SPA-protected path (ssh ocispa)
fwknop_client_public_ssh_port: "{{ infra_port_ssh_public_host | default(infra_port_ssh_public_host) }}"

# ---------------------------------------------------------------------------
# Per-client key selection (from Ansible vault)
# ---------------------------------------------------------------------------
# Each client uses ONLY its own key. The key is selected by inventory_hostname.
# To add a client: add its keys to the vault + add a mapping here.
fwknop_client_key_map:
  kckinai:
    spa_key: "{{ vault_fwknop_spa_key_kckinai | default('') }}"
    hmac_key: "{{ vault_fwknop_hmac_key_kckinai | default('') }}"
  lzkmbp2016:
    spa_key: "{{ vault_fwknop_spa_key_lzkmbp2016 | default('') }}"
    hmac_key: "{{ vault_fwknop_hmac_key_lzkmbp2016 | default('') }}"
  lzkmbp2018:
    spa_key: "{{ vault_fwknop_spa_key_lzkmbp2018 | default('') }}"
    hmac_key: "{{ vault_fwknop_hmac_key_lzkmbp2018 | default('') }}"
  oci-cloud-server:
    spa_key: "{{ vault_fwknop_spa_key_oci_cloud_server | default('') }}"
    hmac_key: "{{ vault_fwknop_hmac_key_oci_cloud_server | default('') }}"

# Resolved key for this host (looked up by inventory_hostname)
fwknop_client_spa_key: "{{ (fwknop_client_key_map[inventory_hostname] | default({})).spa_key | default('') }}"
fwknop_client_hmac_key: "{{ (fwknop_client_key_map[inventory_hostname] | default({})).hmac_key | default('') }}"

# SSH key path for OCI cloud server
fwknop_client_ssh_key: "~/.ssh/lzkmbp2016-micro-oracle"

# Tailscale IP for the OCI cloud server (for the no-knock SSH path)
fwknop_client_tailscale_ip: "100.90.22.85"

# Package names by OS family
# Debian/Ubuntu: fwknop-client
# EL (Oracle/RHEL/CentOS): fwknop (from EPEL, includes client)
fwknop_client_package_name: >-
  {{
    'fwknop-client'
    if ansible_facts['os_family'] == 'Debian'
    else 'fwknop'
  }}

# Whether to deploy the SSH config.d/infrahub file
fwknop_client_deploy_ssh_config: true
