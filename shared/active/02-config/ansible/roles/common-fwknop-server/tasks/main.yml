---
# tasks file for common-fwknop-server
# fwknop SPA (Single Packet Authorization) — hides SSH from port scanners.
# Host-level security service: package install + config templates + firewall + systemd.
# Supports both Debian/Ubuntu (UFW) and EL/Oracle Linux (iptables).
# See internal-docs/research/service/fwknop/research.md for architecture.

# ---------------------------------------------------------------------------
# Pre-Condition: Verify keys are available
# ---------------------------------------------------------------------------
- name: "FWKNOP | Verify per-client SPA and HMAC keys are defined"
  ansible.builtin.assert:
    that:
      - fwknop_clients | length > 0
    fail_msg: >-
      CRITICAL: fwknop_clients list is empty.
      Define at least one client with spa_key and hmac_key in fwknop_clients.
    success_msg: "fwknop_clients defined ({{ fwknop_clients | length }} clients)."
  no_log: true
  tags: ["always", "validate"]

- name: "FWKNOP | Verify each client has non-empty keys"
  ansible.builtin.assert:
    that:
      - item.spa_key | default('') | length > 0
      - item.hmac_key | default('') | length > 0
    fail_msg: >-
      CRITICAL: Client '{{ item.name }}' has empty or missing spa_key/hmac_key.
      Ensure vault_fwknop_spa_key_{{ item.name }} and vault_fwknop_hmac_key_{{ item.name }} are in the vault.
    success_msg: "Client '{{ item.name }}' keys are defined."
  no_log: true
  loop: "{{ fwknop_clients }}"
  tags: ["always", "validate"]

# ---------------------------------------------------------------------------
# Install fwknop
# ---------------------------------------------------------------------------
- name: "FWKNOP | Install fwknop (Debian/Ubuntu)"
  ansible.builtin.package:
    name: "{{ fwknop_package_name }}"
    state: present
  become: true
  when: ansible_os_family == 'Debian'

- name: "FWKNOP | Install fwknop from EPEL (EL)"
  ansible.builtin.dnf:
    name: "{{ fwknop_package_name }}"
    state: present
    enablerepo: epel
  become: true
  when: ansible_os_family == 'RedHat'

# ---------------------------------------------------------------------------
# Deploy configuration files
# ---------------------------------------------------------------------------
- name: "FWKNOP | Deploy fwknopd.conf"
  ansible.builtin.template:
    src: fwknopd.conf.j2
    dest: /etc/fwknop/fwknopd.conf
    owner: root
    group: root
    mode: "{{ infra_mode_file_restricted }}"
  become: true
  notify: restart fwknop

- name: "FWKNOP | Deploy access.conf"
  ansible.builtin.template:
    src: access.conf.j2
    dest: /etc/fwknop/access.conf
    owner: root
    group: root
    mode: "{{ infra_mode_file_restricted }}"
  become: true
  no_log: true
  notify: restart fwknop

# ---------------------------------------------------------------------------
# Firewall rules — UFW (Debian/Ubuntu)
# ---------------------------------------------------------------------------
- name: "FWKNOP | Allow SPA UDP port through UFW (Debian/Ubuntu)"
  community.general.ufw:
    rule: allow
    port: "{{ fwknop_spa_port }}"
    proto: udp
  become: true
  when:
    - fwknop_firewall_type == 'ufw'
    - fwknop_enabled | bool

- name: "FWKNOP | Allow SSH on Tailscale interface via UFW (Debian/Ubuntu)"
  community.general.ufw:
    rule: allow
    interface: "{{ fwknop_tailscale_interface }}"
    direction: in
    port: "{{ fwknop_internal_ssh_port }}"
    proto: tcp
  become: true
  when:
    - fwknop_firewall_type == 'ufw'
    - fwknop_allow_tailscale_ssh | bool
    - fwknop_enabled | bool

- name: "FWKNOP | Remove public SSH UFW rule for internal port (Debian/Ubuntu)"
  community.general.ufw:
    rule: allow
    port: "{{ fwknop_internal_ssh_port }}"
    proto: tcp
    delete: true
  become: true
  when:
    - fwknop_firewall_type == 'ufw'
    - fwknop_enabled | bool
  notify: restart fwknop

- name: "FWKNOP | Remove public SSH UFW rule for public port (Debian/Ubuntu)"
  community.general.ufw:
    rule: allow
    port: "{{ fwknop_ssh_port }}"
    proto: tcp
    delete: true
  become: true
  when:
    - fwknop_firewall_type == 'ufw'
    - fwknop_close_public_ssh | bool
    - fwknop_enabled | bool
  notify: restart fwknop

# ---------------------------------------------------------------------------
# Firewall rules — iptables (EL / Oracle Linux)
# The OCI server uses raw iptables with default ACCEPT policy.
# To close port 22 publicly, we add a DROP rule for non-Tailscale traffic.
# fwknopd inserts temporary ACCEPT rules above this DROP when SPA validates.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Firewall rules — firewalld (EL / Oracle Linux)
# On EL9, firewalld manages the nftables filter table. Any iptables-nft
# rules get wiped on firewalld reload. When firewalld is active, we use
# firewalld rich rules and ports instead of raw iptables so rules persist.
# When firewalld is not active, we fall back to raw iptables.
# ---------------------------------------------------------------------------
- name: "FWKNOP | Check if firewalld is active (EL)"
  ansible.builtin.command: firewall-cmd --state
  register: fwknop_firewalld_state
  changed_when: false
  failed_when: false
  become: true
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool

# --- firewalld path (when firewalld is active) ---

- name: "FWKNOP | Allow SPA UDP port in firewalld (EL)"
  ansible.builtin.command: firewall-cmd --permanent --add-port={{ fwknop_spa_port }}/udp
  become: true
  register: fwknop_firewalld_spa_port
  changed_when: "'success' in fwknop_firewalld_spa_port.stdout | lower"
  failed_when: false
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc == 0

- name: "FWKNOP | Allow public SSH port in firewalld (EL)"
  ansible.builtin.command: firewall-cmd --permanent --add-port={{ fwknop_ssh_port }}/tcp
  become: true
  register: fwknop_firewalld_ssh_port
  changed_when: "'success' in fwknop_firewalld_ssh_port.stdout | lower"
  failed_when: false
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc == 0

- name: "FWKNOP | Allow internal SSH from Tailscale subnet via firewalld rich rule (EL)"
  ansible.builtin.command: >
    firewall-cmd --permanent
    --add-rich-rule='rule family="ipv4" source address="{{ fwknop_tailscale_subnet }}" port port="{{ fwknop_internal_ssh_port }}" protocol="tcp" accept'
  become: true
  register: fwknop_firewalld_tailscale_rich
  changed_when: "'success' in fwknop_firewalld_tailscale_rich.stdout | lower"
  failed_when: false
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_allow_tailscale_ssh | bool
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc == 0

- name: "FWKNOP | Allow internal SSH from libvirt subnets via firewalld rich rules (EL)"
  ansible.builtin.command: >
    firewall-cmd --permanent
    --add-rich-rule='rule family="ipv4" source address="{{ item }}" port port="{{ fwknop_internal_ssh_port }}" protocol="tcp" accept'
  become: true
  register: fwknop_firewalld_libvirt_rich
  changed_when: "'success' in fwknop_firewalld_libvirt_rich.stdout | lower"
  failed_when: false
  loop: "{{ fwknop_libvirt_subnets }}"
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc == 0

- name: "FWKNOP | Drop public access to internal SSH port via firewalld rich rule (EL)"
  ansible.builtin.command: >
    firewall-cmd --permanent
    --add-rich-rule='rule family="ipv4" port port="{{ fwknop_internal_ssh_port }}" protocol="tcp" drop'
  become: true
  register: fwknop_firewalld_drop_internal_rich
  changed_when: "'success' in fwknop_firewalld_drop_internal_rich.stdout | lower"
  failed_when: false
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc == 0

- name: "FWKNOP | Drop public SSH via firewalld direct rule — close public port (EL)"
  ansible.builtin.command: >
    firewall-cmd --permanent --direct --add-rule ipv4 filter INPUT 2 -p tcp --dport {{ fwknop_ssh_port }} -j DROP
  become: true
  register: fwknop_firewalld_drop_public_direct
  changed_when: "'success' in fwknop_firewalld_drop_public_direct.stdout | lower"
  failed_when: false
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_close_public_ssh | bool
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc == 0

- name: "FWKNOP | Remove firewalld direct DROP for public SSH when SPA not closing (EL)"
  ansible.builtin.command: >
    firewall-cmd --permanent --direct --remove-rule ipv4 filter INPUT 2 -p tcp --dport {{ fwknop_ssh_port }} -j DROP
  become: true
  register: fwknop_firewalld_remove_drop_public_direct
  changed_when: "'success' in fwknop_firewalld_remove_drop_public_direct.stdout | lower"
  failed_when: false
  when:
    - fwknop_firewall_type == 'iptables'
    - not (fwknop_close_public_ssh | bool)
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc == 0

- name: "FWKNOP | Reload firewalld to apply all changes (EL)"
  ansible.builtin.command: firewall-cmd --reload
  become: true
  changed_when: true
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc == 0
    - >
      (fwknop_firewalld_spa_port.changed | default(false))
      or (fwknop_firewalld_ssh_port.changed | default(false))
      or (fwknop_firewalld_tailscale_rich.changed | default(false))
      or (fwknop_firewalld_libvirt_rich.changed | default(false))
      or (fwknop_firewalld_drop_internal_rich.changed | default(false))
      or (fwknop_firewalld_drop_public_direct.changed | default(false))
      or (fwknop_firewalld_remove_drop_public_direct.changed | default(false))

# --- iptables fallback path (when firewalld is NOT active) ---

- name: "FWKNOP | Allow SPA UDP port in iptables (EL, no firewalld)"
  ansible.builtin.iptables:
    chain: INPUT
    protocol: udp
    destination_port: "{{ fwknop_spa_port }}"
    jump: ACCEPT
    comment: "fwknop SPA UDP port"
  become: true
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc != 0

- name: "FWKNOP | Allow SSH from Tailscale subnet in iptables (EL, no firewalld)"
  ansible.builtin.iptables:
    chain: INPUT
    source: "{{ fwknop_tailscale_subnet }}"
    protocol: tcp
    destination_port: "{{ fwknop_internal_ssh_port }}"
    jump: ACCEPT
    comment: "fwknop Tailscale SSH (no knock needed)"
  become: true
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_allow_tailscale_ssh | bool
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc != 0

- name: "FWKNOP | Allow SSH from libvirt subnets in iptables (EL, no firewalld)"
  ansible.builtin.iptables:
    chain: INPUT
    source: "{{ item }}"
    protocol: tcp
    destination_port: "{{ fwknop_internal_ssh_port }}"
    jump: ACCEPT
    comment: "fwknop libvirt SSH (isolation VMs)"
  become: true
  loop: "{{ fwknop_libvirt_subnets }}"
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc != 0

- name: "FWKNOP | Drop public access to internal SSH port in iptables (EL, no firewalld)"
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ fwknop_internal_ssh_port }}"
    jump: DROP
    comment: "fwknop internal SSH port (Tailscale/libvirt only)"
  become: true
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc != 0

- name: "FWKNOP | Drop public SSH in iptables — close public port (EL, no firewalld)"
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ fwknop_ssh_port }}"
    jump: DROP
    comment: "fwknop public SSH closed (SPA required)"
  become: true
  when:
    - fwknop_firewall_type == 'iptables'
    - fwknop_close_public_ssh | bool
    - fwknop_enabled | bool
    - fwknop_firewalld_state.rc != 0

# ---------------------------------------------------------------------------
# Ensure fwknop service is running and enabled
# ---------------------------------------------------------------------------
- name: "FWKNOP | Ensure fwknop service is started and enabled"
  ansible.builtin.systemd:
    name: "{{ fwknop_service_name }}"
    state: started
    enabled: true
  become: true

- name: "FWKNOP | Restart fwknop service to apply configuration changes"
  ansible.builtin.systemd:
    name: "{{ fwknop_service_name }}"
    state: restarted
  become: true
  when: not ansible_check_mode
  changed_when: false

# ---------------------------------------------------------------------------
# Verify fwknop service status
# ---------------------------------------------------------------------------
- name: "FWKNOP | Check fwknop service status"
  ansible.builtin.systemd:
    name: "{{ fwknop_service_name }}"
  register: fwknop_service_status
  become: true
  changed_when: false

- name: "FWKNOP | Assert fwknop service is active"
  ansible.builtin.assert:
    that:
      - fwknop_service_status.status.ActiveState == "active"
    fail_msg: "fwknop service ({{ fwknop_service_name }}) is not active"
    success_msg: "fwknop service ({{ fwknop_service_name }}) is active"

# ---------------------------------------------------------------------------
# Verify SPA port is listening
# ---------------------------------------------------------------------------
- name: "FWKNOP | Check SPA UDP port is listening"
  ansible.builtin.command:
    cmd: "ss -ulnp | grep :{{ fwknop_spa_port }}"
  register: fwknop_spa_port_check
  changed_when: false
  failed_when: false
  become: true

- name: "FWKNOP | Report SPA port status"
  ansible.builtin.debug:
    msg: >-
      SPA UDP port {{ fwknop_spa_port }} is
      {{ 'listening' if fwknop_spa_port_check.rc == 0 else 'NOT listening — check fwknopd logs' }}
  when: not ansible_check_mode

# ---------------------------------------------------------------------------
# Summary
# ---------------------------------------------------------------------------
- name: "FWKNOP | Deployment summary"
  ansible.builtin.debug:
    msg: >-
      fwknop deployed ({{ fwknop_service_name }} on {{ ansible_os_family }}).
      SPA port: {{ fwknop_spa_port }}/udp. Firewall: {{ fwknop_firewall_type }}.
      Internal SSH port {{ fwknop_internal_ssh_port }}: Tailscale/libvirt only.
      Public SSH port {{ fwknop_ssh_port }} is
      {{ 'CLOSED to public (SPA required)' if fwknop_close_public_ssh | bool else 'STILL OPEN to public (test SPA before closing)' }}.
      Tailscale SSH path: {{ 'enabled' if fwknop_allow_tailscale_ssh | bool else 'disabled' }}.
  when: not ansible_check_mode
