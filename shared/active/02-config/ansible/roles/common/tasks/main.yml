---
# Common tasks for all LocalNet hosts

- name: Update apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ infra_cache_valid_time }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - "{{ 'python3-docker' if ansible_facts['os_family'] == 'Debian' else 'python3-podman' }}"
      - curl
      - jq
      - git
    state: present

# =====================================================================
# System-wide git security baseline: /etc/gitconfig
#
# Security Stance
# ---------------
# This is the SYSTEM-LEVEL config (/etc/gitconfig), the lowest-precedence
# layer in git's config chain (system < global < local < cmdline).
# It sets the tightest default so that all users on the host inherit
# "never" for the file:// protocol unless a higher layer widens it.
#
# Why we do this
# --------------
# Git 2.38.1 (Oct 2022) changed the default for protocol.file.allow
# from "always" to "user" to close CVE-2022-39253. That CVE let a
# malicious superproject include a submodule with a file:// URL
# pointing at a victim's local path (e.g. file:///home/user/.ssh),
# and `git clone --recurse-submodules` would silently exfiltrate
# those local files to the attacker.
#
# We go one step tighter: "never" at the system level so that even
# direct, user-typed file:// operations are blocked unless the
# user's global config or a repo's local config explicitly opts in.
#
# Expectation
# -----------
# - The user-global config (~/.config/git/config, managed by chezmoi
#   via the dotfiles repo) also sets "never", matching this baseline.
# - Trusted repos that need file:// (e.g. local-sibling submodules)
#   override this in their own .git/config with:
#       git config protocol.file.allow always
# - That override is safe: .git/config is generated locally during
#   clone and is NOT a tracked file, so an untrusted remote cannot
#   inject it. The opt-in is a deliberate local action.
#
# protocol.file.allow values
# --------------------------
#   always  - file:// allowed everywhere, including indirect
#             (submodule-initiated) transports. Required for repos
#             with file:// submodule URLs. Use only in trusted repos.
#   user    - file:// allowed only for direct, user-typed commands.
#             Git's default since 2.38.1. Blocked for indirect use.
#   never   - file:// blocked entirely. Our system-wide default.
# =====================================================================
- name: Configure system-wide git file:// protocol restriction
  ansible.builtin.copy:
    dest: /etc/gitconfig
    content: |
      # Managed by Ansible — role: common
      # Do not edit manually; changes will be overwritten.
      [protocol "file"]
          allow = never
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  when: ansible_facts['os_family'] != "Windows"

- name: Ensure Docker service is installed and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  ignore_errors: true

- name: Ensure docker-compose plugin is available
  ansible.builtin.command:
    cmd: docker compose version
  register: docker_compose_check
  changed_when: false
  ignore_errors: true

- name: Install docker-compose plugin if missing
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-{{ ansible_facts['architecture'] }}"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: "{{ infra_mode_dir }}"
  when: docker_compose_check.rc != 0

- name: Ensure Docker networks exist
  community.docker.docker_network:
    name: "{{ item.name }}"
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ item.subnet }}"
        gateway: "{{ item.gateway | default(omit) }}"
  loop:
    - { name: "{{ localnet_network_name }}", subnet: "{{ localnet_network_subnet }}", gateway: "{{ localnet_network_gateway }}" }
    - { name: "{{ wireguard_network_name }}", subnet: "{{ wireguard_network_subnet }}" }
    - { name: "{{ codeassist_network_name }}", subnet: "{{ codeassist_network_subnet }}" }
    - { name: "{{ agent_network_name }}", subnet: "{{ agent_network_subnet }}", gateway: "{{ agent_network_gateway }}" }
    - { name: "{{ dmz_network_name }}", subnet: "{{ dmz_network_subnet }}", gateway: "{{ dmz_network_gateway }}" }
  ignore_errors: true
