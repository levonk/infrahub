---
# dashboard-directory-empire — Next.js orchestration dashboard
# Directory Empire platform dashboard — multi-stage Docker build from the
# directory-empire repo (lrepo52/directory-empire).
# Target: Windows Docker Desktop (dtop202311, X86). Joins traefik-windows-network.
#
# community.docker modules can't run on Windows (Ansible core basic.py imports
# grp, Unix-only). We use ansible.builtin.shell with DOCKER_HOST: ssh:// and
# delegate_to: localhost, matching the garnix-ci (nl) pattern.

# Service toggle
directory_empire_enabled: true

# Container configuration
directory_empire_container_name: "{{ infra_hostname_dashboard_directory_empire | default('localnet-dashboard-directory-empire') }}"
directory_empire_image_name: "{{ local_registry | default(infra_registry) }}/localnet-dashboard-directory-empire"
directory_empire_image_tag: "latest"

# Ports — Web UI exposed via Traefik
directory_empire_host_port: "{{ infra_port_dashboard_directory_empire_host | default('4530') }}"
directory_empire_container_port: "{{ infra_port_dashboard_directory_empire_container | default(infra_port_monitoring_grafana_host) }}"

# Domain (for Traefik routing)
directory_empire_domain: "{{ infra_domain_dashboard_directory_empire_nl | default('de.nl.' ~ (infra_domain_base | default('example.com'))) }}"

# Volume — config volume for runtime env files
directory_empire_config_volume: "{{ infra_storage_directory_empire_config_volume | default('localnet-directory-empire-config-volume') }}"

# Network — join the traefik-windows network for Traefik routing
directory_empire_network_name: "traefik-windows-network"

# Docker host for Windows deployment (ssh-tunneled)
directory_empire_docker_host_windows: "ssh://ansible@{{ infra_tailscale_fqdn_windows_docker | default(infra_tailscale_tailnet | default('example.ts.net')) }}"

# Local temp directory for rendering config files
directory_empire_windows_temp_dir: "/tmp/directory-empire-config-{{ inventory_hostname }}"

# Healthcheck
directory_empire_healthcheck_interval: "30s"
directory_empire_healthcheck_timeout: "5s"
directory_empire_healthcheck_retries: 3
directory_empire_healthcheck_start_period: "30s"

# Logging
directory_empire_log_max_size: "10m"
directory_empire_log_max_file: "5"

# Timezone
directory_empire_tz: "{{ localnet_tz | default(timezone | default('UTC')) }}"
