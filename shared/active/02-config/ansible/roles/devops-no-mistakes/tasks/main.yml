---
# no-mistakes Deployment
# Deploys the shared git gate service on Windows Docker Desktop hosts via
# SSH-tunneled Docker CLI.
#
# Architecture: community.docker Ansible modules use paramiko for SSH transport,
# which can't authenticate to the Windows host (key discovery issue). Instead,
# we use ansible.builtin.shell with the docker CLI, setting DOCKER_HOST to
# ssh:// so the system SSH client (with ~/.ssh/config) handles auth.
#
# This is a pragmatic exception to the "community.docker modules only" rule.
# The rule exists to avoid docker compose and ensure idempotent container
# management. We achieve both with docker CLI run/create commands. The root
# cause is that community.docker modules can't run on Windows (Ansible core
# basic.py imports grp, Unix-only) and can't use the system SSH client for
# delegate_to: localhost (paramiko auth fails).

# 1. Validate required variables
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - no_mistakes_container_name is defined
      - no_mistakes_image_name is defined
      - no_mistakes_image_tag is defined
      - no_mistakes_ssh_host_port is defined
      - no_mistakes_ssh_container_port is defined
      - no_mistakes_data_volume is defined
      - no_mistakes_network_name is defined
      - no_mistakes_docker_host is defined
    fail_msg: "Missing required no-mistakes variables."
    success_msg: "All required no-mistakes variables are defined."
  tags: ["always", "validate"]

# 2. Pull image from local registry (via docker CLI with SSH transport)
#    Falls back gracefully if the registry is unreachable but the image is
#    already present on the host (e.g., loaded via `docker load`).
- name: Pull no-mistakes image from local registry
  ansible.builtin.shell: >-
    docker pull {{ no_mistakes_image_name }}:{{ no_mistakes_image_tag }}
    || docker image inspect {{ no_mistakes_image_name }}:{{ no_mistakes_image_tag }} >/dev/null 2>&1
  environment:
    DOCKER_HOST: "{{ no_mistakes_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "pull"]

# 3. Create data volume
- name: Ensure no-mistakes data volume exists
  ansible.builtin.shell: "docker volume inspect {{ no_mistakes_data_volume }} 2>/dev/null || docker volume create {{ no_mistakes_data_volume }}"
  environment:
    DOCKER_HOST: "{{ no_mistakes_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "volume"]

# 4. Create temp dir for rendered config files (on localhost)
- name: Create temp dir for no-mistakes config files
  ansible.builtin.file:
    path: "{{ no_mistakes_temp_dir }}"
    state: directory
    mode: "{{ infra_mode_dir }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "config"]

# 5. Render config.yaml to temp dir (on localhost)
- name: Render no-mistakes config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ no_mistakes_temp_dir }}/config.yaml"
    mode: "{{ infra_mode_file }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "config"]

# 6. Render authorized_keys to temp dir (on localhost)
- name: Render no-mistakes authorized_keys
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "{{ no_mistakes_temp_dir }}/authorized_keys"
    mode: "{{ infra_mode_file }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "config"]

# 7. Stop existing container (if any) before recreating
- name: Stop existing no-mistakes container
  ansible.builtin.shell: "docker rm -f {{ no_mistakes_container_name }} 2>/dev/null || true"
  environment:
    DOCKER_HOST: "{{ no_mistakes_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "container"]

# 8. Deploy container
- name: Deploy no-mistakes container
  ansible.builtin.shell: >-
    docker run -d
    --name {{ no_mistakes_container_name }}
    --restart unless-stopped
    -p {{ no_mistakes_ssh_host_port }}:{{ no_mistakes_ssh_container_port }}/tcp
    -v {{ no_mistakes_data_volume }}:/home/gate/.no-mistakes:rw
    --network {{ no_mistakes_network_name }}
    -e GITHUB_TOKEN={{ no_mistakes_github_token }}
    -e WINDSURF_API_KEY={{ no_mistakes_devin_api_key }}
    -e DEVIN_MODEL={{ no_mistakes_devin_model }}
    -e NO_MISTAKES_TELEMETRY=0
    -e NM_HOME=/home/gate/.no-mistakes
    -e TZ={{ localnet_tz | default('UTC') }}
    --log-driver json-file
    --log-opt max-size={{ infra_log_max_size }}
    --log-opt max-file={{ infra_log_max_file }}
    --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/{{ no_mistakes_ssh_container_port }}' 2>/dev/null || exit 1"
    --health-interval {{ no_mistakes_healthcheck_interval }}
    --health-timeout {{ no_mistakes_healthcheck_timeout }}
    --health-retries {{ no_mistakes_healthcheck_retries }}
    --health-start-period {{ no_mistakes_healthcheck_start_period }}
    {{ no_mistakes_image_name }}:{{ no_mistakes_image_tag }}
  environment:
    DOCKER_HOST: "{{ no_mistakes_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "container"]

# 9. Copy config files into the running container
- name: Copy config.yaml into container
  ansible.builtin.command: "docker cp {{ no_mistakes_temp_dir }}/config.yaml {{ no_mistakes_container_name }}:/home/gate/config.yaml"
  environment:
    DOCKER_HOST: "{{ no_mistakes_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "config"]

- name: Copy authorized_keys into container
  ansible.builtin.command: "docker cp {{ no_mistakes_temp_dir }}/authorized_keys {{ no_mistakes_container_name }}:/home/gate/authorized_keys"
  environment:
    DOCKER_HOST: "{{ no_mistakes_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "config"]

# 10. Restart container so entrypoint copies config into NM_HOME and sshd picks up keys
- name: Restart no-mistakes to apply config
  ansible.builtin.command: "docker restart {{ no_mistakes_container_name }}"
  environment:
    DOCKER_HOST: "{{ no_mistakes_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "container"]

# 11. Status report
- name: Get no-mistakes container status
  ansible.builtin.command: "docker inspect --format {% raw %}{{.State.Status}}{% endraw %} {{ no_mistakes_container_name }}"
  environment:
    DOCKER_HOST: "{{ no_mistakes_docker_host }}"
  delegate_to: localhost
  register: no_mistakes_status
  changed_when: false
  ignore_errors: true
  tags: ["always", "info"]

- name: Report no-mistakes status
  ansible.builtin.debug:
    msg: |
      no-mistakes deployed:
        - SSH: ssh://gate@{{ no_mistakes_domain }}:{{ no_mistakes_ssh_host_port }}
        - Container: {{ no_mistakes_container_name }}
        - Image: {{ no_mistakes_image_name }}:{{ no_mistakes_image_tag }}
        - Status: {{ no_mistakes_status.stdout | default('unknown') }}
  tags: ["always", "info"]
