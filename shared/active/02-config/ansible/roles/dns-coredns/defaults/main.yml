---
# defaults file for dns-coredns
# Neutral, overridable defaults. No localnet-specific paths.
# All ports and IPs must be variables — never hardcode.

# ---------------------------------------------------------------------------
# Image & Container
# ---------------------------------------------------------------------------
dns_coredns_image: "coredns/coredns"
dns_coredns_image_tag: "{{ cloud_server_coredns_image_tag | default(infra_value_dns_coredns_image_tag) }}"
dns_coredns_container_name: "{{ cloud_server_coredns_container_name | default(infra_value_dns_coredns_container_name) }}"
dns_coredns_volume_name: "{{ cloud_server_coredns_volume_name | default(infra_value_dns_coredns_volume_name) }}"

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
dns_coredns_network_name: "{{ cloud_server_docker_network_name | default(infra_network_dns_coredns_network_name) }}"

# ---------------------------------------------------------------------------
# Ports — all variable-driven per ADR (host:container mapping)
# ---------------------------------------------------------------------------
# Main DNS port (UDP/TCP)
dns_coredns_host_port: "{{ cloud_server_dns_port | default(infra_port_dns_host) }}"
dns_coredns_container_port: "{{ cloud_server_dns_container_port | default(infra_port_dns_host) }}"

# Metrics / health port
dns_coredns_metrics_host_port: "{{ cloud_server_dns_metrics_port | default(infra_port_dns_coredns_prometheus_host) }}"
dns_coredns_metrics_container_port: "{{ cloud_server_dns_metrics_container_port | default(infra_port_dns_coredns_prometheus_host) }}"

# ---------------------------------------------------------------------------
# Upstream Resolvers
# ---------------------------------------------------------------------------
dns_coredns_upstreams: "{{ cloud_server_dns_upstreams | default(['{{ infra_network_ip_cloudflare_dns_primary }}', '{{ infra_network_ip_cloudflare_dns_secondary }}']) }}"

# ---------------------------------------------------------------------------
# Local Zones
# ---------------------------------------------------------------------------
dns_coredns_local_zones: "{{ cloud_server_dns_local_zones | default([]) }}"
# Example entry:
#   - name: "example.com"
#     ttl: 300
#     records:
#       - "example.com.  IN  A  192.168.1.10"

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------
dns_coredns_cache_ttl_max: "{{ cloud_server_dns_cache_ttl_max | default(infra_timeout_dns_ttl) }}"

# ---------------------------------------------------------------------------
# Service Directory
# ---------------------------------------------------------------------------
dns_coredns_service_dir: "{{ cloud_server_services_dir | default(infra_value_dns_coredns_service_dir) }}/dns/coredns"

# ---------------------------------------------------------------------------
# Verification
# ---------------------------------------------------------------------------
dns_coredns_verify_health: "{{ cloud_server_dns_verify_health | default(true) }}"
dns_coredns_verify_timeout_seconds: "{{ cloud_server_dns_verify_timeout | default(infra_timeout_retry) }}"
