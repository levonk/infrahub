---
- name: Restart dns-lite dnscrypt
  community.docker.docker_container:
    name: localnet-dns-dnscrypt-lite
    restart: true

- name: Restart dns-lite unbound
  community.docker.docker_container:
    name: localnet-dns-unbound-lite
    restart: true

- name: Restart dns-lite adguard
  community.docker.docker_container:
    name: localnet-dns-adguard-lite
    restart: true
