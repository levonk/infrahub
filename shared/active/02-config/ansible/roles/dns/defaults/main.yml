---
# DNS Role Defaults
# Maps dns_* role variables to infra_* infrastructure variables.
# See: shared/active/02-config/ansible/infrastructure/ports.yml and networks.yml

# Service toggle
dns_enabled: true

# Network
dns_network_name: "{{ infra_network_dns_localnet_network_name | default(infra_network_dns_network_name) }}"
dns_network_subnet: "{{ infra_network_dns_localnet_subnet | default(infra_network_dns_localnet_subnet) }}"

# Registry
dns_registry: "{{ local_registry | default(infra_registry) }}"

# Docker host for Windows deployment (ssh-tunneled)
dns_docker_host_windows: "ssh://ansible@{{ infra_tailscale_fqdn_windows_docker | default('dtop202311.' ~ (infra_tailscale_tailnet | default(infra_value_dns_docker_host_windows))) }}"

# IP allocations (from networks.yml)
dns_adguard_ip: "{{ infra_network_ip_dns_adguard | default(infra_network_ip_dns_adguard) }}"
dns_dnsdist_ip: "{{ infra_network_ip_dns_dnsdist | default(infra_network_ip_dns_dnsdist) }}"
dns_coredns_main_ip: "{{ infra_network_ip_dns_coredns | default(infra_network_ip_dns_coredns) }}"
dns_unbound_validator_ip: "{{ infra_network_ip_dns_unbound_validator | default(infra_network_ip_dns_unbound_validator) }}"
dns_unbound_tor_ip: "{{ infra_network_ip_dns_unbound_tor | default(infra_network_ip_dns_unbound_tor) }}"
dns_unbound_root_ip: "{{ infra_network_ip_dns_unbound_root | default(infra_network_ip_dns_unbound_root) }}"
dns_dnscrypt_odoh_ip: "{{ infra_network_ip_dns_dnscrypt_odoh | default(infra_network_ip_dns_dnscrypt_odoh) }}"
dns_dnscrypt_anon_ip: "{{ infra_network_ip_dns_dnscrypt_anon | default(infra_network_ip_dns_dnscrypt_anon) }}"
dns_dnscrypt_std_ip: "{{ infra_network_ip_dns_dnscrypt_std | default(infra_network_ip_dns_dnscrypt_std) }}"
dns_dnscrypt_doh_ip: "{{ infra_network_ip_dns_dnscrypt_doh | default(infra_network_ip_dns_dnscrypt_doh) }}"
dns_dnscrypt_encrypted_ip: "{{ infra_network_ip_dns_dnscrypt_encrypted | default(infra_network_ip_dns_dnscrypt_encrypted) }}"
dns_dnscrypt_plaintext_ip: "{{ infra_network_ip_dns_dnscrypt_plaintext | default(infra_network_ip_dns_dnscrypt_plaintext) }}"
dns_dnscrypt_tor_ip: "{{ infra_network_ip_dns_dnscrypt_tor | default(infra_network_ip_dns_dnscrypt_tor) }}"
dns_dnscrypt_plaintext_tor_ip: "{{ infra_network_ip_dns_dnscrypt_plaintext_tor | default(infra_network_ip_dns_dnscrypt_plaintext_tor) }}"
dns_tor_proxy_ip: "{{ infra_network_ip_dns_tor_proxy | default(infra_network_ip_dns_tor_proxy) }}"

# Port allocations (from ports.yml)
dns_transparent_host_port: "{{ infra_port_dns_transparent_host | default(infra_port_proxy_mitm_web_host) }}"
dns_transparent_container_port: "{{ infra_port_dns_transparent_container | default(infra_port_proxy_mitm_web_host) }}"

dns_dnsdist_main_host_port: "{{ infra_port_dns_dnsdist_main_host | default(infra_port_proxy_mitm_web_alt_host) }}"
dns_dnsdist_main_container_port: "{{ infra_port_dns_dnsdist_main_container | default(infra_port_proxy_mitm_web_alt_host) }}"
dns_dnsdist_metrics_host_port: "{{ infra_port_dns_dnsdist_metrics_host | default(infra_port_dns_adguard_web_host) }}"
dns_dnsdist_metrics_container_port: "{{ infra_port_dns_dnsdist_metrics_container | default(infra_port_dns_adguard_web_host) }}"

dns_coredns_main_host_port: "{{ infra_port_dns_coredns_main_host | default(infra_port_vpn_netbird_data_alt_host) }}"
dns_coredns_main_container_port: "{{ infra_port_dns_coredns_main_container | default(infra_port_vpn_netbird_data_host) }}"
dns_coredns_main_metrics_host_port: "{{ infra_port_dns_coredns_main_metrics_host | default(infra_port_dns_coredns_prometheus_host) }}"
dns_coredns_main_health_host_port: "{{ infra_port_dns_coredns_main_health_host | default(infra_port_omniroute_host) }}"
dns_coredns_main_health_container_port: "{{ infra_port_dns_coredns_main_health_container | default(infra_port_proxy_gost_alt_host) }}"
dns_coredns_internal_host_port: "{{ infra_port_dns_coredns_internal_host | default(infra_port_vpn_netbird_data_alt5_host) }}"
dns_coredns_internal_container_port: "{{ infra_port_dns_coredns_internal_container | default(infra_port_vpn_netbird_data_alt6_host) }}"

dns_dnscrypt_odoh_host_port: "{{ infra_port_dns_dnscrypt_odoh_host | default(infra_port_dns_dnscrypt_host) }}"
dns_dnscrypt_odoh_container_port: "{{ infra_port_dns_dnscrypt_odoh_container | default(infra_port_dns_alt_host) }}"
dns_dnscrypt_anon_host_port: "{{ infra_port_dns_dnscrypt_anon_host | default(infra_port_dns_dnscrypt_alt_host) }}"
dns_dnscrypt_anon_container_port: "{{ infra_port_dns_dnscrypt_anon_container | default(infra_port_dns_alt_host) }}"
dns_dnscrypt_std_host_port: "{{ infra_port_dns_dnscrypt_std_host | default(infra_port_dns_dnscrypt_alt3_host) }}"
dns_dnscrypt_std_container_port: "{{ infra_port_dns_dnscrypt_std_container | default(infra_port_dns_alt_host) }}"
dns_dnscrypt_doh_host_port: "{{ infra_port_dns_dnscrypt_doh_host | default(infra_port_dns_dnscrypt_alt4_host) }}"
dns_dnscrypt_doh_container_port: "{{ infra_port_dns_dnscrypt_doh_container | default(infra_port_dns_alt_host) }}"
dns_dnscrypt_encrypted_host_port: "{{ infra_port_dns_dnscrypt_encrypted_host | default(infra_port_dns_dnscrypt_alt6_host) }}"
dns_dnscrypt_encrypted_container_port: "{{ infra_port_dns_dnscrypt_encrypted_container | default(infra_port_dns_alt_host) }}"
dns_dnscrypt_plaintext_host_port: "{{ infra_port_dns_dnscrypt_plaintext_host | default(infra_port_dns_dnscrypt_alt5_host) }}"
dns_dnscrypt_plaintext_container_port: "{{ infra_port_dns_dnscrypt_plaintext_container | default(infra_port_dns_alt2_host) }}"
dns_dnscrypt_tor_host_port: "{{ infra_port_dns_dnscrypt_tor_host | default(infra_port_dns_dnscrypt_alt2_host) }}"
dns_dnscrypt_tor_container_port: "{{ infra_port_dns_dnscrypt_tor_container | default(infra_port_dns_alt_host) }}"
dns_dnscrypt_plaintext_tor_host_port: "{{ infra_port_dns_dnscrypt_plaintext_tor_host | default(infra_port_dns_dnscrypt_alt7_host) }}"
dns_dnscrypt_plaintext_tor_container_port: "{{ infra_port_dns_dnscrypt_plaintext_tor_container | default(infra_port_dns_alt_host) }}"

dns_unbound_validator_host_port: "{{ infra_port_dns_unbound_validator_host | default(infra_port_vpn_netbird_data_alt2_host) }}"
dns_unbound_validator_container_port: "{{ infra_port_dns_unbound_validator_container | default(infra_port_vpn_netbird_data_host) }}"
dns_unbound_tor_host_port: "{{ infra_port_dns_unbound_tor_host | default(infra_port_vpn_netbird_data_alt3_host) }}"
dns_unbound_tor_container_port: "{{ infra_port_dns_unbound_tor_container | default(infra_port_vpn_netbird_data_host) }}"
dns_unbound_root_host_port: "{{ infra_port_dns_unbound_root_host | default(infra_port_vpn_netbird_data_alt4_host) }}"
dns_unbound_root_container_port: "{{ infra_port_dns_unbound_root_container | default(infra_port_vpn_netbird_data_host) }}"

dns_adguard_host_port: "{{ infra_port_dns_adguard_host | default(infra_port_dns_coredns_forward_host) }}"
dns_adguard_container_port: "{{ infra_port_dns_adguard_container | default(infra_port_dns_coredns_forward_host) }}"
dns_adguard_web_host_port: "{{ infra_port_dns_adguard_web_host | default(infra_port_monitoring_grafana_host) }}"
dns_adguard_web_container_port: "{{ infra_port_dns_adguard_web_container | default(infra_port_monitoring_grafana_host) }}"

# AdGuard admin credentials (password is bcrypt hash — generate with:
#   htpasswd -nbB admin 'yourpassword' | cut -d: -f2
# or use the ansible-vault encrypted value)
dns_adguard_admin_user: "admin"
dns_adguard_admin_password_hash: "{{ vault_dns_adguard_admin_password_hash | default(infra_value_dns_adguard_admin_password_hash) }}"

# Tor proxy
proxy_tor_ip: "{{ dns_tor_proxy_ip }}"
proxy_tor_socks5_ip: "{{ dns_tor_proxy_ip }}"
proxy_tor_socks5_container_port: "9050"
proxy_tor_socks5_host_port: "9050"

# Active vs dark tiers — dark tiers are created but not started
dns_dnscrypt_odoh_enabled: true
dns_dnscrypt_anon_enabled: true
dns_dnscrypt_std_enabled: false
dns_dnscrypt_doh_enabled: false
dns_dnscrypt_encrypted_enabled: false
dns_dnscrypt_plaintext_enabled: true
dns_dnscrypt_tor_enabled: false
dns_dnscrypt_plaintext_tor_enabled: false
dns_unbound_validator_enabled: true
dns_unbound_tor_enabled: true
dns_unbound_root_enabled: true

# Local temp directory for Windows config seeding
dns_windows_temp_dir: "/tmp/dns-config-{{ inventory_hostname }}"
