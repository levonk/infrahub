---
# Blocklist Compiler (one-shot job)

- name: Pull blocklist-compiler image
  community.docker.docker_image:
    name: "{{ dns_registry }}/localnet-dns-blocklist-compiler:latest"
    source: pull
    force_source: true
    state: present
  register: blocklist_compiler_build

- name: Run blocklist-compiler (one-shot)
  community.docker.docker_container:
    name: localnet-dns-blocklist-compiler
    image: "{{ dns_registry }}/localnet-dns-blocklist-compiler"
    state: started
    restart_policy: "no"
    networks:
      - name: "{{ dns_network_name }}"
    volumes:
      - localnet-dns-blocklist-archive-volume:/blocklists/sources:rw
      - localnet-dns-blocklist-cdbs-volume:/blocklists/compiled:rw
    tmpfs:
      - /tmp:mode=1777,size=512m
    env:
      TZ: UTC
      PUID: "{{ localnet_puid | string }}"
      PGID: "{{ localnet_pgid | string }}"
    healthcheck:
      test: ["CMD", "test", "-f", "/blocklists/compiled/blocklist.cdb"]
      interval: "30s"
      timeout: "10s"
      retries: 3
  register: blocklist_compiler_run

- name: Wait for blocklist-compiler to finish (one-shot container exits)
  community.docker.docker_container_info:
    name: localnet-dns-blocklist-compiler
  register: blocklist_compiler_info
  until: >-
    blocklist_compiler_info.container is not defined or
    blocklist_compiler_info.container.State.Status in ["exited", "dead", "removing"] or
    (blocklist_compiler_info.container.State.Running | default(true)) == false
  retries: 60
  delay: 5
  when: blocklist_compiler_run.changed

- name: Remove blocklist-compiler container after completion
  community.docker.docker_container:
    name: localnet-dns-blocklist-compiler
    state: absent
  when: blocklist_compiler_run.changed
