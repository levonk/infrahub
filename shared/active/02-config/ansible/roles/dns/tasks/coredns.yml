---
# CoreDNS

- name: Pull coredns image
  community.docker.docker_image:
    name: "{{ local_registry | default('{{ infra_registry }}') }}/localnet-dns-coredns:latest"
    source: pull
    state: present

- name: Deploy coredns container
  community.docker.docker_container:
    name: localnet-dns-coredns
    image: localnet-dns-coredns
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ localnet_network_name }}"
        ipv4_address: "{{ dns_coredns_main_ip }}"
        aliases:
          - coredns
    ports:
      - "{{ dns_coredns_main_host_port }}:{{ dns_coredns_main_container_port }}/udp"
      - "{{ dns_coredns_main_host_port }}:{{ dns_coredns_main_container_port }}/tcp"
      - "{{ dns_coredns_main_metrics_host_port }}:{{ infra_port_dns_coredns_metrics_host }}/tcp"
      - "{{ dns_coredns_main_health_host_port }}:{{ dns_coredns_main_health_container_port }}/tcp"
    volumes:
      - "{{ localnet_services_dir }}/dns/coredns/mounts/templates:/templates:ro"
      - localnet-dns-coredns-cache-volume:/var/lib/coredns:rw
    env:
      DNS_COREDNS_MAIN_IP: "{{ dns_coredns_main_ip }}"
      DNS_COREDNS_MAIN_HOST_PORT: "{{ dns_coredns_main_host_port }}"
      DNS_COREDNS_MAIN_CONTAINER_PORT: "{{ dns_coredns_main_container_port }}"
      DNS_COREDNS_MAIN_METRICS_HOST_PORT: "{{ dns_coredns_main_metrics_host_port }}"
      DNS_COREDNS_MAIN_HEALTH_HOST_PORT: "{{ dns_coredns_main_health_host_port }}"
      DNS_COREDNS_MAIN_HEALTH_CONTAINER_PORT: "{{ dns_coredns_main_health_container_port }}"
      DNS_COREDNS_INTERNAL_CONTAINER_PORT: "{{ dns_coredns_internal_container_port }}"
      DNS_UNBOUND_VALIDATOR_IP: "{{ dns_unbound_validator_ip }}"
      DNS_UNBOUND_VALIDATOR_CONTAINER_PORT: "{{ dns_unbound_validator_container_port }}"
      DNS_UNBOUND_TOR_IP: "{{ dns_unbound_tor_ip }}"
      DNS_UNBOUND_TOR_CONTAINER_PORT: "{{ dns_unbound_tor_container_port }}"
      DNS_UNBOUND_ROOT_IP: "{{ dns_unbound_root_ip }}"
      DNS_UNBOUND_ROOT_CONTAINER_PORT: "{{ dns_unbound_root_container_port }}"
      DNS_DNSCRYPT_ODOH_IP: "{{ dns_dnscrypt_odoh_ip }}"
      DNS_DNSCRYPT_ODOH_CONTAINER_PORT: "{{ dns_dnscrypt_odoh_container_port }}"
      DNS_DNSCRYPT_ANON_IP: "{{ dns_dnscrypt_anon_ip }}"
      DNS_DNSCRYPT_ANON_CONTAINER_PORT: "{{ dns_dnscrypt_anon_container_port }}"
      DNS_DNSCRYPT_STD_IP: "{{ dns_dnscrypt_std_ip }}"
      DNS_DNSCRYPT_STD_CONTAINER_PORT: "{{ dns_dnscrypt_std_container_port }}"
      DNS_DNSCRYPT_DOH_IP: "{{ dns_dnscrypt_doh_ip }}"
      DNS_DNSCRYPT_DOH_CONTAINER_PORT: "{{ dns_dnscrypt_doh_container_port }}"
      DNS_DNSCRYPT_ENCRYPTED_IP: "{{ dns_dnscrypt_encrypted_ip }}"
      DNS_DNSCRYPT_ENCRYPTED_CONTAINER_PORT: "{{ dns_dnscrypt_encrypted_container_port }}"
      DNS_DNSCRYPT_PLAINTEXT_IP: "{{ dns_dnscrypt_plaintext_ip }}"
      DNS_DNSCRYPT_PLAINTEXT_CONTAINER_PORT: "{{ dns_dnscrypt_plaintext_container_port }}"
      DNS_DNSCRYPT_TOR_IP: "{{ dns_dnscrypt_tor_ip }}"
      DNS_DNSCRYPT_TOR_CONTAINER_PORT: "{{ dns_dnscrypt_tor_container_port }}"
      PROXY_TOR_SOCKS5_IP: "{{ proxy_tor_socks5_ip }}"
      PROXY_TOR_SOCKS5_CONTAINER_PORT: "{{ proxy_tor_socks5_container_port }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://{{ infra_network_bind_localhost }}:{{ dns_coredns_main_health_container_port }}/health"]
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_healthcheck_start_period }}"

- name: Wait for coredns to be healthy
  ansible.builtin.uri:
    url: "http://{{ infra_network_bind_localhost }}:{{ dns_coredns_main_health_host_port }}/health"
    status_code: "{{ infra_http_status_ok }}"
  register: coredns_health
  until: coredns_health.status == {{ infra_http_status_ok }}
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_default }}"
