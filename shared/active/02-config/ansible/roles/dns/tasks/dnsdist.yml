---
# DNSDist

- name: Pull dnsdist image
  community.docker.docker_image:
    name: "{{ dns_registry }}/localnet-dns-dnsdist:latest"
    source: pull
    force_source: true
    state: present

- name: Deploy dnsdist container
  community.docker.docker_container:
    name: localnet-dns-dnsdist
    image: "{{ dns_registry }}/localnet-dns-dnsdist"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ dns_network_name }}"
        ipv4_address: "{{ dns_dnsdist_ip }}"
    ports:
      - "{{ dns_port_prefix }}{{ dns_transparent_host_port }}:{{ dns_transparent_container_port }}/udp"
      - "{{ dns_port_prefix }}{{ dns_transparent_host_port }}:{{ dns_transparent_container_port }}/tcp"
      - "{{ dns_port_prefix }}{{ dns_dnsdist_main_host_port }}:{{ dns_dnsdist_main_container_port }}/udp"
      - "{{ dns_port_prefix }}{{ dns_dnsdist_main_host_port }}:{{ dns_dnsdist_main_container_port }}/tcp"
      - "{{ dns_port_prefix }}{{ dns_dnsdist_metrics_host_port }}:{{ dns_dnsdist_metrics_container_port }}/tcp"
    volumes:
      - "{{ localnet_services_dir }}/dns/dnsdist/mounts/templates:/templates:ro"
      - localnet-dns-blocklist-cdbs-volume:/etc/dnsdist/blocklists:ro
    env:
      DNS_DNSDIST_MAIN_CONTAINER_PORT: "{{ dns_dnsdist_main_container_port | string }}"
      DNS_COREDNS_MAIN_IP: "{{ dns_coredns_main_ip | string }}"
      DNS_COREDNS_MAIN_CONTAINER_PORT: "{{ dns_coredns_main_container_port | string }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "dig", "+short", "example.com", "@{{ infra_network_bind_localhost }}", "-p", "{{ dns_dnsdist_main_container_port }}"]
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}s"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_healthcheck_start_period_long }}"

- name: Wait for dnsdist to be healthy
  ansible.builtin.shell: |
    docker inspect --format='{{"{{"}}.State.Health.Status{{"}}"}}' localnet-dns-dnsdist
  register: dnsdist_health
  until: dnsdist_health.stdout == "healthy"
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_long }}"
  ignore_errors: true
