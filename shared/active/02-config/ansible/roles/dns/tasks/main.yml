---
# LocalNet DNS Stack Deployment
# Services: adguard, dnsdist, coredns, dnscrypt tiers, unbound, blocklist-compiler, tor-proxy
#
# Dual-deployment:
#   Linux  (localnet_hosts, kckinai) — community.docker modules
#   Windows (windows_docker_hosts, dtop202311) — delegate_to: localhost + DOCKER_HOST: ssh://
#
# See: shared/docs/pipelines/dns/complete-dns-chain.mmd for the full architecture.

# ============================================================================
# Validate required variables
# ============================================================================
- name: Validate required DNS variables are defined
  ansible.builtin.assert:
    that:
      - dns_network_name is defined
      - dns_coredns_main_ip is defined
      - dns_unbound_validator_ip is defined
    fail_msg: >-
      Missing required DNS variables. Check infrastructure files
      (ports.yml, networks.yml) and role defaults.
    success_msg: "All required DNS variables are defined."
  tags: ["always", "validate"]

# ============================================================================
# Dispatch based on target OS
# ============================================================================
- name: Dispatch Windows (nl) deployment
  ansible.builtin.include_tasks: deploy-windows.yml
  when:
    - dns_enabled | bool
    - "'windows_docker_hosts' in group_names"
  tags: ["deploy"]

- name: Dispatch Linux deployment
  ansible.builtin.include_tasks: deploy-linux.yml
  when:
    - dns_enabled | bool
    - "'windows_docker_hosts' not in group_names"
  tags: ["deploy"]
