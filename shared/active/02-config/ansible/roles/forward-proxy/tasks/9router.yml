---
# Services: 9Router

- name: Ensure Proxy 9router directory exists on target
  ansible.builtin.file:
    path: "{{ localnet_services_dir }}/9router"
    state: directory
    mode: "{{ infra_mode_dir_0755 }}"

# ============================================================================
# Volume Management
# ============================================================================
- name: Ensure 9router volumes exist
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  loop:
    - localnet-proxy-9router-data-volume
    - localnet-proxy-9router-config-volume

# ============================================================================
# 9Router (OmniRoute replaces this)
# ============================================================================
- name: Pull 9router image
  community.docker.docker_image:
    name: "{{ local_registry | default(infra_registry) }}/localnet-proxy-9router:latest"
    source: pull
    state: present

- name: Deploy 9router container
  community.docker.docker_container:
    name: localnet-proxy-9router
    image: localnet-proxy-9router
    state: started
    restart_policy: unless-stopped
    hostname: 9router
    networks:
      - name: "{{ localnet_network_name }}"
    ports:
      - "{{ proxy_router_9router_host_port | default(infra_port_proxy_router_9router_host) }}:{{ proxy_router_9router_container_port | default(infra_port_proxy_router_9router_host) }}"
    volumes:
      - localnet-proxy-9router-data-volume:/app/data
      - localnet-proxy-9router-config-volume:/app/config
    env:
      NODE_ENV: production
      PORT: "{{ proxy_router_9router_container_port | default(infra_port_proxy_router_9router_host) }}"
      HOSTNAME: "{{ infra_network_bind_all }}"
      NEXT_TELEMETRY_DISABLED: 1
      DATA_DIR: /app/data
      PUID: "{{ localnet_puid }}"
      PGID: "{{ localnet_pgid }}"
    security_opts:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size={{ infra_size_100m }}
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://{{ infra_network_bind_localhost }}:{{ proxy_router_9router_container_port | default(infra_port_proxy_router_9router_host) }}/health"]
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}"
      retries: 3
      start_period: "{{ infra_healthcheck_start_period }}"
    deploy:
      resources:
        limits:
          cpus: '{{ infra_cpu_count_default }}'
          memory: "{{ infra_size_1g }}"
        reservations:
          cpus: '{{ infra_cpu_count_small }}'
          memory: "{{ infra_size_256m }}"

- name: Wait for 9router to be healthy
  ansible.builtin.uri:
    url: "http://{{ infra_network_bind_localhost }}:{{ proxy_router_9router_host_port | default(infra_port_proxy_router_9router_host) }}/health"
    status_code: "{{ infra_http_status_ok }}"
  register: router_health
  until: router_health.status == {{ infra_http_status_ok }}
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_default }}"

# ============================================================================
# Status Report
# ============================================================================
- name: Report Proxy stack status
  ansible.builtin.debug:
    msg: |
      Proxy Stack deployed successfully:
        - 9Router: http://localhost:{{ proxy_router_9router_host_port | default(infra_port_proxy_router_9router_host) }}
