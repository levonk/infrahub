---
# Envoy — uses upstream Docker Hub image (no custom Dockerfile needed)

- name: Pull envoy image
  community.docker.docker_image:
    name: "{{ proxy_envoy_image | default('envoyproxy/envoy') }}:{{ proxy_envoy_image_tag | default('v1.28-latest') }}"
    source: pull
    state: present

- name: Deploy envoy container
  community.docker.docker_container:
    name: localnet-proxy-envoy
    image: "{{ proxy_envoy_image | default('envoyproxy/envoy') }}:{{ proxy_envoy_image_tag | default('v1.28-latest') }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ localnet_network_name }}"
    ports:
      - "{{ proxy_http_transparent_port }}:{{ infra_port_proxy_http_host }}/tcp"
      - "{{ proxy_https_transparent_port }}:{{ infra_port_proxy_https_host }}/tcp"
      - "{{ proxy_envoy_internal_host_port }}:{{ infra_port_proxy_envoy_internal_host }}/tcp"
      - "{{ proxy_envoy_admin_host_port }}:{{ infra_port_proxy_envoy_admin_host }}/tcp"
    volumes:
      - "{{ localnet_services_dir }}/proxy/configs/web/envoy:/etc/envoy/conf.d:ro"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9901/ready"]  # project-lint: disable=magic-int  virtualization device type, not a standalone magic number
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_healthcheck_start_period }}"

- name: Wait for envoy to be healthy
  ansible.builtin.uri:
    url: "http://{{ infra_network_bind_localhost }}:{{ proxy_envoy_admin_host_port }}/ready"
    status_code: "{{ infra_http_status_ok }}"
  register: envoy_health
  until: envoy_health.status == {{ infra_http_status_ok }}
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_default }}"
