---
# Privoxy — uses upstream Docker Hub image (no custom Dockerfile needed)

- name: Pull privoxy image
  community.docker.docker_image:
    name: "{{ proxy_privoxy_image | default('vimagick/privoxy') }}:{{ proxy_privoxy_image_tag | default('latest') }}"
    source: pull
    state: present

- name: Deploy privoxy container
  community.docker.docker_container:
    name: localnet-proxy-privoxy
    image: "{{ proxy_privoxy_image | default('vimagick/privoxy') }}:{{ proxy_privoxy_image_tag | default('latest') }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ localnet_network_name }}"
    volumes:
      - "{{ localnet_services_dir }}/proxy/configs/web/privoxy:/etc/privoxy:ro"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "{{ infra_port_proxy_privoxy_host }}"]
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_healthcheck_start_period }}"

- name: Wait for privoxy to be healthy
  ansible.builtin.wait_for:
    host: localhost
    port: {{ infra_port_proxy_privoxy_host }}
    delay: "{{ infra_delay_default }}"
    timeout: "{{ infra_timeout_long }}"
