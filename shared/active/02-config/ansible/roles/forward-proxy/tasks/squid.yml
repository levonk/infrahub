---
# Squid — uses upstream Docker Hub image (no custom Dockerfile needed)

- name: Pull squid image
  community.docker.docker_image:
    name: "{{ proxy_squid_image | default('ubuntu/squid') }}:{{ proxy_squid_image_tag | default('latest') }}"
    source: pull
    state: present

- name: Deploy squid container
  community.docker.docker_container:
    name: localnet-proxy-squid
    image: "{{ proxy_squid_image | default('ubuntu/squid') }}:{{ proxy_squid_image_tag | default('latest') }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ localnet_network_name }}"
    ports:
      - "{{ proxy_direct_port }}:{{ infra_port_proxy_mitm_transparent_host }}/tcp"
    volumes:
      - "{{ localnet_services_dir }}/proxy/configs/web/squid.conf:/etc/squid/conf.d/localnet.conf:ro"
      - localnet-web-cache-volume:/var/spool/squid
    env:
      CACHE_SIZE_MB: "{{ proxy_cache_size_mb }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "squidclient", "-h", "localhost", "mgr:info"]
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_healthcheck_start_period }}"

- name: Wait for squid to be healthy
  ansible.builtin.shell: |
    docker inspect --format='{{"{{"}}.State.Health.Status{{"}}"}}' localnet-proxy-squid
  register: squid_health
  until: squid_health.stdout == "healthy"
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_long }}"
  ignore_errors: true
