---
# Traefik

- name: Deploy traefik container
  community.docker.docker_container:
    name: localnet-proxy-traefik
    image: traefik:latest
    state: started
    restart_policy: unless-stopped
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--global.sendAnonymousUsage=false"
      - "--global.checkNewVersion=true"
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web=true"
      - "--entrypoints.web.address=:{{ infra_port_proxy_http_host }}"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      - "--entrypoints.websecure=true"
      - "--entrypoints.websecure.address=:{{ infra_port_proxy_https_host }}"
      - "--entryPoints.websecure.proxyProtocol.trustedIPs={{ docker_network_gateway }}/32"  # project-lint: disable=magic-int  CIDR prefix length, not a standalone magic number
      - "--entrypoints.health=true"
      - "--entrypoints.health.address=:{{ infra_port_proxy_mitm_alt_host }}"
      - "--ping=true"
      - "--ping.entrypoint=health"
      - "--certificatesresolvers.le.acme.email=letsencrypt@example.com"
      - "--certificatesresolvers.le.acme.storage=./acme/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--accesslog=true"
      - "--accesslog.filePath=/var/log/traefik/access.log"
      - "--entryPoints.websecure.http.middlewares=crowdsec-bouncer@file"
      - "--experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock"
      - "--experimental.plugins.geoblock.version=v0.3.3"
      - "--providers.docker.endpoint=unix:///socket/docker.sock"
    ports:
      - "{{ infra_port_proxy_http_host }}:{{ infra_port_proxy_http_host }}"
      - "{{ infra_port_proxy_https_host }}:{{ infra_port_proxy_https_host }}"
    networks:
      - name: "{{ localnet_network_name }}"
    volumes:
      - "{{ localnet_services_dir }}/proxy/traefik/mounts/etc/traefik:/etc/traefik:ro"
      - localnet-security-traefik-accesslog-volume:/var/log/traefik/
      - localnet-dockerproxy-ro-volume:/socket/:ro
    env:
      TRAEFIK_EXPERIMENTAL_PLUGINS_GEOBLOCK_MODULENAME: github.com/PascalMinder/geoblock
      TRAEFIK_EXPERIMENTAL_PLUGINS_GEOBLOCK_VERSION: "{{ traefik_plugin_geo_version | default('v0.2.9') }}"
      TRAEFIK_EXPERIMENTAL_PLUGINS_CROWDSEC_MODULENAME: github.com/crowdsecurity/traefik-plugin-crowdsec
      TRAEFIK_EXPERIMENTAL_PLUGINS_CROWDSEC_VERSION: "{{ traefik_plugin_crowdsec_version | default('v1.4.4') }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8882/ping"]  # project-lint: disable=magic-int  virtualization device type, not a standalone magic number
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_healthcheck_start_period }}"

- name: Wait for traefik to be healthy
  ansible.builtin.uri:
    url: "http://{{ infra_endpoint_proxy_alt_localhost }}/ping"
    status_code: "{{ infra_http_status_ok }}"
  register: traefik_health
  until: traefik_health.status == {{ infra_http_status_ok }}
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_default }}"
