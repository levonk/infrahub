---
# tasks file for host-os-bootstrap

# ---------------------------------------------------------------------------
# Package Index Refresh
# ---------------------------------------------------------------------------
- name: Update apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ infra_cache_valid_time }}"
  when: ansible_facts['os_family'] == "Debian"
  become: true

- name: Update dnf cache (Red Hat family)
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['os_family'] == "RedHat"
  become: true

# ---------------------------------------------------------------------------
# Required Packages
# ---------------------------------------------------------------------------
- name: Install required packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ host_os_bootstrap_packages + host_os_bootstrap_packages_debian }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"
  become: true

- name: Install required packages (Red Hat family)
  ansible.builtin.dnf:
    name: "{{ host_os_bootstrap_packages_redhat }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"
  become: true

# ---------------------------------------------------------------------------
# Timezone
# ---------------------------------------------------------------------------
- name: Set system timezone (systemd)
  ansible.builtin.command:
    cmd: "timedatectl set-timezone {{ host_os_bootstrap_timezone }}"
  register: timezone_set
  changed_when: timezone_set.rc == 0
  failed_when: false
  become: true

- name: Set system timezone (non-systemd fallback)
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ host_os_bootstrap_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when: timezone_set.rc != 0
  become: true

# ---------------------------------------------------------------------------
# SELinux Configuration (for RedHat family - required for multi-user Nix)
# ---------------------------------------------------------------------------
- name: Check if SELinux is installed
  ansible.builtin.stat:
    path: /etc/selinux/config
  register: selinux_config
  when: ansible_facts['os_family'] == "RedHat"

- name: Set SELinux to permissive mode (required for multi-user Nix)
  ansible.posix.selinux:
    policy: targeted
    state: permissive
  when:
    - ansible_facts['os_family'] == "RedHat"
    - selinux_config.stat.exists
  become: true

- name: Persist SELinux permissive mode in config
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=permissive'
  when:
    - ansible_facts['os_family'] == "RedHat"
    - selinux_config.stat.exists
  become: true

# ---------------------------------------------------------------------------
# Admin User
# ---------------------------------------------------------------------------
- name: Ensure admin group exists
  ansible.builtin.group:
    name: "{{ host_os_bootstrap_admin_user }}"
    state: present
  become: true

- name: Ensure admin user exists
  ansible.builtin.user:
    name: "{{ host_os_bootstrap_admin_user }}"
    group: "{{ host_os_bootstrap_admin_user }}"
    groups: "{{ host_os_bootstrap_admin_groups }}"
    shell: "{{ host_os_bootstrap_admin_shell }}"
    home: "{{ host_os_bootstrap_admin_home }}"
    create_home: true
    state: present
  become: true

# ---------------------------------------------------------------------------
# Passwordless Sudo
# ---------------------------------------------------------------------------
- name: Configure passwordless sudo for admin user
  ansible.builtin.template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ host_os_bootstrap_admin_user }}"
    owner: root
    group: root
    mode: "{{ infra_mode_file_readonly }}"
    validate: "visudo -cf %s"
  become: true

# ---------------------------------------------------------------------------
# SSH Key Authentication
# ---------------------------------------------------------------------------
- name: Ensure admin user .ssh directory exists
  ansible.builtin.file:
    path: "{{ host_os_bootstrap_admin_home }}/.ssh"
    state: directory
    owner: "{{ host_os_bootstrap_admin_user }}"
    group: "{{ host_os_bootstrap_admin_user }}"
    mode: "{{ infra_mode_dir_restricted }}"
  become: true

- name: Deploy admin user authorized keys
  ansible.builtin.copy:
    content: "{{ host_os_bootstrap_admin_authorized_keys | join('\n') }}\n"
    dest: "{{ host_os_bootstrap_admin_home }}/.ssh/authorized_keys"
    owner: "{{ host_os_bootstrap_admin_user }}"
    group: "{{ host_os_bootstrap_admin_user }}"
    mode: "{{ infra_mode_file_restricted }}"
  when: host_os_bootstrap_admin_authorized_keys | default([]) | length > 0
  become: true

- name: Ensure root .ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "{{ infra_mode_dir_restricted }}"
  become: true

- name: Deploy root authorized keys
  ansible.builtin.copy:
    content: "{{ host_os_bootstrap_root_authorized_keys | join('\n') }}\n"
    dest: /root/.ssh/authorized_keys
    owner: root
    group: root
    mode: "{{ infra_mode_file_restricted }}"
  when: host_os_bootstrap_root_authorized_keys | default([]) | length > 0
  become: true

# ---------------------------------------------------------------------------
# SSH Server Configuration
# ---------------------------------------------------------------------------
- name: Ensure SSH privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "{{ infra_mode_dir }}"
  become: true

- name: Configure SSH server
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
    validate: "sshd -t -f %s"
  become: true
  notify:
    - restart ssh
    - restart sshd

# ---------------------------------------------------------------------------
# Automatic Security Updates
# ---------------------------------------------------------------------------
- name: Configure unattended-upgrades (Debian/Ubuntu)
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - host_os_bootstrap_unattended_upgrades_enabled | bool
  become: true

- name: Enable automatic apt updates (Debian/Ubuntu)
  ansible.builtin.template:
    src: auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - host_os_bootstrap_unattended_upgrades_enabled | bool
  become: true

- name: Configure dnf-automatic (Red Hat family)
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  loop:
    - { regexp: '^apply_updates', line: 'apply_updates = yes' }
    - { regexp: '^upgrade_type', line: 'upgrade_type = security' }
    - { regexp: '^emit_via', line: 'emit_via = motd' }
  when:
    - ansible_facts['os_family'] == "RedHat"
    - host_os_bootstrap_unattended_upgrades_enabled | bool
  become: true

- name: Enable dnf-automatic timer (Red Hat family)
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: started
    enabled: true
  when:
    - ansible_facts['os_family'] == "RedHat"
    - host_os_bootstrap_unattended_upgrades_enabled | bool
  ignore_errors: true
  become: true

# ---------------------------------------------------------------------------
# Apply Pending Security Updates Immediately
# Only security-marked packages are updated — not all available updates.
# This complements the automatic timers above by ensuring the host is
# patched during the Ansible run rather than waiting for the next timer fire.
# ---------------------------------------------------------------------------
- name: Apply security updates immediately (Red Hat family) # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    security: true
  when:
    - ansible_facts['os_family'] == "RedHat"
    - host_os_bootstrap_apply_security_updates | bool
  become: true

- name: Apply security updates immediately (Debian/Ubuntu)
  ansible.builtin.command:
    cmd: unattended-upgrade -v
  when:
    - ansible_facts['os_family'] == "Debian"
    - host_os_bootstrap_apply_security_updates | bool
  register: debian_security_updates
  changed_when: "'No packages need to be updated' not in debian_security_updates.stdout"
  become: true
