---
# Three-phase volume ownership init for a single volume.
# Included once per item in volume_init_volumes.
#
# Loop variable: volume_spec (dict with name, and optionally mount/uid/gid/mode)
# Per ADR-20260822001.

# --- Apply intelligent defaults for this volume spec ---
# Done via set_fact so the rest of this file can reference _vi_* vars
# without repeating the default filters on every task.
- name: "Set defaults for volume {{ volume_spec.name }}"
  ansible.builtin.set_fact:
    _vi_name: "{{ volume_spec.name }}"
    _vi_mount: "{{ volume_spec.mount | default('/data') }}"
    _vi_uid: "{{ volume_spec.uid | default(1000) }}"
    _vi_gid: "{{ volume_spec.gid | default(1000) }}"
    _vi_mode: "{{ volume_spec.mode | default('755') }}"

# --- Phase 0: Ensure the Docker volume exists ---
# Skipped when volume_init_create_volumes is false (volume managed elsewhere).
- name: "Ensure volume {{ _vi_name }} exists"
  ansible.builtin.shell: >-
    docker volume inspect {{ _vi_name }} 2>/dev/null
    || docker volume create {{ _vi_name }}
  environment:
    DOCKER_HOST: "{{ volume_init_docker_host }}"
  delegate_to: localhost
  changed_when: false
  when: volume_init_create_volumes | bool
  tags: ["deploy", "volume"]

# --- Phase 1: chown + in-container verify ---
# The localnet-volume-init container does both: chown -R, chmod, then
# stat-checks within the same mount namespace. Exit codes:
#   0 = ok, 1 = param error, 2 = chown/chmod failed,
#   3 = persistence verify failed, 4 = in-container verify failed
- name: "Fix ownership of {{ _vi_name }} ({{ _vi_uid }}:{{ _vi_gid }} mode {{ _vi_mode }})"
  ansible.builtin.command: >-
    docker run --rm
    -v {{ _vi_name }}:{{ _vi_mount }}
    -e DATA_DIR={{ _vi_mount }}
    {{ volume_init_image }}
    {{ _vi_uid }} {{ _vi_gid }} {{ _vi_mode }}
  environment:
    DOCKER_HOST: "{{ volume_init_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "volume"]

# --- Phase 2: fresh-container verify ---
# Separate container, fresh mount namespace — re-reads from the volume's
# backing store. Catches Docker Desktop WSL2 persistence failures where
# Phase 1's chown appeared to succeed but didn't persist.
# Exit codes: 0 = match, 1 = param error, 2 = mismatch
- name: "Verify {{ _vi_name }} ownership persisted ({{ _vi_uid }}:{{ _vi_gid }})"
  ansible.builtin.command: >-
    docker run --rm --entrypoint /usr/local/bin/verify-volume
    -v {{ _vi_name }}:{{ _vi_mount }}
    -e DATA_DIR={{ _vi_mount }}
    {{ volume_init_image }}
    verify {{ _vi_uid }} {{ _vi_gid }}
  environment:
    DOCKER_HOST: "{{ volume_init_docker_host }}"
  delegate_to: localhost
  register: _vi_verify
  changed_when: false
  failed_when: _vi_verify.rc != 0
  tags: ["deploy", "volume"]
