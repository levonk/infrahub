---
# Media Stack — Default Variables
# Jellyfin + *arr media pipeline deployed to Windows Docker Desktop (dtop202311).
# Upstream images from Docker Hub / GHCR / LinuxServer.io.
# See shared/docs/pipelines/media/PIPELINE-MEDIA.md for the full pipeline.

# Service Configuration
media_stack_enabled: true

# Docker host for SSH-tunneled CLI (Windows Docker Desktop)
media_stack_docker_host: "{{ proxy_traefik_windows_docker_host | default('ssh://ansible@dtop202311.tale-grouper.ts.net') }}"

# Network — joins traefik-windows-network for Traefik routing
media_stack_network_name: "{{ proxy_traefik_windows_network_name | default('traefik-windows-network') }}"

# Shared media data volume (movies, tv, music, comics, downloads, audiobooks)
media_stack_data_volume: "{{ infra_storage_media_data_volume | default('localnet-media-data-volume') }}"

# Timezone
media_stack_tz: "{{ localnet_tz | default('UTC') }}"

# PUID/PGID for LinuxServer.io images (consistent file ownership)
media_stack_puid: "1000"
media_stack_pgid: "1000"

# Logging
media_stack_log_max_size: "10m"
media_stack_log_max_file: "5"

# Healthcheck defaults
media_stack_healthcheck_interval: "30s"
media_stack_healthcheck_timeout: "10s"
media_stack_healthcheck_retries: 3
media_stack_healthcheck_start_period: "30s"
media_stack_healthcheck_host: "127.0.0.1"

# Health verification (Ansible retry loop)
media_stack_health_verify_retries: 30
media_stack_health_verify_delay: 10

# Verify health after deploy
media_stack_verify_health: true

