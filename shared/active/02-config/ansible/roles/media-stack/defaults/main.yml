media_stack_jellyfin_container_name: "{{ infra_hostname_media_jellyfin | default('localnet-media-jellyfin') }}"
media_stack_jellyfin_image: "jellyfin/jellyfin"
media_stack_jellyfin_image_tag: "latest"
media_stack_jellyfin_host_port: "{{ infra_port_media_jellyfin_host | default('8096') }}"  # project-lint: disable=magic-int  fallback port
media_stack_jellyfin_container_port: "{{ infra_port_media_jellyfin_container | default('8096') }}"  # project-lint: disable=magic-int  fallback container port
media_stack_jellyfin_discovery_host_port: "{{ infra_port_media_jellyfin_discovery_host | default('7359') }}"  # project-lint: disable=magic-int
media_stack_jellyfin_discovery_container_port: "{{ infra_port_media_jellyfin_discovery_container | default('7359') }}"  # project-lint: disable=magic-int
media_stack_jellyfin_config_volume: "{{ infra_storage_media_jellyfin_config_volume | default('localnet-media-jellyfin-config-volume') }}"
media_stack_jellyfin_cache_volume: "{{ infra_storage_media_jellyfin_cache_volume | default('localnet-media-jellyfin-cache-volume') }}"
media_stack_jellyfin_domain: "{{ infra_domain_media_jellyfin | default('jellyfin.nl.levonk.com') }}"
media_stack_jellyfin_domain_alias: "{{ infra_domain_media_jellyfin_alias | default('media.levonk.com') }}"

