# ============================================================================
# Status Report
# ============================================================================
- name: Get media stack container statuses
  ansible.builtin.command: >-
    docker ps --format '{% raw %}{{.Names}}\t{{.Status}}{% endraw %}'
    --filter name=localnet-media-
  environment:
    DOCKER_HOST: "{{ media_stack_docker_host }}"
  delegate_to: localhost
  register: media_stack_status
  changed_when: false
  ignore_errors: true
  tags: ["always", "info"]

- name: Report media stack status
  ansible.builtin.debug:
    msg: |
      Media stack deployed on dtop202311 (nl region):
        Jellyfin:      https://{{ media_stack_jellyfin_domain }} (port {{ media_stack_jellyfin_host_port }})
        Jellyseerr:   https://{{ media_stack_jellyseerr_domain }} (port {{ media_stack_jellyseerr_host_port }})
        Radarr:       https://{{ media_stack_radarr_domain }} (port {{ media_stack_radarr_host_port }})
        Sonarr:       https://{{ media_stack_sonarr_domain }} (port {{ media_stack_sonarr_host_port }})
        Lidarr:       https://{{ media_stack_lidarr_domain }} (port {{ media_stack_lidarr_host_port }})
        Bazarr:       https://{{ media_stack_bazarr_domain }} (port {{ media_stack_bazarr_host_port }})
        Prowlarr:     https://{{ media_stack_prowlarr_domain }} (port {{ media_stack_prowlarr_host_port }})
        Kapowarr:     https://{{ media_stack_kapowarr_domain }} (port {{ media_stack_kapowarr_host_port }})
        Whisparr:     https://{{ media_stack_whisparr_domain }} (port {{ media_stack_whisparr_host_port }})
        Audiobookshelf: https://{{ media_stack_audiobookshelf_domain }} (port {{ media_stack_audiobookshelf_host_port }})
        Flaresolverr: internal (port {{ media_stack_flaresolverr_host_port }})
        Recyclarr:    internal (cron, no port)
        Unpackarr:    internal (sidecar, no port)

      Container statuses:
      {{ media_stack_status.stdout | default('unknown') }}
  tags: ["always", "info"]
