---
# Media Stack Windows (nl) deployment — ssh-tunneled Docker CLI pattern
# Target: Windows Docker Desktop (dtop202311, X86).
#
# community.docker modules can't run on Windows (Ansible core basic.py imports
# grp, Unix-only). We use ansible.builtin.shell with DOCKER_HOST: ssh:// and
# delegate_to: localhost, matching the stirling-pdf / search-hister pattern.

# ============================================================================
# Volume Management — three-phase ownership init per ADR-20260822001.
# All *arr services run as UID 1000 inside the container (LinuxServer.io).
# Jellyfin runs as UID 1000. Audiobookshelf runs as UID 1000.
# ============================================================================
- name: Initialize media stack volumes ownership
  ansible.builtin.include_role:
    name: localnet-volume-init
  vars:
    volume_init_docker_host: "{{ media_stack_docker_host }}"
    volume_init_volumes:
      - name: "{{ media_stack_data_volume }}"
        mount: /media
      - name: "{{ media_stack_jellyfin_config_volume }}"
        mount: /config
      - name: "{{ media_stack_jellyfin_cache_volume }}"
        mount: /cache
      - name: "{{ media_stack_jellyseerr_config_volume }}"
        mount: /app/config
      - name: "{{ media_stack_radarr_config_volume }}"
        mount: /config
      - name: "{{ media_stack_sonarr_config_volume }}"
        mount: /config
      - name: "{{ media_stack_lidarr_config_volume }}"
        mount: /config
      - name: "{{ media_stack_bazarr_config_volume }}"
        mount: /config
      - name: "{{ media_stack_prowlarr_config_volume }}"
        mount: /config
      - name: "{{ media_stack_kapowarr_config_volume }}"
        mount: /app/db
      - name: "{{ media_stack_whisparr_config_volume }}"
        mount: /config
      - name: "{{ media_stack_audiobookshelf_config_volume }}"
        mount: /config
      - name: "{{ media_stack_audiobookshelf_metadata_volume }}"
        mount: /metadata
      - name: "{{ media_stack_flaresolverr_config_volume }}"
        mount: /config
      - name: "{{ media_stack_recyclarr_config_volume }}"
        mount: /config
      - name: "{{ media_stack_unpackarr_config_volume }}"
        mount: /config
  tags: ["deploy", "volume"]

# ============================================================================
# Pull Images
# ============================================================================
- name: Pull media stack images
  ansible.builtin.command: "docker pull {{ item }}"
  environment:
    DOCKER_HOST: "{{ media_stack_docker_host }}"
    DOCKER_CONFIG: "{{ lookup('env', 'HOME') }}/.docker-no-creds"
  delegate_to: localhost
  changed_when: true
  loop:
    - "{{ media_stack_jellyfin_image }}:{{ media_stack_jellyfin_image_tag }}"
    - "{{ media_stack_jellyseerr_image }}:{{ media_stack_jellyseerr_image_tag }}"
    - "{{ media_stack_radarr_image }}:{{ media_stack_radarr_image_tag }}"
    - "{{ media_stack_sonarr_image }}:{{ media_stack_sonarr_image_tag }}"
    - "{{ media_stack_lidarr_image }}:{{ media_stack_lidarr_image_tag }}"
    - "{{ media_stack_bazarr_image }}:{{ media_stack_bazarr_image_tag }}"
    - "{{ media_stack_prowlarr_image }}:{{ media_stack_prowlarr_image_tag }}"
    - "{{ media_stack_kapowarr_image }}:{{ media_stack_kapowarr_image_tag }}"
    - "{{ media_stack_whisparr_image }}:{{ media_stack_whisparr_image_tag }}"
    - "{{ media_stack_audiobookshelf_image }}:{{ media_stack_audiobookshelf_image_tag }}"
    - "{{ media_stack_flaresolverr_image }}:{{ media_stack_flaresolverr_image_tag }}"
    - "{{ media_stack_recyclarr_image }}:{{ media_stack_recyclarr_image_tag }}"
    - "{{ media_stack_unpackarr_image }}:{{ media_stack_unpackarr_image_tag }}"
  tags: ["deploy", "pull"]

# ============================================================================
# Stop existing containers (idempotent re-deploy)
# ============================================================================
- name: Stop existing media stack containers
  ansible.builtin.shell: >-
    docker rm -f
    {{ media_stack_jellyfin_container_name }}
    {{ media_stack_jellyseerr_container_name }}
    {{ media_stack_radarr_container_name }}
    {{ media_stack_sonarr_container_name }}
    {{ media_stack_lidarr_container_name }}
    {{ media_stack_bazarr_container_name }}
    {{ media_stack_prowlarr_container_name }}
    {{ media_stack_kapowarr_container_name }}
    {{ media_stack_whisparr_container_name }}
    {{ media_stack_audiobookshelf_container_name }}
    {{ media_stack_flaresolverr_container_name }}
    {{ media_stack_recyclarr_container_name }}
    {{ media_stack_unpackarr_container_name }}
    2>/dev/null || true
  environment:
    DOCKER_HOST: "{{ media_stack_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "container"]

# ============================================================================
# Deploy Jellyfin — media server
# ============================================================================
- name: Deploy Jellyfin container
  ansible.builtin.command: >-
    docker run -d
    --name {{ media_stack_jellyfin_container_name }}
    --restart unless-stopped
    --network {{ media_stack_network_name }}
    -p {{ media_stack_jellyfin_host_port }}:{{ media_stack_jellyfin_container_port }}/tcp
    -p {{ media_stack_jellyfin_discovery_host_port }}:{{ media_stack_jellyfin_discovery_container_port }}/udp
    -v {{ media_stack_jellyfin_config_volume }}:/config:rw
    -v {{ media_stack_jellyfin_cache_volume }}:/cache:rw
    -v {{ media_stack_data_volume }}:/media:rw
    -e TZ={{ media_stack_tz }}
    -e JELLYFIN_PublishedServerUrl=https://{{ media_stack_jellyfin_domain }}
    --log-driver json-file
    --log-opt max-size={{ media_stack_log_max_size }}
    --log-opt max-file={{ media_stack_log_max_file }}
    --health-cmd "curl -sf http://{{ media_stack_healthcheck_host }}:{{ media_stack_jellyfin_container_port }}/health || exit 1"
    --health-interval {{ media_stack_healthcheck_interval }}
    --health-timeout {{ media_stack_healthcheck_timeout }}
    --health-retries {{ media_stack_healthcheck_retries }}
    --health-start-period {{ media_stack_healthcheck_start_period }}
    --security-opt no-new-privileges:true
    {{ media_stack_jellyfin_image }}:{{ media_stack_jellyfin_image_tag }}
  environment:
    DOCKER_HOST: "{{ media_stack_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "container", "jellyfin"]

# ============================================================================
# Deploy Jellyseerr — request management UI
# ============================================================================
