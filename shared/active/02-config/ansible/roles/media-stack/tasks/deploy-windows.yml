# ============================================================================
# Wait for health (Jellyfin + Jellyseerr + Audiobookshelf + Flaresolverr)
# ============================================================================
- name: Wait for Jellyfin to be healthy
  ansible.builtin.command: >-
    docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' {{ media_stack_jellyfin_container_name }}
  environment:
    DOCKER_HOST: "{{ media_stack_docker_host }}"
  delegate_to: localhost
  register: media_stack_jellyfin_health
  until: media_stack_jellyfin_health.stdout == "healthy"
  retries: "{{ media_stack_health_verify_retries }}"
  delay: "{{ media_stack_health_verify_delay }}"
  changed_when: false
  ignore_errors: true
  when: media_stack_verify_health | bool
  tags: ["deploy", "container", "jellyfin"]

- name: Wait for Jellyseerr to be healthy
  ansible.builtin.command: >-
    docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' {{ media_stack_jellyseerr_container_name }}
  environment:
    DOCKER_HOST: "{{ media_stack_docker_host }}"
  delegate_to: localhost
  register: media_stack_jellyseerr_health
  until: media_stack_jellyseerr_health.stdout == "healthy"
