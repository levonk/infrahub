    --restart unless-stopped
    --network {{ media_stack_network_name }}
    -p {{ media_stack_jellyseerr_host_port }}:{{ media_stack_jellyseerr_container_port }}/tcp
    -v {{ media_stack_jellyseerr_config_volume }}:/app/config:rw
    -e PUID={{ media_stack_puid }}
    -e PGID={{ media_stack_pgid }}
    -e TZ={{ media_stack_tz }}
    -e LOG_LEVEL=info
    --log-driver json-file
    --log-opt max-size={{ media_stack_log_max_size }}
    --log-opt max-file={{ media_stack_log_max_file }}
    --health-cmd "curl -sf http://{{ media_stack_healthcheck_host }}:{{ media_stack_jellyseerr_container_port }}/api/v1/status || exit 1"
    --health-interval {{ media_stack_healthcheck_interval }}
    --health-timeout {{ media_stack_healthcheck_timeout }}
    --health-retries {{ media_stack_healthcheck_retries }}
    --health-start-period {{ media_stack_healthcheck_start_period }}
    --security-opt no-new-privileges:true
    {{ media_stack_jellyseerr_image }}:{{ media_stack_jellyseerr_image_tag }}
  environment:
    DOCKER_HOST: "{{ media_stack_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "container", "jellyseerr"]

