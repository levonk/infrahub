---
# Media Stack — Deployment Tasks
# Deploys Jellyfin + *arr media pipeline as Docker containers on Windows
# Docker Desktop (dtop202311, nl region).
#
# Uses the ssh-tunneled Docker CLI pattern (DOCKER_HOST: ssh:// + delegate_to: localhost)
# because community.docker modules can't run on Windows (Ansible core basic.py
# imports grp, Unix-only).
#
# See shared/docs/pipelines/media/PIPELINE-MEDIA.md for the full pipeline.

# 1. Validate required variables
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - media_stack_docker_host is defined
      - media_stack_network_name is defined
      - media_stack_data_volume is defined
      - media_stack_jellyfin_container_name is defined
      - media_stack_jellyfin_image is defined
      - media_stack_jellyfin_host_port is defined
    fail_msg: >-
      Missing required media_stack variables. Check infrastructure files
      (ports.yml, domains.yml, storage.yml) and client overrides.
    success_msg: "All required media_stack variables are defined."
  tags: ["always", "validate"]

# 2. Dispatch to Windows deployment or undeployment
- name: Deploy media stack on Windows Docker host
  ansible.builtin.include_tasks: deploy-windows.yml
  when:
    - media_stack_enabled | bool
    - "'windows_docker_hosts' in group_names"
  tags: ["deploy"]

- name: Undeploy media stack on Windows Docker host (disabled state)
  ansible.builtin.include_tasks: undeploy-windows.yml
  when:
    - not (media_stack_enabled | bool)
    - "'windows_docker_hosts' in group_names"
  tags: ["undeploy"]
