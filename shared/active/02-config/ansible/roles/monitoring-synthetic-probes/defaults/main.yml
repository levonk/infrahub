---
# defaults file for monitoring-synthetic-probes
# Synthetic probes for AI, DNS, web, and VPN pipeline validation.
# All ports and IPs must be variables — never hardcode.

# ---------------------------------------------------------------------------
# Image & Container
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_container_name: "localnet-monitoring-synthetic-probes"
monitoring_synthetic_probes_image_name: "alpine"
monitoring_synthetic_probes_image_tag: "3.24"

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_network: "{{ infra_network_proxy_traefik_network_name | default('traefik-network') }}"

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_scripts_dir: "{{ infra_storage_monitoring_config_dir | default('/opt/localnet/monitoring/synthetic-probes') }}/scripts"
monitoring_synthetic_probes_textfile_dir: "{{ infra_storage_monitoring_node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile_collector') }}/probes"

# ---------------------------------------------------------------------------
# AI Pipeline — LiteLLM probe
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_litellm_endpoint: "http://{{ infra_hostname_ai_litellm | default('localnet-ai-litellm') }}:{{ infra_port_ai_litellm_container | default(4000) }}/v1/chat/completions"  # project-lint: disable=magic-int  litellm port
monitoring_synthetic_probes_litellm_api_key: "{{ vault_litellm_synthetic_probe_key | default('') }}"

# ---------------------------------------------------------------------------
# AI Pipeline — Omnigent probe
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_omnigent_endpoint: "http://{{ infra_hostname_ai_omnigent | default('localnet-ai-omnigent') }}:{{ infra_port_ai_omnigent_container | default(8000) }}"  # project-lint: disable=magic-int  omnigent port
monitoring_synthetic_probes_omnigent_api_key: "{{ vault_omnigent_synthetic_probe_key | default('') }}"

# ---------------------------------------------------------------------------
# DNS Pipeline
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_dns_internal_domain: "{{ infra_domain_base | default('levonk.com') }}"

# ---------------------------------------------------------------------------
# Web Proxy Pipeline
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_web_proxy_url: "http://{{ infra_hostname_proxy_mitm | default('localnet-proxy-mitm') }}:{{ infra_port_proxy_mitm_container | default(8080) }}"  # project-lint: disable=magic-int  mitm port
monitoring_synthetic_probes_web_target_url: "http://example.com"

# ---------------------------------------------------------------------------
# VPN/Egress Pipeline
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_host_public_ip: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
monitoring_synthetic_probes_nordvpn_socks5: "{{ infra_hostname_vpn_nordvpn | default('localnet-vpn-nordvpn') }}:{{ infra_port_vpn_nordvpn_socks_container | default(1080) }}"  # project-lint: disable=magic-int  nordvpn socks port
monitoring_synthetic_probes_tor_socks5_hostname: "{{ infra_hostname_proxy_tor | default('localnet-proxy-tor') }}:{{ infra_port_proxy_tor_socks5_container | default(9050) }}"  # project-lint: disable=magic-int  tor socks port

# ---------------------------------------------------------------------------
# Per-service liveness probes (generic HTTP/TCP checks)
# Emits service_probe_success{pipeline,stage,service} and
# service_probe_duration_seconds{pipeline,stage,service} via textfile collector.
#
# type: http (curl; expect "200" = exact status, "any" = any HTTP response)
#       tcp  (nc connect test; expect is ignored)
# host.docker.internal = OCI host-published ports (host-gateway, see tasks).
# infra_tailscale_fqdn_windows_docker = Windows Docker host (dtop202311) via tailnet.
# ---------------------------------------------------------------------------
monitoring_synthetic_probes_probe_timeout: "15"

monitoring_synthetic_probes_service_checks:
  # ── AI pipeline chain (OCI host-published ports) ──
  - { service: "omnigent",   pipeline: "ai", stage: "agent",         type: "http", target: "http://host.docker.internal:{{ infra_port_ai_omnigent_host }}/",                   expect: "any" }
  - { service: "pi",         pipeline: "ai", stage: "agent",         type: "http", target: "http://host.docker.internal:{{ infra_port_ai_pi_host }}/",                         expect: "any" }
  - { service: "litellm",    pipeline: "ai", stage: "gateway",       type: "http", target: "http://host.docker.internal:{{ infra_port_ai_litellm_host }}/health",              expect: "200" }  # project-lint: disable=magic-int  http ok status
  - { service: "headroom",   pipeline: "ai", stage: "compression",   type: "http", target: "http://host.docker.internal:{{ infra_port_ai_headroom_host }}/",                   expect: "any" }
  - { service: "omniroute",  pipeline: "ai", stage: "routing",       type: "http", target: "http://host.docker.internal:{{ infra_port_ai_omniroute_host }}/",                  expect: "any" }
  - { service: "forge",      pipeline: "ai", stage: "forge",         type: "http", target: "http://host.docker.internal:{{ infra_port_ai_forge_host }}/",                      expect: "any" }
  - { service: "iron-proxy", pipeline: "ai", stage: "iron-proxy",    type: "tcp",  target: "host.docker.internal:{{ infra_port_proxy_iron_proxy_http_host }}" }
  - { service: "nordvpn",    pipeline: "ai", stage: "egress",        type: "tcp",  target: "host.docker.internal:{{ infra_port_vpn_nordvpn_socks_host }}" }
  # ── AI pipeline request-origin peers ──
  - { service: "paperclip",  pipeline: "ai", stage: "orchestration", type: "http", target: "http://host.docker.internal:{{ infra_port_ai_paperclip_host }}/health",            expect: "any" }
  - { service: "buzz",       pipeline: "ai", stage: "relay",         type: "http", target: "http://host.docker.internal:{{ infra_port_ai_buzz_health_host }}/_liveness",       expect: "200" }  # project-lint: disable=magic-int  http ok status
  # ── DNS pipeline ──
  - { service: "adguard",    pipeline: "dns", stage: "filter",       type: "http", target: "http://host.docker.internal:{{ infra_port_dns_adguard_web_host }}/",               expect: "any" }
  - { service: "dnscrypt",   pipeline: "dns", stage: "proxy",        type: "tcp",  target: "host.docker.internal:{{ infra_port_dns_dnscrypt_plaintext_host }}" }
  - { service: "tor-dns",    pipeline: "dns", stage: "proxy",        type: "tcp",  target: "host.docker.internal:{{ infra_port_proxy_tor_socks5_host }}" }
  # ── Web proxy pipeline ──
  - { service: "mitm",       pipeline: "web", stage: "interception", type: "tcp",  target: "host.docker.internal:{{ infra_port_proxy_mitm_adblock_host }}" }
  - { service: "privoxy",    pipeline: "web", stage: "filtering",    type: "tcp",  target: "host.docker.internal:{{ infra_port_proxy_privoxy_host }}" }
  - { service: "varnish",    pipeline: "web", stage: "cache",        type: "http", target: "http://host.docker.internal:{{ infra_port_proxy_varnish_http_host }}/",            expect: "any" }
  - { service: "gost",       pipeline: "web", stage: "egress",       type: "tcp",  target: "host.docker.internal:{{ infra_port_proxy_gost_socks5_host }}" }
  - { service: "tor-web",    pipeline: "web", stage: "egress",       type: "tcp",  target: "host.docker.internal:{{ infra_port_proxy_tor_socks5_host }}" }
  # ── VPN/egress pipeline ──
  - { service: "nordvpn",    pipeline: "vpn", stage: "egress-nordvpn", type: "tcp", target: "host.docker.internal:{{ infra_port_vpn_nordvpn_socks_host }}" }
  - { service: "tor-egress", pipeline: "vpn", stage: "egress-tor",   type: "tcp",  target: "host.docker.internal:{{ infra_port_proxy_tor_socks5_host }}" }
  # ── Media pipeline (Windows Docker host — direct host ports via tailnet) ──
  - { service: "radarr",      pipeline: "media", stage: "manager",   type: "http", target: "http://{{ infra_tailscale_fqdn_windows_docker }}:{{ infra_port_media_radarr_host }}/ping",      expect: "200" }  # project-lint: disable=magic-int  http ok status
  - { service: "sonarr",      pipeline: "media", stage: "manager",   type: "http", target: "http://{{ infra_tailscale_fqdn_windows_docker }}:{{ infra_port_media_sonarr_host }}/ping",      expect: "200" }  # project-lint: disable=magic-int  http ok status
  - { service: "jellyfin",    pipeline: "media", stage: "streaming", type: "http", target: "http://{{ infra_tailscale_fqdn_windows_docker }}:{{ infra_port_media_jellyfin_host }}/health",  expect: "200" }  # project-lint: disable=magic-int  http ok status
  # qBittorrent shares nordvpn's netns (no host port) — probed via Traefik domain.
  - { service: "qbittorrent", pipeline: "media", stage: "download",  type: "http", target: "https://{{ infra_domain_media_qbittorrent }}/",                                   expect: "any" }
  # ── Apps ──
  - { service: "jobops",      pipeline: "apps", stage: "standalone", type: "http", target: "http://{{ infra_tailscale_fqdn_windows_docker }}:{{ infra_port_career_jobops_host }}/",       expect: "any" }
  # ── Infra self-monitoring (Uptime Kuma has no /metrics endpoint) ──
  - { service: "uptime-kuma", pipeline: "infra", stage: "monitoring", type: "http", target: "http://host.docker.internal:{{ infra_port_monitoring_uptime_kuma_host }}/",      expect: "any" }
