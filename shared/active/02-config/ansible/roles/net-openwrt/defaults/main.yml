---
# net-openwrt role defaults
# Manages OpenWrt devices (UCI config via rendered /etc/config files).
# Modes:
#   ap     — bridged access point (no NAT/DHCP/firewall). Default.
#   router — gateway with NAT, DHCP, firewall, optional mwan3 multi-WAN.
# ---------------------------------------------------------------------------

openwrt_mode: "ap"
openwrt_hostname: "{{ inventory_hostname }}"
openwrt_timezone: "UTC"
openwrt_zonename: "UTC"
openwrt_country: "US"

# ---------------------------------------------------------------------------
# Bootstrap
# ---------------------------------------------------------------------------
# Fresh OpenWrt has no Python; the role installs python3 + support packages
# via raw/apk (25.x) or raw/opkg (older) so Ansible modules work afterwards.
openwrt_bootstrap_python: true
# python3-light alone is NOT enough for ansible-core modules (missing idna
# codec, urllib, ctypes...). openssh-sftp-server lets ansible transfer module
# payloads (dropbear ships no sftp).
openwrt_bootstrap_python_packages:
  - "python3-light"
  - "python3-codecs"
  - "python3-ctypes"
  - "python3-logging"
  - "python3-urllib"
  - "python3-email"
  - "python3-openssl"
  - "python3-multiprocessing"
  - "python3-decimal"
  - "python3-pydoc"
  - "openssh-sftp-server"
openwrt_packages: []
# Packages removed before openwrt_packages install (e.g. wpad-basic-mbedtls
# when swapping in wpad-mesh-mbedtls).
openwrt_packages_remove: []
openwrt_admin_authorized_keys: []

# Tailscale security floor — when set, the role compares the INSTALLED
# tailscaled version against it and only then fetches the matching upstream
# static build (pkgs.tailscale.com). If the feed package is ever >= this
# version (feed catches up, or a sysupgrade reinstalls a newer package) the
# task skips — the managed floor never downgrades anything. Empty = feed
# package as-is. Note: upstream static tailscaled is NOT multicall, so the
# packaged /usr/sbin/tailscale CLI symlink stops working — the CLI is a
# separate binary upstream ships next to the daemon.
openwrt_tailscale_version: ""
openwrt_tailscale_arch: "arm"  # pkgs.tailscale.com arch suffix (arm = armv7)

# tailscaled outbound proxy — rendered into UCI 'proxy_url' and exported as
# HTTPS_PROXY/ALL_PROXY by the managed init script. Needed on WAN-less boxes:
# e.g. "http://127.0.0.1:8899" pointing at an SSH -R forward to a host with
# internet. Empty = direct outbound (normal once WAN exists).
openwrt_tailscale_proxy: ""
# Optional tailnet pre-auth key (point at a vault var) for unattended
# `tailscale up` on nodes that aren't already logged in. Empty = skip —
# existing registrations survive anyway via /etc/tailscale in sysupgrade.conf.
openwrt_tailscale_auth_key: ""

# Root password — empty means "leave whatever is on the device". Point at a
# client vault var (e.g. openwrt_root_password: "{{ vault_... }}") to manage
# it: the task writes the sha512-crypt hash into /etc/shadow so plaintext
# never touches the device config or logs. Fixed salt keeps it idempotent.
openwrt_root_password: ""
openwrt_root_password_salt: "wrt0p3n.5a1t"

# ---------------------------------------------------------------------------
# LAN / management interface (br-lan)
# ---------------------------------------------------------------------------
# AP mode: static mgmt IP, both ethernet ports bridged into br-lan.
# Router mode: only openwrt_lan_ports bridged; WAN ports handled separately.
openwrt_lan_device: "br-lan"
openwrt_lan_ports:
  - "lan"
  - "wan"
openwrt_lan_proto: "static"
openwrt_lan_ipaddr: ""          # REQUIRED — per-host mgmt IP
openwrt_lan_netmask: "255.255.255.0"
openwrt_lan_gateway: ""         # REQUIRED in ap mode — upstream router IP
openwrt_lan_dns: []
# PVID the lan (mgmt) interface binds to once VLAN filtering is active
# (openwrt_bridge_vlans non-empty → device becomes br-lan.<pvid>).
openwrt_lan_pvid: 1

# 802.1q VLANs on the LAN bridge (AP mode: trunk tagged VLANs between the
# uplink ports; each SSID attaches to a VLAN sub-interface). DSA syntax.
# Each: {vid, device: "br-lan", tagged_ports: [...], untagged_ports: [...]}
openwrt_bridge_vlans: []

# Additional bridge interfaces (e.g. per-SSID VLAN segments).
# Each: {name, device (default br-<name>; use br-lan.<vid> for a VLAN),
#        proto (default static; "none" for pure bridge), ipaddr, netmask,
#        dhcp: bool, zone: "lan"}
openwrt_extra_interfaces: []

# ---------------------------------------------------------------------------
# WAN interfaces (router mode only)
# ---------------------------------------------------------------------------
# Each: {name, device, proto, ipaddr, netmask, gateway, dns, metric, peerdns}
# proto dhcp: only name/device/metric required.
# Two WANs on the same L2 subnet with different gateways is supported
# (mwan3 policy-routes each member's traffic via its own gateway).
openwrt_wan_interfaces: []
openwrt_wan_port: "wan"

# ---------------------------------------------------------------------------
# DHCP server (router mode + extra interfaces with dhcp: true)
# ---------------------------------------------------------------------------
openwrt_dhcp_start: 100
openwrt_dhcp_limit: 150
openwrt_dhcp_leasetime: "12h"

# ---------------------------------------------------------------------------
# Wireless
# ---------------------------------------------------------------------------
# Radio devices — Linksys WHW01/VLP01: radio0 = 2.4 GHz, radio1 = 5 GHz.
# `path` (or `phy`) is REQUIRED: without it wifi-scripts cannot bind the
# section to a physical radio (shows "Bug: PHY is undefined for device" in
# logread, radio stays down, retry_setup_failed in `wifi status`).
# Get values from `wifi status` / board.json, or the generated default config.
openwrt_radios:
  - name: "radio0"
    path: "platform/soc/a000000.wifi"
    band: "2g"
    channel: "auto"
    htmode: "HT40"
    disabled: false
  - name: "radio1"
    path: "platform/soc/a800000.wifi"
    band: "5g"
    channel: "auto"
    htmode: "VHT80"
    disabled: false

# SSIDs. Each entry:
#   ssid:          broadcast name (required)
#   key:           PSK (required unless encryption: "none")
#   encryption:    sae-mixed (WPA2/WPA3 transitional), psk2, sae, none
#   network:       interface to attach to (default: lan)
#   radios:        subset of radio names (default: all)
#   ieee80211r:    fast roaming FT (default true — same mobility_domain on all APs)
#   mobility_domain: 4-hex-digit domain (default in openwrt_mobility_domain)
#   ieee80211k:    radio resource measurement (default true)
#   ieee80211w:    PMF: 0=off, 1=optional, 2=required (default 1)
#   isolate:       client isolation (default false)
#   hidden:        hide SSID (default false)
#   disabled:      keep defined but off air (default false)
openwrt_mobility_domain: "4f57"
openwrt_wireless_networks: []

# 802.11s wireless backhaul — emits a `mode mesh` wifi-iface on each listed
# radio, bridged into the given network. Leave `id` empty to disable.
# Encrypted mesh (sae) requires wpad-mesh-mbedtls instead of wpad-basic-* —
# put it in openwrt_packages and the replaced package in
# openwrt_packages_remove. Peers must share mesh_id, key, encryption AND
# channel — use a fixed non-DFS channel on the backhaul radio.
openwrt_mesh:
  id: ""
  key: ""
  encryption: "sae"
  radios: []
  network: "lan"

# ---------------------------------------------------------------------------
# Dropbear (SSH)
# ---------------------------------------------------------------------------
openwrt_dropbear_port: 22
openwrt_dropbear_interface: ""          # "" = listen on all interfaces
openwrt_dropbear_password_auth: true    # set false once key auth verified
openwrt_dropbear_root_password_auth: true

# ---------------------------------------------------------------------------
# mwan3 multi-WAN (router mode)
# ---------------------------------------------------------------------------
# Members are auto-generated from openwrt_wan_interfaces (list order =
# failover priority). Policies auto-generated: "balanced" (equal load-share)
# and "<wan>_only" per interface. openwrt_mwan3_rules maps traffic → policy.
openwrt_mwan3_enabled: false
openwrt_mwan3_track_ips:
  - "1.1.1.1"
  - "8.8.8.8"
openwrt_mwan3_reliability: 1
openwrt_mwan3_count: 1
openwrt_mwan3_timeout: 2
openwrt_mwan3_interval: 5
openwrt_mwan3_down: 3
openwrt_mwan3_up: 3
# Each: {use_policy, src_ip, dest_ip, proto, sticky, timeout}
# src_ip accepts interface names, subnets, IPs. Omit fields to match all.
openwrt_mwan3_rules:
  - use_policy: "balanced"
    src_ip: "any"
    dest_ip: "any"

# ---------------------------------------------------------------------------
# Services to disable in pure AP mode
# ---------------------------------------------------------------------------
openwrt_ap_disabled_services:
  - "dnsmasq"
  - "odhcpd"
  - "firewall"
