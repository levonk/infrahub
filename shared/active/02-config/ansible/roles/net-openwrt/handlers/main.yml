---
# Handlers run at play end so connectivity-disrupting reloads happen once.

- name: reload system
  ansible.builtin.command: /etc/init.d/system reload

# logd/logread followers don't pick up log_file/log_size changes on
# /etc/init.d/system reload — the log service must restart to spawn them.
- name: restart log
  ansible.builtin.command: /etc/init.d/log restart

- name: reload network
  ansible.builtin.command: /etc/init.d/network reload

- name: reload wireless
  ansible.builtin.command: wifi reload

- name: reload dropbear
  ansible.builtin.command: /etc/init.d/dropbear reload

- name: reload dnsmasq
  ansible.builtin.command: /etc/init.d/dnsmasq restart

- name: reload firewall
  ansible.builtin.command: /etc/init.d/firewall reload

- name: restart mwan3
  ansible.builtin.command: /usr/sbin/mwan3 restart

- name: restart tailscale
  ansible.builtin.raw: /etc/init.d/tailscale restart || true

- name: reload uhttpd
  ansible.builtin.command: /etc/init.d/uhttpd reload
