---
# Deploy rendered UCI configs and apply service state.

- name: Render /etc/config/system
  ansible.builtin.template:
    src: system.j2
    dest: /etc/config/system
    mode: "0644"
  notify:
    - reload system
    - restart log

- name: Render /etc/config/network
  ansible.builtin.template:
    src: network.j2
    dest: /etc/config/network
    mode: "0644"
  notify: reload network

- name: Render /etc/config/wireless
  ansible.builtin.template:
    src: wireless.j2
    dest: /etc/config/wireless
    mode: "0644"
  notify: reload wireless

- name: Render /etc/config/dropbear
  ansible.builtin.template:
    src: dropbear.j2
    dest: /etc/config/dropbear
    mode: "0644"
  notify: reload dropbear

- name: Set root password (idempotent, vault-managed)
  ansible.builtin.raw: >-
    NEW='{{ openwrt_root_password | password_hash("sha512", salt=openwrt_root_password_salt) }}';
    CUR=$(grep '^root:' /etc/shadow | cut -d: -f2);
    [ "$CUR" = "$NEW" ] && exit 1;
    sed -i "s|^root:[^:]*:|root:$NEW:|" /etc/shadow
  register: openwrt_root_pw
  changed_when: openwrt_root_pw.rc == 0
  failed_when: false
  no_log: true
  when: openwrt_root_password | length > 0

- name: Render /etc/config/dhcp (router mode / extra-interface DHCP)
  ansible.builtin.template:
    src: dhcp.j2
    dest: /etc/config/dhcp
    mode: "0644"
  when: openwrt_mode == "router" or (openwrt_extra_interfaces | selectattr('dhcp', 'defined') | selectattr('dhcp') | list | length > 0)
  notify: reload dnsmasq

- name: Render /etc/config/firewall (router mode)
  ansible.builtin.template:
    src: firewall.j2
    dest: /etc/config/firewall
    mode: "0644"
  when: openwrt_mode == "router"
  notify: reload firewall

# fw4 input dispatch is iifname-based and tailscale0 is not netifd-managed,
# so the lan zone's `list network 'tailscale0'` never matches. The include
# file bridges tailnet input into input_lan on every fw4 reload.
- name: Render /etc/firewall.user (tailscale input bridge)
  ansible.builtin.template:
    src: firewall.user.j2
    dest: /etc/firewall.user
    mode: "0644"
  when: openwrt_mode == "router" and 'tailscale' in openwrt_packages
  notify: reload firewall

- name: Disable services not needed in pure AP mode (idempotent)
  ansible.builtin.raw: >-
    (/etc/init.d/{{ item }} enabled && /etc/init.d/{{ item }} stop &&
    /etc/init.d/{{ item }} disable) || exit 1
  register: openwrt_svc_disable
  changed_when: openwrt_svc_disable.rc == 0
  failed_when: false
  loop: "{{ openwrt_ap_disabled_services }}"
  when: openwrt_mode == "ap"

- name: Enable core services in router mode
  ansible.builtin.raw: >-
    /etc/init.d/{{ item }} enabled && exit 1; /etc/init.d/{{ item }} enable
  register: openwrt_svc_enable
  changed_when: openwrt_svc_enable.rc == 0
  failed_when: false
  loop:
    - "dnsmasq"
    - "odhcpd"
    - "firewall"
  when: openwrt_mode == "router"

# ---------------------------------------------------------------------------
# Tailscale (procd-managed, proxy-aware)
# Stock init script can't express HTTPS_PROXY — our tailscale-init.j2 adds a
# UCI 'proxy_url' option so WAN-less nodes reach the control plane through a
# forwarded CONNECT proxy. Empty proxy = direct outbound.
# ---------------------------------------------------------------------------
- name: Render /etc/config/tailscale
  ansible.builtin.template:
    src: tailscale-config.j2
    dest: /etc/config/tailscale
    mode: "0644"
  notify: restart tailscale
  when: "'tailscale' in openwrt_packages"

- name: Render /etc/init.d/tailscale (proxy-aware)
  ansible.builtin.template:
    src: tailscale-init.j2
    dest: /etc/init.d/tailscale
    mode: "0755"
  notify: restart tailscale
  when: "'tailscale' in openwrt_packages"

# Take over any manually-started daemon — procd should own it (respawn,
# boot start, proxy env from UCI). Idempotent: skips when a procd instance
# is already running.
- name: Ensure tailscaled runs under procd (idempotent)
  ansible.builtin.raw: >-
    ubus call service list '{"name":"tailscale"}' 2>/dev/null | grep -q '"running": *true' && exit 1;
    /etc/init.d/tailscale enable;
    killall tailscaled 2>/dev/null;
    sleep 1;
    /etc/init.d/tailscale start
  register: openwrt_ts_svc
  changed_when: openwrt_ts_svc.rc == 0
  failed_when: false
  when: "'tailscale' in openwrt_packages"

# Unattended join for fresh nodes. The CLI lives at /tmp/tailscale when the
# upstream binary floor staged it (upstream build isn't multicall), else the
# packaged multicall symlink works. Prefers /tmp/tailscale.
- name: Join tailnet via vault auth key (idempotent)
  ansible.builtin.raw: >-
    TS=$([ -x /tmp/tailscale ] && echo /tmp/tailscale || command -v tailscale);
    $TS status 2>/dev/null | grep -q 'Logged out' || exit 1;
    $TS up --auth-key '{{ openwrt_tailscale_auth_key }}' --timeout 30s
  register: openwrt_ts_up
  changed_when: openwrt_ts_up.rc == 0
  failed_when: false
  no_log: true
  when: "'tailscale' in openwrt_packages and openwrt_tailscale_auth_key | length > 0"

# Prompt for sysupgrades on first LuCI login after boot.
- name: Check attended sysupgrade login check setting
  ansible.builtin.raw: uci -q get attendedsysupgrade.client.login_check_for_upgrades
  register: openwrt_asu_check
  changed_when: false
  failed_when: false
  when: "'attendedsysupgrade' in openwrt_packages"

- name: Enable attended sysupgrade login check
  ansible.builtin.raw: >-
    uci set attendedsysupgrade.client.login_check_for_upgrades='1';
    uci commit attendedsysupgrade
  when: >-
    'attendedsysupgrade' in openwrt_packages and
    openwrt_asu_check.stdout | default('') | trim != '1'

- name: HTTPS for uHTTPd (Let's Encrypt via acme.sh)
  ansible.builtin.include_tasks: https.yml
  when: openwrt_https_enabled | bool or openwrt_tailscale_https | bool
