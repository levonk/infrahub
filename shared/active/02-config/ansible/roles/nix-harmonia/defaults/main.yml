---
# nix-harmonia — local Nix binary cache server
# Serves /nix/store over HTTP on 127.0.0.1 only (local access).
# Implements ADR-20260708001: Harmonia on every Nix machine.
# Target: Windows Docker Desktop (dtop202311, X86)

# Service toggle
nix_harmonia_enabled: true

# Container configuration
nix_harmonia_container_name: "{{ infra_hostname_nix_harmonia | default('localnet-nix-harmonia') }}"
nix_harmonia_image_name: "localnet-nix-harmonia"
nix_harmonia_image_tag: "latest"

# Ports — Harmonia binds 127.0.0.1 only (local access, not exposed externally)
nix_harmonia_host_port: "{{ infra_port_nix_harmonia_host | default('4523') }}"
nix_harmonia_container_port: "{{ infra_port_nix_harmonia_container | default('5000') }}"

# Volumes — reuse the shared nix-sidecar volumes
nix_harmonia_nix_store_volume: "{{ infra_storage_nix_shared_store_volume | default('localnet-base-nix-store-volume') }}"
nix_harmonia_nix_config_volume: "{{ infra_storage_nix_shared_config_volume | default('localnet-base-nix-config-volume') }}"
nix_harmonia_data_volume: "{{ infra_storage_nix_harmonia_data_volume | default('localnet-harmonia-data-volume') }}"

# Network — join the traefik-windows network for DNS resolution
nix_harmonia_network_name: "traefik-windows-network"

# Docker host for Windows deployment (ssh-tunneled)
nix_harmonia_docker_host_windows: "ssh://ansible@{{ infra_tailscale_fqdn_windows_docker | default('dtop202311.tale-grouper.ts.net') }}"

# Local temp directory for rendering config files
nix_harmonia_windows_temp_dir: "/tmp/nix-harmonia-config-{{ inventory_hostname }}"

# Harmonia signing key (from vault — user must add via vault handoff)
# When empty, Harmonia runs in read-only mode (serves but doesn't sign)
nix_harmonia_sign_key_path: "/data/signing-key"

# Entrypoint override — the image's default entrypoint (harmonia wrapper) calls
# `nix store --serve` which is not available in Nix 2.34+. We use harmonia-cache
# (the actual Rust binary) directly with CONFIG_FILE env var.
# This path is the Nix store path for the harmonia-cache binary in the image.
# If the image is rebuilt, update this path (check with:
#   docker run --rm --entrypoint="" localnet-nix-harmonia:latest \
#     ls /nix/store/*/bin/harmonia-cache
# )
nix_harmonia_entrypoint: "/nix/store/8vbf9a8ma61yzypb8cnpz912fffvrf1f-harmonia-3.1.0/bin/harmonia-cache"

# Healthcheck — MUST use string with unit suffix, NOT bare integers
nix_harmonia_healthcheck_interval: "30s"
nix_harmonia_healthcheck_timeout: "10s"
nix_harmonia_healthcheck_retries: 3
nix_harmonia_healthcheck_start_period: "15s"

# Logging
nix_harmonia_log_max_size: "10m"
nix_harmonia_log_max_file: "5"

# Timezone
nix_harmonia_tz: "{{ localnet_tz | default(timezone | default('UTC')) }}"
