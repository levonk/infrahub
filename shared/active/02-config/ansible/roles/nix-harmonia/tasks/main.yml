---
# nix-harmonia — local Nix binary cache server (dual-deployment)
# nl  (dtop202311, Windows Docker Desktop, X86) — nix-sidecar Docker volumes
# cno (oci-cloud-server, Linux ARM64) — bind mounts /nix/store from host
#
# Harmonia serves the local /nix/store over HTTP on 127.0.0.1 only (local
# access, not exposed externally).
#
# The deployment target is selected by inventory group membership:
#   - cloud_servers        → deploy-linux.yml   (cno instance)
#   - windows_docker_hosts → deploy-windows.yml (nl instance)
#
# Per AGENTS.md, community.docker modules can't run on Windows (Ansible core
# basic.py imports grp, Unix-only). The Windows path uses ansible.builtin.shell
# with DOCKER_HOST: ssh:// + delegate_to: localhost, matching the verdaccio
# pattern. Config files are rendered locally then copied into a Docker volume
# via a helper alpine container.

# 1. Validate required variables
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - nix_harmonia_image_name is defined
      - nix_harmonia_image_tag is defined
      - nix_harmonia_host_port is defined
      - nix_harmonia_container_port is defined
    fail_msg: >-
      Missing required nix_harmonia variables. Check infrastructure files
      (ports.yml, storage.yml, domains.yml) and vault for
      vault_nix_harmonia_sign_key.
    success_msg: "All required nix_harmonia variables are defined."
  tags: ["always", "validate"]

# 2. Dispatch Linux (cno) deployment for cloud_servers
- name: Dispatch Linux (cno) deployment for cloud_servers
  ansible.builtin.include_tasks: deploy-linux.yml
  vars:
    nix_harmonia_container_name: "{{ nix_harmonia_container_name_cno }}"
    nix_harmonia_data_volume: "{{ nix_harmonia_data_volume_cno }}"
    nix_harmonia_network_name: "{{ nix_harmonia_network_name_cno }}"
  when:
    - nix_harmonia_enabled | bool
    - "'cloud_servers' in group_names or ansible_os_family == 'RedHat'"
  tags: ["deploy"]

# 3. Dispatch Windows (nl) deployment for windows_docker_hosts
- name: Dispatch Windows (nl) deployment for windows_docker_hosts
  ansible.builtin.include_tasks: deploy-windows.yml
  vars:
    nix_harmonia_container_name: "{{ nix_harmonia_container_name_nl }}"
    nix_harmonia_data_volume: "{{ nix_harmonia_data_volume_nl }}"
    nix_harmonia_network_name: "{{ nix_harmonia_network_name_nl }}"
  when:
    - nix_harmonia_enabled | bool
    - "'windows_docker_hosts' in group_names"
  tags: ["deploy"]
