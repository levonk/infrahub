---
# nix-ncps — Nix NAR caching proxy (front door for Nix clients)
# Caches NARs locally for LAN bandwidth savings.
# Implements ADR-20260708001: ncps on regional hubs.
# Dual-deployment:
#   nl  (dtop202311, Windows Docker Desktop, X86) — traefik-windows-network
#   cno (oci-cloud-server, Linux ARM64) — traefik-network

# Service toggle
nix_ncps_enabled: true

# Container configuration — per-region container names
nix_ncps_container_name_nl: "{{ infra_hostname_nix_ncps_nl | default('localnet-nix-ncps') }}"
nix_ncps_container_name_cno: "{{ infra_hostname_nix_ncps_cno | default('localnet-nix-ncps-cno') }}"
# Upstream image: ghcr.io/kalbasit/ncps (multi-arch)
# https://github.com/kalbasit/ncps/releases
# Using :main tag because v0.9.4 doesn't have the `migrate up` command
# (goose-based migration). The :main tag includes the migrate command.
nix_ncps_image_name: "ghcr.io/kalbasit/ncps"
nix_ncps_image_tag: "main"

# Ports — ncps is the front door, exposed via Traefik
nix_ncps_host_port: "{{ infra_port_nix_ncps_host | default('4524') }}"
nix_ncps_container_port: "{{ infra_port_nix_ncps_container | default('8080') }}"

# Domains (for Traefik routing)
nix_ncps_domain_nl: "{{ infra_domain_nix_cache_nl | default('nixcache.nl.' ~ (infra_domain_base | default('example.com'))) }}"
nix_ncps_domain_cno: "{{ infra_domain_nix_cache_cno | default('nixcache.cno.' ~ (infra_domain_base | default('example.com'))) }}"

# Volumes — ncps uses /storage for data (database + cached NARs)
nix_ncps_data_volume_nl: "{{ infra_storage_nix_ncps_data_volume | default('localnet-ncps-data-volume') }}"
nix_ncps_data_volume_cno: "{{ infra_storage_nix_ncps_data_volume_cno | default('localnet-ncps-cno-data-volume') }}"

# ncps storage paths (inside the container)
nix_ncps_storage_path: "/storage"
nix_ncps_db_path: "{{ nix_ncps_storage_path }}/ncps.db"
nix_ncps_db_url: "sqlite:{{ nix_ncps_db_path }}"

# Cache hostname (used by ncps for signing and Nix cache-info)
# Per-region: each ncps signs with its own cache hostname
nix_ncps_cache_hostname_nl: "{{ nix_ncps_domain_nl }}"
nix_ncps_cache_hostname_cno: "{{ nix_ncps_domain_cno }}"

# Local temp directory for rendering config files
nix_ncps_windows_temp_dir: "/tmp/nix-ncps-config-{{ inventory_hostname }}"

# Upstream caches — ncps queries these on cache miss
# Per ADR-20260708001: ncps → ncro → upstreams. ncro races all upstreams
# (Harmonia, cache.nixos.org, cache.garnix.io, nix-community.cachix.org) in
# parallel and returns the fastest response. ncps only needs ncro as its
# single upstream — ncro handles the racing and EMA latency learning.
# ncro is on the same Docker network, so ncps reaches it via the container name.
nix_ncps_upstream_urls_nl:
  - "http://{{ nix_ncro_container_name_nl | default('localnet-nix-ncro') }}:{{ nix_ncro_container_port | default('8081') }}"
nix_ncps_upstream_urls_cno:
  - "http://{{ nix_ncro_container_name_cno | default('localnet-nix-ncro-cno') }}:{{ nix_ncro_container_port | default('8081') }}"

# ncro is a local racing proxy (no signing key of its own). The public keys
# of the upstreams ncro races are trusted by ncps so that NARs fetched via
# ncro pass ncps's signature verification.
nix_ncps_upstream_public_keys:
  - "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPSQZNGZfdL7Q="
  - "cache.garnix.io:CTFPyKSLcx5RMJKfLo5EEPUObbA78b0YQ2DTCJXqr3g="
  - "nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CXHQrkxhLww6X236k="
  - "{{ vault_nix_harmonia_public_key | default('nixcache.nl.example.com-1:placeholder') }}"

# nl: Network — join the traefik-windows network for Traefik routing
nix_ncps_network_name_nl: "traefik-windows-network"
# cno: Network — join traefik-network for Traefik routing
nix_ncps_network_name_cno: "{{ infra_network_proxy_traefik_network_name | default('traefik-network') }}"

# Docker host for Windows deployment (ssh-tunneled)
nix_ncps_docker_host_windows: "ssh://ansible@{{ infra_tailscale_fqdn_windows_docker | default('dtop202311.' ~ (infra_tailscale_tailnet | default('example.ts.net'))) }}"

# Healthcheck — MUST use string with unit suffix, NOT bare integers
nix_ncps_healthcheck_interval: "30s"
nix_ncps_healthcheck_timeout: "10s"
nix_ncps_healthcheck_retries: 3
nix_ncps_healthcheck_start_period: "15s"

# Logging
nix_ncps_log_max_size: "10m"
nix_ncps_log_max_file: "5"

# Timezone
nix_ncps_tz: "{{ localnet_tz | default(timezone | default('UTC')) }}"
