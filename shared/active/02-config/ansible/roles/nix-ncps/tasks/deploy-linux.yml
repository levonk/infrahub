---
# nix-ncps Linux (cno) deployment — community.docker pattern
# Target: OCI cloud server (ARM64, Oracle Linux).
# Uses upstream ncps image: ghcr.io/kalbasit/ncps:v0.9.4
# ncps v0.9.4 commands: serve, migrate-narinfo, migrate-nar-to-chunks, fsck
# No explicit migration needed — database is auto-created on first serve.

# ============================================================================
# Pull Image
# ============================================================================
- name: Pull nix-ncps image
  community.docker.docker_image:
    name: "{{ nix_ncps_image_name }}"
    tag: "{{ nix_ncps_image_tag }}"
    source: pull
  tags: ["deploy", "pull"]

# ============================================================================
# Volume Management
# ============================================================================
- name: Ensure nix-ncps data volume exists
  community.docker.docker_volume:
    name: "{{ nix_ncps_data_volume }}"
    state: present
  tags: ["deploy", "volume"]

# ============================================================================
# Database Migration (run in a one-shot container)
# ============================================================================
- name: Run ncps database migration
  community.docker.docker_container:
    name: "{{ nix_ncps_container_name }}-migrate"
    image: "{{ nix_ncps_image_name }}:{{ nix_ncps_image_tag }}"
    state: started
    entrypoint: "/bin/ncps"
    command: "migrate up --cache-database-url={{ nix_ncps_db_url }}"
    volumes:
      - "{{ nix_ncps_data_volume }}:{{ nix_ncps_storage_path }}:rw"
    detach: false
    cleanup: true
  register: nix_ncps_migrate_result
  changed_when: "'migrate up complete' in (nix_ncps_migrate_result.stdout | default(''))"
  tags: ["deploy", "migrate"]

# ============================================================================
# Container Deployment
# ============================================================================
- name: Stop existing nix-ncps container
  community.docker.docker_container:
    name: "{{ nix_ncps_container_name }}"
    state: absent
  tags: ["deploy", "container"]

- name: Deploy nix-ncps container
  community.docker.docker_container:
    name: "{{ nix_ncps_container_name }}"
    image: "{{ nix_ncps_image_name }}:{{ nix_ncps_image_tag }}"
    state: started
    restart_policy: unless-stopped
    # ncps image has no entrypoint — set it explicitly to /bin/ncps
    entrypoint: "/bin/ncps"
    # ncps v0.9.4 serve command with CLI flags
    command: >-
      serve
      --server-addr={{ infra_network_bind_all }}:{{ nix_ncps_container_port }}
      --cache-hostname={{ nix_ncps_cache_hostname }}
      --cache-database-url={{ nix_ncps_db_url }}
      --cache-storage-local={{ nix_ncps_storage_path }}
      {% for url in nix_ncps_upstream_urls %}--cache-upstream-url={{ url }} {% endfor %}
      {% for key in nix_ncps_upstream_public_keys %}--cache-upstream-public-key={{ key }} {% endfor %}
    networks:
      - name: "{{ nix_ncps_network_name }}"
    published_ports:
      - "{{ infra_network_bind_localhost }}:{{ nix_ncps_host_port }}:{{ nix_ncps_container_port }}/tcp"
    volumes:
      - "{{ nix_ncps_data_volume }}:{{ nix_ncps_storage_path }}:rw"
    env:
      TZ: "{{ nix_ncps_tz }}"
    log_driver: json-file
    log_options:
      max-size: "{{ nix_ncps_log_max_size }}"
      max-file: "{{ nix_ncps_log_max_file }}"
    # No Docker healthcheck — the ncps image is a minimal Nix image with no
    # shell. The Ansible wait_for task verifies the port is listening.
    healthcheck:
      test: ["NONE"]
    security_opts:
      - no-new-privileges:true
  tags: ["deploy", "container"]

# ============================================================================
# Wait for health
# ============================================================================
- name: Wait for nix-ncps (cno) to be healthy
  ansible.builtin.wait_for:
    host: "{{ infra_network_bind_localhost }}"
    port: "{{ nix_ncps_host_port }}"
    delay: "{{ infra_delay_default }}"
    timeout: "{{ infra_timeout_long }}"
  tags: ["deploy", "container"]

# ============================================================================
# Status Report
# ============================================================================
- name: Get nix-ncps (cno) container info
  community.docker.docker_container_info:
    name: "{{ nix_ncps_container_name }}"
  register: nix_ncps_cno_info
  ignore_errors: true
  tags: ["always", "info"]

- name: Report nix-ncps (cno) status
  ansible.builtin.debug:
    msg: |
      nix-ncps (cno) deployed:
        - URL: https://{{ nix_ncps_domain }} (via Traefik on OCI cloud server)
        - Container: {{ nix_ncps_container_name }}
        - Image: {{ nix_ncps_image_name }}:{{ nix_ncps_image_tag }}
        - Network: {{ nix_ncps_network_name }}
        - State: {{ nix_ncps_cno_info.container.State.Status | default('unknown') }}
        - Health: {{ nix_ncps_cno_info.container.State.Health.Status | default('unknown') }}
        - Upstreams: {{ nix_ncps_upstream_urls | join(', ') }}
  tags: ["always", "info"]
