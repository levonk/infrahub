---
# nix-ncps — Nix NAR caching proxy (front door for Nix clients)
# Target: Windows Docker Desktop (dtop202311, X86)
#
# Uses upstream ncps image: ghcr.io/kalbasit/ncps:v0.9.4
# ncps is configured via CLI flags (not a config file) and needs a SQLite
# database initialized via `ncps migrate up` before serving.
#
# community.docker modules can't run on Windows (Ansible core basic.py imports
# grp, Unix-only). We use ansible.builtin.shell with DOCKER_HOST: ssh:// and
# delegate_to: localhost, matching the ai-qm / verdaccio pattern.

# 1. Validate required variables
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - nix_ncps_image_name is defined
      - nix_ncps_image_tag is defined
      - nix_ncps_host_port is defined
      - nix_ncps_container_port is defined
      - nix_ncps_docker_host_windows is defined
      - nix_ncps_upstream_urls is defined
      - nix_ncps_upstream_urls | length > 0
      - nix_ncps_upstream_public_keys is defined
    fail_msg: >-
      Missing required nix_ncps variables. Check infrastructure files
      (ports.yml, domains.yml, storage.yml) and ensure nix_ncps_upstream_urls
      and nix_ncps_upstream_public_keys are populated.
    success_msg: "All required nix_ncps variables are defined."
  tags: ["always", "validate"]

# 2. Dispatch Windows deployment
- name: Dispatch Windows (nl) deployment for windows_docker_hosts
  ansible.builtin.include_tasks: deploy-windows.yml
  when:
    - nix_ncps_enabled | bool
    - "'windows_docker_hosts' in group_names"
  tags: ["deploy"]
