---
# nix-ncro — Nix Cache Route Optimizer (behind ncps)
# Races all upstream caches in parallel, returns fastest response.
# Stateless — no NAR storage (ncps handles caching).
# Upstream: https://github.com/manic-systems/ncro
# Implements ADR-20260708001: ncro on regional hubs.
# Target: Windows Docker Desktop (dtop202311, X86)

# Service toggle
nix_ncro_enabled: true

# Container configuration
nix_ncro_container_name: "{{ infra_hostname_nix_ncro | default('localnet-nix-ncro') }}"
nix_ncro_image_name: "localnet-nix-ncro"
nix_ncro_image_tag: "latest"

# Ports — ncro is internal only (behind ncps), not exposed externally
nix_ncro_host_port: "{{ infra_port_nix_ncro_host | default('4525') }}"
nix_ncro_container_port: "{{ infra_port_nix_ncro_container | default('8081') }}"

# Volumes — ncro is stateless (no NAR storage), only needs config + SQLite route cache
nix_ncro_config_volume: "localnet-ncro-config-volume"
nix_ncro_data_volume: "localnet-ncro-data-volume"

# Network — same network as ncps for internal communication
nix_ncro_network_name: "traefik-windows-network"

# Docker host for Windows deployment (ssh-tunneled)
nix_ncro_docker_host_windows: "ssh://ansible@{{ infra_tailscale_fqdn_windows_docker | default('dtop202311.tale-grouper.ts.net') }}"

# Local temp directory for rendering config files
nix_ncro_windows_temp_dir: "/tmp/nix-ncro-config-{{ inventory_hostname }}"

# Upstream caches that ncro races in parallel
# Lower priority = preferred. Local Harmonia has priority 10 (sub-ms for local store hits).
# Remote caches have priority 20+ (raced in parallel, winner cached in SQLite).
nix_ncro_upstreams:
  - url: "http://{{ nix_harmonia_container_name | default('localnet-nix-harmonia') }}:{{ infra_port_nix_harmonia_container | default('5000') }}"
    priority: 10
  - url: "https://cache.nixos.org"
    priority: 20
    public_key: "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPSQZNGZfdL7Q="
  - url: "https://cache.garnix.io"
    priority: 30
    public_key: "cache.garnix.io:CTFPyKSLcx5RMJKfLo5EEPUObbA78b0YQ2DTCJXqr3g="
  - url: "https://nix-community.cachix.org"
    priority: 30
    public_key: "nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CXHQrkxhLww6X236k="

# Healthcheck
nix_ncro_healthcheck_interval: "30s"
nix_ncro_healthcheck_timeout: "10s"
nix_ncro_healthcheck_retries: 3
nix_ncro_healthcheck_start_period: "15s"

# Logging
nix_ncro_log_max_size: "10m"
nix_ncro_log_max_file: "5"

# Timezone
nix_ncro_tz: "{{ localnet_tz | default(timezone | default('UTC')) }}"
