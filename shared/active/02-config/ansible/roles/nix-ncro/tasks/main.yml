---
# nix-ncro — Nix Cache Route Optimizer (behind ncps)
# Dual-deployment:
#   nl  (dtop202311, Windows Docker Desktop, X86) — traefik-windows-network
#   cno (oci-cloud-server, Linux ARM64) — traefik-network
#
# Locally-built image from Nix flake (supports x86_64-linux + aarch64-linux).
# ncro is configured via a TOML config file rendered from template.
#
# The deployment target is selected by inventory group membership:
#   - cloud_servers        → deploy-linux.yml   (cno instance)
#   - windows_docker_hosts → deploy-windows.yml (nl instance)
#
# Per AGENTS.md, community.docker modules can't run on Windows (Ansible core
# basic.py imports grp, Unix-only). The Windows path uses ansible.builtin.shell
# with DOCKER_HOST: ssh:// + delegate_to: localhost, matching the verdaccio
# pattern.

# 1. Validate required variables
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - nix_ncro_image_name is defined
      - nix_ncro_image_tag is defined
      - nix_ncro_host_port is defined
      - nix_ncro_container_port is defined
      - nix_ncro_upstreams_nl is defined
      - nix_ncro_upstreams_cno is defined
    fail_msg: >-
      Missing required nix_ncro variables. Check infrastructure files
      (ports.yml, storage.yml, domains.yml).
    success_msg: "All required nix_ncro variables are defined."
  tags: ["always", "validate"]

# 2. Dispatch Linux (cno) deployment for cloud_servers
- name: Dispatch Linux (cno) deployment for cloud_servers
  ansible.builtin.include_tasks: deploy-linux.yml
  vars:
    nix_ncro_container_name: "{{ nix_ncro_container_name_cno }}"
    nix_ncro_config_volume: "{{ nix_ncro_config_volume_cno }}"
    nix_ncro_data_volume: "{{ nix_ncro_data_volume_cno }}"
    nix_ncro_network_name: "{{ nix_ncro_network_name_cno }}"
    nix_ncro_upstreams: "{{ nix_ncro_upstreams_cno }}"
  when:
    - nix_ncro_enabled | bool
    - "'cloud_servers' in group_names or ansible_os_family == 'RedHat'"
  tags: ["deploy"]

# 3. Dispatch Windows (nl) deployment for windows_docker_hosts
- name: Dispatch Windows (nl) deployment for windows_docker_hosts
  ansible.builtin.include_tasks: deploy-windows.yml
  vars:
    nix_ncro_container_name: "{{ nix_ncro_container_name_nl }}"
    nix_ncro_config_volume: "{{ nix_ncro_config_volume_nl }}"
    nix_ncro_data_volume: "{{ nix_ncro_data_volume_nl }}"
    nix_ncro_network_name: "{{ nix_ncro_network_name_nl }}"
    nix_ncro_upstreams: "{{ nix_ncro_upstreams_nl }}"
  when:
    - nix_ncro_enabled | bool
    - "'windows_docker_hosts' in group_names"
  tags: ["deploy"]
