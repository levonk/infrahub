---
# OmniRoute AI Gateway Deployment
# Deploys OmniRoute container for unified AI provider access

- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - localnet_services_dir is defined
      - shared_container_services_dir is defined
      - localnet_network_name is defined
    fail_msg: >-
      Missing required variables. Check group_vars/cloud_servers.yml
      and inventory vars (localnet_services_dir, shared_container_services_dir,
      localnet_network_name).
    success_msg: "All required omniroute variables are defined."
  tags: ["always", "validate"]

# ============================================================================
# Volume Management
# ============================================================================
- name: Ensure OmniRoute data volume exists
  community.docker.docker_volume:
    name: "{{ ai_omniroute_volume_name }}"
    state: present

- name: Ensure proxy-chain Docker network exists
  community.docker.docker_network:
    name: "{{ ai_omniroute_chain_network_name }}"
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ infra_network_ai_proxy_chain_subnet | default(infra_network_ai_proxy_chain_subnet) }}"
        gateway: "{{ infra_network_ai_proxy_chain_gateway | default(infra_network_ai_proxy_chain_gateway) }}"

- name: Ensure localnet Docker network exists
  community.docker.docker_network:
    name: "{{ ai_omniroute_localnet_network_name }}"
    state: present
    driver: bridge
  ignore_errors: true  # Network may already exist with different config

# ============================================================================
# Image Pull
# ============================================================================
- name: Pull OmniRoute image
  community.docker.docker_image:
    name: "{{ ai_omniroute_image_name }}"
    source: pull
    state: present
  register: omniroute_build

# ============================================================================
# Container Deployment
# ============================================================================
- name: Deploy OmniRoute container
  community.docker.docker_container:
    name: "{{ ai_omniroute_container_name }}"
    image: "{{ ai_omniroute_image_name }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ ai_omniroute_localnet_network_name }}"
      - name: "{{ ai_omniroute_chain_network_name }}"
        ipv4_address: "{{ ai_omniroute_chain_network_ip }}"
      - name: "{{ ai_omniroute_traefik_network_name }}"
    ports:
      - "{{ ai_omniroute_host_port }}:{{ ai_omniroute_container_port }}/tcp"
    volumes:
      - "{{ ai_omniroute_volume_name }}:/app/data:rw"
      - "{{ proxy_iron_proxy_data_dir | default('/opt/proxy/iron-proxy') }}/mounts/etc/iron-proxy/ca.crt:/usr/local/share/ca-certificates/iron-proxy-ca.crt:ro"
    env:
      PORT: "{{ ai_omniroute_container_port }}"
      NODE_ENV: production
      PUID: "{{ ai_omniroute_puid }}"
      PGID: "{{ ai_omniroute_pgid }}"
      TZ: "{{ ai_omniroute_tz }}"
      OMNIROUTE_COMPRESSION_ENABLED: "{{ ai_omniroute_compression_enabled }}"
      OMNIROUTE_RTK_ENABLED: "{{ ai_omniroute_rtk_enabled }}"
      OMNIROUTE_CAVEMAN_ENABLED: "{{ ai_omniroute_caveman_enabled }}"
      INITIAL_PASSWORD: "{{ ai_omniroute_admin_password }}"
      HTTP_PROXY: "{{ ai_omniroute_http_proxy }}"
      HTTPS_PROXY: "{{ ai_omniroute_https_proxy }}"
      NO_PROXY: "{{ ai_omniroute_no_proxy }}"
      OMNIROUTE_PUBLIC_BASE_URL: "{{ ai_omniroute_public_base_url }}"
      NODE_EXTRA_CA_CERTS: "/usr/local/share/ca-certificates/iron-proxy-ca.crt"
      SSL_CERT_FILE: "/usr/local/share/ca-certificates/iron-proxy-ca.crt"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    security_opts:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode={{ infra_mode_dir_sticky }},size={{ infra_size_128m }}
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck-omniroute.sh"]
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}"
      retries: 3
      start_period: "{{ infra_healthcheck_start_period }}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.omniroute-http.rule: "Host(`{{ ai_omniroute_domain }}`)"
      traefik.http.routers.omniroute-http.entryPoints: "web"
      traefik.http.routers.omniroute-http.middlewares: "redirect-to-https-omniroute"
      traefik.http.routers.omniroute-https.rule: "Host(`{{ ai_omniroute_domain }}`)"
      traefik.http.routers.omniroute-https.entryPoints: "websecure"
      traefik.http.routers.omniroute-https.middlewares: "geoblock,crowdsec-bouncer,authelia"
      traefik.http.routers.omniroute-https.tls: "true"
      traefik.http.routers.omniroute-https.tls.certresolver: "letsencrypt"
      traefik.http.services.omniroute.loadbalancer.server.port: "{{ ai_omniroute_container_port }}"
      traefik.http.middlewares.redirect-to-https-omniroute.redirectscheme.scheme: "https"
      traefik.http.middlewares.redirect-to-https-omniroute.redirectscheme.permanent: "true"
  register: omniroute_deploy
  notify: restart omniroute

- name: Wait for OmniRoute to be healthy
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ ai_omniroute_host_port }}"
    delay: "{{ infra_delay_long }}"
    timeout: "{{ infra_timeout_max }}"
  when: omniroute_deploy.changed

# ---------------------------------------------------------------------------
# Managed Configuration (partial JSON upsert)
# Pushes kckinai provider + kckinaicombo via the import-json API.
# Uses INSERT OR REPLACE — only entities in the template are reconciled.
# UI changes to other providers/combos/settings are preserved.
# ---------------------------------------------------------------------------
- name: Render managed OmniRoute config
  ansible.builtin.template:
    src: managed-config.json.j2
    dest: "/tmp/omniroute-managed-config-{{ ai_omniroute_container_name }}.json"
    mode: "{{ infra_mode_file_0600 }}"
  when: ai_omniroute_managed_config_enabled | bool
  changed_when: false
  no_log: true

- name: Push managed config to OmniRoute (login + import)
  ansible.builtin.shell: |
    set -euo pipefail
    COOKIE_FILE=$(mktemp)
    trap 'rm -f "$COOKIE_FILE"' EXIT
    # Login to get session cookie
    HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
      -c "$COOKIE_FILE" \
      -X POST -H "Content-Type: application/json" \
      -d "{\"username\":\"admin\",\"password\":\"{{ ai_omniroute_admin_password }}\"}" \
      http://localhost:{{ ai_omniroute_host_port }}/api/auth/login)
    if [ "$HTTP_CODE" != "{{ infra_http_status_ok }}" ]; then
      echo "Login failed with HTTP $HTTP_CODE" >&2
      exit 1
    fi
    # Push the partial config (INSERT OR REPLACE upsert)
    HTTP_CODE=$(curl -s -o /tmp/omniroute-import-response.txt -w "%{http_code}" \
      -b "$COOKIE_FILE" \
      -X POST -H "Content-Type: application/json" \
      -d @/tmp/omniroute-managed-config-{{ ai_omniroute_container_name }}.json \
      http://localhost:{{ ai_omniroute_host_port }}/api/settings/import-json)
    cat /tmp/omniroute-import-response.txt
    if [ "$HTTP_CODE" != "{{ infra_http_status_ok }}" ]; then
      echo "Import failed with HTTP $HTTP_CODE" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  when: ai_omniroute_managed_config_enabled | bool
  changed_when: false
  no_log: true
  register: omniroute_managed_config_result

- name: Show managed config import result
  ansible.builtin.debug:
    msg: "{{ omniroute_managed_config_result.stdout | from_json }}"
  when: ai_omniroute_managed_config_enabled | bool and omniroute_managed_config_result.stdout | length > 0

- name: Clean up rendered managed config
  ansible.builtin.file:
    path: "/tmp/omniroute-managed-config-{{ ai_omniroute_container_name }}.json"
    state: absent
  when: ai_omniroute_managed_config_enabled | bool
  changed_when: false

# ============================================================================
# Status Report
# ============================================================================
- name: Report OmniRoute status
  ansible.builtin.debug:
    msg: |
      OmniRoute deployed successfully:
        - Dashboard: http://localhost:{{ ai_omniroute_host_port }}
        - API: http://localhost:{{ ai_omniroute_host_port }}/v1
        - Container: {{ ai_omniroute_container_name }}
