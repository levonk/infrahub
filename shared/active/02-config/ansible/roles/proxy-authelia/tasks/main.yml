---
# tasks file for proxy-authelia
# Deploys Authelia SSO service and optional Redis session store as Docker containers.
# All ports are variable-driven per AGENTS.md rules.

# ---------------------------------------------------------------------------
# Prerequisites
# ---------------------------------------------------------------------------
- name: Ensure authelia data directory exists
  ansible.builtin.file:
    path: "{{ proxy_authelia_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ infra_mode_dir }}"
  become: true

- name: Ensure authelia configuration directories exist
  ansible.builtin.file:
    path: "{{ proxy_authelia_data_dir }}/{{ item }}"
    state: directory
    # userns-remap: container root maps to this UID on the host.
    # Authelia writes notification files and session data to /config.
    owner: "{{ infra_storage_userns_remap_uid | default(infra_storage_userns_remap_uid) }}"
    group: "{{ infra_storage_userns_remap_gid | default(infra_storage_userns_remap_uid) }}"
    mode: "{{ infra_mode_dir }}"
  become: true
  loop:
    - config

# ---------------------------------------------------------------------------
# Docker Volumes
# ---------------------------------------------------------------------------
- name: Ensure authelia Docker volumes exist
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  become: true
  loop:
    - proxy-authelia-postgres
    - proxy-authelia-redis

# ---------------------------------------------------------------------------
# Configuration Templates
# ---------------------------------------------------------------------------
- name: Deploy Authelia configuration
  ansible.builtin.template:
    src: authelia/configuration.yml.j2
    dest: "{{ proxy_authelia_data_dir }}/config/configuration.yml"
    owner: "{{ infra_storage_userns_remap_uid | default(infra_storage_userns_remap_uid) }}"
    group: "{{ infra_storage_userns_remap_gid | default(infra_storage_userns_remap_uid) }}"
    mode: "{{ infra_mode_file }}"
  become: true
  notify: restart proxy-authelia

- name: Deploy Authelia users database
  ansible.builtin.template:
    src: authelia/users_database.yml.j2
    dest: "{{ proxy_authelia_data_dir }}/config/users_database.yml"
    owner: "{{ infra_storage_userns_remap_uid | default(infra_storage_userns_remap_uid) }}"
    group: "{{ infra_storage_userns_remap_gid | default(infra_storage_userns_remap_uid) }}"
    mode: "{{ infra_mode_file }}"
  become: true
  notify: restart proxy-authelia

- name: Deploy Traefik Authelia middleware configuration
  ansible.builtin.template:
    src: traefik/authelia_middleware.yml.j2
    dest: "{{ proxy_authelia_data_dir }}/config/traefik_authelia_middleware.yml"
    owner: "{{ infra_storage_userns_remap_uid | default(infra_storage_userns_remap_uid) }}"
    group: "{{ infra_storage_userns_remap_gid | default(infra_storage_userns_remap_uid) }}"
    mode: "{{ infra_mode_file }}"
  become: true
  notify: restart proxy-authelia

- name: Validate Authelia secrets are set
  ansible.builtin.assert:
    that:
      - proxy_authelia_jwt_secret | length >= 20  # project-lint: disable=magic-int  Authelia config value, not a standalone magic number
      - proxy_authelia_session_secret | length >= 20  # project-lint: disable=magic-int  Authelia config value, not a standalone magic number
      - proxy_authelia_storage_encryption_key | length >= 20  # project-lint: disable=magic-int  Authelia config value, not a standalone magic number
      - proxy_authelia_admin_password is defined
      - proxy_authelia_admin_password | length > 0
    fail_msg: "Authelia secrets must be at least 20 characters long. Set proxy_authelia_jwt_secret, proxy_authelia_session_secret, proxy_authelia_storage_encryption_key, and proxy_authelia_admin_password in host_vars."  # project-lint: disable=magic-int  Authelia config value, not a standalone magic number
    success_msg: "All Authelia secrets are properly configured."

- name: Create secret files for Authelia
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ proxy_authelia_data_dir }}/config/{{ item.file }}"
    owner: "{{ infra_storage_userns_remap_uid | default(infra_storage_userns_remap_uid) }}"
    group: "{{ infra_storage_userns_remap_gid | default(infra_storage_userns_remap_uid) }}"
    mode: "{{ infra_mode_file }}"
  become: true
  loop:
    - { file: "jwt_secret", value: "{{ proxy_authelia_jwt_secret }}" }
    - { file: "session_secret", value: "{{ proxy_authelia_session_secret }}" }
    - { file: "storage_encryption_key", value: "{{ proxy_authelia_storage_encryption_key }}" }
  notify: restart proxy-authelia

# ---------------------------------------------------------------------------
# PostgreSQL Database (for Authelia storage)
# ---------------------------------------------------------------------------
- name: Deploy Authelia PostgreSQL container
  community.docker.docker_container:
    name: proxy-authelia-postgres
    image: "{{ proxy_authelia_postgres_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ proxy_authelia_docker_network_name }}"
    env:
      POSTGRES_USER: "{{ proxy_authelia_postgres_user }}"
      POSTGRES_PASSWORD: "{{ proxy_authelia_postgres_password }}"
      POSTGRES_DB: "{{ proxy_authelia_postgres_database }}"
    volumes:
      - proxy-authelia-postgres:/var/lib/postgresql/data
    log_driver: json-file
    log_opt:
      max-size: "{{ proxy_authelia_log_max_size }}"
      max-file: "{{ proxy_authelia_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ proxy_authelia_postgres_user }}"]
      interval: "{{ infra_timeout_short }}"
      timeout: "{{ infra_timeout_healthcheck_short }}"
      retries: "{{ infra_retry_default }}"
      start_period: "{{ infra_timeout_short }}"
  become: true
  when: proxy_authelia_postgres_enabled | bool
  notify: restart proxy-authelia-postgres

- name: Wait for PostgreSQL to be ready
  ansible.builtin.command:
    cmd: "docker inspect --format='{{ '{{' }} .State.Health.Status {{ '}}' }}' proxy-authelia-postgres"
  become: true
  register: postgres_health
  until: postgres_health.stdout == "healthy"
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_default }}"
  when:
    - proxy_authelia_postgres_enabled | bool
    - proxy_authelia_verify_health | bool

# ---------------------------------------------------------------------------
# Redis Session Store (Sidecar)
# ---------------------------------------------------------------------------
- name: Deploy Authelia Redis container
  community.docker.docker_container:
    name: proxy-authelia-redis
    image: "{{ proxy_authelia_redis_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ proxy_authelia_docker_network_name }}"
    ports:
      - "{{ proxy_authelia_redis_host_port }}:{{ proxy_authelia_redis_container_port }}/tcp"
    volumes:
      - proxy-authelia-redis:/data
    command:
      - redis-server
      - --requirepass
      - "{{ proxy_authelia_redis_password }}"
    log_driver: json-file
    log_opt:
      max-size: "{{ proxy_authelia_log_max_size }}"
      max-file: "{{ proxy_authelia_log_max_file }}"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: "{{ infra_timeout_short }}"
      timeout: "{{ infra_timeout_healthcheck_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_timeout_healthcheck_short }}"
  become: true
  when: proxy_authelia_redis_enabled | bool
  notify: restart proxy-authelia-redis

# ---------------------------------------------------------------------------
# Authelia SSO Container
# ---------------------------------------------------------------------------
- name: Deploy Authelia container
  community.docker.docker_container:
    name: proxy-authelia
    image: "{{ proxy_authelia_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ proxy_authelia_docker_network_name }}"
      - name: "{{ proxy_traefik_docker_network_name | default('traefik-network') }}"
    ports:
      - "{{ proxy_authelia_web_host_port }}:{{ proxy_authelia_web_container_port }}/tcp"
      - "{{ proxy_authelia_metrics_port }}:{{ proxy_authelia_metrics_container_port }}/tcp"
    volumes:
      - "{{ proxy_authelia_data_dir }}/config:/config"
    log_driver: json-file
    log_opt:
      max-size: "{{ proxy_authelia_log_max_size }}"
      max-file: "{{ proxy_authelia_log_max_file }}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:{{ proxy_authelia_web_container_port }}/api/health"]
      interval: "{{ infra_timeout_default }}"
      timeout: "{{ infra_timeout_healthcheck_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_timeout_short }}"
  become: true
  when: proxy_authelia_enabled | bool

# ---------------------------------------------------------------------------
# Log Retention Configuration
# ---------------------------------------------------------------------------
- name: Deploy logrotate configuration for Authelia
  ansible.builtin.template:
    src: logrotate/authelia.j2
    dest: /etc/logrotate.d/authelia
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  become: true
  when: proxy_authelia_enabled | bool

# ---------------------------------------------------------------------------
# Health Verification
# ---------------------------------------------------------------------------
- name: Wait for Authelia to be healthy
  ansible.builtin.uri:
    url: "http://{{ infra_network_bind_localhost }}:{{ proxy_authelia_web_host_port }}/api/health"
    status_code: "{{ infra_http_status_ok }}"
  register: authelia_health
  until: authelia_health.status == {{ infra_http_status_ok }}
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_default }}"
  when:
    - proxy_authelia_enabled | bool
    - proxy_authelia_verify_health | bool
  ignore_errors: true

# ---------------------------------------------------------------------------
# Status Report
# ---------------------------------------------------------------------------
- name: Report authelia status
  ansible.builtin.debug:
    msg: |2
      Authelia SSO deployed successfully:
      - Web UI: https://{{ ansible_host | default('localhost') }}:{{ proxy_authelia_web_host_port }}
      - Redis: {{ proxy_authelia_redis_host_port }} (if enabled)
