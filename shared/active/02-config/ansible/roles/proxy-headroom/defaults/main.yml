---
# defaults file for proxy-headroom
# Neutral, overridable defaults. No localnet-specific paths.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Headroom Container
# ---------------------------------------------------------------------------
proxy_headroom_enabled: true
proxy_headroom_version: "0.26.0"
proxy_headroom_image: "{{ local_registry | default(infra_registry) }}/headroom:latest"

# ---------------------------------------------------------------------------
# Headroom Configuration
# ---------------------------------------------------------------------------
proxy_headroom_host_port: "{{ cloud_server_headroom_host_port | default(infra_port_ai_litellm_host) }}"
proxy_headroom_container_port: "8787"
proxy_headroom_host_ip: "{{ cloud_server_headroom_host_ip | default(infra_network_bind_all) }}"
proxy_headroom_container_ip: "{{ cloud_server_headroom_container_ip | default(infra_network_bind_all) }}"

# ---------------------------------------------------------------------------
# Upstream HTTP Proxy Configuration (for egress, e.g. iron-proxy)
# This sets HTTP_PROXY/HTTPS_PROXY env vars — NOT the API backend.
# Leave empty when the downstream API gateway handles egress.
# ---------------------------------------------------------------------------
proxy_headroom_upstream_proxy: ""

# ---------------------------------------------------------------------------
# OpenAI API Target URL (where Headroom forwards compressed requests)
# Points to OmniRoute in the pipeline. Headroom compresses context then
# forwards to this OpenAI-compatible endpoint.
# Env var: OPENAI_TARGET_API_URL
# ---------------------------------------------------------------------------
proxy_headroom_openai_target_api_url: "http://{{ ai_omniroute_container_name | default(infra_value_proxy_headroom_openai_target_api_url) }}:{{ infra_port_ai_omniroute_container | default(infra_port_vpn_netbird_management_host) }}"

# ---------------------------------------------------------------------------
# Output Token Reduction
# ---------------------------------------------------------------------------
proxy_headroom_output_shaper: "{{ cloud_server_headroom_output_shaper | default(infra_value_proxy_headroom_output_shaper) }}"

# ---------------------------------------------------------------------------
# Data Directory
# ---------------------------------------------------------------------------
proxy_headroom_data_dir: "{{ cloud_server_proxy_data_dir | default(infra_value_proxy_headroom_data_dir) }}/headroom"

# ---------------------------------------------------------------------------
# Docker Network & Volumes
# ---------------------------------------------------------------------------
proxy_headroom_docker_network_name: "{{ cloud_server_proxy_network_name | default(infra_network_proxy_headroom_docker_network_name) }}"
proxy_headroom_volume_name: "localnet-headroom-data-volume"

# ---------------------------------------------------------------------------
# User Configuration
# ---------------------------------------------------------------------------
proxy_headroom_puid: "1000"
proxy_headroom_pgid: "1000"
proxy_headroom_tz: "UTC"

# ---------------------------------------------------------------------------
# Feature Flags
# ---------------------------------------------------------------------------
proxy_headroom_verify_health: true
proxy_headroom_verify_timeout_seconds: 30