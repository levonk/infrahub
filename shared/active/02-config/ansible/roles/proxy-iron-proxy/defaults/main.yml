---
# defaults file for proxy-iron-proxy
# Neutral, overridable defaults. No localnet-specific paths.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# iron-proxy Container
# ---------------------------------------------------------------------------
proxy_iron_proxy_enabled: true
proxy_iron_proxy_version: "latest"
proxy_iron_proxy_image: "ironsh/iron-proxy:{{ proxy_iron_proxy_version }}"

# ---------------------------------------------------------------------------
# DNS Configuration
# ---------------------------------------------------------------------------
proxy_iron_proxy_dns_enabled: true
proxy_iron_proxy_dns_host_port: "{{ cloud_server_iron_proxy_dns_host_port | default(infra_port_dns_host) }}"
proxy_iron_proxy_dns_container_port: "53"
proxy_iron_proxy_dns_proxy_ip: "{{ cloud_server_iron_proxy_dns_proxy_ip | default(infra_network_ip_cloudflare_dns_primary) }}"
proxy_iron_proxy_upstream_dns: "{{ cloud_server_iron_proxy_upstream_dns | default('8.8.8.8:53') }}"

# ---------------------------------------------------------------------------
# HTTP/HTTPS Proxy Configuration
# ---------------------------------------------------------------------------
proxy_iron_proxy_http_host_port: "{{ cloud_server_iron_proxy_http_host_port | default(infra_port_proxy_dashboard_host) }}"
proxy_iron_proxy_http_container_port: "80"
proxy_iron_proxy_https_host_port: "{{ cloud_server_iron_proxy_https_host_port | default(infra_port_vpn_nordvpn_https_host) }}"
proxy_iron_proxy_https_container_port: "443"

# Tunnel listener (CONNECT/SOCKS5) — needed for clients that send CONNECT
# for HTTPS proxying (e.g. Node.js fetch with HTTPS_PROXY, curl --proxy).
# Empty string disables the tunnel listener.
proxy_iron_proxy_tunnel_host_port: "{{ cloud_server_iron_proxy_tunnel_host_port | default('') }}"
proxy_iron_proxy_tunnel_container_port: "{{ cloud_server_iron_proxy_tunnel_container_port | default(infra_port_proxy_dashboard_host) }}"

# ---------------------------------------------------------------------------
# TLS Configuration
# ---------------------------------------------------------------------------
proxy_iron_proxy_tls_mode: "{{ cloud_server_iron_proxy_tls_mode | default('mitm') }}"
proxy_iron_proxy_cert_cache_size: "{{ cloud_server_iron_proxy_cert_cache_size | default(1000) }}"
proxy_iron_proxy_leaf_cert_expiry_hours: "{{ cloud_server_iron_proxy_leaf_cert_expiry_hours | default(72) }}"

# ---------------------------------------------------------------------------
# Proxy Limits
# ---------------------------------------------------------------------------
proxy_iron_proxy_max_request_body_bytes: "{{ cloud_server_iron_proxy_max_request_body_bytes | default(1048576) }}"
proxy_iron_proxy_max_response_body_bytes: "{{ cloud_server_iron_proxy_max_response_body_bytes | default(0) }}"
proxy_iron_proxy_upstream_timeout: "{{ cloud_server_iron_proxy_upstream_timeout | default(infra_timeout_default) }}"

# ---------------------------------------------------------------------------
# Allowlist Configuration
# ---------------------------------------------------------------------------
# Warn mode: allow all traffic through, log what would be blocked.
# This effectively makes iron-proxy an open egress proxy with audit logging.
# Switch to false + populate allowed_domains/allowed_cidrs for default-deny.
proxy_iron_proxy_allowlist_warn: true
proxy_iron_proxy_allowed_domains: []
proxy_iron_proxy_allowed_cidrs: []
proxy_iron_proxy_allowlist_rules: []

# ---------------------------------------------------------------------------
# API Key Configuration (Client-configurable)
# ---------------------------------------------------------------------------
proxy_iron_proxy_openai_enabled: false
proxy_iron_proxy_openai_api_key: ""
proxy_iron_proxy_anthropic_enabled: false
proxy_iron_proxy_anthropic_api_key: ""
proxy_iron_proxy_anthropic_proxy_token: "proxy-token-anthropic"
proxy_iron_proxy_google_enabled: false
proxy_iron_proxy_google_api_key: ""
proxy_iron_proxy_github_enabled: false
proxy_iron_proxy_github_token: ""

# ---------------------------------------------------------------------------
# Upstream Proxy Configuration (for corporate networks)
# ---------------------------------------------------------------------------
proxy_iron_proxy_http_proxy: "{{ cloud_server_iron_proxy_http_proxy | default('') }}"
proxy_iron_proxy_https_proxy: "{{ cloud_server_iron_proxy_https_proxy | default('') }}"
proxy_iron_proxy_no_proxy: "{{ cloud_server_iron_proxy_no_proxy | default('') }}"

# ---------------------------------------------------------------------------
# Docker Network & Volumes
# ---------------------------------------------------------------------------
proxy_iron_proxy_docker_network_name: "{{ cloud_server_proxy_network_name | default('proxy-network') }}"
proxy_iron_proxy_data_dir: "{{ cloud_server_proxy_data_dir | default('/opt/proxy') }}/iron-proxy"

# Proxy-chain network (shared with headroom, omniroute, forge for the AI pipeline)
proxy_iron_proxy_chain_network_name: "{{ infra_network_ai_proxy_chain_network_name | default('proxy-chain-network') }}"
proxy_iron_proxy_chain_network_ip: "{{ infra_network_ip_iron_proxy | default('172.29.0.17') }}"

# VPN network (for chaining egress through NordVPN/gluetun proxy)
# Set to empty string to skip joining the VPN network
proxy_iron_proxy_vpn_network_name: "{{ cloud_server_iron_proxy_vpn_network_name | default('') }}"

# ---------------------------------------------------------------------------
# Feature Flags
# ---------------------------------------------------------------------------
proxy_iron_proxy_verify_health: true
proxy_iron_proxy_verify_timeout_seconds: 30
