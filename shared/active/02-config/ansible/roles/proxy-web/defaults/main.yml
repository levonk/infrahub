---
# proxy-web Role Defaults
# Maps proxy_web_* role variables to infra_* infrastructure variables.
# See: shared/active/02-config/ansible/infrastructure/ports.yml and networks.yml
# See: diagrams/proxy/complete-web-proxy-chain.mmd for the full architecture

# Service toggle
proxy_web_enabled: true

# Network (shares localnet-network with DNS chain)
proxy_web_network_name: "{{ infra_network_dns_localnet_network_name | default('localnet-network') }}"
proxy_web_network_subnet: "{{ infra_network_dns_localnet_subnet | default('172.26.0.0/16') }}"

# Registry
proxy_web_registry: "{{ local_registry | default('100.90.22.85:5000') }}"

# Docker host for Windows deployment (ssh-tunneled)
proxy_web_docker_host_windows: "ssh://ansible@{{ infra_tailscale_fqdn_windows_docker | default('dtop202311.' ~ (infra_tailscale_tailnet | default('example.ts.net'))) }}"

# IP allocations (from networks.yml — shared localnet-network, high range 172.26.255.x)
proxy_web_mitm_ip: "{{ infra_network_ip_proxy_mitm | default('172.26.255.80') }}"
proxy_web_privoxy_ip: "{{ infra_network_ip_proxy_privoxy | default('172.26.255.81') }}"
proxy_web_varnish_ip: "{{ infra_network_ip_proxy_varnish | default('172.26.255.82') }}"
proxy_web_gost_ip: "{{ infra_network_ip_proxy_gost | default('172.26.255.83') }}"

# Tor proxy (shared with DNS chain)
proxy_web_tor_socks5_ip: "{{ infra_network_ip_dns_tor_proxy | default('172.26.255.70') }}"
proxy_web_tor_socks5_port: "{{ infra_port_proxy_tor_socks5_container | default('9050') }}"

# Port allocations (from ports.yml)
# MITM Proxy
proxy_web_mitm_transparent_host_port: "{{ infra_port_proxy_mitm_transparent_host | default('3127') }}"
proxy_web_mitm_transparent_container_port: "{{ infra_port_proxy_mitm_transparent_container | default('3127') }}"
proxy_web_mitm_adblock_host_port: "{{ infra_port_proxy_mitm_adblock_host | default('3128') }}"
proxy_web_mitm_adblock_container_port: "{{ infra_port_proxy_mitm_adblock_container | default('3128') }}"
proxy_web_mitm_webui_host_port: "{{ infra_port_proxy_mitm_webui_host | default('19081') }}"
proxy_web_mitm_webui_container_port: "{{ infra_port_proxy_mitm_webui_container | default('8081') }}"

# Privoxy
proxy_web_privoxy_host_port: "{{ infra_port_proxy_privoxy_host | default('8118') }}"
proxy_web_privoxy_container_port: "{{ infra_port_proxy_privoxy_container | default('8118') }}"

# Varnish
proxy_web_varnish_http_host_port: "{{ infra_port_proxy_varnish_http_host | default('6081') }}"
proxy_web_varnish_http_container_port: "{{ infra_port_proxy_varnish_http_container | default('6081') }}"
proxy_web_varnish_admin_host_port: "{{ infra_port_proxy_varnish_admin_host | default('6082') }}"
proxy_web_varnish_admin_container_port: "{{ infra_port_proxy_varnish_admin_container | default('6082') }}"

# Gost
proxy_web_gost_socks5_host_port: "{{ infra_port_proxy_gost_socks5_host | default('11080') }}"
proxy_web_gost_socks5_container_port: "{{ infra_port_proxy_gost_socks5_container | default('1080') }}"
proxy_web_gost_http_host_port: "{{ infra_port_proxy_gost_http_host | default('19080') }}"
proxy_web_gost_http_container_port: "{{ infra_port_proxy_gost_http_container | default('8080') }}"

# Volumes (from storage.yml)
proxy_web_mitm_ca_volume: "{{ infra_storage_proxy_mitm_ca_volume | default('localnet-proxy-mitm-ca-volume') }}"
proxy_web_varnish_cache_volume: "{{ infra_storage_proxy_varnish_cache_volume | default('localnet-proxy-varnish-cache-volume') }}"
proxy_web_gost_config_volume: "{{ infra_storage_proxy_gost_config_volume | default('localnet-proxy-gost-config-volume') }}"
proxy_web_privoxy_config_volume: "{{ infra_storage_proxy_privoxy_config_volume | default('localnet-proxy-privoxy-config-volume') }}"

# Container images
proxy_web_mitm_image: "mitmproxy/mitmproxy"
proxy_web_privoxy_image: "vimagick/privoxy"
proxy_web_varnish_image: "varnish"
proxy_web_gost_image: "localnet-proxy-gost"

# Varnish cache size
proxy_web_varnish_cache_size: "1G"

# Local temp directory for Windows config seeding
proxy_web_windows_temp_dir: "/tmp/proxy-web-config-{{ inventory_hostname }}"
