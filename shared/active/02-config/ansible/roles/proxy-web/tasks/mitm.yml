---
# MITM Proxy (mitmproxy/mitmproxy)
# Layer 2: HTTPS decryption + CA management
# Runs in mitmweb mode for web UI access

- name: Pull MITM proxy image
  community.docker.docker_image:
    name: "{{ proxy_web_mitm_image }}"
    source: pull
    state: present

- name: Deploy MITM proxy container
  community.docker.docker_container:
    name: localnet-proxy-mitm
    image: "{{ proxy_web_mitm_image }}"
    state: started
    restart_policy: unless-stopped
    command: >-
      mitmweb
      --web-host 0.0.0.0
      --web-port {{ proxy_web_mitm_webui_container_port }}
      --mode regular@{{ proxy_web_mitm_adblock_container_port }}
    networks:
      - name: "{{ proxy_web_network_name }}"
        ipv4_address: "{{ proxy_web_mitm_ip }}"
        aliases:
          - mitm
    published_ports:
      - "{{ proxy_web_mitm_adblock_host_port }}:{{ proxy_web_mitm_adblock_container_port }}/tcp"
      - "{{ proxy_web_mitm_transparent_host_port }}:{{ proxy_web_mitm_transparent_container_port }}/tcp"
      - "{{ proxy_web_mitm_webui_host_port }}:{{ proxy_web_mitm_webui_container_port }}/tcp"
    volumes:
      - "{{ proxy_web_mitm_ca_volume }}:/home/mitmproxy/.mitmproxy:rw"
    env:
      TZ: "{{ localnet_tz | default('UTC') }}"
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: 5
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:{{ proxy_web_mitm_webui_container_port }}/"]
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "30s"

- name: Wait for MITM proxy web UI to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ proxy_web_mitm_webui_host_port }}/"
    status_code: 200
  register: mitm_health
  until: mitm_health.status == 200
  retries: 10
  delay: 5
