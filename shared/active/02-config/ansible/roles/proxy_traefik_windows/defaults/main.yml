---
# proxy-traefik-windows — Traefik reverse proxy for Windows Docker Desktop
#
# Deploys a Traefik container on a Windows Docker host using the
# ssh-tunneled Docker CLI pattern (DOCKER_HOST: ssh:// + delegate_to: localhost).
# community.docker modules can't run on Windows (Ansible core basic.py imports
# grp, Unix-only), so all tasks use ansible.builtin.shell/command with
# DOCKER_HOST environment variable.
#
# This role is the Windows equivalent of proxy-traefik (Linux/OCI).
# It handles TLS termination via Let's Encrypt DNS-01 challenge (Cloudflare)
# and routes traffic to containers running on the Windows Docker host.

# ---------------------------------------------------------------------------
# Service Configuration
# ---------------------------------------------------------------------------
proxy_traefik_windows_enabled: true
proxy_traefik_windows_container_name: "traefik-windows"
proxy_traefik_windows_image: "traefik"
proxy_traefik_windows_image_tag: "v3.0"
proxy_traefik_windows_temp_dir: "/tmp/traefik-windows-config"

# ---------------------------------------------------------------------------
# Network / Port Configuration
# ---------------------------------------------------------------------------
proxy_traefik_windows_network_name: "traefik-windows-network"
proxy_traefik_windows_http_port: "80"
proxy_traefik_windows_https_port: "443"
proxy_traefik_windows_dashboard_port: "8882"

# ---------------------------------------------------------------------------
# Volume Configuration
# ---------------------------------------------------------------------------
proxy_traefik_windows_config_volume: "traefik-windows-config"
proxy_traefik_windows_letsencrypt_volume: "traefik-windows-letsencrypt"
proxy_traefik_windows_logs_volume: "traefik-windows-logs"

# ---------------------------------------------------------------------------
# ACME / Let's Encrypt Configuration
# ---------------------------------------------------------------------------
proxy_traefik_windows_acme_email: "{{ cloud_server_acme_email | default('admin@example.com') }}"
proxy_traefik_windows_acme_staging: false

# Cloudflare DNS challenge env vars (passed to Traefik container)
# CF_DNS_API_TOKEN is the Cloudflare API token for DNS-01 challenge
proxy_traefik_windows_cf_dns_api_token: "{{ vault_cloudflare_api_token | default('') }}"

# ---------------------------------------------------------------------------
# Authelia Integration (optional — Authelia runs on OCI, reachable via Tailscale)
# ---------------------------------------------------------------------------
proxy_traefik_windows_authelia_enabled: true
proxy_traefik_windows_authelia_url: "http://{{ infra_tailscale_fqdn_cloud_server | default('oci.tale-grouper.ts.net') }}:{{ infra_port_sso_authelia_web_host | default('9091') }}/api/verify?rd=https://{{ infra_domain_sso_authelia | default('auth.levonk.com') }}"

# ---------------------------------------------------------------------------
# Verdaccio Integration
# ---------------------------------------------------------------------------
proxy_traefik_windows_verdaccio_enabled: true
proxy_traefik_windows_verdaccio_domain: "{{ infra_domain_artifact_verdaccio_nl | default('npmjs.nl.levonk.com') }}"
proxy_traefik_windows_verdaccio_container_name: "{{ verdaccio_container_name_nl | default('localnet-artifact-verdaccio-nl') }}"
proxy_traefik_windows_verdaccio_container_port: "{{ verdaccio_container_port | default('4873') }}"

# ---------------------------------------------------------------------------
# Homepage + TraLa Integration (nl dashboards)
# ---------------------------------------------------------------------------
proxy_traefik_windows_homepage_enabled: true
proxy_traefik_windows_homepage_domain: "{{ infra_domain_dashboard_homepage_nl | default('start.nl.levonk.com') }}"
proxy_traefik_windows_homepage_container_name: "homepage-nl"
proxy_traefik_windows_homepage_container_port: "3000"
proxy_traefik_windows_homepage_image: "ghcr.io/gethomepage/homepage"
proxy_traefik_windows_homepage_image_tag: "latest"
proxy_traefik_windows_homepage_host_port: "8084"

proxy_traefik_windows_trala_enabled: true
proxy_traefik_windows_trala_domain: "{{ infra_domain_dashboard_trala_nl | default('start2.nl.levonk.com') }}"
proxy_traefik_windows_trala_container_name: "trala-nl"
proxy_traefik_windows_trala_container_port: "8080"
proxy_traefik_windows_trala_image: "ghcr.io/dannybouwers/trala"
proxy_traefik_windows_trala_image_tag: "latest"
proxy_traefik_windows_trala_host_port: "8085"

# ---------------------------------------------------------------------------
# Nix Cache Chain Integration (nl — ncps front door)
# ncps is the NAR caching proxy. Harmonia + ncro are internal (not routed).
# ---------------------------------------------------------------------------
proxy_traefik_windows_nix_ncps_enabled: true
proxy_traefik_windows_nix_ncps_domain: "{{ infra_domain_nix_cache_nl | default('nixcache.nl.levonk.com') }}"
proxy_traefik_windows_nix_ncps_container_name: "{{ infra_hostname_nix_ncps | default('localnet-nix-ncps') }}"
proxy_traefik_windows_nix_ncps_container_port: "{{ infra_port_nix_ncps_container | default('8080') }}"

# ---------------------------------------------------------------------------
# Garnix CI Integration (nl — CI builder web UI + API)
# ---------------------------------------------------------------------------
proxy_traefik_windows_garnix_ci_enabled: true
proxy_traefik_windows_garnix_ci_domain: "{{ infra_domain_garnix_ci_nl | default('ci.nl.levonk.com') }}"
proxy_traefik_windows_garnix_ci_container_name: "{{ infra_hostname_garnix_ci | default('localnet-garnix-ci') }}"
proxy_traefik_windows_garnix_ci_web_container_port: "{{ infra_port_garnix_ci_web_container | default('3000') }}"
proxy_traefik_windows_garnix_ci_api_container_port: "{{ infra_port_garnix_ci_api_container | default('8080') }}"

# ---------------------------------------------------------------------------
# Directory Empire Integration (nl — Next.js orchestration dashboard)
# ---------------------------------------------------------------------------
proxy_traefik_windows_directory_empire_enabled: true
proxy_traefik_windows_directory_empire_domain: "{{ infra_domain_dashboard_directory_empire_nl | default('de.nl.levonk.com') }}"
proxy_traefik_windows_directory_empire_container_name: "{{ infra_hostname_dashboard_directory_empire | default('localnet-dashboard-directory-empire') }}"
proxy_traefik_windows_directory_empire_container_port: "{{ infra_port_dashboard_directory_empire_container | default('3000') }}"

# ---------------------------------------------------------------------------
# Docker Host (Windows — ssh-tunneled)
# ---------------------------------------------------------------------------
proxy_traefik_windows_docker_host: "{{ verdaccio_docker_host_windows | default('ssh://ansible@dtop202311.tale-grouper.ts.net') }}"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
proxy_traefik_windows_log_level: "INFO"
proxy_traefik_windows_log_max_size: "10m"
proxy_traefik_windows_log_max_file: "3"

# ---------------------------------------------------------------------------
# Healthcheck
# ---------------------------------------------------------------------------
proxy_traefik_windows_healthcheck_interval: "30s"
proxy_traefik_windows_healthcheck_timeout: "5s"
proxy_traefik_windows_healthcheck_retries: 3
proxy_traefik_windows_healthcheck_start_period: "10s"
