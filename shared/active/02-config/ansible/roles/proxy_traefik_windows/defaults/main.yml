---
# proxy-traefik-windows — Traefik reverse proxy for Windows Docker Desktop
#
# Deploys a Traefik container on a Windows Docker host using the
# ssh-tunneled Docker CLI pattern (DOCKER_HOST: ssh:// + delegate_to: localhost).
# community.docker modules can't run on Windows (Ansible core basic.py imports
# grp, Unix-only), so all tasks use ansible.builtin.shell/command with
# DOCKER_HOST environment variable.
#
# This role is the Windows equivalent of proxy-traefik (Linux/OCI).
# It handles TLS termination via Let's Encrypt DNS-01 challenge (Cloudflare)
# and routes traffic to containers running on the Windows Docker host.

# ---------------------------------------------------------------------------
# Service Configuration
# ---------------------------------------------------------------------------
proxy_traefik_windows_enabled: true
proxy_traefik_windows_container_name: "traefik-windows"
proxy_traefik_windows_image: "traefik"
proxy_traefik_windows_image_tag: "v3.0"
proxy_traefik_windows_temp_dir: "/tmp/traefik-windows-config"

# ---------------------------------------------------------------------------
# Network / Port Configuration
# ---------------------------------------------------------------------------
proxy_traefik_windows_network_name: "traefik-windows-network"
proxy_traefik_windows_http_port: "80"
proxy_traefik_windows_https_port: "443"
proxy_traefik_windows_dashboard_port: "8882"

# ---------------------------------------------------------------------------
# Volume Configuration
# ---------------------------------------------------------------------------
proxy_traefik_windows_config_volume: "traefik-windows-config"
proxy_traefik_windows_letsencrypt_volume: "traefik-windows-letsencrypt"
proxy_traefik_windows_logs_volume: "traefik-windows-logs"

# ---------------------------------------------------------------------------
# ACME / Let's Encrypt Configuration
# ---------------------------------------------------------------------------
proxy_traefik_windows_acme_email: "{{ cloud_server_acme_email | default(infra_value_proxy_traefik_windows_acme_email) }}"
proxy_traefik_windows_acme_staging: false

# Cloudflare DNS challenge env vars (passed to Traefik container)
# CF_DNS_API_TOKEN is the Cloudflare API token for DNS-01 challenge
proxy_traefik_windows_cf_dns_api_token: "{{ vault_cloudflare_api_token | default('') }}"
# Cloudflare zone ID (for ACME TXT record cleanup)
proxy_traefik_windows_cf_zone_id: "{{ vault_cloudflare_zone_id | default('') }}"

# ---------------------------------------------------------------------------
# ACME TXT Record Cleanup
# ---------------------------------------------------------------------------
# Before Traefik starts, stale _acme-challenge.* TXT records are deleted
# via the Cloudflare API. This prevents the "An identical record already
# exists (81058)" error that blocks ACME DNS-01 challenges.
# Set to false to skip cleanup (e.g., for testing or offline runs).
proxy_traefik_windows_acme_txt_cleanup: true

# ---------------------------------------------------------------------------
# Certificate Validation
# ---------------------------------------------------------------------------
# After Traefik is healthy, poll each domain's TLS cert via openssl s_client
# to verify it's not the "TRAEFIK DEFAULT CERT" (self-signed fallback).
# Set to false to skip validation.
proxy_traefik_windows_cert_validation: true
# How long to wait for certs to be issued (seconds)
proxy_traefik_windows_cert_validation_timeout: 180
# Polling interval (seconds)
proxy_traefik_windows_cert_validation_interval: 10

# ---------------------------------------------------------------------------
# Managed domains — auto-populated from enabled services
# This list drives ACME TXT cleanup and cert validation.
# Add new services here when adding Traefik dynamic config templates.
# ---------------------------------------------------------------------------
proxy_traefik_windows_cert_domains: >-
  {{
    ([] | default([])) +
    ((proxy_traefik_windows_verdaccio_enabled | bool) | ternary([proxy_traefik_windows_verdaccio_domain], [])) +
    ((proxy_traefik_windows_homepage_enabled | bool) | ternary([proxy_traefik_windows_homepage_domain], [])) +
    ((proxy_traefik_windows_trala_enabled | bool) | ternary([proxy_traefik_windows_trala_domain], [])) +
    ((proxy_traefik_windows_nix_ncps_enabled | bool) | ternary([proxy_traefik_windows_nix_ncps_domain], [])) +
    ((proxy_traefik_windows_garnix_ci_enabled | bool) | ternary([proxy_traefik_windows_garnix_ci_domain], [])) +
    ((proxy_traefik_windows_directory_empire_enabled | bool) | ternary([proxy_traefik_windows_directory_empire_domain], [])) +
    ((proxy_traefik_windows_control_center_enabled | bool) | ternary([proxy_traefik_windows_control_center_domain_nl, proxy_traefik_windows_control_center_domain_default], [])) +
    ((dns_dnsdist_enabled | default(false) | bool) | ternary([infra_domain_dns_dnsdist | default('')], [])) +
    ((proxy_traefik_windows_hister_enabled | bool) | ternary([proxy_traefik_windows_hister_domain], [])) +
    ((proxy_traefik_windows_stirling_pdf_enabled | bool) | ternary([proxy_traefik_windows_stirling_pdf_domain], [])) +
    ((proxy_traefik_windows_stirling_pdf_enabled | bool and tools_stirling_pdf_domain_alias is defined and tools_stirling_pdf_domain_alias | length > 0) | ternary([tools_stirling_pdf_domain_alias], [])) +
    ((proxy_traefik_windows_stirling_pdf_enabled | bool and proxy_traefik_windows_stirling_pdf_api_domain is defined and proxy_traefik_windows_stirling_pdf_api_domain | length > 0) | ternary([proxy_traefik_windows_stirling_pdf_api_domain], []))
    | select('ne', '') | list
  }}

# ---------------------------------------------------------------------------
# Authelia Integration (optional — Authelia runs on OCI, reachable via Tailscale)
# ---------------------------------------------------------------------------
proxy_traefik_windows_authelia_enabled: true
proxy_traefik_windows_authelia_url: "http://{{ infra_tailscale_fqdn_cloud_server | default('oci.' ~ (infra_tailscale_tailnet | default(infra_value_proxy_traefik_windows_authelia_url))) }}:{{ infra_port_sso_authelia_web_host | default(infra_port_proxy_authelia_host) }}/api/verify?rd=https://{{ infra_domain_sso_authelia }}"

# ---------------------------------------------------------------------------
# Verdaccio Integration
# ---------------------------------------------------------------------------
proxy_traefik_windows_verdaccio_enabled: true
proxy_traefik_windows_verdaccio_domain: "{{ infra_domain_artifact_verdaccio_nl  }}"
proxy_traefik_windows_verdaccio_container_name: "{{ verdaccio_container_name_nl | default(infra_value_proxy_traefik_windows_verdaccio_container_name) }}"
proxy_traefik_windows_verdaccio_container_port: "{{ verdaccio_container_port | default(infra_port_nix_ncro_web_alt_host) }}"

# ---------------------------------------------------------------------------
# Homepage + TraLa Integration (nl dashboards)
# ---------------------------------------------------------------------------
proxy_traefik_windows_homepage_enabled: true
proxy_traefik_windows_homepage_domain: "{{ infra_domain_dashboard_homepage_nl  }}"
proxy_traefik_windows_homepage_container_name: "homepage-nl"
proxy_traefik_windows_homepage_container_port: "3000"
proxy_traefik_windows_homepage_image: "ghcr.io/gethomepage/homepage"
proxy_traefik_windows_homepage_image_tag: "latest"
proxy_traefik_windows_homepage_host_port: "8084"

proxy_traefik_windows_trala_enabled: true
proxy_traefik_windows_trala_domain: "{{ infra_domain_dashboard_trala_nl  }}"
proxy_traefik_windows_trala_container_name: "trala-nl"
proxy_traefik_windows_trala_container_port: "8080"
proxy_traefik_windows_trala_image: "ghcr.io/dannybouwers/trala"
proxy_traefik_windows_trala_image_tag: "latest"
proxy_traefik_windows_trala_host_port: "8085"

# ---------------------------------------------------------------------------
# Nix Cache Chain Integration (nl — ncps front door)
# ncps is the NAR caching proxy. Harmonia + ncro are internal (not routed).
# ---------------------------------------------------------------------------
proxy_traefik_windows_nix_ncps_enabled: true
proxy_traefik_windows_nix_ncps_domain: "{{ infra_domain_nix_cache_nl  }}"
proxy_traefik_windows_nix_ncps_container_name: "{{ infra_hostname_nix_ncps | default(infra_value_proxy_traefik_windows_nix_ncps_container_name) }}"
proxy_traefik_windows_nix_ncps_container_port: "{{ infra_port_nix_ncps_container | default(infra_port_proxy_dashboard_host) }}"

# ---------------------------------------------------------------------------
# Garnix CI Integration (nl — CI builder web UI + API)
# ---------------------------------------------------------------------------
proxy_traefik_windows_garnix_ci_enabled: true
proxy_traefik_windows_garnix_ci_domain: "{{ infra_domain_garnix_ci_nl  }}"
proxy_traefik_windows_garnix_ci_container_name: "{{ infra_hostname_garnix_ci | default(infra_value_proxy_traefik_windows_garnix_ci_container_name) }}"
proxy_traefik_windows_garnix_ci_web_container_port: "{{ infra_port_garnix_ci_web_container | default(infra_port_monitoring_grafana_host) }}"
proxy_traefik_windows_garnix_ci_api_container_port: "{{ infra_port_garnix_ci_api_container | default(infra_port_proxy_dashboard_host) }}"

# ---------------------------------------------------------------------------
# Directory Empire Integration (nl — Next.js orchestration dashboard)
# ---------------------------------------------------------------------------
proxy_traefik_windows_directory_empire_enabled: true
proxy_traefik_windows_directory_empire_domain: "{{ infra_domain_dashboard_directory_empire_nl  }}"
proxy_traefik_windows_directory_empire_container_name: "{{ infra_hostname_dashboard_directory_empire | default(infra_value_proxy_traefik_windows_directory_empire_container_name) }}"
proxy_traefik_windows_directory_empire_container_port: "{{ infra_port_dashboard_directory_empire_container | default(infra_port_monitoring_grafana_host) }}"

# ---------------------------------------------------------------------------
# Control Center Dashboard Integration (nl + default — dashboard)
# ---------------------------------------------------------------------------
proxy_traefik_windows_control_center_enabled: true
proxy_traefik_windows_control_center_domain_nl: "{{ infra_domain_dashboard_control_center_nl | default('dashboard.nl.' ~ (infra_domain_base | default(infra_value_control_center_domain_nl))) }}"
proxy_traefik_windows_control_center_domain_default: "{{ infra_domain_dashboard_control_center | default('dashboard.' ~ (infra_domain_base | default(infra_value_control_center_domain_default))) }}"
proxy_traefik_windows_control_center_container_name: "{{ infra_hostname_dashboard_control_center | default(infra_value_control_center_container_name) }}"
proxy_traefik_windows_control_center_container_port: "{{ infra_port_dashboard_control_center_container | default(infra_value_control_center_container_port) }}"

# ---------------------------------------------------------------------------
# Hister Search Engine Integration (nl — self-hosted search engine)
# ---------------------------------------------------------------------------
proxy_traefik_windows_hister_enabled: true
proxy_traefik_windows_hister_domain: "{{ search_hister_domain | default(infra_value_proxy_traefik_windows_hister_domain) }}"
proxy_traefik_windows_hister_container_name: "{{ search_hister_container_name | default(infra_value_proxy_traefik_windows_hister_container_name) }}"
proxy_traefik_windows_hister_container_port: "{{ search_hister_container_port | default(infra_port_proxy_https_alt_host) }}"

# ---------------------------------------------------------------------------
# Stirling-PDF Integration (nl — self-hosted PDF utility suite)
# ---------------------------------------------------------------------------
proxy_traefik_windows_stirling_pdf_enabled: true
proxy_traefik_windows_stirling_pdf_domain: "{{ tools_stirling_pdf_domain | default(infra_value_proxy_traefik_windows_stirling_pdf_domain) }}"
proxy_traefik_windows_stirling_pdf_container_name: "{{ tools_stirling_pdf_container_name | default(infra_value_proxy_traefik_windows_stirling_pdf_container_name) }}"
proxy_traefik_windows_stirling_pdf_container_port: "{{ tools_stirling_pdf_container_port | default(infra_port_proxy_dashboard_host) }}"

# ---------------------------------------------------------------------------
# Docker Host (Windows — ssh-tunneled)
# ---------------------------------------------------------------------------
proxy_traefik_windows_docker_host: "{{ verdaccio_docker_host_windows | default('ssh://ansible@dtop202311.' ~ (infra_tailscale_tailnet | default(infra_value_proxy_traefik_windows_docker_host))) }}"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
proxy_traefik_windows_log_level: "INFO"
proxy_traefik_windows_log_max_size: "10m"
proxy_traefik_windows_log_max_file: "3"

# ---------------------------------------------------------------------------
# Healthcheck
# ---------------------------------------------------------------------------
proxy_traefik_windows_healthcheck_interval: "30s"
proxy_traefik_windows_healthcheck_timeout: "5s"
proxy_traefik_windows_healthcheck_retries: 3
proxy_traefik_windows_healthcheck_start_period: "10s"
