---
# Gost Egress Multiplexer (locally-built: localnet-proxy-gost)
# Layer 5: Routes traffic to egress backends (Direct, Tor)
# Receives cache misses from Varnish

- name: Pull Gost image
  community.docker.docker_image:
    name: "{{ proxy_web_registry }}/localnet-proxy-gost:latest"
    source: pull
    state: present
  when: proxy_web_registry is defined

- name: Deploy Gost container
  community.docker.docker_container:
    name: localnet-proxy-gost
    image: "{{ proxy_web_registry }}/{{ proxy_web_gost_image }}:latest"
    state: started
    restart_policy: unless-stopped
    entrypoint: ["/usr/bin/gost"]
    command: ["-C", "/etc/gost/gost.yaml"]
    networks:
      - name: "{{ proxy_web_network_name }}"
        ipv4_address: "{{ proxy_web_gost_ip }}"
        aliases:
          - gost
    published_ports:
      - "{{ proxy_web_gost_socks5_host_port }}:{{ proxy_web_gost_socks5_container_port }}/tcp"
      - "{{ proxy_web_gost_http_host_port }}:{{ proxy_web_gost_http_container_port }}/tcp"
    volumes:
      - "{{ localnet_services_dir }}/proxy-web/gost.yaml:/etc/gost/gost.yaml:ro"
    env:
      TZ: "{{ localnet_tz | default('UTC') }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "nc", "-z", "{{ infra_network_bind_localhost }}", "{{ proxy_web_gost_socks5_container_port }}"]
      interval: "{{ infra_timeout_default }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_timeout_healthcheck }}"

- name: Wait for Gost SOCKS5 to be ready
  ansible.builtin.wait_for:
    host: "{{ infra_network_bind_localhost }}"
    port: "{{ proxy_web_gost_socks5_host_port }}"
    timeout: "{{ infra_timeout_default }}"
  retries: "{{ infra_retry_default }}"
  delay: "{{ infra_delay_default }}"
