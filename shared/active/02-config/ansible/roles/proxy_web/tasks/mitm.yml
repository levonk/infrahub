---
# MITM Proxy (mitmproxy/mitmproxy)
# Layer 2: HTTPS decryption + CA management
# Runs in mitmweb mode for web UI access

- name: Pull MITM proxy image
  community.docker.docker_image:
    name: "{{ proxy_web_mitm_image }}"
    source: pull
    state: present

- name: Deploy MITM proxy container
  community.docker.docker_container:
    name: localnet-proxy-mitm
    image: "{{ proxy_web_mitm_image }}"
    state: started
    restart_policy: unless-stopped
    command: >-
      mitmweb
      --web-host {{ infra_network_bind_all }}
      --web-port {{ proxy_web_mitm_webui_container_port }}
      --mode regular@{{ proxy_web_mitm_adblock_container_port }}
    networks:
      - name: "{{ proxy_web_network_name }}"
        ipv4_address: "{{ proxy_web_mitm_ip }}"
        aliases:
          - mitm
    published_ports:
      - "{{ proxy_web_mitm_adblock_host_port }}:{{ proxy_web_mitm_adblock_container_port }}/tcp"
      - "{{ proxy_web_mitm_transparent_host_port }}:{{ proxy_web_mitm_transparent_container_port }}/tcp"
      - "{{ proxy_web_mitm_webui_host_port }}:{{ proxy_web_mitm_webui_container_port }}/tcp"
    volumes:
      - "{{ proxy_web_mitm_ca_volume }}:/home/mitmproxy/.mitmproxy:rw"
    env:
      TZ: "{{ localnet_tz | default('UTC') }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout({{ infra_timeout_short }}); s.connect(('{{ infra_network_bind_localhost }}', {{ proxy_web_mitm_webui_container_port }})); s.close()\""]
      interval: "{{ infra_timeout_default }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_timeout_default }}"

- name: Wait for MITM proxy web UI to be ready
  ansible.builtin.uri:
    url: "http://{{ infra_network_bind_localhost }}:{{ proxy_web_mitm_webui_host_port }}/"
    status_code: [200, 403]
  register: proxy_web_mitm_health
  until: proxy_web_mitm_health.status in [200, 403]
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_default }}"
