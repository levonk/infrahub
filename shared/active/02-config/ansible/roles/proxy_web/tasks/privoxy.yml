---
# Privoxy (vimagick/privoxy)
# Layer 3: Content filtering + header sanitization
# Receives plaintext HTTP from MITM proxy

- name: Pull Privoxy image
  community.docker.docker_image:
    name: "{{ proxy_web_privoxy_image }}"
    source: pull
    state: present

- name: Deploy Privoxy container
  community.docker.docker_container:
    name: localnet-proxy-privoxy
    image: "{{ proxy_web_privoxy_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ proxy_web_network_name }}"
        ipv4_address: "{{ proxy_web_privoxy_ip }}"
        aliases:
          - privoxy
    volumes:
      - "{{ localnet_services_dir }}/proxy-web/privoxy-config:/etc/privoxy/config:ro"
      - "{{ proxy_web_privoxy_config_volume }}:/etc/privoxy:rw"
    env:
      TZ: "{{ localnet_tz | default('UTC') }}"
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "nc", "-zv", "{{ infra_network_bind_localhost }}", "{{ proxy_web_privoxy_container_port }}"]
      interval: "{{ infra_timeout_default }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_timeout_healthcheck }}"

- name: Wait for Privoxy to be ready
  ansible.builtin.wait_for:
    host: "{{ proxy_web_privoxy_ip }}"
    port: "{{ proxy_web_privoxy_container_port }}"
    timeout: "{{ infra_timeout_default }}"
  retries: "{{ infra_retry_default }}"
  delay: "{{ infra_delay_default }}"
