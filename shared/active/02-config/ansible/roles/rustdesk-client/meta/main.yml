---
galaxy_info:
  role_name: rustdesk_client
  author: infrahub
  description: >
    Installs and configures the RustDesk client to use a self-hosted
    RustDesk server. On Linux uses .deb/.rpm + systemd; on macOS uses the
    Homebrew cask + launchd Daemon/Agent, then opens the System Settings
    privacy panes for the one-time TCC grants.
  company: levonk
  license: MIT
  min_ansible_version: "2.9"

  platforms:
    - name: Debian
      versions:
        - bookworm
    - name: Ubuntu
      versions:
        - noble
    - name: EL
      versions:
        - "9"
    - name: MacOSX
      versions:
        - all

  galaxy_tags:
    - rustdesk
    - remotedesktop
    - client

dependencies: []
