---
# RustDesk Client — Installation and Configuration
# Installs the RustDesk client and configures it to use a self-hosted
# RustDesk server (hbbs/hbbr). Dispatches on OS:
#
#   Linux  — .deb/.rpm package, systemd service, root config
#   macOS  — Homebrew cask, launchd Daemon/Agent, per-user + root config,
#            TCC privacy-pane handoff for the one-time human grants

# ============================================================================
# Validate required variables
# ============================================================================
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - rustdesk_client_id_server is defined
      - rustdesk_client_relay_server is defined
      - rustdesk_client_key is defined
      - rustdesk_client_version is defined
    fail_msg: >-
      Missing required rustdesk_client variables. Check
      roles/rustdesk-client/defaults/main.yml.
    success_msg: "All required rustdesk_client variables are defined."
  tags: ["always", "validate"]

# ============================================================================
# OS dispatch
# ============================================================================
- name: Include macOS tasks
  ansible.builtin.include_tasks: darwin.yml
  when:
    - rustdesk_client_enabled | bool
    - ansible_facts['distribution'] == "MacOSX"
  tags: ["rustdesk"]

- name: Include Linux tasks
  ansible.builtin.include_tasks: linux.yml
  when:
    - rustdesk_client_enabled | bool
    - ansible_facts['os_family'] in ["Debian", "RedHat"]
  tags: ["rustdesk"]

- name: Warn on unsupported platform
  ansible.builtin.debug:
    msg: >-
      rustdesk-client: unsupported platform
      (distribution={{ ansible_facts['distribution'] | default('?') }},
      os_family={{ ansible_facts['os_family'] | default('?') }}). Nothing was done.
  when: >-
    ansible_facts['distribution'] != "MacOSX"
    and ansible_facts['os_family'] not in ["Debian", "RedHat"]
  tags: ["always"]
