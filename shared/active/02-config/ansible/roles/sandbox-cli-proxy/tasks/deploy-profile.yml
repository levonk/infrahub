---
# deploy-profile.yml — deploys a single iron-proxy instance for one egress profile
# Called via include_tasks with loop_var=profile

# ---------------------------------------------------------------------------
# Docker Network
# ---------------------------------------------------------------------------
- name: "Ensure {{ profile.name }} sandbox Docker network exists"
  community.docker.docker_network:
    name: "{{ profile.network }}"
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ profile.subnet }}"
        gateway: "{{ profile.gateway }}"
  become: true

# ---------------------------------------------------------------------------
# Configuration Template
# ---------------------------------------------------------------------------
- name: "Deploy {{ profile.name }} iron-proxy configuration"
  ansible.builtin.template:
    src: iron-proxy-profile.yml.j2
    dest: "{{ sandbox_cli_proxy_config_dir }}/{{ profile.name }}/iron-proxy.yml"
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  become: true
  notify: restart sandbox-cli-proxy

# ---------------------------------------------------------------------------
# CA Certificate Generation (shared across profiles, generated once)
# ---------------------------------------------------------------------------
- name: Check if sandbox CA certificate exists
  ansible.builtin.stat:
    path: "{{ sandbox_cli_proxy_ca_dir }}/ca.crt"
  register: sandbox_ca_cert
  become: true

- name: Generate CA certificate for sandbox MITM mode
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -newkey rsa:{{ infra_crypto_rsa_key_size }} -keyout {{ sandbox_cli_proxy_ca_dir }}/ca.key
      -out {{ sandbox_cli_proxy_ca_dir }}/ca.crt -days {{ infra_tls_ca_validity_days }} -nodes
      -subj "/CN=sandbox-cli-proxy CA/O=sandbox-cli/C=US"
      -addext "basicConstraints=critical,CA:true"
      -addext "keyUsage=critical,keyCertSign"
  become: true
  when:
    - sandbox_cli_proxy_tls_mode == "mitm"
    - not sandbox_ca_cert.stat.exists
  notify: restart sandbox-cli-proxy

- name: Set CA key permissions readable by container
  ansible.builtin.file:
    path: "{{ sandbox_cli_proxy_ca_dir }}/ca.key"
    mode: "{{ infra_mode_file }}"
  become: true
  when:
    - sandbox_cli_proxy_tls_mode == "mitm"
    - not sandbox_ca_cert.stat.exists

# ---------------------------------------------------------------------------
# Docker Volume for CA cert
# ---------------------------------------------------------------------------
- name: "Ensure {{ profile.name }} CA volume exists"
  community.docker.docker_volume:
    name: "sandbox-cli-ca-{{ profile.name }}"
    state: present
  become: true

# ---------------------------------------------------------------------------
# iron-proxy Container
# ---------------------------------------------------------------------------
- name: "Deploy {{ profile.name }} iron-proxy container"
  community.docker.docker_container:
    name: "sandbox-iron-proxy-{{ profile.name }}"
    image: "{{ sandbox_cli_proxy_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ profile.network }}"
        ipv4_address: "{{ profile.proxy_ip }}"
    ports:
      - "{{ profile.http_port }}:{{ sandbox_cli_proxy_http_container_port | default(infra_port_proxy_http_host) }}/tcp"
      - "{{ profile.https_port }}:{{ sandbox_cli_proxy_https_container_port | default(infra_port_proxy_https_host) }}/tcp"
    volumes:
      - "{{ sandbox_cli_proxy_config_dir }}/{{ profile.name }}/iron-proxy.yml:/etc/iron-proxy/iron-proxy.yml:ro"
      - "{{ sandbox_cli_proxy_ca_dir }}/ca.crt:/etc/iron-proxy/ca.crt:ro"
      - "{{ sandbox_cli_proxy_ca_dir }}/ca.key:/etc/iron-proxy/ca.key:ro"
      - "sandbox-cli-ca-{{ profile.name }}:/etc/iron-proxy-ca"
    env:
      IRON_DNS_ENABLED: "{{ sandbox_cli_proxy_dns_enabled | ternary('true', 'false') }}"
      IRON_DNS_LISTEN: ":{{ profile.dns_port | default(infra_port_dns_host) }}"
      IRON_DNS_PROXY_IP: "{{ sandbox_cli_proxy_dns_proxy_ip }}"
      IRON_PROXY_HTTP_LISTEN: ":{{ sandbox_cli_proxy_http_container_port | default(infra_port_proxy_http_host) }}"
      IRON_PROXY_HTTPS_LISTEN: ":{{ sandbox_cli_proxy_https_container_port | default(infra_port_proxy_https_host) }}"
      IRON_TLS_MODE: "{{ sandbox_cli_proxy_tls_mode }}"
      IRON_TLS_CA_CERT: "/etc/iron-proxy/ca.crt"
      IRON_TLS_CA_KEY: "/etc/iron-proxy/ca.key"
      IRON_TLS_CERT_CACHE_SIZE: "{{ sandbox_cli_proxy_cert_cache_size | string }}"
      IRON_TLS_LEAF_CERT_EXPIRY_HOURS: "{{ sandbox_cli_proxy_leaf_cert_expiry_hours | string }}"
    cap_drop:
      - ALL
    capabilities:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
    security_opts:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size={{ infra_size_100m }}
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:{{ sandbox_cli_proxy_http_container_port | default(infra_port_proxy_http_host) }}/ 2>/dev/null; rc=$?; [ $rc -le 1 ] || exit 1"]
      interval: "{{ infra_timeout_default }}"
      timeout: "{{ infra_timeout_healthcheck_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_timeout_short }}"
  become: true

# ---------------------------------------------------------------------------
# Health Verification
# ---------------------------------------------------------------------------
- name: "Wait for {{ profile.name }} iron-proxy to be healthy"
  ansible.builtin.uri:
    url: "http://{{ infra_network_bind_localhost }}:{{ profile.http_port }}/health"
    status_code: [200, 502]
  register: profile_health
  until: profile_health.status in [200, 502]
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_default }}"
  when:
    - sandbox_cli_proxy_enabled | bool
    - sandbox_cli_proxy_verify_health | bool

# ---------------------------------------------------------------------------
# Extract CA cert to host for just recipe mounting
# ---------------------------------------------------------------------------
- name: "Ensure CA cert is accessible on host for {{ profile.name }}"
  ansible.builtin.copy:
    src: "{{ sandbox_cli_proxy_ca_dir }}/ca.crt"
    dest: "{{ sandbox_cli_proxy_ca_dir }}/ca/ca.crt"
    remote_src: true
    owner: root
    group: root
    mode: "{{ infra_mode_file }}"
  become: true
