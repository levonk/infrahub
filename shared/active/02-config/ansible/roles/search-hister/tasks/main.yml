---
# Hister Search Engine — Deployment Tasks
# Deploys Hister as a Docker container on Windows Docker Desktop (dtop202311).
#
# Uses the ssh-tunneled Docker CLI pattern (DOCKER_HOST: ssh:// + delegate_to: localhost)
# because community.docker modules can't run on Windows (Ansible core basic.py
# imports grp, Unix-only).

# 1. Validate required variables
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - search_hister_container_name is defined
      - search_hister_image_name is defined
      - search_hister_host_port is defined
      - search_hister_container_port is defined
      - search_hister_domain is defined
    fail_msg: >-
      Missing required search_hister variables. Check infrastructure files
      (ports.yml, domains.yml, storage.yml) and client overrides.
    success_msg: "All required search_hister variables are defined."
  tags: ["always", "validate"]

# 2. Dispatch to Windows deployment
- name: Deploy Hister on Windows Docker host
  ansible.builtin.include_tasks: deploy-windows.yml
  when:
    - search_hister_enabled | bool
    - "'windows_docker_hosts' in group_names"
  tags: ["deploy"]
