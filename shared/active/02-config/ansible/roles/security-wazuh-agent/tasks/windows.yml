---
# Windows wazuh agent installation
# Downloads the official MSI installer from the Wazuh packages repository
# and installs it silently with deployment variables for auto-enrollment.

# 1. Check if wazuh agent is already installed
- name: Check if wazuh agent is already installed (Windows)
  ansible.windows.win_service_info:
    name: "{{ wazuh_agent_windows_service_name }}"
  register: wazuh_agent_windows_service

# 2. Download the MSI installer
- name: Create temp directory for wazuh agent MSI (Windows)
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\wazuh-agent"
    state: directory
  when: not wazuh_agent_windows_service.exists | default(false)
  tags: ["deploy", "wazuh-agent"]

- name: Download wazuh agent MSI (Windows)
  ansible.windows.win_get_url:
    url: "{{ wazuh_agent_windows_msi_url }}"
    dest: "C:\\Windows\\Temp\\wazuh-agent\\{{ wazuh_agent_windows_msi_filename }}"
  when: not wazuh_agent_windows_service.exists | default(false)
  tags: ["deploy", "wazuh-agent"]

# 3. Install the MSI with deployment variables
- name: Install wazuh agent MSI (Windows)
  ansible.windows.win_package:
    path: "C:\\Windows\\Temp\\wazuh-agent\\{{ wazuh_agent_windows_msi_filename }}"
    state: present
    arguments: >-
      /q
      WAZUH_MANAGER="{{ wazuh_agent_manager_address }}"
      WAZUH_MANAGER_PORT="{{ wazuh_agent_manager_port }}"
      WAZUH_REGISTRATION_SERVER="{{ wazuh_agent_manager_address }}"
      WAZUH_REGISTRATION_PORT="{{ wazuh_agent_enrollment_port }}"
      WAZUH_AGENT_NAME="{{ wazuh_agent_name }}"
      WAZUH_AGENT_GROUP="{{ wazuh_agent_group }}"
      {% if wazuh_agent_enrollment_password | length > 0 %}
      WAZUH_REGISTRATION_PASSWORD="{{ wazuh_agent_enrollment_password }}"
      {% endif %}
  when: not wazuh_agent_windows_service.exists | default(false)
  no_log: true
  tags: ["deploy", "wazuh-agent"]

# 4. Clean up the MSI installer
- name: Remove wazuh agent MSI installer (Windows)
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\wazuh-agent"
    state: absent
  when: not wazuh_agent_windows_service.exists | default(false)
  tags: ["deploy", "wazuh-agent"]

# 5. Ensure ossec.conf has the correct manager address
- name: Ensure ossec.conf manager address is correct (Windows)
  ansible.windows.win_lineinfile:
    path: "{{ wazuh_agent_windows_config_path }}"
    regexp: '<address>.*</address>'
    line: '      <address>{{ wazuh_agent_manager_address }}</address>'
  notify: restart wazuh agent
  tags: ["deploy", "wazuh-agent", "config"]

# 6. Start the agent service
- name: Start wazuh agent service (Windows)
  ansible.windows.win_service:
    name: "{{ wazuh_agent_windows_service_name }}"
    state: started
    start_mode: auto
  tags: ["deploy", "wazuh-agent"]
