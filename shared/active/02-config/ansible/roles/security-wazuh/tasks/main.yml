---
# Wazuh SIEM/XDR Deployment
# Deploys on Windows Docker Desktop hosts via SSH-tunneled Docker CLI.
# Upstream images: wazuh/wazuh-manager, wazuh/wazuh-indexer, wazuh/wazuh-dashboard
#
# 3-container stack: manager (agent comm + analysis), indexer (OpenSearch
# storage), dashboard (web UI). TLS certs generated by wazuh-certs-generator.
#
# community.docker Ansible modules can't run on Windows (Ansible core basic.py
# imports grp, Unix-only). We use ansible.builtin.shell/command with the docker
# CLI, setting DOCKER_HOST to ssh:// so the system SSH client handles auth.
# This is the proven pattern for Windows Docker hosts in this codebase.

# 1. Validate required variables
- name: Validate required wazuh variables are defined
  ansible.builtin.assert:
    that:
      - wazuh_manager_container_name is defined
      - wazuh_manager_image_name is defined
      - wazuh_indexer_container_name is defined
      - wazuh_indexer_image_name is defined
      - wazuh_dashboard_container_name is defined
      - wazuh_dashboard_image_name is defined
      - wazuh_manager_agent_host_port is defined
      - wazuh_dashboard_host_port is defined
      - wazuh_indexer_password is defined
      - wazuh_indexer_password | length > 0
      - wazuh_dashboard_password is defined
      - wazuh_dashboard_password | length > 0
      - wazuh_api_password is defined
      - wazuh_api_password | length > 0
    fail_msg: "Missing required wazuh variables. Check windows_docker_hosts.yml and vault file."
    success_msg: "All required wazuh variables are defined."
  tags: ["always", "validate"]

# 2. Pull images from Docker Hub
- name: Pull wazuh-manager image
  ansible.builtin.command: "docker pull {{ wazuh_manager_image_name }}:{{ wazuh_manager_image_tag }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
    DOCKER_CONFIG: "{{ lookup('env', 'HOME') }}/.docker-no-creds"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "pull"]

- name: Pull wazuh-indexer image
  ansible.builtin.command: "docker pull {{ wazuh_indexer_image_name }}:{{ wazuh_indexer_image_tag }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
    DOCKER_CONFIG: "{{ lookup('env', 'HOME') }}/.docker-no-creds"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "pull"]

- name: Pull wazuh-dashboard image
  ansible.builtin.command: "docker pull {{ wazuh_dashboard_image_name }}:{{ wazuh_dashboard_image_tag }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
    DOCKER_CONFIG: "{{ lookup('env', 'HOME') }}/.docker-no-creds"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "pull"]

- name: Pull wazuh-certs-generator image
  ansible.builtin.command: "docker pull {{ wazuh_certs_generator_image }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
    DOCKER_CONFIG: "{{ lookup('env', 'HOME') }}/.docker-no-creds"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "pull", "certs"]

# 3. Create Docker network
- name: Create wazuh Docker network
  ansible.builtin.shell: "docker network inspect {{ wazuh_network_name }} 2>/dev/null || docker network create --driver bridge --subnet {{ wazuh_network_subnet }} --gateway {{ wazuh_network_gateway }} {{ wazuh_network_name }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "network"]

# 4. Create volumes
- name: Create wazuh volumes
  ansible.builtin.shell: "docker volume inspect {{ item }} 2>/dev/null || docker volume create {{ item }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  loop:
    - "{{ wazuh_manager_api_config_volume }}"
    - "{{ wazuh_manager_etc_volume }}"
    - "{{ wazuh_manager_logs_volume }}"
    - "{{ wazuh_manager_queue_volume }}"
    - "{{ wazuh_manager_multigroups_volume }}"
    - "{{ wazuh_indexer_data_volume }}"
    - "{{ wazuh_indexer_config_volume }}"
    - "{{ wazuh_dashboard_config_volume }}"
    - "{{ wazuh_dashboard_custom_volume }}"
    - "{{ wazuh_dashboard_data_volume }}"
    - "{{ wazuh_manager_config_mount_volume }}"
    - "{{ wazuh_certs_volume }}"
  tags: ["deploy", "volume"]

# 5. Generate TLS certificates (run certs-generator container if certs don't exist yet)
- name: Check if wazuh certs already exist
  ansible.builtin.shell: "docker run --rm -v {{ wazuh_certs_volume }}:/certs alpine ls /certs/{{ wazuh_indexer_container_name }}.pem 2>/dev/null && echo EXISTS || echo MISSING"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  register: wazuh_certs_check
  changed_when: false
  tags: ["deploy", "certs"]

- name: Clean wazuh cert volume before regeneration
  ansible.builtin.command: "docker run --rm -v {{ wazuh_certs_volume }}:/certificates alpine sh -c 'rm -rf /certificates/*'"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  when: wazuh_certs_check.stdout == "MISSING"
  tags: ["deploy", "certs"]

- name: Generate wazuh config for cert generator
  ansible.builtin.command: >-
    docker run --rm -i
    -v {{ wazuh_certs_volume }}:/config
    alpine sh -c 'cat > /config/certs.yml'
  args:
    stdin: "{{ lookup('template', 'wazuh-config.yml.j2') }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  when: wazuh_certs_check.stdout == "MISSING"
  tags: ["deploy", "certs"]

- name: Generate wazuh TLS certificates
  ansible.builtin.command: >-
    docker run --rm
    --name wazuh-certs-generator
    -v {{ wazuh_certs_volume }}:/config
    -v {{ wazuh_certs_volume }}:/certificates
    -e CERT_TOOL_VERSION=4.14
    {{ wazuh_certs_generator_image }}
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "certs"]

- name: Fix wazuh certificate directory permissions
  ansible.builtin.command: >-
    docker run --rm -v {{ wazuh_certs_volume }}:/certificates alpine sh -c
    'chmod 755 /certificates && chmod 644 /certificates/root-ca.pem /certificates/root-ca-manager.pem'
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "certs"]

# 6. Populate configuration volumes
- name: Copy wazuh-indexer default config into config volume
  ansible.builtin.command: >-
    docker run --rm --user 0 --entrypoint sh
    -v {{ wazuh_indexer_config_volume }}:/config
    {{ wazuh_indexer_image_name }}:{{ wazuh_indexer_image_tag }}
    -c 'cp -r /usr/share/wazuh-indexer/config/* /config/ && chown -R 1000:0 /config'
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "config"]

- name: Generate wazuh admin password hash
  ansible.builtin.command: >-
    docker run --rm
    -e PASS={{ wazuh_indexer_password | quote }}
    -e JAVA_HOME=/usr/share/wazuh-indexer/jdk
    {{ wazuh_indexer_image_name }}:{{ wazuh_indexer_image_tag }} sh -c
    '/usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p "$PASS"'
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  register: wazuh_admin_hash_raw
  no_log: true
  changed_when: false
  tags: ["deploy", "config"]

- name: Generate wazuh kibanaserver password hash
  ansible.builtin.command: >-
    docker run --rm
    -e PASS={{ wazuh_dashboard_password | quote }}
    -e JAVA_HOME=/usr/share/wazuh-indexer/jdk
    {{ wazuh_indexer_image_name }}:{{ wazuh_indexer_image_tag }} sh -c
    '/usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p "$PASS"'
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  register: wazuh_kibanaserver_hash_raw
  no_log: true
  changed_when: false
  tags: ["deploy", "config"]

- name: Set password hash facts
  ansible.builtin.set_fact:
    wazuh_admin_hash: "{{ wazuh_admin_hash_raw.stdout | trim }}"
    wazuh_kibanaserver_hash: "{{ wazuh_kibanaserver_hash_raw.stdout | trim }}"
  no_log: true
  tags: ["deploy", "config"]

- name: Write wazuh-indexer opensearch.yml
  ansible.builtin.command: >-
    docker run --rm -i
    -v {{ wazuh_indexer_config_volume }}:/config
    --user 0
    alpine sh -c 'cat > /config/opensearch.yml && chmod 644 /config/opensearch.yml'
  args:
    stdin: "{{ lookup('template', 'opensearch.yml.j2') }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "config"]

- name: Write wazuh-indexer internal_users.yml
  ansible.builtin.command: >-
    docker run --rm -i
    -v {{ wazuh_indexer_config_volume }}:/config
    --user 0
    alpine sh -c 'cat > /config/opensearch-security/internal_users.yml && chmod 644 /config/opensearch-security/internal_users.yml'
  args:
    stdin: "{{ lookup('template', 'internal_users.yml.j2') }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  no_log: true
  tags: ["deploy", "config"]

- name: Write wazuh-dashboard opensearch_dashboards.yml
  ansible.builtin.command: >-
    docker run --rm -i
    -v {{ wazuh_dashboard_config_volume }}:/config
    alpine sh -c 'cat > /config/opensearch_dashboards.yml && chmod 644 /config/opensearch_dashboards.yml && chown -R 1000:0 /config'
  args:
    stdin: "{{ lookup('template', 'opensearch_dashboards.yml.j2') }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "config"]

- name: Prepare wazuh-dashboard data volume
  ansible.builtin.command: >-
    docker run --rm
    -v {{ wazuh_dashboard_data_volume }}:/data
    alpine sh -c 'chown -R 1000:0 /data && chmod 755 /data'
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "config"]

- name: Write wazuh-manager ossec.conf
  ansible.builtin.command: >-
    docker run --rm -i
    -v {{ wazuh_manager_config_mount_volume }}:/config
    alpine sh -c 'mkdir -p /config/etc && cat > /config/etc/ossec.conf && chmod 644 /config/etc/ossec.conf'
  args:
    stdin: "{{ lookup('template', 'wazuh-manager.conf.j2') }}"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "config"]

# 7. Stop existing containers (if any) before recreating
- name: Stop existing wazuh-dashboard container
  ansible.builtin.shell: "docker rm -f {{ wazuh_dashboard_container_name }} 2>/dev/null || true"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "container"]

- name: Stop existing wazuh-manager container
  ansible.builtin.shell: "docker rm -f {{ wazuh_manager_container_name }} 2>/dev/null || true"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "container"]

- name: Stop existing wazuh-indexer container
  ansible.builtin.shell: "docker rm -f {{ wazuh_indexer_container_name }} 2>/dev/null || true"
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "container"]

# 8. Deploy wazuh-indexer (must start first — manager and dashboard depend on it)
- name: Deploy wazuh-indexer container
  ansible.builtin.command: >-
    docker run -d
    --name {{ wazuh_indexer_container_name }}
    --hostname {{ wazuh_indexer_container_name }}
    --network {{ wazuh_network_name }}
    --ip {{ wazuh_indexer_ip }}
    --restart unless-stopped
    --ulimit memlock=-1:-1
    --ulimit nofile=65536:65536
    -e OPENSEARCH_JAVA_OPTS={{ wazuh_indexer_java_opts | quote }}
    -e bootstrap.memory_lock=true
    -v {{ wazuh_indexer_data_volume }}:/var/lib/wazuh-indexer
    -v {{ wazuh_indexer_config_volume }}:/usr/share/wazuh-indexer/config
    -v {{ wazuh_certs_volume }}:/usr/share/wazuh-indexer/config/certs
    {{ wazuh_indexer_image_name }}:{{ wazuh_indexer_image_tag }}
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  register: wazuh_indexer_container
  changed_when: true
  tags: ["deploy", "container"]

- name: Wait for wazuh-indexer to be healthy
  ansible.builtin.shell: >-
    docker exec {{ wazuh_indexer_container_name }} curl -k -s -o /dev/null -w '%{http_code}'
    --cacert /usr/share/wazuh-indexer/config/certs/root-ca.pem
    --cert /usr/share/wazuh-indexer/config/certs/admin.pem
    --key /usr/share/wazuh-indexer/config/certs/admin-key.pem
    https://localhost:9200
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  register: wazuh_indexer_health
  until: wazuh_indexer_health.stdout == "200"
  retries: 24
  delay: 5
  changed_when: false
  tags: ["deploy", "container"]

# 9. Deploy wazuh-manager
- name: Deploy wazuh-manager container
  ansible.builtin.command: >-
    docker run -d
    --name {{ wazuh_manager_container_name }}
    --hostname {{ wazuh_manager_container_name }}
    --network {{ wazuh_network_name }}
    --ip {{ wazuh_manager_ip }}
    --restart unless-stopped
    --ulimit memlock=-1:-1
    --ulimit nofile=655360:655360
    -p {{ wazuh_manager_agent_host_port }}:{{ wazuh_manager_agent_container_port }}
    -p {{ wazuh_manager_enrollment_host_port }}:{{ wazuh_manager_enrollment_container_port }}
    -p {{ wazuh_manager_api_host_port }}:{{ wazuh_manager_api_container_port }}
    -e INDEXER_URL={{ ('"https://' ~ wazuh_indexer_ip ~ ':9200"') | quote }}
    -e INDEXER_USERNAME={{ wazuh_indexer_username | quote }}
    -e INDEXER_PASSWORD={{ wazuh_indexer_password | quote }}
    -e FILEBEAT_SSL_VERIFICATION_MODE=full
    -e SSL_CERTIFICATE_AUTHORITIES=/var/ossec/etc/certs/root-ca.pem
    -e SSL_CERTIFICATE=/var/ossec/etc/certs/wazuh-manager.pem
    -e SSL_KEY=/var/ossec/etc/certs/wazuh-manager-key.pem
    -e API_USERNAME={{ wazuh_api_username | quote }}
    -e API_PASSWORD={{ wazuh_api_password | quote }}
    -v {{ wazuh_manager_api_config_volume }}:/var/ossec/api/configuration
    -v {{ wazuh_manager_etc_volume }}:/var/ossec/etc
    -v {{ wazuh_manager_logs_volume }}:/var/ossec/logs
    -v {{ wazuh_manager_queue_volume }}:/var/ossec/queue
    -v {{ wazuh_manager_multigroups_volume }}:/var/ossec/var/multigroups
    -v {{ wazuh_certs_volume }}:/var/ossec/etc/certs
    -v {{ wazuh_manager_config_mount_volume }}:/wazuh-config-mount
    {{ wazuh_manager_image_name }}:{{ wazuh_manager_image_tag }}
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  register: wazuh_manager_container
  changed_when: true
  tags: ["deploy", "container"]

# 10. Deploy wazuh-dashboard
- name: Deploy wazuh-dashboard container
  ansible.builtin.command: >-
    docker run -d
    --name {{ wazuh_dashboard_container_name }}
    --hostname {{ wazuh_dashboard_container_name }}
    --network {{ wazuh_network_name }}
    --ip {{ wazuh_dashboard_ip }}
    --restart unless-stopped
    -p {{ wazuh_dashboard_host_port }}:{{ wazuh_dashboard_container_port }}
    -e DASHBOARD_USERNAME={{ wazuh_dashboard_username | quote }}
    -e DASHBOARD_PASSWORD={{ wazuh_dashboard_password | quote }}
    -e WAZUH_API_URL={{ ('"https://' ~ wazuh_manager_ip ~ '"') | quote }}
    -e API_PORT={{ wazuh_manager_api_container_port | quote }}
    -e API_USERNAME={{ wazuh_api_username | quote }}
    -e API_PASSWORD={{ wazuh_api_password | quote }}
    -v {{ wazuh_dashboard_config_volume }}:/usr/share/wazuh-dashboard/config
    -v {{ wazuh_dashboard_custom_volume }}:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    -v {{ wazuh_dashboard_data_volume }}:/usr/share/wazuh-dashboard/data/wazuh/config
    -v {{ wazuh_certs_volume }}:/usr/share/wazuh-dashboard/config/certs
    {{ wazuh_dashboard_image_name }}:{{ wazuh_dashboard_image_tag }}
  environment:
    DOCKER_HOST: "{{ wazuh_docker_host }}"
  delegate_to: localhost
  register: wazuh_dashboard_container
  changed_when: true
  tags: ["deploy", "container"]

- name: Wait for wazuh-dashboard to be healthy
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ wazuh_dashboard_host_port }}"
    delay: 5
    timeout: 120
  delegate_to: localhost
  tags: ["deploy", "container"]

- name: Wazuh deployment status
  ansible.builtin.debug:
    msg:
      - "Wazuh manager container: {{ wazuh_manager_container.stdout }}"
      - "Wazuh indexer container: {{ wazuh_indexer_container.stdout }}"
      - "Wazuh dashboard container: {{ wazuh_dashboard_container.stdout }}"
      - "Dashboard: https://{{ wazuh_domain }}"
  delegate_to: localhost
  tags: ["deploy", "container"]
