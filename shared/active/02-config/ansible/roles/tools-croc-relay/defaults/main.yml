---
# Croc file-transfer relay default variables
# Upstream Docker Hub image — no build pipeline needed.
# https://hub.docker.com/r/schollz/croc

# Container configuration
croc_relay_container_name: "localnet-croc-relay"
croc_relay_image_name: "schollz/croc"
croc_relay_image_tag: "latest"

# Ports (reference infrastructure variables)
# The relay uses a contiguous range; the first port is the PAKE/communication port.
croc_relay_start_port: "{{ infra_port_tools_croc_relay_comm_host | default('9009') }}"
croc_relay_end_port: "{{ infra_port_tools_croc_relay_data_end_host | default('9013') }}"

# Comma-separated list for the CROC_PORTS environment variable
# (must match the published container port range).
croc_relay_ports: "{{ range(croc_relay_start_port | int, croc_relay_end_port | int + 1) | map('string') | list }}"
croc_relay_ports_csv: "{{ croc_relay_ports | join(',') }}"

# Relay password (required, from vault)
croc_relay_password: "{{ vault_croc_relay_password | default('') }}"

# Enable flag
croc_relay_enabled: true

# Docker connection string for the Windows host (SSH-tunneled Docker CLI).
# community.docker modules cannot run on Windows (Ansible core basic.py imports grp,
# which is Unix-only), so we delegate to localhost and use the docker CLI with DOCKER_HOST=ssh://.
croc_relay_docker_host: "ssh://ansible@{{ windows_tailscale_hostname | default('dtop202311') }}.{{ infra_tailscale_tailnet | default('example.ts.net') }}"

# Healthcheck durations (strings with unit suffix, NOT bare integers)
croc_relay_healthcheck_interval: "30s"
croc_relay_healthcheck_timeout: "10s"
croc_relay_healthcheck_retries: 3
croc_relay_healthcheck_start_period: "30s"
