---
# Croc relay deployment
# Deploys on Windows Docker Desktop hosts via SSH-tunneled Docker CLI.
# Upstream Docker Hub image — no build phase.
#
# Architecture: community.docker Ansible modules cannot run on Windows (Ansible
# core basic.py imports grp, Unix-only). We delegate to localhost and use the
# docker CLI with DOCKER_HOST=ssh:// so the system SSH client (with ~/.ssh/config)
# handles authentication.
#
# This is a pragmatic exception to the "community.docker modules only" rule for
# Windows Docker hosts. The rule exists to avoid docker compose and ensure
# idempotent container management; we achieve the latter by recreating the
# container on each deploy.

# 1. Validate required variables
- name: Validate required croc relay variables are defined
  ansible.builtin.assert:
    that:
      - croc_relay_container_name is defined
      - croc_relay_image_name is defined
      - croc_relay_start_port is defined
      - croc_relay_end_port is defined
      - croc_relay_password is defined
      - croc_relay_password | length > 0
    fail_msg: "Missing required croc relay variables. Check the client vault and group_vars."
    success_msg: "All required croc relay variables are defined."
  tags: ["always", "validate"]

# 2. Pull image from Docker Hub
- name: Pull croc relay image from Docker Hub
  ansible.builtin.shell: "docker pull {{ croc_relay_image_name }}:{{ croc_relay_image_tag }}"
  environment:
    DOCKER_HOST: "{{ croc_relay_docker_host }}"
    DOCKER_CONFIG: "{{ lookup('env', 'HOME') }}/.docker-no-creds"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "pull"]

# 3. Stop existing container (if any) before recreating
- name: Stop existing croc relay container
  ansible.builtin.shell: "docker rm -f {{ croc_relay_container_name }} 2>/dev/null || true"
  environment:
    DOCKER_HOST: "{{ croc_relay_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "container"]

# 4. Deploy container
- name: Deploy croc relay container
  ansible.builtin.shell: >
    docker run -d
    --name {{ croc_relay_container_name }}
    --restart unless-stopped
    -p {{ croc_relay_start_port }}-{{ croc_relay_end_port }}:{{ croc_relay_start_port }}-{{ croc_relay_end_port }}
    -e CROC_PORTS="$CROC_PORTS"
    -e CROC_PASS="$CROC_PASS"
    --log-driver json-file
    --log-opt max-size=10m
    --log-opt max-file=5
    --health-cmd "nc -z -w 3 localhost {{ croc_relay_start_port }} || exit 1"
    --health-interval {{ croc_relay_healthcheck_interval }}
    --health-timeout {{ croc_relay_healthcheck_timeout }}
    --health-retries {{ croc_relay_healthcheck_retries }}
    --health-start-period {{ croc_relay_healthcheck_start_period }}
    {{ croc_relay_image_name }}:{{ croc_relay_image_tag }}
  environment:
    DOCKER_HOST: "{{ croc_relay_docker_host }}"
    CROC_PORTS: "{{ croc_relay_ports_csv }}"
    CROC_PASS: "{{ croc_relay_password }}"
  delegate_to: localhost
  changed_when: true
  no_log: true
  tags: ["deploy", "container"]

# 5. Get status
- name: Get croc relay container status
  ansible.builtin.shell: "docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' {{ croc_relay_container_name }}"
  environment:
    DOCKER_HOST: "{{ croc_relay_docker_host }}"
  delegate_to: localhost
  register: croc_relay_status
  changed_when: false
  ignore_errors: true
  tags: ["always", "info"]

# 6. Status report
- name: Report croc relay status
  ansible.builtin.debug:
    msg: |
      croc relay deployed:
        - Host: {{ inventory_hostname }}
        - Container: {{ croc_relay_container_name }}
        - Ports: {{ croc_relay_start_port }}-{{ croc_relay_end_port }} (TCP)
        - CROC_PORTS: {{ croc_relay_ports_csv }}
        - Status: {{ croc_relay_status.stdout | default('unknown') }}
  tags: ["always", "info"]
