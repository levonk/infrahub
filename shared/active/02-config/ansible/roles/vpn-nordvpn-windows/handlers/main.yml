---
# NordVPN Exit Node for Windows Docker Desktop — handlers

- name: "Restart nordvpn-windows container"
  ansible.builtin.command: "docker restart {{ vpn_nordvpn_windows_container_name }}"
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true

- name: "Restart tailscale-nordvpn-windows container"
  ansible.builtin.command: "docker restart {{ vpn_nordvpn_windows_tailscale_container_name }}"
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true
