---
# NordVPN Exit Node for Windows Docker Desktop
# Deploys NordVPN (gluetun) + Tailscale exit node container on Windows Docker Desktop.
#
# Uses ansible.builtin.command with the docker CLI and DOCKER_HOST environment variable.
# The docker CLI uses the system SSH client (not paramiko) to connect to the Windows
# Docker daemon via SSH, which works correctly with Tailscale SSH config and keys.
#
# Reference: roles/p2p-freenet/tasks/main.yml for the delegate_to + DOCKER_HOST pattern.

# 1. Validate required variables
- name: "Validate required NordVPN Windows variables"
  ansible.builtin.assert:
    that:
      - vpn_nordvpn_windows_container_name is defined
      - vpn_nordvpn_windows_image is defined
      - vpn_nordvpn_windows_network_name is defined
      - vpn_nordvpn_windows_docker_host is defined
      - vpn_tailscale_windows_auth_key | length > 0
      - vpn_tailscale_windows_nordvpn_hostname is defined
    fail_msg: >-
      Missing required NordVPN Windows variables. Check
      levonk/active/02-config/ansible/inventories/group_vars/windows_docker_hosts.yml
      and the vpn-nordvpn-windows role defaults.
    success_msg: "All required NordVPN Windows variables are defined."
  tags: ["always", "validate"]

# 2. Pull images via docker CLI (runs on controller, connects to Windows Docker via SSH)
- name: "Pull gluetun NordVPN image"
  ansible.builtin.command: "docker pull {{ vpn_nordvpn_windows_image }}"
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "pull"]

- name: "Pull Tailscale image"
  ansible.builtin.command: "docker pull {{ vpn_nordvpn_windows_tailscale_image }}"
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "pull"]

# 3. Create Docker network
- name: "Create NordVPN Windows Docker network"
  ansible.builtin.shell: >-
    docker network inspect {{ vpn_nordvpn_windows_network_name }} 2>/dev/null
    || docker network create --driver bridge
    --subnet {{ vpn_nordvpn_windows_network_subnet }}
    --gateway {{ vpn_nordvpn_windows_network_gateway }}
    {{ vpn_nordvpn_windows_network_name }}
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: false
  tags: ["deploy", "network"]

# 4. Create volumes
- name: "Create NordVPN Windows volumes"
  ansible.builtin.shell: >-
    docker volume inspect {{ item }} 2>/dev/null
    || docker volume create {{ item }}
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: false
  loop:
    - "{{ vpn_nordvpn_windows_config_volume_name }}"
    - "{{ vpn_nordvpn_windows_data_volume_name }}"
    - "{{ vpn_nordvpn_windows_tailscale_state_volume_name }}"
  tags: ["deploy", "volume"]

# 5. Remove legacy containers (name migration)
- name: "Remove legacy nordvpn-windows container"
  ansible.builtin.command: "docker rm -f nordvpn-windows"
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: false
  failed_when: false
  tags: ["deploy", "migrate"]

- name: "Remove legacy tailscale-nordvpn-windows container"
  ansible.builtin.command: "docker rm -f tailscale-nordvpn-windows"
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: false
  failed_when: false
  tags: ["deploy", "migrate"]

# 6. Remove existing containers for redeploy (idempotent recreation)
- name: "Remove existing NordVPN container for redeploy"
  ansible.builtin.command: "docker rm -f {{ vpn_nordvpn_windows_container_name }}"
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: false
  failed_when: false
  tags: ["deploy", "container"]

- name: "Remove existing Tailscale NordVPN container for redeploy"
  ansible.builtin.command: "docker rm -f {{ vpn_nordvpn_windows_tailscale_container_name }}"
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: false
  failed_when: false
  tags: ["deploy", "container"]

# 7. Deploy NordVPN (gluetun) container
- name: "Deploy NordVPN Windows container"
  ansible.builtin.shell: >-
    docker run -d
    --name {{ vpn_nordvpn_windows_container_name }}
    --restart unless-stopped
    --cap-add NET_ADMIN
    --cap-add NET_RAW
    --device /dev/net/tun:/dev/net/tun
    --network {{ vpn_nordvpn_windows_network_name }}
    --sysctl net.ipv4.ip_forward=1
    --sysctl net.ipv6.conf.all.forwarding=1
    --security-opt no-new-privileges:true
    -e VPN_SERVICE_PROVIDER=nordvpn
    -e OPENVPN_VERSION=2.6  # project-lint: disable=magic-dotted  version number, not an operational magic number
    -e "SERVER_COUNTRIES={{ vpn_nordvpn_windows_country }}"
    -e "OPENVPN_USER={{ vpn_nordvpn_windows_openvpn_user }}"
    -e "OPENVPN_PASSWORD={{ vpn_nordvpn_windows_openvpn_pass }}"
    -e FIREWALL=on
    -e DOT=on
    -e TZ={{ vpn_nordvpn_windows_tz }}
    -e HTTPPROXY=on
    -e HTTPPROXY_PORT={{ vpn_nordvpn_windows_http_container_port | string }}
    -e HTTPSPROXY=on
    -e HTTPSPROXY_PORT={{ vpn_nordvpn_windows_https_container_port | string }}
    -e SHADOWSOCKS=on
    -e SHADOWSOCKS_PORT={{ vpn_nordvpn_windows_shadowsocks_container_port | string }}
    -p {{ vpn_nordvpn_windows_socks_host_port }}:{{ vpn_nordvpn_windows_socks_container_port }}
    -p {{ vpn_nordvpn_windows_http_host_port }}:{{ vpn_nordvpn_windows_http_container_port }}
    -p {{ vpn_nordvpn_windows_https_host_port }}:{{ vpn_nordvpn_windows_https_container_port }}
    -p {{ vpn_nordvpn_windows_shadowsocks_host_port }}:{{ vpn_nordvpn_windows_shadowsocks_container_port }}
    -v {{ vpn_nordvpn_windows_config_volume_name }}:/gluetun
    -v {{ vpn_nordvpn_windows_data_volume_name }}:/tmp/gluetun
    --log-driver json-file
    --log-opt max-size={{ infra_log_max_size }}
    --log-opt max-file={{ infra_log_max_file }}
    {{ vpn_nordvpn_windows_image }}
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true
  tags: ["deploy", "container"]

# 8. Wait for NordVPN to initialize
- name: "Wait for NordVPN Windows container to initialize"
  ansible.builtin.pause:
    seconds: "{{ infra_delay_long }}"
  tags: ["deploy", "wait"]

# 9. Deploy Tailscale exit node container (routes through NordVPN)
- name: "Deploy Tailscale NordVPN Windows exit node container"
  ansible.builtin.shell: >-
    docker run -d
    --name {{ vpn_nordvpn_windows_tailscale_container_name }}
    --restart unless-stopped
    --network {{ vpn_nordvpn_windows_network_name }}
    --cap-add NET_ADMIN
    --device /dev/net/tun:/dev/net/tun
    --sysctl net.ipv4.ip_forward=1
    --sysctl net.ipv6.conf.all.forwarding=1
    --security-opt no-new-privileges:true
    -e TS_AUTHKEY={{ vpn_tailscale_windows_auth_key }}
    -e TS_HOSTNAME={{ vpn_tailscale_windows_nordvpn_hostname }}
    -e TS_STATE_DIR=/var/lib/tailscale
    -e 'TS_EXTRA_ARGS=--advertise-exit-node --accept-routes'
    -e TZ={{ vpn_nordvpn_windows_tz }}
    -v {{ vpn_nordvpn_windows_tailscale_state_volume_name }}:/var/lib/tailscale
    --log-driver json-file
    --log-opt max-size={{ infra_log_max_size }}
    --log-opt max-file={{ infra_log_max_file }}
    {{ vpn_nordvpn_windows_tailscale_image }}
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true
  no_log: true
  tags: ["deploy", "container"]

# 10. Wait for Tailscale to initialize
- name: "Wait for Tailscale NordVPN Windows to initialize"
  ansible.builtin.pause:
    seconds: "{{ infra_delay_extended }}"
  tags: ["deploy", "wait"]

# 11. Configure NordVPN as gateway for Tailscale traffic
- name: "Get NordVPN Windows container IP"
  ansible.builtin.shell: >-
    docker inspect {{ vpn_nordvpn_windows_container_name }}
    --format '{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}{% endraw %}'
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  register: nordvpn_windows_ip_result
  changed_when: false
  tags: ["deploy", "route"]

- name: "Configure NordVPN Windows as gateway for Tailscale traffic"
  ansible.builtin.command: >-
    docker exec {{ vpn_nordvpn_windows_tailscale_container_name }} sh -c
    'ip route del default 2>/dev/null; ip route add default via {{ nordvpn_windows_ip_result.stdout }}'
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true
  failed_when: false
  tags: ["deploy", "route"]

# 12. Status report
- name: "Get NordVPN Windows container status"
  ansible.builtin.shell: >-
    docker inspect {{ vpn_nordvpn_windows_container_name }}
    --format '{% raw %}{{.State.Status}}{{end}}{% endraw %}'
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  register: nordvpn_windows_status
  changed_when: false
  failed_when: false
  tags: ["always", "info"]

- name: "Get Tailscale NordVPN Windows container status"
  ansible.builtin.shell: >-
    docker inspect {{ vpn_nordvpn_windows_tailscale_container_name }}
    --format '{% raw %}{{.State.Status}}{{end}}{% endraw %}'
  environment:
    DOCKER_HOST: "{{ vpn_nordvpn_windows_docker_host }}"
  delegate_to: localhost
  register: tailscale_nordvpn_windows_status
  changed_when: false
  failed_when: false
  tags: ["always", "info"]

- name: "Report NordVPN Windows exit node status"
  ansible.builtin.debug:
    msg: |
      NordVPN Windows exit node deployed:
        - NordVPN container: {{ vpn_nordvpn_windows_container_name }} ({{ nordvpn_windows_status.stdout | default('unknown') }})
        - Tailscale container: {{ vpn_nordvpn_windows_tailscale_container_name }} ({{ tailscale_nordvpn_windows_status.stdout | default('unknown') }})
        - Tailscale hostname: {{ vpn_tailscale_windows_nordvpn_hostname }}
        - Network: {{ vpn_nordvpn_windows_network_name }}
        - SOCKS proxy: {{ infra_tailscale_fqdn_windows_docker | default('dtop202311.' ~ (infra_tailscale_tailnet | default('example.ts.net'))) }}:{{ vpn_nordvpn_windows_socks_host_port }}
        - HTTP proxy: {{ infra_tailscale_fqdn_windows_docker | default('dtop202311.' ~ (infra_tailscale_tailnet | default('example.ts.net'))) }}:{{ vpn_nordvpn_windows_http_host_port }}
  tags: ["always", "info"]
