---
# defaults file for vpn-nordvpn

# NordVPN Configuration
vpn_nordvpn_enabled: false
vpn_nordvpn_token: ""
vpn_nordvpn_country: "United_States"
vpn_nordvpn_openvpn_user: ""
vpn_nordvpn_openvpn_pass: ""

# Container Configuration
vpn_nordvpn_container_name: "nordvpn"
vpn_nordvpn_config_volume_name: "localnet-nordvpn-config-volume"
vpn_nordvpn_data_volume_name: "localnet-nordvpn-data-volume"

# Network Configuration
vpn_nordvpn_network_name: "{{ cloud_server_nordvpn_network_name | default(infra_network_vpn_nordvpn_network_name) }}"
vpn_nordvpn_network_subnet: "{{ cloud_server_nordvpn_network_subnet | default(infra_network_vpn_nordvpn_subnet) }}"
vpn_nordvpn_network_gateway: "{{ cloud_server_nordvpn_network_gateway | default(infra_network_vpn_nordvpn_gateway) }}"

# Port Configuration (ALL ports must be variables - NO hardcoded ports)
vpn_nordvpn_wireguard_host_port: "{{ cloud_server_nordvpn_wireguard_host_port | default(infra_port_vpn_nordvpn_wireguard_host) }}"
vpn_nordvpn_wireguard_container_port: "{{ cloud_server_nordvpn_wireguard_container_port | default(infra_port_vpn_nordvpn_wireguard_host) }}"
vpn_nordvpn_socks_host_port: "{{ cloud_server_nordvpn_socks_host_port | default(infra_port_vpn_nordvpn_socks_host) }}"
vpn_nordvpn_socks_container_port: "{{ cloud_server_nordvpn_socks_container_port | default(infra_port_vpn_nordvpn_socks_host) }}"
vpn_nordvpn_http_host_port: "{{ cloud_server_nordvpn_http_host_port | default(infra_port_vpn_nordvpn_http_host) }}"
vpn_nordvpn_http_container_port: "{{ cloud_server_nordvpn_http_container_port | default(infra_port_vpn_nordvpn_http_host) }}"
vpn_nordvpn_https_host_port: "{{ cloud_server_nordvpn_https_host_port | default(infra_port_vpn_nordvpn_https_host) }}"
vpn_nordvpn_https_container_port: "{{ cloud_server_nordvpn_https_container_port | default(infra_port_vpn_nordvpn_https_host) }}"
vpn_nordvpn_shadowsocks_host_port: "{{ cloud_server_nordvpn_shadowsocks_host_port | default(infra_port_vpn_nordvpn_shadowsocks_host) }}"
vpn_nordvpn_shadowsocks_container_port: "{{ cloud_server_nordvpn_shadowsocks_container_port | default(infra_port_vpn_nordvpn_shadowsocks_host) }}"

# Service Directories
localnet_services_dir: "/opt/localnet/services"
localnet_tz: "UTC"
