---
# handlers file for vpn-nordvpn

- name: restart nordvpn
  community.docker.docker_container:
    name: "{{ vpn_nordvpn_container_name }}"
    state: restarted
  when: vpn_nordvpn_enabled

- name: wait for nordvpn
  ansible.builtin.pause:
    seconds: "{{ infra_delay_long }}"
  when: vpn_nordvpn_enabled
