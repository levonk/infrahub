---
# Tor Exit Node for Windows Docker Desktop — handlers

- name: "Restart tor-exit-windows container"
  ansible.builtin.command: "docker restart {{ vpn_tor_windows_tor_container_name }}"
  environment:
    DOCKER_HOST: "{{ vpn_tor_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true

- name: "Restart tailscale-tor-windows container"
  ansible.builtin.command: "docker restart {{ vpn_tor_windows_tailscale_container_name }}"
  environment:
    DOCKER_HOST: "{{ vpn_tor_windows_docker_host }}"
  delegate_to: localhost
  changed_when: true
