---
# Tor Exit Node for Windows Docker Desktop — handlers

- name: "Restart tor-exit-windows container"
  community.docker.docker_container:
    name: "{{ vpn_tor_windows_tor_container_name }}"
    state: started
    restart: true
  delegate_to: localhost
  vars:
    ansible_docker_host: "{{ vpn_tor_windows_docker_host }}"

- name: "Restart tailscale-tor-windows container"
  community.docker.docker_container:
    name: "{{ vpn_tor_windows_tailscale_container_name }}"
    state: started
    restart: true
  delegate_to: localhost
  vars:
    ansible_docker_host: "{{ vpn_tor_windows_docker_host }}"
