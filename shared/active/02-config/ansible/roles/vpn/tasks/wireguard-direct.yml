---
# WireGuard Direct Mode

- name: Deploy wireguard-direct container
  community.docker.docker_container:
    name: localnet-vpn-direct
    image: linuxserver/wireguard:latest
    state: started
    restart_policy: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - name: "{{ localnet_network_name }}"
      - name: wireguard
    volumes:
      - localnet-wireguard-direct-config-volume:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "{{ wireguard_direct_port | default('51820') }}:51820/udp"  # project-lint: disable=magic-int  WireGuard port, should use infra_port variable
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    dns_servers:
      - "{{ host_ip }}"
    env:
      PUID: "{{ localnet_puid }}"
      PGID: "{{ localnet_pgid }}"
      TZ: "{{ localnet_tz }}"
      SERVERURL: "{{ wireguard_serverurl | default('auto') }}"
      SERVERPORT: "{{ wireguard_direct_port | default('51820') }}"  # project-lint: disable=magic-int  WireGuard port, should use infra_port variable
      PEERS: "{{ wireguard_direct_peers | default('5') }}"  # project-lint: disable=magic-int  WireGuard peer count default, not a standalone magic number
      PEERDNS: "{{ host_ip }}"
      INTERNAL_SUBNET: {{ infra_network_vpn_wireguard_direct_subnet }}
      ALLOWEDIPS: "{{ infra_network_warp_subnet }},{{ host_ip }}/32"  # project-lint: disable=magic-int  CIDR prefix length in WireGuard allowed IPs, not a standalone magic number
      LOG_CONFS: true
    log_driver: json-file
    log_options:
      max-size: "{{ infra_log_max_size }}"
      max-file: "{{ infra_log_max_file }}"
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: "{{ infra_healthcheck_interval }}"
      timeout: "{{ infra_timeout_short }}"
      retries: "{{ infra_retry_short }}"
      start_period: "{{ infra_healthcheck_start_period }}"

- name: Wait for wireguard-direct to be healthy
  ansible.builtin.shell: |
    docker inspect --format='{{"{{"}}.State.Health.Status{{"}}"}}' localnet-vpn-direct
  register: wg_direct_health
  until: wg_direct_health.stdout == "healthy"
  retries: "{{ infra_retry_long }}"
  delay: "{{ infra_delay_long }}"
  ignore_errors: true
