# Nix cache chain: nixcache.nl.levonk.com (ncps front door for nl region)
# ncps caches NARs locally and races upstreams via ncro on miss.
# Lower priority = preferred (Nix tries lower priority first).
extra-substituters = https://nixcache.nl.levonk.com?priority=30 https://cache.nixos.org?priority=80

extra-trusted-public-keys = nixcache.nl.levonk.com:4lFFsosyMr06JYe2LllzAMTkuCvnIX5z4jiWgt2CaiA= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPSQZNGZfdL7Q= cache.garnix.io-1:917cK6X0+XBO7CV7MncdEVt18A8hBsN1SWqI7RliSMA=
experimental-features = nix-command flakes
# trusted-users will be set dynamically by entrypoint script

# Multi-user Nix configuration
build-users-group = nixbld

# Fallback and timeout settings for resilience
fallback = true
connect-timeout = 5
max-silent-time = 900

# We'll set up a job to do this to prevent wasted compute
auto-optimise-store = false
