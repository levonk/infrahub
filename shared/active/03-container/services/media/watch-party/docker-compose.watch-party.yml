services:
  watch-party:
    build:
      context: .
      dockerfile: docker/Dockerfile.watch-party
    ports:
      - "${WATCH_PARTY_HOST_PORT}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ICE_SERVERS=${ICE_SERVERS:-[]}
    volumes:
      - watch-party-uploads:/app/uploads
      - watch-party-hls-cache:/app/hls-cache
    restart: unless-stopped

volumes:
  watch-party-uploads:
  watch-party-hls-cache:
